# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: AI Tech Notes
subtitle: '探索本地 LLM、AI Agent 與高吞吐運算極限'
description: '記錄本地 LLM、AI 工具實測、深度學習資源與硬體效能評測'
keywords: 'AI, LLM, Agent, Ollama, Machine Learning, Hexo, Tech'
author: kalpakjian
language: zh-TW
timezone: Asia/Taipei

# URL
url: https://kalpakjian.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'dhh-rails-world-2026/**'
  - 'opencv-notes/**'
  - 'ai-intro-notes/**'
  - 'cv-intro-notes/**'

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Theme
theme: fluid

# Deployment
# 發佈方式：push 到 main → GitHub Actions（.github/workflows/pages.yml）
# 自動執行 hexo clean && hexo generate 並部署到 GitHub Pages。
# 本專案「不使用」hexo deploy（遠端沒有 gh-pages 分支），故不需要 deploy 區段。

# Search Generator
search:
  path: search.xml
  field: post
  content: true
  format: html

# Feed Generator (RSS)
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
