# Fluid Theme Settings
navbar:
  blog_title: AI Tech Notes
  ground_glass:
    enable: true
  # 資源分三類：文章（首頁／歸檔）、專題、學習筆記
  # 名稱不再加「專題：」前綴，改用兩個下拉群組呈現
  menu:
    - { key: 'home', link: '/', icon: 'iconfont icon-home-fill' }
    - key: 'topics'
      name: '專題'
      icon: 'iconfont icon-books'
      submenu:
        - { name: '手寫程式碼的時代正式結束（DHH 退休）', link: '/dhh-rails-world-2026/index.html', icon: 'iconfont icon-bookmark' }
        - { name: '從零打造一個 coding agent', link: '/coding-agent/', icon: 'iconfont icon-bookmark' }
        - { name: 'Agent 時代，你可能累錯地方了', link: '/2026/10/16/matt-pocock-18-agent-mistakes/', icon: 'iconfont icon-bookmark' }
        - { name: '用 Python 解決問題：24 類工作 × 48 個套件', link: '/2026/10/16/python-problem-solving-toolkit/', icon: 'iconfont icon-bookmark' }
    - key: 'notes'
      name: '學習筆記'
      icon: 'iconfont icon-notebook'
      submenu:
        - { name: 'IVDC 電腦視覺課程', link: '/cv-course/', icon: 'iconfont icon-note' }
        - { name: 'IVDC LLM 與生成式 AI 課程', link: '/llm-course/', icon: 'iconfont icon-note' }
        - { name: 'AutoML 應用證書課程', link: '/automl-course/', icon: 'iconfont icon-note' }
    - { key: 'archive', link: '/archives/', icon: 'iconfont icon-archive-fill' }
    - { key: 'category', link: '/categories/', icon: 'iconfont icon-category-fill' }
    - { key: 'tag', link: '/tags/', icon: 'iconfont icon-tags-fill' }
    - { key: 'about', link: '/about/', icon: 'iconfont icon-user-fill' }

index:
  banner_img: https://images.unsplash.com/photo-1518770660439-4636190af475?w=1600
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text: 'AI Tech Notes - 探索本地 LLM 與 Agent 架構'
  auto_excerpt:
    enable: true

post:
  banner_img: https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1600
  toc:
    enable: true
    number: true
  code:
    copy: true
    highlight:
      enable: true
      lib: 'highlightjs'
      highlightjs:
        style: 'atom-one-dark'
  math:
    enable: true
    specific: true
    engine: mathjax

custom_css:
  - /css/custom.css

footer:
  content: '© 2026 kalpakjian | Powered by <a href="https://hexo.io" target="_blank">Hexo</a> & <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a>'

search:
  enable: true
  type: 'local'
  path: /search.xml
