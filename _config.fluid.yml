# Fluid Theme Settings
navbar:
  blog_title: AI Tech Notes
  ground_glass:
    enable: true
  # 資源分三類：文章（首頁／歸檔）、專題、學習筆記
  # 名稱不再加「專題：」前綴，改用兩個下拉群組呈現
  menu:
    - { key: 'home', link: '/', icon: 'iconfont icon-home-fill' }
    - key: 'topics'
      name: '專題'
      icon: 'iconfont icon-books'
      submenu:
        # 專題 = 一個標題頁 + 多個 HTML 頁（單頁文章不收在這裡，見首頁「文章」欄）
        - { name: 'CNN 專題：九篇圖解系列、課程筆記與實驗', link: '/cnn/', icon: 'iconfont icon-bookmark' }
        - { name: 'OCR：正體中文書頁辨識與校對', link: '/ocr/', icon: 'iconfont icon-bookmark' }
        - { name: 'CNN 專題：十個實驗，和三次被推翻的假設', link: '/cnn-lab/', icon: 'iconfont icon-bookmark' }
        - { name: '從零打造一個 coding agent', link: '/coding-agent/', icon: 'iconfont icon-bookmark' }
        - { name: '手寫程式碼的時代正式結束（DHH 退休）', link: '/dhh-rails-world-2026/index.html', icon: 'iconfont icon-bookmark' }
    # 單頁互動應用（不是文章、也不是多頁專題），獨立一格
    - { key: 'ziwei', name: '紫微斗數', link: '/ziwei-fortune/', icon: 'iconfont icon-bookmark' }
    - key: 'notes'
      name: '學習筆記'
      icon: 'iconfont icon-notebook'
      submenu:
        - { name: '電腦視覺課程', link: '/cv-course/', icon: 'iconfont icon-note' }
        - { name: 'LLM 與生成式 AI 課程', link: '/llm-course/', icon: 'iconfont icon-note' }
        - { name: 'AutoML 應用證書課程', link: '/automl-course/', icon: 'iconfont icon-note' }
    - { key: 'archive', link: '/archives/', icon: 'iconfont icon-archive-fill' }
    - { key: 'category', link: '/categories/', icon: 'iconfont icon-category-fill' }
    - { key: 'tag', link: '/tags/', icon: 'iconfont icon-tags-fill' }
    - { key: 'about', link: '/about/', icon: 'iconfont icon-user-fill' }

# /about/ 頁面（theme 預設會顯示 "Fluid / An elegant theme for Hexo" 與一個指向
# /img/favicon.png 的微信 QR——本站沒有那張圖，會變成破圖）。這裡整段覆寫。
about:
  avatar: /img/avatar.png
  name: 'AI Tech Notes'
  intro: '本地 LLM 部署 · AI 工具實測 · 深度學習筆記 · 硬體效能評測'
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/kalpakjian', tip: 'GitHub' }

# theme 會無條件生成一份 /links/「友鏈」頁，預設塞三個 Fluid 官方 demo 連結，
# 而且頭像指向不存在的 /img/favicon.png（破圖）。本站沒有友鏈頁，關掉。
links:
  enable: false


index:
  banner_img: https://images.unsplash.com/photo-1518770660439-4636190af475?w=1600
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text: 'AI Tech Notes - 探索本地 LLM 與 Agent 架構'
  auto_excerpt:
    enable: true

post:
  banner_img: https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1600
  toc:
    enable: true
    number: true
  code:
    copy: true
    highlight:
      enable: true
      lib: 'highlightjs'
      highlightjs:
        style: 'atom-one-dark'
  math:
    enable: true
    specific: true
    engine: mathjax

custom_css:
  - /css/custom.css

footer:
  content: '© 2026 kalpakjian | Powered by <a href="https://hexo.io" target="_blank">Hexo</a> & <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a>'

search:
  enable: true
  type: 'local'
  path: /search.xml
