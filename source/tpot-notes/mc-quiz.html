<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;
  --red-bg:#fdeaea; --sel:#dbeafe; --sel-line:#2563eb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}
code{background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:.92em; font-family:ui-monospace,Consolas,"Courier New",monospace}
</style>

<script>
const QUESTIONS = [{"q":"TPOT 的全名是什麼？","o":["Total Pipeline Optimization Tool","Tree-based Pipeline Optimization Tool","Tree-based Process Optimization Toolkit","Training Pipeline Output Tool"],"a":1,"e":"TPOT 是 **Tree-based Pipeline Optimization Tool**（樹狀流程最佳化工具）：Tree-based 指管線用樹狀（有向圖）表示。"},{"q":"TPOT 屬於下列哪一類工具？","o":["深度學習框架","資料庫管理系統","資料視覺化工具","自動化機器學習（AutoML）工具"],"a":3,"e":"TPOT 是 **AutoML（Automated Machine Learning）** 工具：把「選演算法、處理特徵、調超參數」自動化。"},{"q":"TPOT 幫你決定的三件事，**不包含**下列哪一項？","o":["業務問題該如何定義","該選哪種演算法","資料特徵該如何處理與篩選","超參數該怎麼設定"],"a":0,"e":"TPOT 只負責「**怎麼做模型**」；**定義問題、收集與清理資料、選評估指標**仍然是人的工作。"},{"q":"本課的鳶尾花任務屬於哪一種機器學習？","o":["非監督式學習（分群）","監督式學習的迴歸問題","監督式學習的分類問題","強化學習"],"a":2,"e":"鳶尾花有**標籤**（品種 0/1/2）且標籤是**類別** → 監督式學習的**分類**問題，用 `TPOTClassifier`。"},{"q":"傳統程式設計與機器學習最大的差別是什麼？","o":["傳統程式設計跑得比較慢","機器學習不需要電腦","傳統程式設計由人寫規則；機器學習由資料找出規則","機器學習不需要資料"],"a":2,"e":"簡報的記法：傳統程式設計是 **資料 + 規則 → 答案**；機器學習是 **資料 + 答案 → 規則（模型）**。"},{"q":"在鳶尾花資料集裡，`iris.target` 代表什麼？","o":["正確答案（品種）","花的四個特徵數值","訓練與測試的比例","模型的準確率"],"a":0,"e":"`iris.data` 是**特徵**（花瓣／花萼長寬），`iris.target` 是**正確答案**（品種標籤）。"},{"q":"簡報說資料科學家面臨的「排列組合地獄」是指什麼？","o":["資料檔案的排列順序很難整理","GPU 的記憶體排列方式很複雜","資料庫的索引組合太多","演算法、特徵處理、超參數的組合數高達數萬種，人工無法窮舉"],"a":3,"e":"簡報原文：「這些選項的組合高達數萬種，光靠人工測試不僅極度耗時，更是不可能完成的任務。」"},{"q":"組合數成長的方式是？","o":["相加成長（每多一個選項只多一種）","相乘成長（每多一個維度就乘上好幾倍）","固定不變","只跟資料筆數有關"],"a":1,"e":"本機實測：4 種演算法 × 3 種前處理 × 3 個超參數 = **279 種**；再多一種前處理就變 465 種（相乘成長）。"},{"q":"本機實測用 `GridSearchCV` 跑 18 條管線（每條 5 折）大約花多久？","o":["約 3.94 秒","約 40 分鐘","約 3.94 分鐘","約 3.94 小時"],"a":0,"e":"本機實測（Python 3.11.16 / scikit-learn 1.9.1）：18 條管線 × 5 折 = 90 次 fit，共 **3.94 秒**。"},{"q":"TPOT 被比喻成什麼？","o":["自動販賣機","翻譯軟體","專屬的 AI 研發助理","資料庫引擎"],"a":2,"e":"簡報原話：「TPOT 就像是你專屬的 **AI 研發助理**」——你給資料，它幫你試成千上萬種組合。"},{"q":"TPOT 用什麼技術尋找最佳模型？","o":["窮舉法（把所有組合都試完）","基因演算法（模仿生物演化）","隨機森林","線性規劃"],"a":1,"e":"TPOT 的核心是**基因演算法**：初始族群 → 適者生存 → 交配與突變 → 不斷迭代。"},{"q":"TPOT 的搜尋空間本質上是什麼？","o":["所有可能的深度神經網路架構","任何程式語言的函式庫","雲端服務的價格方案","scikit-learn 提供的零件組合"],"a":3,"e":"TPOT 的搜尋空間 = **scikit-learn 的零件箱**；sklearn 沒有的演算法（例如 CN2、Scoring Sheet），它搜尋不到。"},{"q":"基因演算法的第一步「初始族群」是什麼意思？","o":["先用人類經驗挑幾個模型來測","系統先隨機生成一批不同的模型","先把資料複製好幾份","先算出答案再倒推模型"],"a":1,"e":"簡報：「系統先隨機生成一批不同的 AI 模型（例如 100 個）」——對應 TPOT 的 `population_size`。"},{"q":"基因演算法裡「適者生存」的判定標準，在 TPOT 中由哪個參數決定？","o":["`n_jobs`","`verbose`","`random_state`","`scorers`（搭配 `cv` 算出的交叉驗證分數）"],"a":3,"e":"「適者」= 交叉驗證分數高的管線；分數用 `scorers` 指定、用 `cv` 折數算出來。"},{"q":"「交配與突變」在 TPOT 中做什麼？","o":["把表現優異的模型特徵互相結合，或隨機微調參數，產生下一代","把資料集複製一份","把訓練與測試資料互換","把程式碼自動加上註解"],"a":0,"e":"對應 1.1.0 的參數：`crossover_probability=0.2`（交配）、`mutate_probability=0.7`（突變）。"},{"q":"TPOT 參數 `population_size` 對應生物演化的哪個概念？","o":["世代數","突變率","族群大小（一代裡有幾個個體）","天擇壓力"],"a":2,"e":"`population_size` = 每代幾個模型；`generations` = 繁衍幾代。課堂簡報用 20 與 5。"},{"q":"生物學的「適應度（fitness）」在 TPOT 中對應什麼？","o":["訓練所花的時間","模型的檔案大小","交叉驗證分數","資料的欄位數"],"a":2,"e":"適應度 = **交叉驗證分數**（例如 `scorers=['accuracy']` 時的 CV 平均準確率）。"},{"q":"TPOT 為什麼叫「樹狀（Tree-based）」流程？","o":["因為管線在內部是一張有向圖，節點是處理步驟、邊是資料流向","因為它只能用決策樹","因為它把資料排成樹狀結構","因為它的輸出是一棵聖誕樹圖"],"a":0,"e":"一條管線在 TPOT 內部是**有向圖**：節點是 sklearn 元件，邊代表資料從哪裡流到哪裡，所以允許分叉再合併。"},{"q":"課堂參數 `generations=5, population_size=20` 大約會評估幾條管線？","o":["5 條","20 條","25 條","約 100 條（5 × 20）"],"a":3,"e":"5 代 × 每代 20 個 = 約 **100 個模型組合**，這也是簡報說「要等 2～3 分鐘」的原因。"},{"q":"TPOT 1.1.0 的 `generations` 預設值是什麼？","o":["5","None（不設上限，改由 `max_time_mins` 控制）","100","0"],"a":1,"e":"1.1.0 的 `generations` 預設是 **None**；預設的 `max_time_mins` 是 **60** 分鐘——所以忘記設預算就會等很久。"},{"q":"TPOT 1.1.0 的 `max_time_mins` 預設值是多少？","o":["60（分鐘）","10（分鐘）","5（分鐘）","無上限"],"a":0,"e":"`max_time_mins=60`、`max_eval_time_mins=10`（單一管線的評估上限）。"},{"q":"簡報的賽車比喻中，「引擎、懸吊、輪胎」對應 TPOT 的什麼？","o":["超參數","訓練資料","演算法（模型種類）","評估指標"],"a":2,"e":"零件 = **演算法**（隨機森林、SVM、KNN…）；零件的規格 = **超參數**；下賽道跑圈的秒數 = **CV 分數**。"},{"q":"賽車比喻中「下賽道跑一圈的秒數」對應什麼？","o":["訓練資料的筆數","交叉驗證分數","程式執行時間","模型的檔案大小"],"a":1,"e":"秒數 = **交叉驗證分數**：用來決定哪些車（管線）能留下來繼續改裝。"},{"q":"鐵達尼號任務中，TPOT 要預測的標籤（y）是什麼？","o":["票價高低","艙等（1/2/3）","乘客年齡","是否存活（Survived）"],"a":3,"e":"標籤是 **Survived**（存活與否）；年齡、性別、艙等、票價都是**特徵**。"},{"q":"鐵達尼號資料裡 `Age` 有大約 20% 缺失，標準做法是什麼？","o":["直接把該乘客整筆刪掉","用中位數（或平均數）填補","把缺失填成 0","把缺失當成一個新品種"],"a":1,"e":"數值欄位的缺失通常用 `SimpleImputer(strategy=\"median\")` 填補；填 0 會讓模型誤以為「0 歲」。"},{"q":"`Sex`、`Embarked` 這種文字欄位要怎麼處理才能餵給模型？","o":["直接丟掉不用","改成大寫字母","用平均數填補","轉成 0/1 的數值（One-Hot 編碼）"],"a":3,"e":"用 `OneHotEncoder`（或 `pd.get_dummies`）把類別展開成 0/1 欄位；本機實測 `Sex`+`Embarked` 會展開成 4 欄。"},{"q":"為什麼 `Pclass`（1/2/3 艙等）建議當「類別」處理？","o":["因為它代表艙等的等級，不是可加減的數量","因為它一定是文字","因為它有很多缺失值","因為它跟票價完全一樣"],"a":0,"e":"「1 等 + 2 等 ≠ 3 等」——這種**有序類別**直接當數值會讓模型誤解成數量關係。"},{"q":"簡報為什麼把練習從鐵達尼號改成鳶尾花？","o":["因為 TPOT 不能處理鐵達尼號","因為鐵達尼號的資料太少","因為鐵達尼號需要缺失值填補與類別編碼等前處理，會花掉太多課堂時間","因為鳶尾花資料比較新"],"a":2,"e":"TPOT 只吃**乾淨的數值矩陣**；鐵達尼號要先去缺失、編碼、抽文字特徵，所以課堂改用零缺失的鳶尾花。"},{"q":"什麼是「資料洩漏（data leakage）」？","o":["資料庫被駭客入侵","訓練資料不小心被刪掉","用測試集的資訊（例如平均數）去處理訓練資料，讓分數虛高","把測試集印出來看答案"],"a":2,"e":"正確做法：前處理**只 fit 在訓練集**，再用同一組統計量 transform 測試集（包進 `Pipeline` 最安全）。"},{"q":"在 Colab 開啟新筆記本後，第一步（步驟 1）要做什麼？","o":["點「新增筆記本 (New Notebook)」開始一個空白 .ipynb","先安裝 TPOT","先上傳資料集","先按 Shift + Enter"],"a":0,"e":"簡報步驟 1：開瀏覽器 → 搜尋 Google Colab → 確認已登入 Google 帳號 → 點「新增筆記本」。"},{"q":"Google Colab 本質上是什麼？","o":["一套要安裝在自己電腦的軟體","一個雲端硬碟","一個網頁版的程式碼編輯器，不能執行","雲端的 Jupyter Notebook（程式在 Google 的機器上跑）"],"a":3,"e":"Colab = 雲端 **Jupyter Notebook**：不用在自己電腦安裝東西；但閒置會被回收，套件要重裝。"},{"q":"在 Colab 裡寫 `!pip install tpot`，前面的驚嘆號代表什麼？","o":["強調語氣","這行是作業系統指令，不是 Python 語法","強制重新安裝","安靜模式"],"a":1,"e":"`!` 是 Colab／Jupyter 的語法糖：把後面那行交給**作業系統 shell** 執行（所以 `pip` 才跑得動）。"},{"q":"安裝完 TPOT 後，簡報說畫面左邊會出現什麼，代表安裝成功？","o":["綠色打勾","紅色叉叉","一個對話框","進度條停在 50%"],"a":0,"e":"綠色打勾＝這一格執行完成；但仍建議看輸出最後幾行，確認沒有錯誤訊息。"},{"q":"執行 `import tpot` 出現 `ModuleNotFoundError: No module named 'tpot'`，最可能的原因是什麼？","o":["電腦沒有網路","Colab 需要付費","沒有先執行 `!pip install tpot`（或換了 runtime 後要重裝）","TPOT 只能在 Linux 執行"],"a":2,"e":"安裝（`!pip install`）與使用（`import`）是兩件事；Colab 換 runtime 後環境會重置，要重跑安裝格。"},{"q":"在 Colab 裡「重新啟動 runtime」之後，已經安裝的 TPOT 會怎樣？","o":["自動保留","會被清掉，需要重新 `!pip install tpot`","升級到最新版","變成唯讀"],"a":1,"e":"runtime 重啟等於換一台新機器；所有 pip 安裝的套件都不會保留。"},{"q":"在 Colab 的程式碼區塊裡，除了點左邊的播放鍵，還可以用什麼快捷鍵執行？","o":["Ctrl + S","Ctrl + Z","Alt + F4","Shift + Enter"],"a":3,"e":"簡報步驟 5 提到：按播放鍵「▶️」或使用快捷鍵 **Shift + Enter** 執行。"},{"q":"步驟 3「建立程式碼區塊」要做什麼？","o":["把整份程式寫在一個 Word 檔裡","點「+ 程式碼 (+ Code)」開一個新的空白儲存格 (Cell)","先刪掉預設的儲存格","先上傳自己的 .py 檔"],"a":1,"e":"Colab／Jupyter 是一小格一小格執行的；簡報要你開一個新 Cell 來寫 AI 訓練程式。"},{"q":"`from tpot import TPOTClassifier` 匯入的是什麼？","o":["鳶尾花資料集","切分資料的工具","畫圖的工具","負責執行自動化機器學習（分類任務）的核心引擎"],"a":3,"e":"簡報原文：「TPOTClassifier：這是我們今天的主角，負責執行自動化機器學習（分類任務）的核心引擎。」"},{"q":"`from sklearn.datasets import load_iris` 是用來做什麼？","o":["載入內建的鳶尾花資料集","安裝 TPOT","切割訓練與測試資料","計算準確率"],"a":0,"e":"`load_iris()` 會回傳 150 筆、4 個特徵、3 個類別的經典資料集。"},{"q":"為什麼簡報要求先用 `train_test_split` 把資料切開？","o":["因為 sklearn 規定一定要切","因為切開後訓練比較快","因為全部拿去練會讓模型「死背」，要留一份沒看過的資料當期末考","因為 TPOT 只吃測試集"],"a":2,"e":"簡報原文：「如果我們把所有考古題都給 AI 練習，它可能會死背答案」，所以要留 `X_test, y_test` 當期末考。"},{"q":"`random_state=42` 的作用是什麼？","o":["把資料隨機排序","指定要用 42 個執行緒","固定隨機種子，確保每次切出來的資料都一樣，方便驗證結果","把準確率乘上 42"],"a":2,"e":"簡報原文：「設定隨機種子，確保我們每次切出來的資料都一樣，方便驗證結果。」"},{"q":"簡報的 `TPOTClassifier(generations=5, population_size=20, verbosity=2, random_state=42)` 中，哪一個參數在 TPOT 1.1.0 會直接報錯？","o":["`verbosity`（1.1.0 已改名為 `verbose`）","`generations`","`population_size`","`random_state`"],"a":0,"e":"本機實測：`TypeError: TPOTEstimator.__init__() got an unexpected keyword argument 'verbosity'`；改成 `verbose=2` 即可。"},{"q":"`tpot.fit(X_train, y_train)` 這一行在做什麼？","o":["把資料存到硬碟","畫出資料分布圖","只做資料前處理","啟動基因演算法，開始嘗試各種演算法與參數組合"],"a":3,"e":"簡報原文：「`.fit()` 是機器學習中最核心的動作，意思是『擬合』或『訓練』」——對 TPOT 而言就是**開始演化搜尋**。"},{"q":"執行時看到進度條 `Generation: 100%|██████| 5/5`，代表什麼？","o":["已經評估了 5 條管線","繁衍 5 代已經全部跑完","資料切成 5 份","準確率是 5%"],"a":1,"e":"`5/5` 就是 `generations=5` 的 5 個世代全部完成；這個進度條由 `verbose=2` 印出。"},{"q":"簡報最後用 `tpot.score(X_test, y_test)` 看準確率；在 TPOT 1.1.0 應該怎麼寫？","o":["`accuracy_score(y_test, tpot.predict(X_test))`","`tpot.accuracy(X_test, y_test)`","`tpot.evaluate(X_test, y_test)`","`tpot.result_`"],"a":0,"e":"本機實測：`AttributeError: 'TPOTClassifier' object has no attribute 'score'`。1.1.0 沒有 `.score()`，要用 `predict` 搭配 sklearn 的指標函式。"},{"q":"TPOT 1.1.0 要把「最佳管線」帶走（存檔／部署），正確做法是？","o":["`tpot.export('pipeline.py')`","`tpot.save()`","`joblib.dump(tpot.fitted_pipeline_, 'model.joblib')`","`tpot.pipeline_`"],"a":2,"e":"1.1.0 移除了 `export()`；最佳管線在 `fitted_pipeline_`（本機實測型別是 sklearn `Pipeline`），用 `joblib` 存最直接。"},{"q":"關於 `tpot.export('pipeline.py')`，下列敘述何者正確？","o":["這是 1.1.0 的標準寫法","這是 0.x 的寫法；1.1.0 已移除，呼叫會出現 AttributeError","它會把資料匯出成 CSV","它會自動上傳到 GitHub"],"a":1,"e":"本機實測：`hasattr(tpot, 'export')` 為 `False`，呼叫得到 `AttributeError: module 'tpot' has no attribute 'export'`。"},{"q":"在本機（Windows）執行 TPOT 時，`processes=False` 的作用是什麼？","o":["關閉多執行緒","讓程式不要在 GPU 上跑","把結果存成檔案","讓 dask 用同一個行程內的執行緒，不要開子行程（避免 Nanny 起不來）"],"a":3,"e":"本機實測：不設 `processes=False` 會得到 `RuntimeError: Nanny failed to start.`；設了之後 5 代 × 20 族群約 51 秒跑完。"},{"q":"本機實測中，TPOT 內部的交叉驗證最佳分數是 0.9822，但測試集只有 0.9474。最合理的解釋是？","o":["程式有 bug","因為「在約 100 條裡挑最好的」天生樂觀，真實表現要用沒看過的資料才算得準","因為測試集比訓練集難很多倍","因為 sklearn 的 accuracy 算錯了"],"a":1,"e":"這叫**贏家詛咒（winner's curse）**：內部 CV 分數是「挑出來的最好那條」的分數，不是模型的真實實力。"},{"q":"本課的測試集只有 38 筆。這對「準確率」的解讀造成什麼影響？","o":["沒有影響","38 筆太多，分數一定很準","只要用 38 筆就不需要交叉驗證","錯 1 筆就會掉約 2.6%（例如 0.9737 與 0.9474 只差 1 筆）"],"a":3,"e":"1 ÷ 38 ≈ 2.6%：測試集越小，分數跳動越大——這也是簡報的 0.973 與本機的 0.9474 只差一題的原因。"},{"q":"如果資料的類別極度不平衡（例如 99% 都是同一類），只報 Accuracy 會有什麼問題？","o":["一個「全部猜多數類」的模型也能拿到 99%，看起來很好但完全沒用","Accuracy 會算不出來","Accuracy 會變成負數","Accuracy 會自動變成 Recall"],"a":0,"e":"不平衡資料要看 **Recall / Precision / F1 / ROC-AUC**，不能只看 Accuracy。"},{"q":"如果標籤是連續數值（例如房價），應該用哪個類別與指標？","o":["`TPOTClassifier` + Accuracy","`TPOTClassifier` + ROC-AUC","`TPOTRegressor` + RMSE／MAE","`TPOTRegressor` + Accuracy"],"a":2,"e":"標籤是**數值** → 迴歸問題 → `TPOTRegressor`，評估用 **RMSE / MAE / R²**。"},{"q":"TPOT 1.1.0 的 `scorers` 預設值是什麼？","o":["`['accuracy']`","`['f1_macro']`","`['roc_auc_ovr']`","`['rmse']`"],"a":2,"e":"預設是 **`['roc_auc_ovr']`**（多類別的一 const LET = 'ABCD';
const KEY = 'tpot-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let code = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else if(s.charAt(i) === '`'){
      code = !code;
      out += code ? '<code>' : '</code>';
      i += 1;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 20 || i === 40){
      const label = i === 0 ? '第一部分：AutoML、TPOT 與基因演算法基礎（1–20）'
                  : i === 20 ? '第二部分：鐵達尼號例子、Colab 準備與程式實作（21–40）'
                  : '第三部分：API 細節、常見錯誤與評估觀念（41–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
}
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
