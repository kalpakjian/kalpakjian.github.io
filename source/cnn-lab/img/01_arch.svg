<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="CNN 基本流水線：輸入、卷積、池化、卷積、池化、卷積、GAP、全連接、Softmax">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="52%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".24" stroke-width="1.5"/>

  <text x="450" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">卷積神經網絡（CNN）的基本流水線</text>
  <text x="450" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">同一組濾波器在整張圖上滑動 → 特徵圖 → 縮小 → 重複 → 最後回答「這是哪一類」</text>
  <line x1="170" y1="58" x2="730" y2="58" stroke="url(#rule)" stroke-width="2" filter="url(#gl)"/>

  <g font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
    <g filter="url(#gl)">
      <rect x="15" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="113" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#f472b6" stroke-width="1.5"/>
      <rect x="211" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#a78bfa" stroke-width="1.5"/>
      <rect x="309" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#f472b6" stroke-width="1.5"/>
      <rect x="407" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#a78bfa" stroke-width="1.5"/>
      <rect x="505" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#f472b6" stroke-width="1.5"/>
      <rect x="603" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#2dd4bf" stroke-width="1.5"/>
      <rect x="701" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="799" y="82" width="86" height="66" rx="9" fill="#0f1720" stroke="#3fb950" stroke-width="1.5"/>
    </g>

    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="58" y="106" fill="#22d3ee" filter="url(#gl)">輸入</text>
      <text x="156" y="106" fill="#f472b6" filter="url(#gl)">卷積</text>
      <text x="254" y="106" fill="#a78bfa" filter="url(#gl)">池化</text>
      <text x="352" y="106" fill="#f472b6" filter="url(#gl)">卷積</text>
      <text x="450" y="106" fill="#a78bfa" filter="url(#gl)">池化</text>
      <text x="548" y="106" fill="#f472b6" filter="url(#gl)">卷積</text>
      <text x="646" y="106" fill="#2dd4bf" filter="url(#gl)">GAP</text>
      <text x="744" y="106" fill="#fbbf24" filter="url(#gl)">全連接</text>
      <text x="842" y="106" fill="#3fb950" filter="url(#gl)">Softmax</text>
    </g>

    <g font-size="9.5" text-anchor="middle" fill="#9aa7b6">
      <text x="58" y="124">32×32×3</text><text x="58" y="138">一張彩色圖</text>
      <text x="156" y="124">3×3 濾波器</text><text x="156" y="138">→ 32 張圖</text>
      <text x="254" y="124">2×2 取最大</text><text x="254" y="138">32→16 格</text>
      <text x="352" y="124">3×3 濾波器</text><text x="352" y="138">→ 64 張圖</text>
      <text x="450" y="124">2×2 取最大</text><text x="450" y="138">16→8 格</text>
      <text x="548" y="124">3×3 濾波器</text><text x="548" y="138">→128 張圖</text>
      <text x="646" y="124">整張平均</text><text x="646" y="138">→128 個數</text>
      <text x="744" y="124">128 → 10</text><text x="744" y="138">每個類別一分</text>
      <text x="842" y="124">轉成機率</text><text x="842" y="138">加起來=100%</text>
    </g>
  </g>

  <g stroke="#22d3ee" stroke-width="1.6" opacity=".85" marker-end="url(#ar)" filter="url(#gl)">
    <line x1="101" y1="115" x2="111" y2="115"/>
    <line x1="199" y1="115" x2="209" y2="115"/>
    <line x1="297" y1="115" x2="307" y2="115"/>
    <line x1="395" y1="115" x2="405" y2="115"/>
    <line x1="493" y1="115" x2="503" y2="115"/>
    <line x1="591" y1="115" x2="601" y2="115"/>
    <line x1="689" y1="115" x2="699" y2="115"/>
    <line x1="787" y1="115" x2="797" y2="115"/>
  </g>

  <g>
    <line x1="254" y1="152" x2="548" y2="152" stroke="#f472b6" stroke-dasharray="5 4" stroke-width="1.4" filter="url(#gl)"/>
    <text x="401" y="168" font-size="10" text-anchor="middle" fill="#f472b6" filter="url(#gl)">這一段 = 特徵抽取（空間變小、通道變多）</text>
    <text x="254" y="196" font-size="10" text-anchor="middle" fill="#8b949e">卷積層數 ≈ 2–4 個就足以跑 MNIST / CIFAR-10</text>
    <text x="646" y="196" font-size="10" text-anchor="middle" fill="#8b949e">GAP 讓模型能接受任何尺寸的輸入</text>
  </g>

  <g font-size="10" fill="#9aa7b6">
    <rect x="15" y="212" width="12" height="12" rx="3" fill="#0f1720" stroke="#f472b6" stroke-width="1.4"/>
    <text x="33" y="222">卷積：找「邊緣、線條、紋理」</text>
    <rect x="213" y="212" width="12" height="12" rx="3" fill="#0f1720" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="231" y="222">池化：把圖縮小，減少計算</text>
    <rect x="411" y="212" width="12" height="12" rx="3" fill="#0f1720" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="429" y="222">GAP：把每張特徵圖壓成一個數字</text>
    <rect x="651" y="212" width="12" height="12" rx="3" fill="#0f1720" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="669" y="222">全連接：綜合所有特徵做決定</text>
  </g>
</svg>