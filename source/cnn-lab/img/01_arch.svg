<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box{stroke-width:1.5;rx:8}
      .t1{font-size:12px;font-weight:700;text-anchor:middle}
      .t2{font-size:9.5px;text-anchor:middle;fill:#334155}
      .lbl{font-size:10px;text-anchor:middle;fill:#64748b}
    </style>
  </defs>

  <text x="450" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    卷積神經網絡（CNN）的基本流水線
  </text>
  <text x="450" y="46" font-size="10.5" text-anchor="middle" fill="#64748b">
    同一組濾波器在整張圖上滑動 → 特徵圖 → 縮小 → 重複 → 最後回答「這是哪一類」
  </text>

  <g>
    <rect class="box" x="15" y="82" width="86" height="66" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text class="t1" x="58" y="106" fill="#0c4a6e">輸入</text>
    <text class="t2" x="58" y="124">32×32×3</text>
    <text class="t2" x="58" y="138">一張彩色圖</text>

    <rect class="box" x="113" y="82" width="86" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="t1" x="156" y="106" fill="#4c1d95">卷積</text>
    <text class="t2" x="156" y="124">3×3 濾波器</text>
    <text class="t2" x="156" y="138">→ 32 張圖</text>

    <rect class="box" x="211" y="82" width="86" height="66" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text class="t1" x="254" y="106" fill="#1e293b">池化</text>
    <text class="t2" x="254" y="124">2×2 取最大</text>
    <text class="t2" x="254" y="138">32→16 格</text>

    <rect class="box" x="309" y="82" width="86" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="t1" x="352" y="106" fill="#4c1d95">卷積</text>
    <text class="t2" x="352" y="124">3×3 濾波器</text>
    <text class="t2" x="352" y="138">→ 64 張圖</text>

    <rect class="box" x="407" y="82" width="86" height="66" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text class="t1" x="450" y="106" fill="#1e293b">池化</text>
    <text class="t2" x="450" y="124">2×2 取最大</text>
    <text class="t2" x="450" y="138">16→8 格</text>

    <rect class="box" x="505" y="82" width="86" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="t1" x="548" y="106" fill="#4c1d95">卷積</text>
    <text class="t2" x="548" y="124">3×3 濾波器</text>
    <text class="t2" x="548" y="138">→128 張圖</text>

    <rect class="box" x="603" y="82" width="86" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text class="t1" x="646" y="106" fill="#14532d">GAP</text>
    <text class="t2" x="646" y="124">整張平均</text>
    <text class="t2" x="646" y="138">→128 個數</text>

    <rect class="box" x="701" y="82" width="86" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text class="t1" x="744" y="106" fill="#78350f">全連接</text>
    <text class="t2" x="744" y="124">128 → 10</text>
    <text class="t2" x="744" y="138">每個類別一分</text>

    <rect class="box" x="799" y="82" width="86" height="66" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text class="t1" x="842" y="106" fill="#7f1d1d">Softmax</text>
    <text class="t2" x="842" y="124">轉成機率</text>
    <text class="t2" x="842" y="138">加起來=100%</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="101" y1="115" x2="111" y2="115"/>
    <line x1="199" y1="115" x2="209" y2="115"/>
    <line x1="297" y1="115" x2="307" y2="115"/>
    <line x1="395" y1="115" x2="405" y2="115"/>
    <line x1="493" y1="115" x2="503" y2="115"/>
    <line x1="591" y1="115" x2="601" y2="115"/>
    <line x1="689" y1="115" x2="699" y2="115"/>
    <line x1="787" y1="115" x2="797" y2="115"/>
  </g>

  <g>
    <line x1="254" y1="152" x2="548" y2="152" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text class="lbl" x="401" y="168">這一段 = 特徵抽取（空間變小、通道變多）</text>
    <text class="lbl" x="254" y="196">卷積層數 ≈ 2–4 個就足以跑 MNIST / CIFAR-10</text>
    <text class="lbl" x="646" y="196">GAP 讓模型能接受任何尺寸的輸入</text>
  </g>

  <g>
    <rect x="15" y="212" width="12" height="12" rx="2" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="33" y="222" font-size="10" fill="#475569">卷積：找「邊緣、線條、紋理」</text>
    <rect x="213" y="212" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#64748b"/>
    <text x="231" y="222" font-size="10" fill="#475569">池化：把圖縮小，減少計算</text>
    <rect x="411" y="212" width="12" height="12" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <text x="429" y="222" font-size="10" fill="#475569">GAP：把每張特徵圖壓成一個數字</text>
    <rect x="651" y="212" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706"/>
    <text x="669" y="222" font-size="10" fill="#475569">全連接：綜合所有特徵做決定</text>
  </g>
</svg>
