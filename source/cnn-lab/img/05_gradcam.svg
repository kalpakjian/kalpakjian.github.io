<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <defs>
    <radialGradient id="heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    Grad-CAM：模型「看哪裡」才做出這個判斷
  </text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#64748b">
    把最後一層的梯度當成「重要程度」，乘上特徵圖 → 變成一張熱點圖
  </text>

  <g>
    <!-- row 1 -->
    <rect x="60" y="72" width="130" height="130" fill="url(#sky)"/>
    <path d="M95,150 Q120,120 150,148 Q130,156 110,152 Z" fill="#1f2937"/>
    <path d="M150,148 L175,140 L152,154 Z" fill="#1f2937"/>
    <text x="125" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">① 原圖</text>
    <text x="125" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">鳥在藍天裡</text>

    <rect x="240" y="72" width="130" height="130" fill="#0b1220"/>
    <ellipse cx="290" cy="118" rx="52" ry="40" fill="url(#heat)"/>
    <text x="305" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">② Grad-CAM 熱點</text>
    <text x="305" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">紅 = 對答案最有貢獻</text>

    <rect x="420" y="72" width="130" height="130" fill="url(#sky)"/>
    <path d="M455,150 Q480,120 510,148 Q490,156 470,152 Z" fill="#1f2937"/>
    <path d="M510,148 L535,140 L512,154 Z" fill="#1f2937"/>
    <ellipse cx="470" cy="118" rx="52" ry="40" fill="url(#heat)" opacity="0.45"/>
    <text x="485" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">③ 疊在一起</text>
    <text x="485" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">熱點落在「天空」，不是鳥</text>

    <g>
      <rect x="600" y="80" width="250" height="112" rx="8" fill="#fef2f2" stroke="#dc2626"/>
      <text x="616" y="102" font-size="11" font-weight="700" fill="#7f1d1d">推論：模型靠背景判斷</text>
      <text x="616" y="122" font-size="9.8" fill="#7f1d1d">但這個推論有一個致命弱點：</text>
      <text x="616" y="140" font-size="9.8" fill="#7f1d1d">7×7 的特徵圖放大到 32×32，</text>
      <text x="616" y="158" font-size="9.8" fill="#7f1d1d">每個點代表 4×4 的原始像素，</text>
      <text x="616" y="176" font-size="9.8" font-weight="700" fill="#7f1d1d">位置誤差可達 ±4 像素。</text>
    </g>
  </g>

  <g>
    <rect x="60" y="248" width="790" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="76" y="267" font-size="10" fill="#334155">
      白話：這張圖告訴你「模型大概看哪一區」，但不能當成「模型一定在看那個東西」的鐵證。
    </text>
    <text x="76" y="285" font-size="10" fill="#64748b">
      所以後面還要做遮擋實驗（第 6 章）與反事實實驗（第 10 章）。
    </text>
  </g>
</svg>
