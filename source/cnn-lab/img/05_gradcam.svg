<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="Grad-CAM 三連拍：原圖、熱點圖、疊在一起，熱點落在天空而非鳥">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <radialGradient id="heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity=".95"/>
      <stop offset="32%" stop-color="#fbbf24" stop-opacity=".85"/>
      <stop offset="62%" stop-color="#a78bfa" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3a55"/><stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="300" fill="url(#bg)"/>
  <rect width="880" height="300" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="298.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">Grad-CAM：模型「看哪裡」才做出這個判斷</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">把最後一層的梯度當成「重要程度」，乘上特徵圖 → 變成一張熱點圖</text>

  <g>
    <rect x="60" y="72" width="130" height="130" fill="url(#sky)" stroke="#22d3ee" stroke-width="1.4" filter="url(#gl)"/>
    <path d="M95,150 Q120,120 150,148 Q130,156 110,152 Z" fill="#0b1220"/>
    <path d="M150,148 L175,140 L152,154 Z" fill="#0b1220"/>
    <path d="M95,150 Q120,120 150,148" fill="none" stroke="#67e8f9" stroke-width="1.4" opacity=".7"/>
    <text x="125" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#e6edf3">① 原圖</text>
    <text x="125" y="238" text-anchor="middle" font-size="9.5" fill="#8b949e">鳥在藍天裡</text>

    <rect x="240" y="72" width="130" height="130" fill="#060b14" stroke="#a78bfa" stroke-width="1.4" filter="url(#gl)"/>
    <ellipse cx="290" cy="118" rx="52" ry="40" fill="url(#heat)" filter="url(#gl2)"/>
    <text x="305" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#e6edf3">② Grad-CAM 熱點</text>
    <text x="305" y="238" text-anchor="middle" font-size="9.5" fill="#f472b6">紅 = 對答案最有貢獻</text>

    <rect x="420" y="72" width="130" height="130" fill="url(#sky)" stroke="#f472b6" stroke-width="1.4" filter="url(#gl)"/>
    <path d="M455,150 Q480,120 510,148 Q490,156 470,152 Z" fill="#0b1220"/>
    <path d="M510,148 L535,140 L512,154 Z" fill="#0b1220"/>
    <ellipse cx="470" cy="118" rx="52" ry="40" fill="url(#heat)" opacity=".55" filter="url(#gl2)"/>
    <text x="485" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#e6edf3">③ 疊在一起</text>
    <text x="485" y="238" text-anchor="middle" font-size="9.5" fill="#fbbf24">熱點落在「天空」，不是鳥</text>

    <g>
      <rect x="600" y="80" width="250" height="112" rx="9" fill="#1a1018" stroke="#f85149" stroke-width="1.5" filter="url(#gl)"/>
      <text x="616" y="102" font-size="11" font-weight="700" fill="#f85149" filter="url(#gl)">推論：模型靠背景判斷</text>
      <text x="616" y="122" font-size="9.8" fill="#9aa7b6">但這個推論有一個致命弱點：</text>
      <text x="616" y="140" font-size="9.8" fill="#9aa7b6">7×7 的特徵圖放大到 32×32，</text>
      <text x="616" y="158" font-size="9.8" fill="#9aa7b6">每個點代表 4×4 的原始像素，</text>
      <text x="616" y="176" font-size="9.8" font-weight="700" fill="#f85149" filter="url(#gl)">位置誤差可達 ±4 像素。</text>
    </g>
  </g>

  <g>
    <rect x="60" y="248" width="790" height="46" rx="8" fill="#0f1720" stroke="#22d3ee" stroke-width="1.4" filter="url(#gl)"/>
    <text x="76" y="267" font-size="10" fill="#c3ccd8">白話：這張圖告訴你「模型大概看哪一區」，但不能當成「模型一定在看那個東西」的鐵證。</text>
    <text x="76" y="285" font-size="10" fill="#8b949e">所以後面還要做遮擋實驗（第 6 章）與反事實實驗（第 10 章）。</text>
  </g>
</svg>