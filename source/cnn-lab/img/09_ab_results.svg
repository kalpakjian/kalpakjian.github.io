<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    三次「治療」都失敗：準確率掉了，目標錯誤卻沒少
  </text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#64748b">
    同一 seed、同時長、同超參，唯一差別是被測的資料增強
  </text>

  <!-- axes -->
  <g transform="translate(90,80)">
    <line x1="0" y1="180" x2="640" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="-10" y="8" font-size="9" text-anchor="end" fill="#64748b">85%</text>
    <text x="-10" y="60" font-size="9" text-anchor="end" fill="#64748b">84%</text>
    <text x="-10" y="112" font-size="9" text-anchor="end" fill="#64748b">83%</text>
    <text x="-10" y="164" font-size="9" text-anchor="end" fill="#64748b">82%</text>
    <g stroke="#e2e8f0" stroke-width="0.8">
      <line x1="0" y1="0" x2="640" y2="0"/><line x1="0" y1="60" x2="640" y2="60"/>
      <line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="180" x2="640" y2="180"/>
    </g>

    <!-- bars: heights map (acc-82)/3*180 -->
    <g>
      <rect x="40" y="3.8" width="90" height="176.2" fill="#2563eb" opacity="0.85"/>
      <rect x="200" y="128.4" width="90" height="51.6" fill="#f59e0b" opacity="0.85"/>
      <rect x="360" y="127.8" width="90" height="52.2" fill="#f59e0b" opacity="0.85"/>
      <rect x="520" y="105" width="90" height="75" fill="#f59e0b" opacity="0.85"/>
    </g>

    <g font-size="10" text-anchor="middle">
      <text x="85" y="-8" fill="#1d4ed8" font-weight="700">84.97%</text>
      <text x="245" y="122" fill="#b45309" font-weight="700">82.87%</text>
      <text x="405" y="121" fill="#b45309" font-weight="700">82.88%</text>
      <text x="565" y="98" fill="#b45309" font-weight="700">83.26%</text>
    </g>

    <g font-size="9.5" text-anchor="middle" fill="#334155">
      <text x="85" y="198">baseline</text>
      <text x="85" y="212" fill="#64748b">無增強</text>
      <text x="245" y="198">RandomErasing</text>
      <text x="245" y="212" fill="#64748b">p=0.5</text>
      <text x="405" y="198">邊框換另一張圖</text>
      <text x="405" y="212" fill="#64748b">p=0.5</text>
      <text x="565" y="198">邊框換純色</text>
      <text x="565" y="212" fill="#64748b">p=0.9, 20ep</text>
    </g>
  </g>

  <!-- bird->plane line -->
  <g transform="translate(90,80)">
    <polyline points="85,168 245,170 405,164 565,168" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
    <g fill="#dc2626">
      <circle cx="85" cy="168" r="4"/><circle cx="245" cy="170" r="4"/>
      <circle cx="405" cy="164" r="4"/><circle cx="565" cy="168" r="4"/>
    </g>
    <g font-size="9" fill="#dc2626" text-anchor="middle">
      <text x="85" y="158">4.2%</text><text x="245" y="188">4.0%</text>
      <text x="405" y="154">5.0%</text><text x="565" y="158">4.2%</text>
    </g>
    <text x="640" y="172" font-size="9" fill="#dc2626" text-anchor="end">bird→plane</text>
  </g>

  <g>
    <rect x="90" y="292" width="750" height="30" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="106" y="312" font-size="10" fill="#7f1d1d">
      三次干預平均賠 1.9 個百分點準確率，目標指標（紅線）卻在誤差範圍內動也不動 → 這個處方無效，不是「效果小」。
    </text>
  </g>
</svg>
