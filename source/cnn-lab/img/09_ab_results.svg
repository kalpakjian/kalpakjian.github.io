<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="四次 A/B 的準確率柱狀圖與 bird→plane 折線：準確率下降，目標指標不動">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="348" fill="url(#bg)"/>
  <rect width="880" height="348" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="346.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">三次「治療」都失敗：準確率掉了，目標錯誤卻沒少</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">同一 seed、同時長、同超參，唯一差別是被測的資料增強</text>

  <g transform="translate(90,80)">
    <line x1="0" y1="180" x2="640" y2="180" stroke="#3b4a5c" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#3b4a5c" stroke-width="1.2"/>
    <text x="-10" y="8" font-size="9" text-anchor="end" fill="#8b949e">85%</text>
    <text x="-10" y="60" font-size="9" text-anchor="end" fill="#8b949e">84%</text>
    <text x="-10" y="112" font-size="9" text-anchor="end" fill="#8b949e">83%</text>
    <text x="-10" y="164" font-size="9" text-anchor="end" fill="#8b949e">82%</text>
    <g stroke="#1b3a5c" stroke-width="0.8">
      <line x1="0" y1="0" x2="640" y2="0"/><line x1="0" y1="60" x2="640" y2="60"/>
      <line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="180" x2="640" y2="180"/>
    </g>

    <g filter="url(#gl)">
      <rect x="40" y="3.8" width="90" height="176.2" rx="4" fill="url(#barB)" stroke="#22d3ee" stroke-width="1.2"/>
      <rect x="200" y="128.4" width="90" height="51.6" rx="4" fill="url(#barA)" stroke="#fbbf24" stroke-width="1.2"/>
      <rect x="360" y="127.8" width="90" height="52.2" rx="4" fill="url(#barA)" stroke="#fbbf24" stroke-width="1.2"/>
      <rect x="520" y="105" width="90" height="75" rx="4" fill="url(#barA)" stroke="#fbbf24" stroke-width="1.2"/>
    </g>

    <g font-size="10" text-anchor="middle" font-weight="700">
      <text x="85" y="-8" fill="#22d3ee" filter="url(#gl)">84.97%</text>
      <text x="245" y="122" fill="#fbbf24" filter="url(#gl)">82.87%</text>
      <text x="405" y="121" fill="#fbbf24" filter="url(#gl)">82.88%</text>
      <text x="565" y="98" fill="#fbbf24" filter="url(#gl)">83.26%</text>
    </g>

    <g font-size="9.5" text-anchor="middle" fill="#9aa7b6">
      <text x="85" y="204">baseline</text>
      <text x="85" y="218" fill="#8b949e">無增強</text>
      <text x="245" y="204">RandomErasing</text>
      <text x="245" y="218" fill="#8b949e">p=0.5</text>
      <text x="405" y="204">邊框換另一張圖</text>
      <text x="405" y="218" fill="#8b949e">p=0.5</text>
      <text x="565" y="204">邊框換純色</text>
      <text x="565" y="218" fill="#8b949e">p=0.9, 20ep</text>
    </g>
  </g>

  <g transform="translate(90,80)">
    <polyline points="85,168 245,170 405,164 565,168" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-dasharray="5 3" filter="url(#gl)"/>
    <g fill="#f472b6" filter="url(#gl)">
      <circle cx="85" cy="168" r="4"/><circle cx="245" cy="170" r="4"/><circle cx="405" cy="164" r="4"/><circle cx="565" cy="168" r="4"/>
    </g>
    <g font-size="9" fill="#f472b6" text-anchor="middle">
      <text x="85" y="158">4.2%</text><text x="245" y="160">4.0%</text>
      <text x="405" y="154">5.0%</text><text x="565" y="158">4.2%</text>
    </g>
    <text x="640" y="30" font-size="9" fill="#f472b6" text-anchor="end" filter="url(#gl)">bird→plane（目標指標）</text>
  </g>

  <g>
    <rect x="90" y="310" width="750" height="30" rx="7" fill="#1a1018" stroke="#f85149" stroke-width="1.3" filter="url(#gl)"/>
    <text x="106" y="330" font-size="10" fill="#9aa7b6">三次干預平均賠 1.9 個百分點準確率，目標指標（粉線）卻在誤差範圍內動也不動 → 這個處方無效，不是「效果小」。</text>
  </g>
</svg>