<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <text x="440" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    混淆矩陣：模型最常把「誰」認成「誰」
  </text>
  <text x="440" y="44" font-size="10.5" text-anchor="middle" fill="#64748b">
    每一列加起來 100%；對角線 = 答對，其他格 = 答錯成該類的比例（只標 ≥3% 的）
  </text>

  <g transform="translate(170,78)" font-size="9.5" text-anchor="middle">
    <text x="25" y="-10" fill="#334155">bird</text><text x="75" y="-10" fill="#334155">cat</text>
    <text x="125" y="-10" fill="#334155">dog</text><text x="175" y="-10" fill="#334155">deer</text>
    <text x="225" y="-10" fill="#334155">plane</text><text x="275" y="-10" fill="#334155">ship</text>
    <text x="-8" y="29" text-anchor="end" fill="#334155">bird</text>
    <text x="-8" y="79" text-anchor="end" fill="#334155">cat</text>
    <text x="-8" y="129" text-anchor="end" fill="#334155">dog</text>
    <text x="-8" y="179" text-anchor="end" fill="#334155">deer</text>
    <text x="-8" y="229" text-anchor="end" fill="#334155">plane</text>
    <text x="-8" y="279" text-anchor="end" fill="#334155">ship</text>

    <rect x="0" y="0" width="300" height="300" fill="#f8fafc" stroke="#cbd5e1"/>
    <g stroke="#e2e8f0" stroke-width="0.8">
      <line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="150" y1="0" x2="150" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="250" y1="0" x2="250" y2="300"/>
      <line x1="0" y1="50" x2="300" y2="50"/><line x1="0" y1="100" x2="300" y2="100"/>
      <line x1="0" y1="150" x2="300" y2="150"/><line x1="0" y1="200" x2="300" y2="200"/>
      <line x1="0" y1="250" x2="300" y2="250"/>
    </g>

    <rect x="0" y="0" width="50" height="50" fill="#1d4ed8"/><text x="25" y="30" fill="#fff" font-weight="700">78</text>
    <rect x="50" y="0" width="50" height="50" fill="#dbeafe"/><text x="75" y="30" fill="#334155">4</text>
    <rect x="150" y="0" width="50" height="50" fill="#dbeafe"/><text x="175" y="30" fill="#334155">4</text>
    <rect x="200" y="0" width="50" height="50" fill="#dbeafe"/><text x="225" y="30" fill="#334155">4</text>

    <rect x="0" y="50" width="50" height="50" fill="#bfdbfe"/><text x="25" y="80" fill="#334155">6</text>
    <rect x="50" y="50" width="50" height="50" fill="#1d4ed8"/><text x="75" y="80" fill="#fff" font-weight="700">69</text>
    <rect x="100" y="50" width="50" height="50" fill="#bfdbfe"/><text x="125" y="80" fill="#334155">11</text>
    <rect x="150" y="50" width="50" height="50" fill="#dbeafe"/><text x="175" y="80" fill="#334155">4</text>

    <rect x="0" y="100" width="50" height="50" fill="#eff6ff"/><text x="25" y="130" fill="#334155">3</text>
    <rect x="50" y="100" width="50" height="50" fill="#bfdbfe"/><text x="75" y="130" fill="#334155">11</text>
    <rect x="100" y="100" width="50" height="50" fill="#1d4ed8"/><text x="125" y="130" fill="#fff" font-weight="700">78</text>

    <rect x="50" y="150" width="50" height="50" fill="#eff6ff"/><text x="75" y="180" fill="#334155">3</text>
    <rect x="150" y="150" width="50" height="50" fill="#1d4ed8"/><text x="175" y="180" fill="#fff" font-weight="700">84</text>

    <rect x="0" y="200" width="50" height="50" fill="#dbeafe"/><text x="25" y="230" fill="#334155">4</text>
    <rect x="200" y="200" width="50" height="50" fill="#1d4ed8"/><text x="225" y="230" fill="#fff" font-weight="700">88</text>
    <rect x="250" y="200" width="50" height="50" fill="#dbeafe"/><text x="275" y="230" fill="#334155">4</text>

    <rect x="200" y="250" width="50" height="50" fill="#dbeafe"/><text x="225" y="280" fill="#334155">5</text>
    <rect x="250" y="250" width="50" height="50" fill="#1d4ed8"/><text x="275" y="280" fill="#fff" font-weight="700">91</text>
  </g>

  <g transform="translate(510,84)">
    <rect x="0" y="0" width="320" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="22" font-size="10.5" font-weight="700" fill="#0f172a">三個明顯的「互相認錯」</text>
    <text x="14" y="44" font-size="9.8" fill="#b91c1c">cat ↔ dog ：11% / 10%</text>
    <text x="14" y="62" font-size="9.8" fill="#b91c1c">truck ↔ car ：約 4%</text>
    <text x="14" y="80" font-size="9.8" fill="#b91c1c">bird → deer / plane ：各 4%</text>
    <text x="14" y="102" font-size="9.5" font-weight="700" fill="#334155">→ 錯的都是「長得很像」的類別，不是亂猜</text>
  </g>

  <g transform="translate(510,214)">
    <rect x="0" y="0" width="320" height="86" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#1e3a8a">白話</text>
    <text x="14" y="42" font-size="9.6" fill="#1e3a8a">就像考試把「貓」寫成「狗」、「卡車」寫成「汽車」。</text>
    <text x="14" y="60" font-size="9.6" fill="#1e3a8a">你幾乎不會把貓寫成「飛機」——模型也一樣。</text>
    <text x="14" y="78" font-size="9.4" fill="#3b82f6">這叫「語意相近的混淆」，是正常的。</text>
  </g>
</svg>
