<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="CIFAR-10 混淆矩陣：cat 與 dog 互混 11%／10%，truck 與 car 約 4%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="390" fill="url(#bg)"/>
  <rect width="880" height="390" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="388.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".24" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">混淆矩陣：模型最常把「誰」認成「誰」</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">每一列加起來 100%；對角線 = 答對，其他格 = 答錯成該類的比例（只標 ≥3% 的）</text>

  <g transform="translate(170,78)" font-size="9.5" text-anchor="middle">
    <text x="25" y="-10" fill="#9aa7b6">bird</text><text x="75" y="-10" fill="#9aa7b6">cat</text>
    <text x="125" y="-10" fill="#9aa7b6">dog</text><text x="175" y="-10" fill="#9aa7b6">deer</text>
    <text x="225" y="-10" fill="#9aa7b6">plane</text><text x="275" y="-10" fill="#9aa7b6">ship</text>
    <text x="-8" y="29" text-anchor="end" fill="#9aa7b6">bird</text>
    <text x="-8" y="79" text-anchor="end" fill="#9aa7b6">cat</text>
    <text x="-8" y="129" text-anchor="end" fill="#9aa7b6">dog</text>
    <text x="-8" y="179" text-anchor="end" fill="#9aa7b6">deer</text>
    <text x="-8" y="229" text-anchor="end" fill="#9aa7b6">plane</text>
    <text x="-8" y="279" text-anchor="end" fill="#9aa7b6">ship</text>

    <rect x="0" y="0" width="300" height="300" fill="#0a1420" stroke="#22d3ee" stroke-width="1.4" filter="url(#gl)"/>
    <g stroke="#1b3a5c" stroke-width="0.8">
      <line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="150" y1="0" x2="150" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="250" y1="0" x2="250" y2="300"/>
      <line x1="0" y1="50" x2="300" y2="50"/><line x1="0" y1="100" x2="300" y2="100"/>
      <line x1="0" y1="150" x2="300" y2="150"/><line x1="0" y1="200" x2="300" y2="200"/>
      <line x1="0" y1="250" x2="300" y2="250"/>
    </g>

    <g filter="url(#gl)">
      <rect x="0" y="0" width="50" height="50" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/><text x="25" y="30" fill="#e0fbff" font-weight="700">78</text>
      <rect x="50" y="50" width="50" height="50" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/><text x="75" y="80" fill="#e0fbff" font-weight="700">69</text>
      <rect x="100" y="100" width="50" height="50" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/><text x="125" y="130" fill="#e0fbff" font-weight="700">78</text>
      <rect x="150" y="150" width="50" height="50" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/><text x="175" y="180" fill="#e0fbff" font-weight="700">84</text>
      <rect x="200" y="200" width="50" height="50" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/><text x="225" y="230" fill="#e0fbff" font-weight="700">88</text>
      <rect x="250" y="250" width="50" height="50" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/><text x="275" y="280" fill="#e0fbff" font-weight="700">91</text>
    </g>

    <g fill="#16233a" stroke="#1b3a5c" stroke-width="0.8">
      <rect x="50" y="0" width="50" height="50"/><rect x="150" y="0" width="50" height="50"/><rect x="200" y="0" width="50" height="50"/>
      <rect x="0" y="50" width="50" height="50"/><rect x="100" y="50" width="50" height="50"/><rect x="150" y="50" width="50" height="50"/>
      <rect x="0" y="100" width="50" height="50"/><rect x="50" y="100" width="50" height="50"/>
      <rect x="50" y="150" width="50" height="50"/>
      <rect x="0" y="200" width="50" height="50"/><rect x="250" y="200" width="50" height="50"/>
      <rect x="200" y="250" width="50" height="50"/>
    </g>
    <g fill="#8b949e">
      <text x="75" y="30">4</text><text x="175" y="30">4</text><text x="225" y="30">4</text>
      <text x="25" y="80">6</text><text x="125" y="80">11</text><text x="175" y="80">4</text>
      <text x="25" y="130">3</text><text x="75" y="130">11</text>
      <text x="75" y="180">3</text>
      <text x="25" y="230">4</text><text x="275" y="230">4</text>
      <text x="225" y="280">5</text>
    </g>
  </g>

  <g transform="translate(510,84)">
    <rect x="0" y="0" width="320" height="118" rx="9" fill="#0f1720" stroke="#22d3ee" stroke-width="1.4" filter="url(#gl)"/>
    <text x="14" y="22" font-size="10.5" font-weight="700" fill="#e6edf3">三個明顯的「互相認錯」</text>
    <text x="14" y="44" font-size="9.8" fill="#f472b6" filter="url(#gl)">cat ↔ dog ：11% / 10%</text>
    <text x="14" y="62" font-size="9.8" fill="#f472b6" filter="url(#gl)">truck ↔ car ：約 4%</text>
    <text x="14" y="80" font-size="9.8" fill="#f472b6" filter="url(#gl)">bird → deer / plane ：各 4%</text>
    <text x="14" y="102" font-size="9.5" font-weight="700" fill="#c3ccd8">→ 錯的都是「長得很像」的類別，不是亂猜</text>
  </g>

  <g transform="translate(510,216)">
    <rect x="0" y="0" width="320" height="86" rx="9" fill="#0f1720" stroke="#a78bfa" stroke-width="1.4" filter="url(#gl)"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#a78bfa" filter="url(#gl)">白話</text>
    <text x="14" y="42" font-size="9.6" fill="#9aa7b6">就像考試把「貓」寫成「狗」、「卡車」寫成「汽車」。</text>
    <text x="14" y="60" font-size="9.6" fill="#9aa7b6">你幾乎不會把貓寫成「飛機」——模型也一樣。</text>
    <text x="14" y="78" font-size="9.4" fill="#8b949e">這叫「語意相近的混淆」，是正常的。</text>
  </g>

  <g transform="translate(510,316)">
    <rect x="0" y="0" width="320" height="56" rx="9" fill="#0f1720" stroke="#3fb950" stroke-width="1.4" filter="url(#gl)"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#3fb950" filter="url(#gl)">對角線 = 答對</text>
    <text x="14" y="42" font-size="9.4" fill="#9aa7b6">bird 78% / cat 69% / dog 78% / deer 84%</text>
  </g>
</svg>