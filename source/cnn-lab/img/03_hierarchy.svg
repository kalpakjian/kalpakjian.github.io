<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="階層式特徵：第 1 層看線條、第 2 層看轉角、第 3 層看整個形狀">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="880" height="330" fill="url(#bg)"/>
  <rect width="880" height="330" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="328.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">越深的層，看得越「大」、越「抽象」</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">空間變小、通道變多 —— 用「位置」換「意義」</text>

  <g>
    <g>
      <rect x="40" y="80" width="168" height="168" rx="6" fill="#0a1420" stroke="#22d3ee" stroke-width="1.5" filter="url(#gl)"/>
      <g stroke="#1e3a5c" stroke-width="0.7">
        <line x1="40" y1="101" x2="208" y2="101"/><line x1="40" y1="122" x2="208" y2="122"/>
        <line x1="40" y1="143" x2="208" y2="143"/><line x1="40" y1="164" x2="208" y2="164"/>
        <line x1="40" y1="185" x2="208" y2="185"/><line x1="40" y1="206" x2="208" y2="206"/>
        <line x1="40" y1="227" x2="208" y2="227"/>
        <line x1="61" y1="80" x2="61" y2="248"/><line x1="82" y1="80" x2="82" y2="248"/>
        <line x1="103" y1="80" x2="103" y2="248"/><line x1="124" y1="80" x2="124" y2="248"/>
        <line x1="145" y1="80" x2="145" y2="248"/><line x1="166" y1="80" x2="166" y2="248"/>
        <line x1="187" y1="80" x2="187" y2="248"/>
      </g>
      <path d="M60,150 L150,150" stroke="#22d3ee" stroke-width="3.4" fill="none" filter="url(#gl)"/>
      <path d="M60,180 L150,120" stroke="#22d3ee" stroke-width="3.4" fill="none" filter="url(#gl)"/>
      <text x="124" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee" filter="url(#gl)">第 1 層</text>
      <text x="124" y="288" text-anchor="middle" font-size="10" fill="#9aa7b6">28×28 · 32 通道</text>
      <text x="124" y="306" text-anchor="middle" font-size="10.5" fill="#22d3ee" filter="url(#gl)">看到：線條、邊緣</text>
    </g>

    <g>
      <rect x="290" y="122" width="84" height="84" rx="4" fill="#0a1420" stroke="#a78bfa" stroke-width="1.5" filter="url(#gl)"/>
      <g stroke="#3b2f63" stroke-width="0.7">
        <line x1="290" y1="143" x2="374" y2="143"/><line x1="290" y1="164" x2="374" y2="164"/><line x1="290" y1="185" x2="374" y2="185"/>
        <line x1="311" y1="122" x2="311" y2="206"/><line x1="332" y1="122" x2="332" y2="206"/><line x1="353" y1="122" x2="353" y2="206"/>
      </g>
      <path d="M300,180 Q320,140 340,180" stroke="#a78bfa" stroke-width="2.8" fill="none" filter="url(#gl)"/>
      <text x="332" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" filter="url(#gl)">第 2 層</text>
      <text x="332" y="246" text-anchor="middle" font-size="10" fill="#9aa7b6">14×14 · 64 通道</text>
      <text x="332" y="264" text-anchor="middle" font-size="10.5" fill="#a78bfa" filter="url(#gl)">看到：轉角、弧形</text>
    </g>

    <g>
      <rect x="450" y="150" width="42" height="42" rx="3" fill="#0a1420" stroke="#f472b6" stroke-width="1.5" filter="url(#gl)"/>
      <g stroke="#5c2f4c" stroke-width="0.7">
        <line x1="450" y1="171" x2="492" y2="171"/><line x1="471" y1="150" x2="471" y2="192"/>
      </g>
      <circle cx="471" cy="167" r="9" fill="none" stroke="#f472b6" stroke-width="2.8" filter="url(#gl)"/>
      <text x="471" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#f472b6" filter="url(#gl)">第 3 層</text>
      <text x="471" y="232" text-anchor="middle" font-size="10" fill="#9aa7b6">7×7 · 128 通道</text>
      <text x="471" y="250" text-anchor="middle" font-size="10.5" fill="#f472b6" filter="url(#gl)">看到：整個形狀</text>
    </g>

    <g>
      <rect x="560" y="140" width="120" height="62" rx="8" fill="#0f1720" stroke="#2dd4bf" stroke-width="1.5" filter="url(#gl)"/>
      <text x="620" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="#2dd4bf" filter="url(#gl)">GAP + 全連接</text>
      <text x="620" y="181" text-anchor="middle" font-size="9.5" fill="#9aa7b6">128 個數字 → 10 個分數</text>
      <text x="620" y="228" text-anchor="middle" font-size="10.5" fill="#2dd4bf" filter="url(#gl)">決定：這是什麼？</text>
      <line x1="505" y1="171" x2="555" y2="171" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#ar)" filter="url(#gl)"/>
    </g>
  </g>

  <g>
    <rect x="710" y="140" width="140" height="62" rx="8" fill="#0f1720" stroke="#8b949e" stroke-width="1.3" filter="url(#gl)"/>
    <text x="780" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#c3ccd8">位置精度</text>
    <text x="780" y="178" text-anchor="middle" font-size="10" fill="#9aa7b6">28×28 → 7×7</text>
    <text x="780" y="194" text-anchor="middle" font-size="9" fill="#8b949e">一格 = 4×4 原圖像素</text>
  </g>

  <g stroke="#22d3ee" stroke-width="1.6" marker-end="url(#ar)" filter="url(#gl)">
    <line x1="212" y1="164" x2="285" y2="164"/>
    <line x1="378" y1="164" x2="445" y2="168"/>
  </g>

  <text x="440" y="322" font-size="10" text-anchor="middle" fill="#8b949e">這就是 CNN 的「階層式學習」：先看小地方，再把小地方組起來看大地方</text>
</svg>