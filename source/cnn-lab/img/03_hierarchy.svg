<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    越深的層，看得越「大」、越「抽象」
  </text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#64748b">
    空間變小、通道變多 —— 用「位置」換「意義」
  </text>

  <g>
    <!-- layer 1 -->
    <g>
      <rect x="40" y="80" width="168" height="168" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
      <g stroke="#7dd3fc" stroke-width="0.7">
        <line x1="40" y1="101" x2="208" y2="101"/><line x1="40" y1="122" x2="208" y2="122"/>
        <line x1="40" y1="143" x2="208" y2="143"/><line x1="40" y1="164" x2="208" y2="164"/>
        <line x1="40" y1="185" x2="208" y2="185"/><line x1="40" y1="206" x2="208" y2="206"/>
        <line x1="40" y1="227" x2="208" y2="227"/>
        <line x1="61" y1="80" x2="61" y2="248"/><line x1="82" y1="80" x2="82" y2="248"/>
        <line x1="103" y1="80" x2="103" y2="248"/><line x1="124" y1="80" x2="124" y2="248"/>
        <line x1="145" y1="80" x2="145" y2="248"/><line x1="166" y1="80" x2="166" y2="248"/>
        <line x1="187" y1="80" x2="187" y2="248"/>
      </g>
      <path d="M60,150 L150,150" stroke="#0284c7" stroke-width="3"/>
      <path d="M60,180 L150,120" stroke="#0284c7" stroke-width="3"/>
      <text x="124" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">第 1 層</text>
      <text x="124" y="288" text-anchor="middle" font-size="10" fill="#0c4a6e">28×28 · 32 通道</text>
      <text x="124" y="306" text-anchor="middle" font-size="10.5" fill="#0284c7">看到：線條、邊緣</text>
    </g>

    <!-- layer 2 -->
    <g>
      <rect x="290" y="122" width="84" height="84" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
      <g stroke="#c4b5fd" stroke-width="0.7">
        <line x1="290" y1="143" x2="374" y2="143"/><line x1="290" y1="164" x2="374" y2="164"/>
        <line x1="290" y1="185" x2="374" y2="185"/>
        <line x1="311" y1="122" x2="311" y2="206"/><line x1="332" y1="122" x2="332" y2="206"/>
        <line x1="353" y1="122" x2="353" y2="206"/>
      </g>
      <path d="M300,180 Q320,140 340,180" stroke="#7c3aed" stroke-width="2.6" fill="none"/>
      <text x="332" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">第 2 層</text>
      <text x="332" y="246" text-anchor="middle" font-size="10" fill="#4c1d95">14×14 · 64 通道</text>
      <text x="332" y="264" text-anchor="middle" font-size="10.5" fill="#7c3aed">看到：轉角、弧形</text>
    </g>

    <!-- layer 3 -->
    <g>
      <rect x="450" y="150" width="42" height="42" rx="2" fill="#fce7f3" stroke="#db2777"/>
      <g stroke="#f9a8d4" stroke-width="0.7">
        <line x1="450" y1="171" x2="492" y2="171"/><line x1="471" y1="150" x2="471" y2="192"/>
      </g>
      <circle cx="471" cy="167" r="9" fill="none" stroke="#db2777" stroke-width="2.6"/>
      <text x="471" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#831843">第 3 層</text>
      <text x="471" y="232" text-anchor="middle" font-size="10" fill="#831843">7×7 · 128 通道</text>
      <text x="471" y="250" text-anchor="middle" font-size="10.5" fill="#db2777">看到：整個形狀</text>
    </g>

    <!-- classifier -->
    <g>
      <rect x="560" y="140" width="120" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="620" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">GAP + 全連接</text>
      <text x="620" y="181" text-anchor="middle" font-size="9.5" fill="#14532d">128 個數字 → 10 個分數</text>
      <text x="620" y="228" text-anchor="middle" font-size="10.5" fill="#16a34a">決定：這是什麼？</text>
      <line x1="505" y1="171" x2="555" y2="171" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a3)"/>
    </g>
  </g>

  <g>
    <rect x="710" y="140" width="140" height="62" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="780" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">位置精度</text>
    <text x="780" y="178" text-anchor="middle" font-size="10" fill="#334155">28×28 → 7×7</text>
    <text x="780" y="194" text-anchor="middle" font-size="9" fill="#64748b">一格 = 4×4 原圖像素</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a3)">
    <line x1="212" y1="164" x2="285" y2="164"/>
    <line x1="378" y1="164" x2="445" y2="168"/>
  </g>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="440" y="322" font-size="10" text-anchor="middle" fill="#64748b">
    這就是 CNN 的「階層式學習」：先看小地方，再把小地方組起來看大地方
  </text>
</svg>
