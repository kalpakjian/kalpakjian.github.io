<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="三個 3×3 濾波器：垂直邊緣、水平邊緣、小斑塊；紅為正權重、藍為負權重">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="320" fill="url(#bg)"/>
  <rect width="880" height="320" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="318.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">訓練完之後，濾波器（濾鏡）長什麼樣子？</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">紅 = 正權重（這裡亮 → 輸出亮）　藍 = 負權重（這裡亮 → 輸出暗）</text>

  <g font-size="9" text-anchor="middle">
    <g transform="translate(50,80)">
      <text x="45" y="-8" font-size="10.5" font-weight="700" fill="#e6edf3" filter="url(#gl)">垂直邊緣偵測</text>
      <rect x="0" y="0" width="90" height="90" fill="#0a1420" stroke="#22d3ee" stroke-width="1.5" filter="url(#gl)"/>
      <rect x="0" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/><text x="15" y="20" fill="#93c5fd">−0.3</text>
      <rect x="30" y="0" width="30" height="30" fill="#111a26" stroke="#1e3a5c" stroke-width=".8"/><text x="45" y="20" fill="#6e7b8c">0.0</text>
      <rect x="60" y="0" width="30" height="30" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/><text x="75" y="20" fill="#fda4af">+0.4</text>
      <rect x="0" y="30" width="30" height="30" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/><text x="15" y="50" fill="#93c5fd">−0.3</text>
      <rect x="30" y="30" width="30" height="30" fill="#111a26" stroke="#1e3a5c" stroke-width=".8"/><text x="45" y="50" fill="#6e7b8c">0.0</text>
      <rect x="60" y="30" width="30" height="30" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/><text x="75" y="50" fill="#fda4af">+0.4</text>
      <rect x="0" y="60" width="30" height="30" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/><text x="15" y="80" fill="#93c5fd">−0.3</text>
      <rect x="30" y="60" width="30" height="30" fill="#111a26" stroke="#1e3a5c" stroke-width=".8"/><text x="45" y="80" fill="#6e7b8c">0.0</text>
      <rect x="60" y="60" width="30" height="30" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/><text x="75" y="80" fill="#fda4af">+0.4</text>
      <text x="45" y="106" font-size="9" fill="#9aa7b6">左暗右亮 → 會亮</text>
    </g>

    <g transform="translate(210,80)">
      <text x="45" y="-8" font-size="10.5" font-weight="700" fill="#e6edf3" filter="url(#gl)">水平邊緣偵測</text>
      <rect x="0" y="0" width="90" height="90" fill="#0a1420" stroke="#a78bfa" stroke-width="1.5" filter="url(#gl)"/>
      <rect x="0" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/><text x="15" y="20" fill="#93c5fd">−0.3</text>
      <rect x="30" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/><text x="45" y="20" fill="#93c5fd">−0.3</text>
      <rect x="60" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/><text x="75" y="20" fill="#93c5fd">−0.3</text>
      <rect x="0" y="30" width="30" height="30" fill="#111a26" stroke="#1e3a5c" stroke-width=".8"/><text x="15" y="50" fill="#6e7b8c">0.1</text>
      <rect x="30" y="30" width="30" height="30" fill="#111a26" stroke="#1e3a5c" stroke-width=".8"/><text x="45" y="50" fill="#6e7b8c">0.1</text>
      <rect x="60" y="30" width="30" height="30" fill="#111a26" stroke="#1e3a5c" stroke-width=".8"/><text x="75" y="50" fill="#6e7b8c">0.1</text>
      <rect x="0" y="60" width="30" height="30" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/><text x="15" y="80" fill="#fda4af">+0.4</text>
      <rect x="30" y="60" width="30" height="30" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/><text x="45" y="80" fill="#fda4af">+0.4</text>
      <rect x="60" y="60" width="30" height="30" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/><text x="75" y="80" fill="#fda4af">+0.4</text>
      <text x="45" y="106" font-size="9" fill="#9aa7b6">上暗下亮 → 會亮</text>
    </g>

    <g transform="translate(370,80)">
      <text x="45" y="-8" font-size="10.5" font-weight="700" fill="#e6edf3" filter="url(#gl)">小圓點／斑塊</text>
      <rect x="0" y="0" width="90" height="90" fill="#0a1420" stroke="#f472b6" stroke-width="1.5" filter="url(#gl)"/>
      <rect x="0" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="15" y="20" fill="#93c5fd">−0.2</text>
      <rect x="30" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="45" y="20" fill="#93c5fd">−0.2</text>
      <rect x="60" y="0" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="75" y="20" fill="#93c5fd">−0.2</text>
      <rect x="0" y="30" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="15" y="50" fill="#93c5fd">−0.2</text>
      <rect x="30" y="30" width="30" height="30" fill="#f43f5e" fill-opacity=".45" stroke="#fb7185" stroke-width="1.3" filter="url(#gl)"/><text x="45" y="50" fill="#fecdd3">+0.6</text>
      <rect x="60" y="30" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="75" y="50" fill="#93c5fd">−0.2</text>
      <rect x="0" y="60" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="15" y="80" fill="#93c5fd">−0.2</text>
      <rect x="30" y="60" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="45" y="80" fill="#93c5fd">−0.2</text>
      <rect x="60" y="60" width="30" height="30" fill="#3b82f6" fill-opacity=".28" stroke="#60a5fa" stroke-width="1"/><text x="75" y="80" fill="#93c5fd">−0.2</text>
      <text x="45" y="106" font-size="9" fill="#9aa7b6">中間有東西 → 會亮</text>
    </g>
  </g>

  <g font-size="10.5">
    <rect x="50" y="222" width="12" height="12" rx="3" fill="#3b82f6" fill-opacity=".34" stroke="#60a5fa" stroke-width="1"/>
    <text x="70" y="232" fill="#9aa7b6">負權重（−）</text>
    <rect x="180" y="222" width="12" height="12" rx="3" fill="#f43f5e" fill-opacity=".34" stroke="#fb7185" stroke-width="1"/>
    <text x="200" y="232" fill="#9aa7b6">正權重（+）</text>
    <rect x="310" y="222" width="12" height="12" rx="3" fill="#111a26" stroke="#1e3a5c" stroke-width="1"/>
    <text x="330" y="232" fill="#9aa7b6">接近 0（不參與）</text>
    <text x="440" y="278" text-anchor="middle" fill="#8b949e">沒有人教它要這樣做 —— 這些「邊緣偵測器」是訓練完自動長出來的</text>
  </g>
</svg>