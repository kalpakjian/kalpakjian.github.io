<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="880" height="480" fill="url(#bg)"/>

  <!-- decorative grid -->
  <g stroke="#1e40af" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="360" x2="880" y2="360"/><line x1="0" y1="380" x2="880" y2="380"/>
    <line x1="0" y1="400" x2="880" y2="400"/><line x1="0" y1="420" x2="880" y2="420"/>
    <line x1="0" y1="440" x2="880" y2="440"/>
  </g>

  <!-- conv icon: 3x3 kernel sliding -->
  <g transform="translate(96,120)">
    <rect x="0" y="0" width="132" height="132" rx="4" fill="#0b1220" stroke="#38bdf8" stroke-width="1.2"/>
    <g stroke="#1e40af" stroke-width="0.8">
      <line x1="33" y1="0" x2="33" y2="132"/><line x1="66" y1="0" x2="66" y2="132"/>
      <line x1="99" y1="0" x2="99" y2="132"/>
      <line x1="0" y1="33" x2="132" y2="33"/><line x1="0" y1="66" x2="132" y2="66"/>
      <line x1="0" y1="99" x2="132" y2="99"/>
    </g>
    <rect x="33" y="33" width="33" height="33" fill="#a78bfa" opacity="0.85"/>
    <rect x="33" y="33" width="33" height="33" fill="none" stroke="#f0abfc" stroke-width="1.6"/>
    <text x="66" y="156" text-anchor="middle" font-size="10" fill="#7dd3fc">3×3 濾波器在滑動</text>
  </g>

  <text x="290" y="150" font-size="38" font-weight="700" fill="#f8fafc">卷積神經網絡</text>
  <text x="290" y="192" font-size="20" fill="#93c5fd">CNN 專題：十個實驗，和三次被推翻的假設</text>
  <line x1="290" y1="212" x2="770" y2="212" stroke="url(#line)" stroke-width="3"/>

  <g font-size="12.5" fill="#cbd5e1">
    <text x="290" y="244">● 從「濾波器在找什麼」到「模型到底看哪裡」</text>
    <text x="290" y="268">● 每一個結論都附上可重跑的實驗與數字</text>
    <text x="290" y="292">● 三次看似合理的處方，實測全部失敗</text>
  </g>

  <g transform="translate(290,326)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#1d4ed8" opacity="0.35" stroke="#60a5fa"/>
    <text x="75" y="22" text-anchor="middle" font-size="11" fill="#dbeafe">MNIST 98.9%</text>
    <rect x="164" y="0" width="150" height="34" rx="17" fill="#1d4ed8" opacity="0.35" stroke="#60a5fa"/>
    <text x="239" y="22" text-anchor="middle" font-size="11" fill="#dbeafe">CIFAR-10 85.7%</text>
    <rect x="328" y="0" width="150" height="34" rx="17" fill="#1d4ed8" opacity="0.35" stroke="#60a5fa"/>
    <text x="403" y="22" text-anchor="middle" font-size="11" fill="#dbeafe">RTX 4090</text>
  </g>

  <text x="96" y="440" font-size="11" fill="#60a5fa">PyTorch 2.14 · Python 3.14 · 964k 參數的小模型</text>
</svg>
