<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <defs>
    <marker id="a6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    Occlusion（遮擋實驗）：把圖一小塊一小塊蓋住，看信心掉多少
  </text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#64748b">
    8×8 的灰塊、每次移動 4 格 → 一張 32×32 的圖要跑 49 次推論
  </text>

  <g>
    <!-- input grid -->
    <g transform="translate(60,80)">
      <text x="60" y="-10" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">① 原圖 + 滑動的灰塊</text>
      <rect x="0" y="0" width="120" height="120" fill="#e2e8f0" stroke="#94a3b8"/>
      <g stroke="#cbd5e1" stroke-width="0.6">
        <line x1="30" y1="0" x2="30" y2="120"/><line x1="60" y1="0" x2="60" y2="120"/>
        <line x1="90" y1="0" x2="90" y2="120"/>
        <line x1="0" y1="30" x2="120" y2="30"/><line x1="0" y1="60" x2="120" y2="60"/>
        <line x1="0" y1="90" x2="120" y2="90"/>
      </g>
      <path d="M30,90 Q60,60 90,88" stroke="#1e293b" stroke-width="6" fill="none"/>
      <rect x="30" y="30" width="30" height="30" fill="#64748b" opacity="0.85"/>
      <text x="45" y="49" text-anchor="middle" font-size="8" fill="#fff">遮住</text>
    </g>

    <!-- heatmap of drops -->
    <g transform="translate(250,80)">
      <text x="60" y="-10" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">② 信心下降的熱圖</text>
      <g>
        <rect x="0" y="0" width="30" height="30" fill="#dbeafe"/><rect x="30" y="0" width="30" height="30" fill="#bfdbfe"/>
        <rect x="60" y="0" width="30" height="30" fill="#fecaca"/><rect x="90" y="0" width="30" height="30" fill="#dbeafe"/>
        <rect x="0" y="30" width="30" height="30" fill="#bfdbfe"/><rect x="30" y="30" width="30" height="30" fill="#fca5a5"/>
        <rect x="60" y="30" width="30" height="30" fill="#ef4444"/><rect x="90" y="30" width="30" height="30" fill="#bfdbfe"/>
        <rect x="0" y="60" width="30" height="30" fill="#dbeafe"/><rect x="30" y="60" width="30" height="30" fill="#f87171"/>
        <rect x="60" y="60" width="30" height="30" fill="#fca5a5"/><rect x="90" y="60" width="30" height="30" fill="#dbeafe"/>
        <rect x="0" y="90" width="30" height="30" fill="#dbeafe"/><rect x="30" y="90" width="30" height="30" fill="#bfdbfe"/>
        <rect x="60" y="90" width="30" height="30" fill="#bfdbfe"/><rect x="90" y="90" width="30" height="30" fill="#dbeafe"/>
      </g>
      <text x="75" y="50" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">0.88</text>
      <text x="60" y="140" text-anchor="middle" font-size="9" fill="#64748b">紅 = 遮這裡掉最多</text>
    </g>

    <g transform="translate(430,88)">
      <rect x="0" y="0" width="180" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="14" y="22" font-size="10" font-weight="700" fill="#0f172a">怎麼讀這個數字</text>
      <text x="14" y="44" font-size="9.6" fill="#334155">ratio = 最大下降 ÷ 領先幅度</text>
      <text x="14" y="62" font-size="9.6" fill="#334155">≥ 0.5 → 有明確的「關鍵區」</text>
      <text x="14" y="78" font-size="9.6" fill="#334155">0.15–0.5 → 證據分散</text>
      <text x="14" y="94" font-size="9.6" fill="#334155">&lt; 0.15 → 沒有單一決定區</text>
    </g>

    <g transform="translate(640,88)">
      <rect x="0" y="0" width="190" height="104" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="12" y="22" font-size="10" font-weight="700" fill="#1e3a8a">實測結果</text>
      <text x="12" y="44" font-size="9.6" fill="#1e3a8a">MNIST 誤判：0.88 / 0.84</text>
      <text x="12" y="62" font-size="9.6" fill="#1e3a8a">CIFAR 誤判：0.16 / 0.31</text>
      <text x="12" y="84" font-size="9.4" fill="#1e3a8a" font-weight="700">→ 數字本身不能分辨對錯</text>
      <text x="12" y="98" font-size="9" fill="#3b82f6">（猜對的樣本也一樣低）</text>
    </g>
  </g>

  <g>
    <rect x="60" y="240" width="770" height="74" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="76" y="262" font-size="11" font-weight="700" fill="#713f12">白話：這就像考試時用橡皮擦把你的答案一塊一塊擦掉</text>
    <text x="76" y="282" font-size="10" fill="#713f12">
      擦掉某一塊後分數大跌 → 那一塊是關鍵；擦掉哪一塊都沒差 → 你的答案不是靠某個重點，而是靠整體感覺（或靠背景）。
    </text>
    <text x="76" y="300" font-size="10" fill="#713f12">
      但要注意：擦掉一塊也可能擦到「答案本身」，所以這個方法適合驗證，不適合直接當結論。
    </text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a6)">
    <line x1="185" y1="140" x2="243" y2="140"/>
    <line x1="375" y1="140" x2="423" y2="140"/>
  </g>
</svg>
