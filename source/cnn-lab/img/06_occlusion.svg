<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="遮擋實驗：8×8 灰塊在 32×32 圖上滑動，產生信心下降的熱圖">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="880" height="330" fill="url(#bg)"/>
  <rect width="880" height="330" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="328.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">Occlusion（遮擋實驗）：把圖一小塊一小塊蓋住，看信心掉多少</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">8×8 的灰塊、每次移動 4 格 → 一張 32×32 的圖要跑 49 次推論</text>

  <g>
    <g transform="translate(60,80)">
      <text x="60" y="-10" text-anchor="middle" font-size="10" font-weight="700" fill="#e6edf3">① 原圖 + 滑動的灰塊</text>
      <rect x="0" y="0" width="120" height="120" fill="#0a1420" stroke="#22d3ee" stroke-width="1.4" filter="url(#gl)"/>
      <g stroke="#1e3a5c" stroke-width="0.6">
        <line x1="30" y1="0" x2="30" y2="120"/><line x1="60" y1="0" x2="60" y2="120"/><line x1="90" y1="0" x2="90" y2="120"/>
        <line x1="0" y1="30" x2="120" y2="30"/><line x1="0" y1="60" x2="120" y2="60"/><line x1="0" y1="90" x2="120" y2="90"/>
      </g>
      <path d="M30,90 Q60,60 90,88" stroke="#67e8f9" stroke-width="6" fill="none" opacity=".85" filter="url(#gl)"/>
      <rect x="30" y="30" width="30" height="30" fill="#64748b" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.2" filter="url(#gl)"/>
      <text x="45" y="49" text-anchor="middle" font-size="8" fill="#e2e8f0">遮住</text>
    </g>

    <g transform="translate(250,80)">
      <text x="60" y="-10" text-anchor="middle" font-size="10" font-weight="700" fill="#e6edf3">② 信心下降的熱圖</text>
      <g>
        <rect x="0" y="0" width="30" height="30" fill="#0f2a44" stroke="#1b3a5c" stroke-width=".6"/><rect x="30" y="0" width="30" height="30" fill="#153a63" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="60" y="0" width="30" height="30" fill="#4a2540" stroke="#1b3a5c" stroke-width=".6"/><rect x="90" y="0" width="30" height="30" fill="#0f2a44" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="0" y="30" width="30" height="30" fill="#153a63" stroke="#1b3a5c" stroke-width=".6"/><rect x="30" y="30" width="30" height="30" fill="#7a2f4a" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="60" y="30" width="30" height="30" fill="#f43f5e" fill-opacity=".85" stroke="#fb7185" stroke-width="1" filter="url(#gl)"/><rect x="90" y="30" width="30" height="30" fill="#153a63" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="0" y="60" width="30" height="30" fill="#0f2a44" stroke="#1b3a5c" stroke-width=".6"/><rect x="30" y="60" width="30" height="30" fill="#b8435c" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="60" y="60" width="30" height="30" fill="#7a2f4a" stroke="#1b3a5c" stroke-width=".6"/><rect x="90" y="60" width="30" height="30" fill="#0f2a44" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="0" y="90" width="30" height="30" fill="#0f2a44" stroke="#1b3a5c" stroke-width=".6"/><rect x="30" y="90" width="30" height="30" fill="#153a63" stroke="#1b3a5c" stroke-width=".6"/>
        <rect x="60" y="90" width="30" height="30" fill="#153a63" stroke="#1b3a5c" stroke-width=".6"/><rect x="90" y="90" width="30" height="30" fill="#0f2a44" stroke="#1b3a5c" stroke-width=".6"/>
      </g>
      <text x="75" y="50" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" filter="url(#gl)">0.88</text>
      <text x="60" y="140" text-anchor="middle" font-size="9" fill="#8b949e">紅 = 遮這裡掉最多</text>
    </g>

    <g transform="translate(430,88)">
      <rect x="0" y="0" width="180" height="104" rx="8" fill="#0f1720" stroke="#8b949e" stroke-width="1.3" filter="url(#gl)"/>
      <text x="14" y="22" font-size="10" font-weight="700" fill="#e6edf3">怎麼讀這個數字</text>
      <text x="14" y="44" font-size="9.6" fill="#9aa7b6">ratio = 最大下降 ÷ 領先幅度</text>
      <text x="14" y="62" font-size="9.6" fill="#9aa7b6">≥ 0.5 → 有明確的「關鍵區」</text>
      <text x="14" y="78" font-size="9.6" fill="#9aa7b6">0.15–0.5 → 證據分散</text>
      <text x="14" y="94" font-size="9.6" fill="#9aa7b6">&lt; 0.15 → 沒有單一決定區</text>
    </g>

    <g transform="translate(640,88)">
      <rect x="0" y="0" width="190" height="104" rx="8" fill="#0f1720" stroke="#22d3ee" stroke-width="1.4" filter="url(#gl)"/>
      <text x="12" y="22" font-size="10" font-weight="700" fill="#22d3ee" filter="url(#gl)">實測結果</text>
      <text x="12" y="44" font-size="9.6" fill="#9aa7b6">MNIST 誤判：0.88 / 0.84</text>
      <text x="12" y="62" font-size="9.6" fill="#9aa7b6">CIFAR 誤判：0.16 / 0.31</text>
      <text x="12" y="84" font-size="9.4" font-weight="700" fill="#fbbf24" filter="url(#gl)">→ 數字本身不能分辨對錯</text>
      <text x="12" y="98" font-size="9" fill="#8b949e">（猜對的樣本也一樣低）</text>
    </g>
  </g>

  <g>
    <rect x="60" y="240" width="770" height="74" rx="9" fill="#191508" stroke="#fbbf24" stroke-width="1.4" filter="url(#gl)"/>
    <text x="76" y="262" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#gl)">白話：這就像考試時用橡皮擦把你的答案一塊一塊擦掉</text>
    <text x="76" y="282" font-size="10" fill="#9aa7b6">擦掉某一塊後分數大跌 → 那一塊是關鍵；擦掉哪一塊都沒差 → 你的答案不是靠某個重點，而是靠整體感覺（或靠背景）。</text>
    <text x="76" y="300" font-size="10" fill="#9aa7b6">但要注意：擦掉一塊也可能擦到「答案本身」，所以這個方法適合驗證，不適合直接當結論。</text>
  </g>

  <g stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ar)" filter="url(#gl)">
    <line x1="185" y1="140" x2="243" y2="140"/>
    <line x1="375" y1="140" x2="423" y2="140"/>
  </g>
</svg>