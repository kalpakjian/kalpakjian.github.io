<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" role="img" aria-label="信心分布：答錯的樣本信心 96.9–98.9%，答對的樣本只有 27.4–35.6%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="52%" stop-color="#0b1220"/><stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <linearGradient id="barErr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="barOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="320" fill="url(#bg)"/>
  <rect width="880" height="320" fill="url(#gr)" opacity=".55"/>
  <rect x="0.75" y="0.75" width="878.5" height="318.5" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5"/>

  <text x="440" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3" filter="url(#gl)">錯得最慘的，都是最有自信的</text>
  <text x="440" y="46" font-size="10.5" text-anchor="middle" fill="#8b949e">MNIST 測試集：信心最高的錯誤 vs 信心最低的正確</text>

  <g transform="translate(70,78)">
    <line x1="0" y1="170" x2="740" y2="170" stroke="#3b4a5c" stroke-width="1.2"/>
    <g stroke="#1b3a5c" stroke-width="0.8">
      <line x1="0" y1="0" x2="740" y2="0"/><line x1="0" y1="85" x2="740" y2="85"/>
    </g>
    <text x="-8" y="8" font-size="9" text-anchor="end" fill="#8b949e">100%</text>
    <text x="-8" y="90" font-size="9" text-anchor="end" fill="#8b949e">50%</text>

    <g filter="url(#gl)">
      <rect x="40" y="2.6" width="110" height="167.4" rx="4" fill="url(#barErr)" stroke="#fb7185" stroke-width="1.2"/>
      <rect x="175" y="4.4" width="110" height="165.6" rx="4" fill="url(#barErr)" stroke="#fb7185" stroke-width="1.2"/>
      <rect x="310" y="5.3" width="110" height="164.7" rx="4" fill="url(#barErr)" stroke="#fb7185" stroke-width="1.2"/>
      <rect x="445" y="117.4" width="110" height="52.6" rx="4" fill="url(#barOk)" stroke="#22d3ee" stroke-width="1.2"/>
      <rect x="580" y="102.8" width="110" height="67.2" rx="4" fill="url(#barOk)" stroke="#22d3ee" stroke-width="1.2"/>
      <rect x="705" y="101.7" width="35" height="68.3" rx="4" fill="url(#barOk)" stroke="#22d3ee" stroke-width="1.2"/>
    </g>

    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="95" y="-6" fill="#fb7185" filter="url(#gl)">98.9%</text>
      <text x="230" y="-6" fill="#fb7185" filter="url(#gl)">97.5%</text>
      <text x="365" y="-6" fill="#fb7185" filter="url(#gl)">96.9%</text>
      <text x="500" y="110" fill="#22d3ee" filter="url(#gl)">27.4%</text>
      <text x="635" y="96" fill="#22d3ee" filter="url(#gl)">35.0%</text>
      <text x="722" y="95" fill="#22d3ee" filter="url(#gl)">35.6%</text>
    </g>

    <g font-size="9.5" text-anchor="middle" fill="#9aa7b6">
      <text x="95" y="190">7 → 2</text><text x="230" y="190">5 → 3</text><text x="365" y="190">1 → 2</text>
      <text x="500" y="190">9（答對）</text><text x="635" y="190">7（答對）</text><text x="722" y="190">5（答對）</text>
    </g>
    <g font-size="10" text-anchor="middle" font-weight="700">
      <text x="225" y="212" fill="#fb7185" filter="url(#gl)">▼ 答錯的三張：信心 96.9–98.9%</text>
      <text x="610" y="212" fill="#22d3ee" filter="url(#gl)">▲ 答對的三張：信心只有 27–36%</text>
    </g>
  </g>

  <g>
    <text x="440" y="312" text-anchor="middle" font-size="10.5" fill="#fbbf24" filter="url(#gl)">→ 你沒辦法用「信心低」去篩出錯誤，因為錯誤的自信反而更高。</text>
  </g>
</svg>
