<script>
const QUESTIONS = [{"q":"生物神經元中，負責「接收」訊號的構造是？","o":["軸突（axon）","樹突（dendrites）","突觸（synapse）","細胞核（nucleus）"],"a":1,"e":"樹突（dendrites）由細胞體分岔出去，負責**接收**訊號；軸突（axon）負責把訊號**送出**。"},{"q":"動作電位（action potential）的特性是？","o":["可以「部分發火」","只要受到刺激就一定發火","全有全無：達到閾值才發火","與閾值完全無關"],"a":2,"e":"課程強調動作電位是 **all-or-nothing**：達到閾值才發火，而且**沒有「部分發火」**這種事。"},{"q":"課程說一個神經元可以與多少個其他神經元連接？","o":["固定 1 個","2～5 個","10～100 個","10～100,000 個"],"a":3,"e":"課程寫「a neuron makes connections with 10 or 100000 other neurons at junctions called synapses」。"},{"q":"課程認為「腦中學習」的基礎是什麼？","o":["神經元連結的長期改變","神經元數量大量增加","腦容量變大","突觸完全消失"],"a":0,"e":"課程說訊號在短期控制腦的活動，也促成**神經元連結的長期改變**，這些機制被認為是學習的基礎。"},{"q":"課程對「神經元（neuron）」的定義是？","o":["儲存資料的記憶體","傳遞資料的線路","把輸入值通過函數後輸出結果","計算誤差的元件"],"a":2,"e":"Neurons **pass input values through functions and output the result**。"},{"q":"課程對「權重（weight）」的定義是？","o":["在神經元之間傳遞的數值","神經元的外型","輸入資料的筆數","網路的層數"],"a":0,"e":"Weights **carry values between neurons**（在神經元之間傳遞的數值，而且是可學習的）。"},{"q":"ANN 的三層，由輸入到輸出的正確順序是？","o":["輸出層 → 隱藏層 → 輸入層","輸入層 → 隱藏層 → 輸出層","隱藏層 → 輸入層 → 輸出層","輸入層 → 輸出層 → 隱藏層"],"a":1,"e":"順序是 **Input Layer → Hidden Layer → Output Layer**；隱藏層可以有好多層。"},{"q":"用「預測與答案的誤差」回頭調整權重的是？","o":["Feed-forward","One-hot encoding","Back Propagation","Gradient Boosting"],"a":2,"e":"**Back Propagation（反向傳播）**才是用誤差回頭更新權重的機制；Feed-forward 只是往前算答案。"},{"q":"Feed-forward（前向傳播）的方向是？","o":["輸入層往輸出層","輸出層往輸入層","只在同一層內循環","雙向同時進行"],"a":0,"e":"Feed-forward 是**由輸入往輸出**；由輸出往輸入的是 Back Propagation。"},{"q":"決定一個網路「深不深」的是？","o":["資料筆數","輸出層的神經元數","隱藏層的數量","學習率大小"],"a":2,"e":"深度看的是**隱藏層數量**；標準是**隱藏層超過兩層**就叫 deep。"},{"q":"一個完整訓練循環的正確順序是？","o":["前向傳播 → 算誤差 → 反向傳播","反向傳播 → 前向傳播 → 算誤差","算誤差 → 反向傳播 → 前向傳播","只需要做前向傳播"],"a":0,"e":"先 **Feed-forward** 得到預測值，算出誤差後再用 **Back Propagation** 更新權重，反覆迭代。"},{"q":"一個 3 類別的分類問題，輸出層通常有幾個神經元？","o":["1 個","2 個","3 個","9 個"],"a":2,"e":"多類別分類的輸出層神經元數通常等於**類別數**（3 類 → 3 個），再配合 Softmax。"},{"q":"課程定義「deep」的標準是？","o":["資料量超過 1 TB","參數超過一百萬個","訓練時間超過一天","隱藏層超過兩層"],"a":3,"e":"It is called \"deep\" because of its **depth, with more than two hidden layers**。"},{"q":"課程指出 DNN 已成功應用於哪些領域？","o":["電腦視覺與自然語言處理","排版與列印","資料庫與網路","電子商務與物流"],"a":0,"e":"Deep neural networks have been successful in **computer vision and natural language processing**。"},{"q":"下列哪一項「不是」ANN 定義中的關鍵字？","o":["inspired by biological neural networks","organized into layers","learn from data to make predictions or decisions","只能處理影像資料"],"a":3,"e":"ANN 的定義完全沒有「只能處理影像」這個限制；它是一種**計算模型**，由分層的節點組成、能從資料學習。"},{"q":"網路拓撲（Network Topology）在描述什麼？","o":["資料的形狀","網路的結構：層數、寬度、連接方式","資料的筆數","硬體的規格"],"a":1,"e":"Network Topology 談的是**網路的骨架**（深度、寬度、連接方式），不是資料的形狀。"},{"q":"「ANNs are relatively shallow…DNNs are characterized by their depth」這句話在課程哪一頁？","o":["p5","p6","p7","p8"],"a":2,"e":"這段話在 **p7**「Deep Neural Network — Network Topology」；p6 是 ANN / DNN 的正式定義。"},{"q":"為什麼深層網路能處理複雜的模式？","o":["因為參數一定比較少","因為完全不需要激勵函數","因為資料量一定比較大","因為能逐層堆疊出階層式的表徵"],"a":3,"e":"深層網路可以**逐層堆疊出階層式表徵**（低階特徵 → 高階概念），這正是 deep 的價值。"},{"q":"激勵函數位於哪裡？","o":["神經元內部","整個網路的外面","資料前處理階段","損失函數裡面"],"a":0,"e":"It **sits inside a neuron**——它處理的是神經元加權總和之後的值。"},{"q":"激勵函數最關鍵的作用是？","o":["加快讀取資料","引入非線性（non-linearity）","壓縮資料大小","增加網路層數"],"a":1,"e":"It adds a twist called **non-linearity** so the network can learn hard patterns。"},{"q":"課程說激勵函數會「決定」什麼？","o":["資料要儲存在哪裡","學習率的大小","神經元要不要開啟、要不要把資料往下送","批次的大小"],"a":2,"e":"**decides if the neuron should turn on or send data ahead**。"},{"q":"如果把激勵函數全部拿掉，多層網路會變成？","o":["更強的非線性模型","完全無法計算","自動變成 DNN","等價於一層線性轉換"],"a":3,"e":"沒有非線性時，多層線性轉換串起來仍等價於**一層線性模型**，因此學不動複雜圖形。"},{"q":"下列哪一項「不是」激勵函數？","o":["ReLU","Sigmoid","Softmax","Bias（偏置）"],"a":3,"e":"Bias 是加在加權總和上的常數，**不是激勵函數**；ReLU、Sigmoid、Softmax 都是。"},{"q":"二元分類的輸出層通常使用？","o":["Sigmoid","Softmax","階梯函數（TLU）","線性函數"],"a":0,"e":"二元分類只需要 1 個輸出神經元 + **Sigmoid**，輸出可直接解讀為機率。"},{"q":"TLU 的輸出值範圍是？","o":["{0, 1}","(0, 1)","[0, ∞)","(−∞, ∞)"],"a":0,"e":"TLU 是閾值邏輯單元，輸出**非 0 即 1**，不是機率也不是任意實數。"},{"q":"TLU 公式中的 θ 代表什麼？","o":["學習率","閾值（threshold）","權重總和","輸出值"],"a":1,"e":"θ 是 **threshold 閾值**：加權總和 a ≥ θ 時輸出 1，否則輸出 0。"},{"q":"TLU 的加權總和 a 等於？","o":["Σxᵢ","Πwᵢxᵢ","Σwᵢxᵢ","max(0, xᵢ)"],"a":2,"e":"a = Σ(i=1..n) wᵢxᵢ；也就是**每個輸入乘上自己的權重後相加**。"},{"q":"TLU 無法直接用梯度下降訓練的主要原因是？","o":["輸出值太小","參數太多","階梯函數不可微","沒有權重"],"a":2,"e":"階梯函數在 θ 處**不連續、不可微**，梯度不是 0 就是不存在，因此無法直接做梯度下降。"},{"q":"單層 TLU 無法解決下列哪個問題？","o":["AND","OR","XOR","NOT"],"a":2,"e":"單層 TLU 只能畫出**一條直線決策邊界**，因此解不了 **XOR**（這是感知機的著名限制）。"},{"q":"TLU 是下列哪個模型的雛形？","o":["感知機（Perceptron）","卷積神經網路（CNN）","Transformer","隨機森林"],"a":0,"e":"McCulloch–Pitts 神經元提出雛形，Rosenblatt 的**感知機（Perceptron）**把它變成可訓練的演算法。"},{"q":"ReLU 的公式是？","o":["1/(1+e⁻ᵃ)","eᵃ/Σeᵃ","1 if a ≥ θ else 0","max(0, a)"],"a":3,"e":"ReLU = **max(0, a)**：負的加權總和壓成 0，正的則原樣通過。"},{"q":"ReLU 在負區間的梯度是？","o":["1","0","0.5","無限大"],"a":1,"e":"ReLU 負區間輸出固定為 0，所以**梯度為 0**；正區間梯度固定為 1。"},{"q":"「dead neuron（神經元死亡）」與哪個激勵函數最有關？","o":["ReLU","Softmax","線性函數","Sigmoid"],"a":0,"e":"ReLU 負區間梯度為 0，若某神經元長期落在負區間就再也收不到更新 → **dead neuron**。"},{"q":"ReLU 的主要優點之一是？","o":["輸出總和一定為 1","輸出一定有上界","計算快、正區間梯度固定為 1","可以把輸出壓成機率"],"a":2,"e":"ReLU 只做一次比較（運算極快），而且**正區間梯度固定為 1**，不會像 Sigmoid 那樣梯度消失。"},{"q":"課程把 ReLU 的輸出寫成？","o":["y = 0","y = a = Σwᵢxᵢ","y = 1/(1+e⁻ᵃ)","y = eᵃ/Σeᵃ"],"a":1,"e":" 寫的是 **y = a = Σwᵢxᵢ**（正值原樣通過）；標準寫法就是 f(a) = max(0, a)。"},{"q":"Sigmoid 的值域是？","o":["[0, 1]","(−1, 1)","(0, 1)","[0, ∞)"],"a":2,"e":"Sigmoid 的輸出永遠落在 **(0, 1)** 開區間內：可以無限接近 0 或 1，但不會等於 0 或 1。"},{"q":"σ(0) 等於多少？","o":["0.5","0","1","0.25"],"a":0,"e":"把 a = 0 代入 1/(1+e⁻ᵃ) 得到 **0.5**，這也是常見的決策門檻。"},{"q":"Sigmoid 最常被指出的缺點是？","o":["計算太慢","輸出不是機率","無法微分","兩端飽和造成梯度消失"],"a":3,"e":"輸入很大或很小時 Sigmoid 會**飽和**，導數趨近 0，造成**梯度消失（vanishing gradient）**。"},{"q":"Sigmoid 的導數可以寫成？","o":["σ(a)·(1 − σ(a))","σ(a) + 1","e⁻ᵃ","1 / a"],"a":0,"e":"Sigmoid 的導數是 **σ(a)(1 − σ(a))**，形式簡單、處處可微，所以能配合梯度下降。"},{"q":"深層網路的隱藏層，目前最常用哪個激勵函數？","o":["階梯函數（TLU）","ReLU","Sigmoid","Softmax"],"a":1,"e":"隱藏層的預設是 **ReLU**：快、不易梯度消失；Sigmoid 主要留給二元分類的輸出層。"},{"q":"Softmax 的輸出總和一定是？","o":["0","1","等於類別數","不一定"],"a":1,"e":"Softmax 除以所有指數的總和，所以輸出**加總必為 1**，可視為機率分布。"},{"q":"Softmax 的公式是？","o":["pᵢ = e^zᵢ / Σⱼe^zⱼ","pᵢ = 1/(1+e^(−zᵢ))","pᵢ = max(0, zᵢ)","pᵢ = zᵢ / Σⱼzⱼ"],"a":0,"e":"Softmax 是**先取指數、再除以總和**：pᵢ = e^zᵢ / Σⱼe^zⱼ。"},{"q":"Softmax 使用指數函數的理由「不包括」？","o":["保證輸出為正","放大分數差距","處處可微、可反向傳播","讓輸出變成整數"],"a":3,"e":"Softmax 的輸出是 (0,1) 的機率，**不會變成整數**；「保證為正、放大差距、可微」才是用指數的理由。"},{"q":"多標籤分類（多個標籤可以同時成立）應該使用？","o":["單一 Softmax","單一 ReLU","單一階梯函數","每個標籤各一個 Sigmoid"],"a":3,"e":"標籤**可以同時成立**時，要讓每個標籤各自判斷 → **每個標籤各一個 Sigmoid**，而不是互斥的 Softmax。"},{"q":"對 z = [2.0, 1.0, 0.1] 做 Softmax，最大的機率約是多少？","o":["0.099","0.659","0.242","0.500"],"a":1,"e":"e^z = [7.389, 2.718, 1.105]（總和 11.213），除以總和得 **[0.659, 0.242, 0.099]**，最大是 0.659。"},{"q":"迴歸問題的輸出層通常使用？","o":["Softmax","Sigmoid","階梯函數","ReLU 或線性（等同不用激勵函數）"],"a":3,"e":"迴歸要輸出**連續數值**，用 Sigmoid 會把大數值壓進 (0,1)，所以改用 ReLU 或線性輸出。"},{"q":" 的樹狀圖中，Multiclass Classification 對應哪個激勵函數？","o":["TLU","ReLU","Softmax","Sigmoid"],"a":2,"e":"Binary → TLU、**Multiclass → Softmax**、Multilabel → Sigmoid、Regression → ReLU。"},{"q":"判斷該用哪個激勵函數的第一步是？","o":["看資料量有多少","看輸出是類別還是數值","看 GPU 的規格","看資料有幾個欄位"],"a":1,"e":"先判斷**輸出是類別（分類）還是數值（迴歸）**，再看類別是否互斥，就能決定激勵函數。"},{"q":"課程把機器學習分成幾個主題？","o":["2 個","3 個","4 個","5 個"],"a":1,"e":"三個主題：**基本概念、監督式學習的原理與實例、非監督式學習的原理與實例**。"},{"q":"「Ten Steps to a Machine Learning Solution」的第 2 步是？","o":["找出目標變數與預測準確度的衡量方式","清理並合併資料集","部署模型","選擇演算法"],"a":0,"e":"第 1 步定義問題、第 2 步**決定目標變數與準確度的衡量方式**——指標沒定好，後面無法比較模型。"},{"q":"下列哪一項「不是」課程十步中的步驟？","o":["決定執行頻率","決定模型更新頻率","測試模型","撰寫網頁前端"],"a":3,"e":"十步聚焦在資料與模型的生命週期（含**執行頻率**與**更新頻率**），沒有「撰寫網頁前端」。"},{"q":"「Learn Incrementally?」這條分類軸在問什麼？","o":["有沒有標籤","是批次學習還是增量（線上）學習","有沒有使用 GPU","要不要做降維"],"a":1,"e":"這條軸問的是**學習方式**：批次學習一次用全部資料；增量／線上學習則讓模型隨資料持續更新。"},{"q":"混淆矩陣中 TP（True Positive）代表？","o":["實際為負、預測為正","實際為正、預測為負","實際為正、預測也為正","實際為負、預測也為負"],"a":2,"e":"TP = **實際是正類，模型也說是正類**（猜對）；FP 是誤報、FN 是漏抓、TN 是正確排除。"},{"q":"Precision（精確率）的公式是？","o":["TP / (TP+FN)","TP / (TP+FP)","(TP+TN) / 全部","TN / (TN+FP)"],"a":1,"e":"Precision 的分母是**預測為正**的總數：**TP / (TP+FP)**；分母放 TP+FN 的是 Recall。"},{"q":"Recall（召回率）的公式是？","o":["TP / (TP+FP)","(TP+TN) / 全部","TN / (TN+FP)","TP / (TP+FN)"],"a":3,"e":"Recall 的分母是**實際為正**的總數：**TP / (TP+FN)**，衡量「該抓的有沒有抓到」。"},{"q":"若 TP = 126、FP = 21、FN = 7、TN = 119，Accuracy 約為？","o":["85.71%","89.74%","94.74%","96.34%"],"a":1,"e":"(126+119) / (126+21+7+119) = 245 / 273 ≈ **89.74%**。"},{"q":"如果任務「寧可誤報、不可漏抓」（例如癌症篩檢），應該怎麼做？","o":["把門檻調高","增加類別數","改用迴歸模型","把門檻調低以提高 Recall"],"a":3,"e":"門檻調低會讓更多樣本被判為正類 → **FN（漏抓）減少、Recall 上升**，代價是 FP 增加。"},{"q":"迴歸模型應該用哪組指標評估？","o":["Accuracy / F1","Precision / Recall","MAE / MSE / R²","Specificity"],"a":2,"e":"迴歸的輸出是連續數值，用 **MAE / MSE / R²**；Accuracy、F1、Precision 都是分類指標。"},{"q":"分群的目標是？","o":["群內距離最小、群間距離最大","群內距離最大、群間距離最小","兩者都最大","兩者都最小"],"a":0,"e":"**intracluster distances are minimized**、**intercluster distances are maximized**。"},{"q":"k-means 的 k 是怎麼決定的？","o":["由演算法自動決定","等於資料筆數","等於特徵數","由人指定（常用 elbow method 挑）"],"a":3,"e":"k 必須**由人指定**；常用 **elbow method** 觀察 inertia 的轉折來挑 k。"}];

const LET = 'ABCD';
const KEY = 'nn-activation-ml-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 20 || i === 40){
      const label = i === 0 ? '第一部分：生物神經元、網路結構與激勵函數概念（1–20）'
                  : i === 20 ? '第二部分：激勵函數 TLU / ReLU / Sigmoid（21–40）'
                  : '第三部分：Softmax、問題類型與機器學習（41–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
}
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
