<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;
  --red-bg:#fdeaea; --sel:#dbeafe; --sel-line:#2563eb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}

<script>
const QUESTIONS = [{"q":"本課程（Lesson 2）本節列出的三大主題是？","o":["Popular LLM／Predictive AI vs Generative AI／LLM vs RAG","AI／Machine Learning／Deep Learning","GAN／VAE／Diffusion","ChatGPT／Gemini／Copilot"],"a":0,"e":" 的 Learning topics 只有三個 bullet，就是這三個。注意第二個是「Predictive AI vs Generative AI」而不是「AI vs ML」，第三個是「LLM vs RAG」而不是「LLM vs GAN」。"},{"q":"本節對「生成式 AI」的定義，最關鍵的兩個詞是？","o":["forecast future outcomes／historical data","create new content／learning patterns from existing data","classify data／labelled dataset","maximize reward／environment interaction"],"a":1,"e":" 與 p30 兩次定義都圍繞這兩個詞：create new content（創造新內容）與 learning patterns from existing data（從既有資料學模式）。forecast future outcomes 是 Predictive AI。"},{"q":" 的清單中，被標註為「AI Search Engine」的產品是？","o":["Grok","Copilot","Perplexity","Kimi"],"a":2,"e":" 寫「Perplexity (AI Search Engine)」。它用 RAG 先檢索網頁、再生成附來源的答案，所以同時具備搜尋引擎與生成式 AI 的特性。"},{"q":"「GPT」三個字母中，P 代表什麼？","o":["Predictive","Prompt","Public","Pre-trained"],"a":3,"e":"GPT = Generative Pre-trained Transformer。Pre-trained 指的是「先在大規模語料上預訓練、之後再微調」的兩階段流程，不是「已經訓練完成」的意思。"},{"q":"RLHF（Reinforcement Learning from Human Feedback）的三個階段，正確順序是？","o":["Supervised Fine-Tuning → Reward Model → PPO","Reward Model → Supervised Fine-Tuning → PPO","PPO → Supervised Fine-Tuning → Reward Model","Supervised Fine-Tuning → PPO → Reward Model"],"a":0,"e":" 的順序：① 人類訓練員提供示範對話做監督式微調（SFT）→ ② 收集比較資料訓練獎勵模型 → ③ 用獎勵模型當訊號以 PPO 微調，且「the process was repeated several times」。"},{"q":"本節特別強調獎勵模型是用「比較資料（comparison data）」訓練的，為什麼？","o":["因為比較資料比較容易自動產生","因為人類給絕對分數不一致，但「哪個比較好」的排序一致得多","因為排序不需要人類參與","因為比較資料可以直接當成生成器的訓練標籤"],"a":1,"e":"這是隱含重點：要人類給 87 分、92 分這種絕對分數，前後兩次可能不一致；但問「A 和 B 哪個比較好」就穩定得多。所以獎勵模型學的是相對判斷。"},{"q":" 說 OpenAI 是用什麼方法訓練 ChatGPT 的？","o":["只用監督式學習","只用非監督式學習","強化學習（RLHF）","純規則式專家系統"],"a":2,"e":"本節原文：「The company OpenAI trained ChatGPT using reinforcement learning. By Reinforcement Learning from Human Feedback (RLHF)」。"},{"q":"Google 的對話式 AI 在改名之前叫什麼？","o":["Copilot","Grok","Claude","Bard"],"a":3,"e":" 寫「Gemini / Bard (by Google)」。Bard 是 2023 年推出時的產品名，2024 年改名為 Gemini，同時 Gemini 也成為模型家族的名字。"},{"q":"Copilot 是哪一家公司的產品？","o":["Microsoft","Google","Meta","OpenAI"],"a":0,"e":" 寫「Copilot (by Microsoft)」。Copilot 是微軟對 AI 助手的產品命名，背後模型來自微軟與 OpenAI 的合作，不是微軟自己從零訓練的模型。"},{"q":" 問「What is the different with Google Search?」，下列敘述何者正確？","o":["Google 搜尋會直接寫出一段完整答案","對話式 LLM 直接生成一段答案，Google 搜尋回傳的是連結清單","兩者的輸出形式完全相同","Google 搜尋無法取得即時網頁資料"],"a":1,"e":"核心差別是「誰做彙整」：Google 給你連結、你自己讀；LLM 幫你讀完再寫成一段話。代價是 LLM 會幻覺、且知識受訓練截止日限制。"},{"q":" 對 LLM 的定義中，列出的四個能力動詞是？","o":["train, test, deploy, monitor","encode, decode, attend, generate","understand, summarize, generate, predict","classify, cluster, regress, rank"],"a":2,"e":"本節原文：「uses deep learning techniques and massively large data sets to understand, summarize, generate and predict new content」。這四個動詞常被當成選項干擾源。"},{"q":"依 的 LLM 定義，「Large」指的是？","o":["使用了 massively large data sets","模型檔案體積很大","輸出文字很長","訓練時間很長"],"a":0,"e":"本節把「Large」對應到 massively large data sets（超大資料集）。本機實測的 distilgpt2 只有 81.9 M 參數，正好可以對照「真正的大」有多大。"},{"q":"（ChatGPT Prompt）那一頁示範的重點是什麼？","o":["如何從零訓練一個模型","同一個模型只要改寫 prompt，輸出就會完全不同","如何對模型做微調","如何把模型部署到雲端"],"a":1,"e":"這一頁是 Lesson 5（Prompt Engineering）的前導。它要建立的最小觀念是：Prompt Engineering 之所以成立，前提就是「prompt 寫法會改變輸出」。"},{"q":"「Copilot（副駕駛）」這個命名要傳達的意思是？","o":["AI 可以完全自動駕駛、不需要人類","AI 會取代人類做最終決策","AI 輔助人類，但最終決策與責任仍在人類身上","AI 只能用在寫程式的情境"],"a":2,"e":"副駕駛不負責開飛機。這個命名直接對應 Lesson 4「Responsible LLM」裡的 Human Oversight（人類監督）原則。"},{"q":"本機實測 `distilgpt2` 的參數量是多少？","o":["859.5 M","1.5 B","768 M","81.9 M"],"a":3,"e":"本機實測 n_params = 81.9 M。對照 Stable Diffusion 1.5 的 U-Net 是 859.5 M，而真正的「大型」語言模型是數百億到數千億參數——這就是本節選 distilgpt2 的原因：它免費、免 token、能在 Colab 跑。"},{"q":"Llama 是 Meta 發表的模型家族。它的授權性質最準確的描述是？","o":["開放權重（open weights），但授權有條件限制","完全開源（open source），連訓練資料都公開","封閉原始碼，只能透過 API 使用","公共領域（public domain），完全無限制"],"a":0,"e":"嚴格來說 Llama 是 open weights 而非 open source：權重可以下載，但授權有商用條件。它是本課程「本機 LLM」整條主線（Lesson 6／7）的起點。"},{"q":"Grok 的開發公司正式名稱是？","o":["OpenAI","xAI","Meta AI","Anthropic"],"a":1,"e":"本節用創辦人代表公司，寫「Grok (by Elon Musk)」，但正式公司名是 xAI。Grok 的差異化在於能即時存取 X（前 Twitter）平台上的貼文。"},{"q":"Perplexity 的運作方式，最接近下列哪一種技術的產品化？","o":["微調（fine-tuning）","GAN","RAG（檢索增強生成）","RLHF"],"a":2,"e":"Perplexity 先去網路上檢索相關頁面，再把檢索結果當上下文交給 LLM 生成答案，並附上來源引用——這正是 RAG 的產品化。"},{"q":"本節列出的中國對話式生成式 AI 有三個，下列何者「不在」其中？","o":["Kimi","Tongyi","DeepSeek","Claude"],"a":3,"e":" 的 Conversational Generative AI (China) 只列 Kimi.ai、Tongyi、DeepSeek 三個。Claude 是 Anthropic 的模型，不屬於這份清單。"},{"q":"「Tongyi（通義）」是哪一家公司的 AI 品牌？","o":["阿里巴巴（Alibaba）","騰訊（Tencent）","百度（Baidu）","位元組跳動（ByteDance）"],"a":0,"e":"通義是阿里巴巴的 AI 品牌名，旗下的模型系列就是「通義千問 Qwen」。本專題的章節插圖正是用 Qwen-Image 生成的。"},{"q":"本節用一頁專門示範「DeepSeek to use locally」，最主要的原因是什麼？","o":["因為 DeepSeek 是最便宜的雲端 API","因為 DeepSeek 是開放權重、可以下載到自己的機器上推論","因為 DeepSeek 只能用來生成圖片","因為 DeepSeek 不支援中文"],"a":1,"e":"這一頁是全課的承先啟後：把「熱門 LLM」接到「本機 LLM」。本節總共介紹 9 個對話式生成式 AI，其中可下載權重的只有 Llama 與 DeepSeek。"},{"q":"「本機跑 LLM」相對於雲端 API，最主要的好處不包括下列哪一項？","o":["資料不離開自己的機器（隱私）","沒有 per-token 費用","斷網也能用","模型能力一定比雲端大模型強"],"a":2,"e":"本機跑的三個代價之一就是「品質」：能在本機跑的多是小模型，能力遠不如雲端大模型。本機跑解決的是隱私、成本、離線、可控，不是「更聰明」。"},{"q":" 的「Third Party App with Multiple AI Models」指的是？","o":["一個 App 只能接一個模型","把模型下載到本機的 App","一個介面可以切換多個不同供應商的模型","專門用來訓練模型的 App"],"a":3,"e":"聚合 App 的核心價值是「一個介面、多個模型」。它必須解決「每個供應商 API 形狀不同」的問題，這正是 Lesson 8（LiteLLM）要處理的核心問題——§14 就是 Lesson 8 的動機來源。"},{"q":"多模型聚合 App 最主要的三個風險，下列何者「不是」？","o":["你的 API Key 要交給第三方託管","你的 prompt 與回覆會經過第三方伺服器","App 聲稱的模型版本你無法驗證","聚合 App 一定會讓回覆變慢十倍"],"a":0,"e":"本節沒有提到「變慢十倍」。真正的三個風險是：金鑰託管、中間人（prompt 與回覆經過第三方）、模型版本不透明。"},{"q":"關於「生成式 AI 偵測器」，下列敘述何者正確？","o":["偵測結果可以作為抄襲的定論","偵測器輸出的是機率，不是證據，必須搭配人工審查","偵測器只能偵測圖片，不能偵測文字","有了浮水印技術後，偵測就百分之百準確"],"a":1,"e":"偵測器靠統計特徵（困惑度／突發性）、分類器或浮水印判斷，本質是機率性判斷。誤判會造成實際傷害，所以屬於 Lesson 4 的 Reliability 與 Accountability 範疇，必須有人類覆核。"},{"q":"本節是第二條主線的過場頁，它列出的四個 bullet 依序是？","o":["Recap of Predictive AI → Basic Concepts in GAN Network → Underlying Technologies and Algorithms → Hybrid AI Systems","GAN → Diffusion → VAE → AR","Predictive AI → LLM → RAG → Hybrid","ChatGPT → Gemini → Copilot → Grok"],"a":0,"e":"這四個 bullet 就是 §16–§27 的路線圖，常被當成配對題考。注意「Basic Concepts」在前、「Underlying Technologies」在後。"},{"q":"本節把 GAN 放在「生成式 AI」底下的主要理由是？","o":["因為 GAN 可以預測未來結果","因為 GAN 是生成式 AI 最早、最經典的實現方式之一","因為 GAN 是一種監督式分類模型","因為 GAN 不需要訓練"],"a":1,"e":"GAN 產生新資料（不是預測），而且它用「對抗」方式訓練——這是它獨有的機制。所以本節先講 GAN（§23–§24）再講 Diffusion（§25），兩者都是生成式 AI 的實現方式。"},{"q":"把 §3 的六個產品與 §12 的三個產品合起來，本課共介紹幾個對話式生成式 AI？","o":["6 個","3 個","9 個","12 個"],"a":2,"e":"§3 有 ChatGPT、Gemini、Copilot、Llama、Grok、Perplexity（6 個），§12 有 Kimi、Tongyi、DeepSeek（3 個），合計 9 個。其中可下載權重的是 Llama 與 DeepSeek。"},{"q":" 的「Generative AI Detector」不包含下列哪一種判斷方法？","o":["統計特徵（困惑度、突發性）","分類器","浮水印","用 GAN 生成一份「人類風格」的對照文本"],"a":3,"e":"本節只呈現偵測器的存在與用途，沒有給出方法清單。實務上常見的三種方法是統計特徵、分類器與浮水印；「用 GAN 生成對照文本」不是偵測方法。"},{"q":"「在本機跑 LLM」的三個主要代價，下列何者正確？","o":["需要 API Key、要付 per-token 費用、必須連網","模型一定比雲端更強、速度更快、更省電","只能跑英文、不能微調、不能離線使用","硬體需求（要足夠 VRAM）、品質（能在本機跑的多是小模型）、設定（要自己處理量化、記憶體與執行環境）"],"a":3,"e":"本機跑的價值在隱私、成本、離線與可控；代價就是這三項。本機實測的 distilgpt2 只有 81.9 M 參數，能跑但不會聽指令——這正是「品質」這一項代價的具體樣貌。"},{"q":"本節列出的五個預測式 AI 常見演算法，下列何者「不在」其中？","o":["Clustering（分群）","Decision trees（決策樹）","Random forests（隨機森林）","Ensemble methods（集成方法）"],"a":0,"e":"本節列的五個是 regression models、decision trees、random forests、neural networks、ensemble methods。Clustering 是「分群」（非監督），不在預測式演算法清單裡。注意 ensemble methods 是第五個，很容易被漏掉。"},{"q":" 的 Applications 段落中，「predictive maintenance（預測性維護）」被歸在哪一類？","o":["Business","Other Fields","Healthcare","Finance"],"a":1,"e":"本節把 weather forecasting、predictive maintenance、traffic flow optimization 歸在 Other Fields。Business 是客戶流失與銷售預測，Healthcare 是疫情與診斷，Finance 是信用評分、詐欺偵測與股市趨勢。"},{"q":"本節給出的預測式 AI 五步流程，第一步是什麼？","o":["Model Training（模型訓練）","Deployment（部署）","Data Collection（資料蒐集）","Prediction and Validation（預測與驗證）"],"a":2,"e":"五步順序是：① Data Collection → ② Data Preprocessing → ③ Model Training → ④ Prediction and Validation → ⑤ Deployment。最常見的錯答是把「模型訓練」當第一步。"},{"q":"本節把「Prediction」與「Validation」放在同一階段，這代表什麼？","o":["兩者是完全獨立的兩個階段","驗證要在訓練之前完成","預測不需要驗證","產生預測與評估準確度是同一階段的一體兩面"],"a":3,"e":" 的第 ④ 步原文是「Prediction and Validation: Generating forecasts and evaluating their accuracy」——是同一個 bullet，不是兩個獨立階段。"},{"q":"本機實測 `Predictive AI.ipynb` 得到 R² = 1.00。正確的解讀是？","o":["因為線性迴歸是最好的演算法","因為資料量夠大所以模型很準","因為資料是用線性公式合成的，而模型也是線性模型，形式完全吻合","因為測試集有 80 筆，樣本充足"],"a":0,"e":"資料的 price 是用 size×300 + rooms×10000 + loc×5000 + 雜訊 產生的，而模型正是 LinearRegression。R²=1.00 只證明「模型形式與資料產生機制吻合」，不能證明模型在真實資料上有效。另外測試集只有 20 筆（n=100 × 0.2）。"},{"q":"本機實測的房價預測 MAE 約為 1 萬，最接近的解釋是？","o":["模型壞掉了","雜訊項是 ±20,000 的均勻分布，理論平均絕對偏差約 5,000；實測 11,227 因測試集只有 20 筆而偏高","MAE 一定等於雜訊的最大值","MAE 與資料無關，只是隨機數字"],"a":1,"e":"均勻分布的平均絕對偏差約為區間寬度的 1/4（20000/4 = 5000）。實測 11,227（seed=42）與 9,466（不設 seed）都高於理論值，原因是 test_size=0.2 只有 20 筆，波動大。"},{"q":"本節把下列哪一項列為「生成式 AI 的核心技術」？","o":["Logistic Regression","Random Forest","Transformers","Decision Tree"],"a":2,"e":" 的 Machine Learning Models 一欄寫的是 GANs、VAEs、Transformers、diffusion models。把 Transformer 列進來是因為 ChatGPT 的 T 就是 Transformer。"},{"q":"本節說 DALL·E 與 Stable Diffusion 屬於哪一類生成模型？","o":["GAN","VAE","Autoregressive","Diffusion（擴散模型）"],"a":3,"e":" 的 Diffusion Models 一欄就以 DALL·E、Stable Diffusion 為例。把 DALL·E／Stable Diffusion 誤配到 GAN 是最常見的錯誤。"},{"q":" 的 How It Works 三階段中，與 fine-tuning 並列為「客製化手段」的是？","o":["prompt engineering（提示工程）","data augmentation","reinforcement learning","quantization"],"a":0,"e":"本節寫「tailored for specific tasks or styles via fine-tuning or prompt engineering」。兩者成本差距極大：fine-tuning 改權重、要重新訓練；prompt engineering 只改輸入。"},{"q":" 的 Process 三步中，「seed」指的是什麼？","o":["隨機數產生器的種子","資料庫的索引鍵","輸入的一部分（文字描述或半張圖）","模型權重的初始值"],"a":2,"e":"本節寫「Input a prompt or seed (e.g., text description, partial image)」，所以 seed 是輸入的一部分。在擴散模型實作裡 seed 也常用來控制起始的隨機雜訊。"},{"q":"下列哪一組敘述正確區分了 Predictive AI 與 Generative AI？","o":["Predictive 產出新內容；Generative 預測未來結果","兩者都會產出新內容，只是速度不同","兩者都只做分類","Predictive 預測未來結果（如偵測詐欺）；Generative 創造新內容（如寫詩、畫圖）"],"a":3,"e":"判斷的唯一標準是「輸出的是預測還是新內容」。看到 predict／forecast／detect／classify／recommend 就是 Predictive；看到 write／create／generate／draw 就是 Generative。"},{"q":"「AI ⊃ ML ⊃ DL ⊃ Generative AI」四層中，Deep Learning 的定義關鍵詞是？","o":["multi-layered neural networks（多層神經網路）","large datasets","autonomous decision making","pattern generation"],"a":0,"e":" 對 Deep Learning 的定義是「uses multi-layered neural networks to model complex data patterns」。四層的包含順序是必考題。"},{"q":"「AIGC」指的是什麼？","o":["A General Intelligence Computing","AI-Generated Content（AI 生成的內容）","Automated Image Generation Cycle","Advanced Interactive Generative Chat"],"a":1,"e":" 給的是內容來源三分法：PGC（專業生產）、UGC（使用者生成）、AIGC（AI 生成）。AIGC 是「內容」的分類，不是「模型」的分類。"},{"q":"關於 GAN 的訓練，下列敘述何者正確？","o":["判別器準確率越高代表訓練越成功","判別器準確率降到 50% 代表訓練失敗","判別器準確率降到約 50%（等於擲硬幣）代表生成器已能產出逼真資料，是收斂的標誌","GAN 的判別器與生成器必須同時更新權重"],"a":2,"e":" 寫「until the discriminator model is fooled about half the time」。50% 準確率是收斂的標誌，不是失敗。另外 說兩個網路是「alternating periods」輪流訓練，不是同時更新。"},{"q":" 說 GAN 訓練「過頭」會發生什麼事？","o":["生成器開始過擬合訓練資料","判別器變得越來越好，生成器也跟著變好","訓練自動停止","判別器給出完全隨機的回饋（junk feedback），生成器品質可能崩壞（collapse）"],"a":3,"e":"本節原文：「If the GAN continues training past the point when the discriminator is giving completely random feedback, then the generator starts to train on junk feedback, and its own quality may collapse.」注意這不是「過擬合」。"},{"q":"擴散模型的 Forward Process 與 Reverse Process，哪一個需要「訓練」？","o":["兩個都要訓練","只有 Reverse Process（去噪）需要訓練，Forward 是固定的加噪公式","只有 Forward Process（加噪）需要訓練","兩個都不需要訓練"],"a":1,"e":"–p55：Forward Process 是「incrementally added」的固定加噪過程；Reverse Process 才是「the model learns to reverse this process」。換句話說：只有去噪那一段是神經網路要學的。"},{"q":"本節提到的 SDE（Stochastic Differential Equation）在擴散模型裡的角色是？","o":["計算生成圖片的解析度","衡量生成品質的指標","描述「加噪過程」的數學工具","控制學習率的優化器"],"a":2,"e":"「SDEs are mathematical tools that describe the noise addition process in diffusion models.」它描述的是連續時間下的加噪過程。"},{"q":"DDPM 與 DDIM 的關係，下列敘述何者正確？","o":["DDIM 是另一種全新的生成架構","DDPM 是 DDIM 的加速版本","兩者完全相同，只是論文不同","DDIM 是 DDPM 的加速取樣器（確定性、可跳步）"],"a":3,"e":" 寫「techniques like DDIM or faster samplers mitigate this（取樣慢）」。DDPM 是機率式去噪、需要很多步；DDIM 是加速取樣器，不是新架構。"},{"q":" Stable Diffusion 示範中，`guidance_scale` 與 `num_inference_steps` 的預設值是？","o":["7.5 與 20","20 與 7.5","1.0 與 10","15.0 與 50"],"a":0,"e":"`Gen AI.ipynb`：guidance_scale 滑桿範圍 1.0–20.0、預設 7.5；num_inference_steps 滑桿範圍 10–50、預設 20。輸出固定 512×512。"},{"q":"本機實測 Stable Diffusion 1.5（512×512，20 步）的生成時間約為？","o":["約 30–60 秒","約 5 秒","約 0.02 秒","約 0.6 秒"],"a":3,"e":"本節寫「may take 30-60 seconds」，那是 Google Colab 免費 GPU（T4 等級）的體感；本機 RTX 4090 實測只要 0.61 秒，峰值 VRAM 5.13 GB。"},{"q":"關於「GAN vs Diffusion」的比較，下列敘述何者正確？","o":["GAN 訓練穩定但生成慢","Diffusion 生成快但訓練不穩","Diffusion 訓練穩定、多樣性好，代價是取樣需要迭代而較慢","兩者的生成速度與穩定性完全相同"],"a":2,"e":"GAN 的優勢是生成快（一次前向），但訓練不穩、容易模式崩壞；Diffusion 訓練穩定、多樣性好，但需要迭代數十步去噪，所以較慢（可用 DDIM 加速）。"},{"q":" 提到的「Autoregressive Model (AR)」的核心概念是？","o":["一次生成整張圖片","用對抗方式訓練兩個網路","用貝氏推論學潛在表徵","時間 t 的輸出 X_t 取決於過去的值 X_{t-1}, X_{t-2}, …"],"a":3,"e":"公式就是 X_t 依賴前面的值。LLM（如 GPT）正是自迴歸模型：一次預測一個 token，再把剛生成的 token 接回去繼續預測。"},{"q":"本節對「Hybrid AI」給了兩種不同的定義，下列哪一組是對的？","o":["① Predictive AI + Generative AI　② Symbolic AI + Sub-symbolic AI","① GAN + Diffusion　② VAE + AR","① LLM + RAG　② CNN + RNN","① Supervised + Unsupervised　② Online + Offline"],"a":0,"e":"／p65 講的是 Predictive + Generative（能預測又能創造）；p64 講的是 Symbolic（規則、可解釋）+ Sub-symbolic（機器學習、擅長模式辨識）。兩者都叫 Hybrid AI，但講的是不同的「混合」。"},{"q":"本節三個真實世界應用（醫療、電商、招聘）的共同結構中，第三步「Hybrid AI」的共同目的是？","o":["完全取代人類決策","把不一致的輸出藏起來","整合並把關——確保一致、可解釋，必要時交人類審查","把預測結果直接寫進資料庫"],"a":2,"e":"醫療是「flags uncertain cases for doctor review」、電商是「ensures the generated content aligns with predicted customer intent」。Hybrid AI 的目的不是自動化，而是可解釋與可信任。"},{"q":"關於 RAG，下列敘述何者正確？","o":["RAG 會微調嵌入模型以適應你的資料","RAG 只是建立向量索引，模型權重完全沒有被更新","RAG 必須重新訓練 LLM 才能使用","RAG 的索引必須每次查詢都重建"],"a":1,"e":" 特別用一整段澄清：「The embedding model itself isn't trained or modified; it's a fixed model applied to your files… no model weights are updated.」索引是「one-time computational task」（~5–15 分鐘 / 1 GB 文字 / GPU）。"},{"q":" 的對照表中，「Offline Capability」一列的內容是？","o":["RAG: Yes／LLM: No","兩者都是 Yes","LLM: Yes／RAG: No","兩者都是 No"],"a":2,"e":"本節寫 LLM 的 Offline Capability 是 Yes（權重在本機，斷網可跑），RAG 是 No（needs data access）。這一列是最容易答錯的地方。"},{"q":" 的 Use Cases 中，「Language translation」最適合用哪一種？","o":["LLM，因為它 relies on learned patterns","RAG，因為翻譯需要查字典","RAG，因為翻譯需要最新資料","兩者都不適合"],"a":0,"e":"這是本節最反直覺的一格。本節給的理由是「Relies on learned patterns」，所以選 LLM。對照組：Customer support／Medical research／Legal Consultation 都選 RAG。"},{"q":" 的 AnythingLLM 操作流程中，「Move and Embed」這一步做的事是？","o":["把文件上傳到雲端硬碟","把文件移入工作區並轉成向量嵌入，供之後檢索","把模型權重下載到本機","把對話紀錄匯出成 CSV"],"a":1,"e":"「Move and Embed」就是 RAG 流程的「向量化 + 存入向量庫」。AnythingLLM 本身不是 LLM——它負責文件管理與向量檢索，生成交給外部的 Ollama／LM Studio。"},{"q":" 引用 Geoffrey Hinton 的例子，最後留下的問題是？","o":["GPT-4 能不能寫程式","GPT-4 的參數有多少","AI 會不會取代人類","這個答案是否推翻了「LLM 只是 stochastic parrots（隨機鸚鵡）」的說法"],"a":3,"e":"本節沒有給答案，而是留下問句。要記住的專有名詞是 stochastic parrots。Hinton 的身份在本節中被標為「Nobel prize winner – Godfather of AI」。"},{"q":"四支 Lab（LLM／RAG／Predictive AI／Gen AI）預期在哪個環境執行？","o":["本機 Windows 命令列","Google Colab","Android 手機","Raspberry Pi"],"a":1,"e":"線索是 `from google.colab import files`（RAG.ipynb）與 `!pip install`（Colab 語法），以及本節說 SD 生成「may take 30-60 seconds」——那是 Colab 免費 GPU 的體感。"}];

const LET = 'ABCD';
const KEY = 'popular-llm-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 15 || i === 30 || i === 45){
      const label = i === 0 ? '第一部分：課程地圖、生成式 AI、熱門 LLM 與 ChatGPT（1–15）'
                  : i === 15 ? '第二部分：各家 LLM、本機跑、聚合 App 與偵測器（16–30）'
                  : i === 30 ? '第三部分：預測式 vs 生成式、GAN 原理與訓練（31–45）'
                  : '第四部分：Diffusion、混合式 AI、RAG 與考試重點（46–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
