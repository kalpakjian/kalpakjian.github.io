: "Keras 用 kernel_size。"}, {"q": "課程程式碼出現 SyntaxError 的最可能原因？", "o": ["缺少 import", "縮排錯誤", "彎引號被當成字串引號", "變數未定義"], "a": 2, "e": "U+2019 不是合法引號。"}, {"q": "本筆記的模型在 MNIST 上的參數量？", "o": ["320", "2,389,962", "11,173,962", "1,668,490"], "a": 3, "e": "320 + 18,496 + 1,639,424 + 10,250。"}, {"q": "參數主要集中在哪裡？", "o": ["攤平後的全連接層", "第二個卷積層", "第一個卷積層", "softmax"], "a": 0, "e": "約 98.9% 在 Flatten → Dense。"}, {"q": "同架構換成 CIFAR-10，攤平後維度？", "o": ["1600", "2304", "4096", "1024"], "a": 1, "e": "6×6×64 = 2304。"}, {"q": "全連接層為什麼被稱為「參數爆炸」？", "o": ["初始化很慢", "需要更多激活函數", "參數量 ≈ 特徵維度 × 神經元數", "不能使用 GPU"], "a": 2, "e": "例如 1600×1024。"}, {"q": "stride 變大會有什麼效果？", "o": ["輸出變大", "感受野變小", "參數變多", "輸出變小、計算變便宜"], "a": 3, "e": "跳得遠 → 輸出較小。"}, {"q": "感受野指的是？", "o": ["節點在輸入上連結到的區域", "濾波器的大小", "輸出通道數", "池化窗口"], "a": 0, "e": "層層堆疊會讓感受野變大。"}, {"q": "FCN 拿掉全連接層的原因？", "o": ["參數太多", "要輸出與輸入同尺寸的標籤圖", "訓練較快", "避免過擬合"], "a": 1, "e": "全卷積才能保持解析度。"}, {"q": "FCN 的上採樣通常用哪一層？", "o": ["Conv2D", "MaxPool2D", "Conv2DTranspose", "Flatten"], "a": 2, "e": "轉置卷積負責放大。"}, {"q": "生物醫學分割除了分割圖還會輸出什麼？", "o": ["損失曲線", "文字描述", "邊界框", "不確定性圖"], "a": 3, "e": "要能說出「哪裡不確定」。"}, {"q": "本筆記量到的「零激活／死濾波器」比例？", "o": ["50.6% / 0.0%", "0.0% / 50.6%", "50.6% / 50.6%", "0.0% / 0.0%"], "a": 0, "e": "稀疏是常態，但沒有濾波器死亡。"}, {"q": "Keras 的 CIFAR 鏡像在本機的問題？", "o": ["被限速到約 46 KB/s", "檔案損毀", "需要登入", "已下架"], "a": 0, "e": "改用 Hugging Face parquet 再轉檔。"}, {"q": "轉檔後驗證資料正確的指標？", "o": ["像素總數", "每通道均值 ≈ 125/123/114", "檔案大小", "標籤數"], "a": 1, "e": "通道順序錯的話均值會不同。"}, {"q": "把池化換成 stride=2 卷積的差別？", "o": ["失去非線性", "不再降維", "多了可學習參數", "不能反向傳播"], "a": 2, "e": "卷積有權重，池化沒有。"}, {"q": "深度學習的「卷積」實務上是？", "o": ["真正的卷積（翻轉核）", "矩陣乘法", "傅立葉變換", "互相關（不翻轉核）"], "a": 3, "e": "對學出來的核沒差別。"}, {"q": "padding=SAME 的作用？", "o": ["輸出尺寸與輸入相同", "縮小輸出", "增加參數", "自動池化"], "a": 0, "e": "補零讓尺寸不變。"}, {"q": "VALID padding 的意思是？", "o": ["補零", "不填充，輸出變小", "補平均值", "只在邊界補"], "a": 1, "e": "輸出邊長會減少。"}, {"q": "池化反向傳播時做什麼？", "o": ["隨機丟棄梯度", "平均分配", "把梯度路由回最大值", "不傳梯度"], "a": 2, "e": "沒有參數，只分配梯度。"}, {"q": "要表達「模型哪裡不確定」，分割常用？", "o": ["dropout", "資料增強", "learning rate schedule", "不確定性圖"], "a": 3, "e": "醫療影像特別重視。"}, {"q": "影像上色本質上是？", "o": ["逐像素回歸", "分類", "偵測", "排序"], "a": 0, "e": "輸出連續色度值。"}, {"q": "超解析的輸入輸出關係？", "o": ["影像 → 類別", "影像 → 影像", "類別 → 影像", "文字 → 影像"], "a": 1, "e": "與 FCN 同類。"}, {"q": "自駕的「端到端」是什麼？", "o": ["分段訓練再接", "先偵測再規劃", "感測器直接學到控制指令", "只用 GPS"], "a": 2, "e": "不需人工標註中間步驟。"}, {"q": "部署前本 repo 的品質閘門要求？", "o": ["0 警告", "人工審核", "覆蓋率 80%", "0 失敗"], "a": 3, "e": "qa_notes.ps1 必須 0 失敗。"}, {"q": "`MaxPool2D` 與 `MaxPooling2D` 的關係？", "o": ["同一個層的別名", "不同層", "前者已移除", "後者沒有參數"], "a": 0, "e": "兩者等價，可互換。"}, {"q": "Dense(1024) 佔這個模型多少參數？", "o": ["約一半", "約 98.9%", "約七成", "約 10%"], "a": 1, "e": "1,639,424 / 1,668,490。"}, {"q": "MNIST 攤平後是幾維？", "o": ["1024", "2304", "1600", "784"], "a": 2, "e": "5×5×64 = 1600。"}, {"q": "softmax 之後要得到類別索引用？", "o": ["softmax 再一次", "round", "sum", "argmax"], "a": 3, "e": "取最大值的索引。"}, {"q": "卷積層的參數量由什麼決定？", "o": ["核大小 × 輸入通道 × 濾波器數", "輸入邊長", "batch size", "stride"], "a": 0, "e": "(k×k×Cin+1)×Cout。"}, {"q": "如果池化窗口 2×2、stride 1，輸出會？", "o": ["縮一半", "只縮一格", "不變", "變大"], "a": 1, "e": "步幅小於窗口時重疊。"}, {"q": "哪個說法錯？", "o": ["池化沒有參數", "卷積權重由資料學習", "depth 由輸入通道決定", "stride 越大輸出越小"], "a": 2, "e": "depth 由濾波器數量決定。"}, {"q": "把 28×28 影像接 1024 神經元的全連接層，權重約多少？", "o": ["8 千", "8 萬", "780 萬", "78 萬"], "a": 3, "e": "28×28×1024 ≈ 802,816。"}];

const LET = 'ABCD';
const KEY = 'cnn2-mc-quiz-v2';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 20 || i === 40){
      const label = i === 0 ? '第一部分：分類三步曲、卷積與池化基礎、Keras 實作（1–20）'
                  : i === 20 ? '第二部分：參數量、感受野、FCN（21–29）'
                  : '第三部分：資料管線、padding、池化反向與應用版圖（30–49）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
}
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 49 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
