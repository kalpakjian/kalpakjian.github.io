<script>
const QUESTIONS = [{"q":"Hugging Face 生態系的三層架構，由上而下的正確順序是？","o":["Core ML Libraries → Hugging Face Hub → Inference & Deployment Tools","Inference & Deployment Tools → Core ML Libraries → Hugging Face Hub","Hugging Face Hub → Inference & Deployment Tools → Core ML Libraries","Hugging Face Hub → Core ML Libraries → Inference & Deployment Tools"],"a":3,"e":"Hub 放資產（最上層）、Core ML Libraries 是在程式裡用、Inference & Deployment 負責上線。這個順序是本課骨架。"},{"q":"課程說 Model Hub 上有多少個模型？","o":["1 萬+","10 萬+","300 萬+","300k+（30 萬以上）"],"a":3,"e":" 寫 300k+ models。筆記提醒這是課程撰寫當時的快照，只代表量級（十萬級），不是精確值。"},{"q":"Hugging Face Hub 的四個組成是？","o":["Model Hub、Dataset Hub、Spaces、文件與版本控制","Model Hub、Dataset Hub、Inference Endpoints、TGI","Transformers、Datasets、Tokenizers、Diffusers","Model Hub、Pipeline、Trainer、Accelerate"],"a":0,"e":" 的四條 bullet。注意第三條 Documentation and version control 常被忽略，但它是 Hub 能成為事實標準的關鍵（Git-based repo ＋ 可鎖 revision）。"},{"q":" 說 Hugging Face「Hosts models, datasets, demos」，其中 demos 對應的產品是？","o":["Model Cards","Optimum","Inference Endpoints","Spaces"],"a":3,"e":"demos 對應的是 Spaces（免費託管 ML Demo）。這是課程用詞容易誤解的地方——它指的不是範例程式碼。"},{"q":"Spaces 支援哪四種型態？","o":["Gradio、Streamlit、Static、Custom Docker","CLI、REST、gRPC、WebSocket","Docker、Kubernetes、Lambda、VM","PyTorch、TensorFlow、JAX、ONNX"],"a":0,"e":"。Streamlit 這一項直接連到 Lesson 9——課程教的 Web App 可以直接部署成 Space。"},{"q":"下列哪一類**不屬於**課程列出的 Model Hub 模型類別？","o":["Embedding models","Audio/speech models","Quantum circuit models","Diffusion models"],"a":2,"e":" 列的是：LLMs（Llama／Mistral／Qwen）、Diffusion models、Audio/speech models、Embedding models、Community and organization models。沒有量子電路模型。"},{"q":"課程把 Hub 上的模型分為 Organization 與 Community，下列敘述何者正確？","o":["Community 模型一定比較新，優先使用","兩者完全等價，不需要區分","Organization 通常是官方發布、Model Card 較完整；Community 需要自行驗證","Community 模型不能商用，Organization 可以"],"a":2,"e":"Lesson 6 的兩個 Lab 用的都是 Community 轉傳（fancyzhx/ag_news、slegroux/tiny-imagenet-200-clean）。這不是錯，但要知道社群鏡像可能與官方版本有差異。"},{"q":"`dataset.select(range(32))` 的行為是？","o":["隨機抽 32 筆","把資料集切成 32 份","複製前 32 筆到新的資料集","只取索引（zero-copy view），幾乎不花時間"],"a":3,"e":"select() 是取索引不是複製。所以即使底層有 12 萬筆，取 32 筆也幾乎不花時間——這是課程示範「小資料集」的正確做法。"},{"q":"`load_dataset` 解析 repo id 時，內部會拼成什麼 URI？","o":["hf://models/<repo>","hf://datasets/<repo>","https://huggingface.co/<repo>","s3://huggingface/<repo>"],"a":1,"e":"本機實測的錯誤訊息直接顯示 hf://datasets/ag_news@<commit>/.huggingface.yaml。這也是「datasets/ 是 Dataset Hub 標誌」的實證。"},{"q":"在 `datasets 5.0.0` 執行 `load_dataset(\"ag_news\")`（不帶 namespace）會？","o":["丟出 HfUriError：Repository id must be 'namespace/name'","正常載入官方版本","自動補上 fancyzhx/ 前綴","回傳空資料集"],"a":0,"e":"5.x 強制要求 namespace/name。課程用 fancyzhx/ag_news（社群鏡像）反而正確，因為它有 namespace。"},{"q":"AG News 資料集有幾個類別？","o":["2 類","4 類","10 類","20 類"],"a":1,"e":"4 類：World、Sports、Business、Sci-Tech。課程只取前 32 筆示範，其中 small_ds[0] 的 label 是 2（Business）。"},{"q":"AG News 訓練集有幾筆資料？","o":["1,200 筆","12,000 筆","120,000 筆","1,200,000 筆"],"a":2,"e":"本機實測 len=120000，features=['text', 'label']，首次下載 12.58 秒。"},{"q":"`pipeline()` 的核心價值是？","o":["只做模型下載","把前處理、模型推論、後處理包成一行","取代 GPU 驅動","只用於文字任務"],"a":1,"e":"pipeline() 內部做三件事：① Preprocessor（Tokenizer/ImageProcessor/FeatureExtractor）② Model forward ③ Postprocessor（softmax/argmax/decode）。課程從頭到尾沒提它，但三個 Lab 全靠它。"},{"q":"`AutoModel` 與 `AutoModelForCausalLM` 的差別是？","o":["兩者完全相同","前者只能讀不能寫","後者參數比較少","前者只輸出 hidden states，後者輸出下一個 token 的 logits"],"a":3,"e":"AutoModel 只有本體（hidden states），AutoModelFor* 帶任務頭。pipeline() 內部就是依 task 自動選擇對應的 AutoModelFor*。"},{"q":"`AutoModel.from_pretrained()` 能自動選對模型類別，是因為它先讀了哪個檔案？","o":["model.safetensors","README.md","tokenizer_config.json","config.json 的 architectures 欄位"],"a":3,"e":"它先下載 config.json、讀 architectures 欄位、再決定用哪個 class。所以社群模型如果 config.json 寫錯，載入就會失敗。"},{"q":" 提到 transformers 支援的三個後端框架是？","o":["NumPy、SciPy、Pandas","PyTorch、TensorFlow、JAX","CUDA、ROCm、Metal","ONNX、TensorRT、OpenVINO"],"a":1,"e":" 第三條 bullet。但實務上社群模型 99% 只提供 PyTorch 權重，所以就是選 PyTorch（本機是 torch 2.14.1+cu132）。"},{"q":"`load_dataset(id)` 不指定 `split=` 時回傳什麼？","o":["Dataset","DatasetDict","list","IterableDataset"],"a":1,"e":"沒指定 split 回傳 DatasetDict，要用 ds['train'] 取。有指定 split='train' 才直接回傳 Dataset。"},{"q":"串流模式的 `streaming=True` 回傳什麼型別？","o":["IterableDataset","DataLoader","Dataset","DatasetDict"],"a":0,"e":"本機實測型別就是 datasets.iterable_dataset.IterableDataset。這代表不能用 len()、不能索引、不能 select()。"},{"q":"下列哪一項**不能**在串流模式（`IterableDataset`）上使用？","o":["ds.take(100)","len(ds) 與 ds[0]","for x in ds","next(iter(ds))"],"a":1,"e":"串流沒有長度也不能索引。要用 take(n)/skip(n) 取代 select()，用 for 迴圈或 next(iter()) 取代索引。"},{"q":"串流的 `shuffle(seed=42)` 是什麼性質？","o":["只洗牌第一筆","真正的全域洗牌","用緩衝區做的近似洗牌，不是全域","完全沒有作用"],"a":2,"e":"它用 buffer_size（預設 1000）做近似洗牌。要真正的全域洗牌就必須完整下載資料集。"},{"q":"本機實測：完整下載 ag_news vs 串流取 200 筆，時間差距約為？","o":["完整下載 0.002 秒；串流 12.58 秒","完整下載 12.58 秒；串流再取 200 筆只要 0.002 秒","兩者都是 12 秒左右","串流比較慢"],"a":1,"e":"這是本課最大的「課程 vs Lab」落差的實證：課程用兩頁教 Streaming，三個 Lab 一次都沒用。"},{"q":"`HF_TOKEN` 環境變數的作用是？","o":["提高 Hub 的速率限制，並可存取需要授權的模型","加密本機快取","指定 GPU 編號","取代 API key 做模型推論"],"a":0,"e":"未認證也能下載公開模型，但 rate limit 低很多。課程三個 notebook 的輸出裡滿是「HF_TOKEN does not exist」的警告；本機實測也踩到 Wikimedia 回 HTTP 429 的限流。"},{"q":"`ds.map(tokenize, batched=True)` 的 `batched=True` 為什麼重要？","o":["自動做 shuffle","可以省記憶體","一次處理一批，速度可差十倍以上","自動切成 train/test"],"a":2,"e":" 的 Efficient batching 就是指這個。這也是 map() 最常被忽略的效能參數。"},{"q":"`datasets` 底層用什麼格式 ＋ 什麼機制，讓它能處理比 RAM 大的資料？","o":["JSON ＋ 串流","CSV ＋ 分頁","Parquet ＋ 壓縮","Apache Arrow ＋ 記憶體映射"],"a":3,"e":" 寫 Arrow-optimized for speed。記憶體映射讓「載入 98,179 筆的 Tiny ImageNet 不會把 RAM 吃爆」。"},{"q":"看到子詞前綴 `##`，可以判斷是哪一種分詞器？","o":["BPE","SentencePiece","WordPiece","Unigram"],"a":2,"e":"## 是 WordPiece（BERT 系）的接續子詞標記。例：unhappiness → un ##happy ##ness。"},{"q":"看到 `▁`（U+2581）符號，可以判斷是哪一種分詞器？","o":["Custom Tokenizer","SentencePiece","WordPiece","BPE"],"a":1,"e":"▁ 表示「新詞的開始」。例：I like apples → ▁I ▁like ▁apple s。注意它是 U+2581，不是鍵盤上的底線 _。"},{"q":"WordPiece 的合併準則是？","o":["按字母順序合併","貪婪：合併出現次數最多的相鄰對","隨機合併","最大似然：合併能讓語料機率最大化的那一對"],"a":3,"e":" 特別強調 Uses maximum likelihood–based merging, not greedy。這與 BPE 的貪婪準則是最核心的差別。"},{"q":"BPE 的合併準則是？","o":["最大似然","貪婪：每次合併出現次數最多的相鄰對","按詞頻排序","由語言模型決定"],"a":1,"e":"BPE 是純計數的貪婪合併（Count the most frequent pair）。WordPiece 則用 count(pair)/(count(a)×count(b)) 的似然評分。"},{"q":"BPE 這個演算法最初的用途是？","o":["機器翻譯","資料壓縮","語音辨識","影像編碼"],"a":1,"e":" 明寫 Originally a compression algorithm。這解釋了它為什麼是「貪婪合併最頻繁對」——壓縮的目標就是用最少符號表示資料。"},{"q":"WordPiece 是由哪家公司開發、主要用在哪個模型？","o":["OpenAI；GPT-2","Meta；LLaMA","Microsoft；Phi","Google；BERT"],"a":3,"e":"WordPiece（Google / BERT tokenizer），用於 BERT、DistilBERT。⚠️ 課程把 ALBERT 與 XLNet 也列在這裡，但 p28 又把 ALBERT 列在 SentencePiece 底下——兩頁互相矛盾，實際上 ALBERT 用的是 SentencePiece。"},{"q":"SentencePiece 的主要使用者（課程列出的）是？","o":["Falcon、Mistral","BERT、DistilBERT","GPT-2/3、RoBERTa、CLIP","T5、mT5、ALBERT、LLaMA"],"a":3,"e":" 標題就寫 used in T5, ALBERT multilingual, LLaMA。它與 WordPiece 最大的差別是「不需要空白前處理」。"},{"q":"SentencePiece 支援哪兩種演算法？","o":["BPE 與 Unigram 語言模型","只支援 BPE","只支援 Unigram","WordPiece 與 BPE"],"a":0,"e":"BPE（subword-nmt style）與 Unigram language model（more probabilistic）。所以 SentencePiece 是「框架」，不是單一演算法。"},{"q":"三種分詞器中，哪一種**不需要空白前處理**（語言無關）？","o":["三者都需要","WordPiece","BPE","SentencePiece"],"a":3,"e":"課程把「Requires pre-processing with whitespace → not sentence-level」列為 WordPiece 的限制；SentencePiece 正是為了補上這個缺點而設計。"},{"q":"byte-level BPE（GPT-2）最大的優點是？","o":["可以直接處理中文分詞","詞表最小","永不產生 `<unk>`，可編碼任何文字（含 emoji、罕見字）","不需要訓練"],"a":2,"e":" 寫 Can encode ANY text in ANY language (Unicode-safe) 與 Handles misspellings well because it works on bytes。代價是中文／emoji 會被切成多個 token。"},{"q":"`transformers` 的 `*Fast` 分詞器（如 BertTokenizerFast）來自哪個套件？","o":["tokenizers（Rust 實作）","sentencepiece","nltk","transformers 內建的 Python 實作"],"a":0,"e":" 說 Fast tokenization built in Rust。本機實測 tokenizers 0.23.2、sentencepiece 0.2.1。"},{"q":"關於分詞器與模型的配對，下列敘述何者正確？","o":["可以用任意分詞器搭配任意模型，不影響結果","必須從同一個 repo id 載入；不配對不會報錯但輸出是亂碼","分詞器只在訓練時需要","配錯只會讓速度變慢"],"a":1,"e":"因為 token id 對不上詞嵌入——形狀對得上、程式照跑，但輸出是亂碼且很難 debug。這正是 Auto* 系列存在的理由。"},{"q":"PEFT 的全名是？","o":["Parameter-Efficient Fine-Tuning","Pre-Engineered Fine-Tuning","Partial Error-Free Training","Post-Execution Feature Tuning"],"a":0,"e":"參數高效微調。它是一「類」方法的統稱，核心想法是「不要動原本的模型權重，只訓練一小部分額外參數」。"},{"q":"下列哪一項**不是** PEFT 的方法？","o":["QLoRA","Adapters","Full fine-tuning（全參數微調）","LoRA"],"a":2,"e":"PEFT 的三個成員是 LoRA／QLoRA／Adapters。Full fine-tuning 正是 PEFT 要取代的傳統做法，當然不算 PEFT。"},{"q":"LoRA 的核心公式是？","o":["W' = W + A × B","W' = A × B","W' = W − A × B","W' = W × A × B"],"a":0,"e":"W 是凍結的原權重，A（d×r）與 B（r×d）是小的可訓練矩陣。課程 LoRA.txt 就是算這個。"},{"q":"本機實測：distilgpt2 套用 LoRA（r=8）後，trainable% 是多少？","o":["1.797%","17.97%","0.1797%","0.01797%"],"a":2,"e":"trainable params 147,456、all params 82,060,032、trainable% 0.1797%。這組數字與課程完全一致。"},{"q":"LoRA 讓模型的「總」參數量如何變化？","o":["總參數與可訓練參數都變多","總參數變少，可訓練參數也變少","總參數不變，只有可訓練參數變少","總參數反而變多（+147,456），但可訓練參數暴減"],"a":3,"e":"這是考試最愛的陷阱題。實測 81,912,576 → 82,060,032（總數變多），可訓練的從 81,912,576 → 147,456。因為 LoRA 是「外加」的模組。"},{"q":"QLoRA 的正確全名是？","o":["Quantized Low-Rank Adaptation","Quantum Low-Rank Adaptation","Quantile Low-Rank Adaptation","Quick Low-Rank Adaptation"],"a":0,"e":"⚠️ ／p35 標題寫 QLoRA (Low Rank Adaptation)，是直接複製 LoRA 的展開。QLoRA 的 Q 是 Quantized。"},{"q":"QLoRA 使用的兩種量化技術是？","o":["BitNet 與 ternary","INT8 與 FP16","NF4 與 double quantization","GPTQ 與 AWQ"],"a":2,"e":" 明列 Uses techniques like NF4 quantization and double quantization。NF4 是專為常態分布權重設計的 4-bit 型別；double quantization 把量化常數本身再量化一次。"},{"q":"QLoRA 中，被訓練的 adapter 維持在什麼精度？","o":["8-bit","16-bit","32-bit","4-bit"],"a":1,"e":" 第二條 bullet：Still achieves high accuracy because LoRA adapters remain in 16-bit。量化的是被凍結的 W，不是被訓練的 A、B。"},{"q":"課程說 QLoRA 能讓 24GB 的單張消費級 GPU 微調多大的模型？","o":["33B–70B","405B","7B","13B"],"a":0,"e":" 寫 Enables fine-tuning 33B–70B models on a single consumer GPU，並以「Fine-tune a 33B model on a single 24GB GPU」收尾。"},{"q":" 說「Adapters are the core idea behind: LoRA, QLoRA」，這句話的意思是？","o":["Adapter 是 LoRA 的舊版本，已被淘汰","LoRA 與 QLoRA 是 Adapter 這個概念的具體實作","Adapter 只能用於 QLoRA","三者是完全無關的技術"],"a":1,"e":"「Adapter」是抽象概念（在模型裡插入小可訓練模組），LoRA 與 QLoRA 是它的實作。所以課程把 Adapters 放在 LoRA／QLoRA 之後講，順序是對的。"},{"q":"`HF_LLM.ipynb` 用 `target_modules=[\"c_attn\"]` 有什麼問題？","o":["應該用 list 不是 str","沒有問題","拼字錯誤","c_attn 是 GPT-2 專屬的模組名，換成 Llama／Qwen 會直接 ValueError"],"a":3,"e":"本機實測：套在 Llama 架構上得到 ValueError: Target modules {'c_attn'} not found in the base model。可攜寫法是 target_modules=\"all-linear\"（實測 trainable 589,824、0.7149%）。"},{"q":"Safetensors 主要取代哪一種權重格式？","o":[".onnx",".h5",".gguf",".bin（PyTorch pickle）"],"a":3,"e":" 寫 Replaces .bin files。核心動機是安全：pickle 載入等同「執行任意程式碼」，在任何人都能上傳的 Hub 上是嚴重風險。"},{"q":"Model Cards 在 repo 裡實際上是哪個檔案？","o":["card.json","model_info.yaml","README.md（含 YAML frontmatter）","LICENSE"],"a":2,"e":"Model Card 就是 repo 的 README.md，開頭的 YAML frontmatter 會變成 Hub 上的篩選標籤（task／language／license）。課程列的四個區塊是 Intended use／Limitations／Evaluation results／Training data。"},{"q":"Text Generation Inference（TGI）最核心的技術是？","o":["Tensor parallelism","Quantization","Continuous batching","Token streaming"],"a":2,"e":"Continuous batching 讓哪個序列先結束就先補新的進去，GPU 利用率大幅提升。LLM 推論是記憶體頻寬瓶頸，所以批次幾乎是「免費」的加速。⚠️  此頁有 • • 空項目符號。"},{"q":"Inference Endpoints 與 TGI 的關係是？","o":["Endpoints 是 TGI 的付費代管版本（含 auto-scaling、pay-per-use）","TGI 是 Endpoints 的舊名稱","Endpoints 只能跑 OpenAI 的模型","兩者完全無關"],"a":0,"e":" 的三條 bullet：Auto-scaling／Enterprise-ready／Pay-per-use。考試常考「何者是 Hugging Face 的付費代管服務」。"},{"q":"課程列出的 Optimum 三個硬體後端是？","o":["x86、ARM、RISC-V","CUDA、ROCm、Metal","NVIDIA TensorRT、Intel OpenVINO、Qualcomm AI Engine","AWS、Azure、GCP"],"a":2,"e":"用法是把 AutoModel 換成 ORTModel／OVModel，其餘程式碼幾乎不動。本機實測 optimum 未安裝（Lab 沒用到）。"},{"q":"Accelerate 的定位是？","o":["只用於推論","高層訓練框架，取代 Trainer","底層工具，讓同一份程式碼從 CPU 跑到多卡 GPU／TPU；Trainer 的底層就是它","只支援 TPU"],"a":2,"e":" 的三條 bullet：Multi-GPU／Distributed training／Supports CPU, GPU, TPU。重點是「寫一份程式，到處跑」。"},{"q":"`HF_transformer.ipynb` 的註解說要用 Google 的 DeiT，但程式實際載入的是？","o":["openai/clip-vit-base-patch32","microsoft/resnet-50","google/vit-base-patch16-224（ViT）","facebook/deit-base-distilled-patch16-224"],"a":2,"e":"本機實測 pipeline 用的 model class 是 ViTForImageClassification，config.architectures 也是 ['ViTForImageClassification']。真正的 DeiT 類別是 DeiTForImageClassificationWithTeacher。"},{"q":"`pipeline(\"audio-classification\", model=\"MIT/ast-finetuned-audioset-...\")` 的輸出是？","o":["AudioSet 的類別標籤（如 Ding／Beep, bleep／Clang）","頻譜圖","嵌入向量","文字轉錄（text tokens）"],"a":0,"e":"本機實測輸出 Ding 55.9%／Beep, bleep 19.5%／Clang 5.6%，與 56%／20%／6% 完全一致。⚠️ 課程 cell[8] 卻寫「Output: Text tokens」，是錯的。"},{"q":"哪一類模型才會輸出「文字」？","o":["audio-classification","automatic-speech-recognition（ASR，如 wav2vec2、Whisper）","text-classification","image-classification"],"a":1,"e":"本機實測：facebook/wav2vec2-base-960h（Wav2Vec2ForCTC）跑同一段 1 kHz 正弦得到 {'text': ''}（空字串，因為那不是語音）。 markdown 聲稱用了 wav2vec2，但程式用的是 AST。"},{"q":"`HF_transformer.ipynb` 的圖片來源有什麼問題？","o":["是熱連結到新聞站 CDN 的『裁切』圖（862×485），預測明顯失敗（最高信心度只有 12.9%）卻不加說明","圖片格式錯誤","使用了本地檔案","圖片太小"],"a":0,"e":"本機完全複現課程輸出：book jacket 12.9%／vestment 8.8%／overskirt 4.2%。根因是 ImageNet-1k 沒有「肖像畫」這個類別——模型只會輸出它訓練過的 1000 類。這才是本 Lab 最該學的一課。"},{"q":"`HF_LLM.ipynb` 只做了哪三件事？","o":["載入模型 → 套 LoRA → 印參數量（完全沒有 forward／backward）","訓練 → 評估 → 部署","下載資料 → 清洗 → 訓練","量化 → 轉 GGUF → 上傳"],"a":0,"e":"整份 notebook 只有 2 格。課程把「套上 LoRA 後參數量變少」當成「微調完成」，是概念錯誤——套上 LoRA 只是準備好可以微調。本機補做的 forward+backward 是 0.035 秒、loss 6.1742。"},{"q":"本機實測：`import peft` 失敗的**真正**根因是什麼？","o":["transformers 版本太舊","torchaudio 與 torch 的 CUDA 版本不符（13.0 vs 13.2），拖垮 transformers 的 lazy-import","缺少 BloomPreTrainedModel 這個檔案","peft 沒有安裝"],"a":1,"e":"錯誤訊息是 ModuleNotFoundError: Could not import module 'BloomPreTrainedModel'，完全誤導。根因鏈：torchaudio CUDA 不符 → transformers/audio_utils.py 的 import torchaudio 炸掉 → peft/utils/constants.py 的 from transformers import BloomPreTrainedModel 失敗。解法：pip uninstall -y torchaudio。"},{"q":"本機實測發現 Tiny ImageNet（`slegroux/tiny-imagenet-200-clean`）有什麼特性，讓「找魚」示範失效？","o":["沒有 label 欄位","所有圖片都是魚","資料集損毀","資料已按類別排序（前 3000 筆只有 7 個類別），所以迴圈其實只跑了 3 次就 break"],"a":3,"e":"本機實測：前 20 筆 label 全是 0、index 500–505 全是 1、labels == sorted(labels) 為 True。所以 Fish indices: [0, 1, 2] 不是「找到」的，是資料順序使然。正確做法是先用 filter() 或先 shuffle()。"}];

const LET = 'ABCD';
const KEY = 'huggingface-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 12 || i === 24 || i === 36 || i === 48){
      const label = i === 0 ? '第一部分：生態系、Hub 與 Spaces（1–12）'
                  : i === 12 ? '第二部分：Transformers、Datasets 與前處理（13–24）'
                  : i === 24 ? '第三部分：三種 Tokenizer（25–36）'
                  : i === 36 ? '第四部分：PEFT、LoRA、QLoRA 與工具鏈（37–48）'
                  : '第五部分：部署、三個 Lab 與實測缺陷（49–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
