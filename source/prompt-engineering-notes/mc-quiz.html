<title>Prompt Engineering MC 模擬測驗（60 題）| AI Tech Notes</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;
  --red-bg:#fdeaea; --sel:#dbeafe; --sel-line:#2563eb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}
</style>

<script>
const QUESTIONS = [{"q":"課程對 prompt 的定義是？","o":["模型自己生成的問題","使用者對模型輸出的評分","為了達成想要的任務，傳給語言模型的指令與上下文","模型內部的權重設定"],"a":2,"e":"prompts involve instructions and context passed to a language model to achieve a desired task。"},{"q":"課程對 prompt engineering 的定義是？","o":["開發並最佳化 prompt，以便在各種應用中有效率地使用語言模型","把模型重新訓練成特定領域專家","用程式自動生成大量訓練資料","把模型壓縮到可以在手機上執行"],"a":0,"e":"the practice of developing and optimizing prompts to efficiently use language models (LMs) for a variety of applications。"},{"q":"課程列出的三個課程目標中，「第三個」是？","o":["介紹 transformer 架構","講解如何訓練 LLM","介紹 GPU 採購策略","提供示範與練習，實際操作不同的提示技術"],"a":3,"e":" 的第三個目標：Provide demonstrations and exercises to practice different prompting techniques。這也是課程有 20 幾頁 Classroom Exercise 的原因。"},{"q":"課程列出「為什麼要學 prompt engineering」的三個理由，下列何者「不是」？","o":["對研究、發現與技術推進很重要","可以完全取代微調，所以不需要任何訓練資料","幫助測試與評估 LLM 的極限","讓各種創新應用得以建立在 LLM 之上"],"a":1,"e":" 的三點是 research/discoveries/advancement、test and evaluate the limitations of LLMs、enables innovative applications。"},{"q":"課程第一個範例（The sky is blue）使用的模型是？","o":["text-davinci-003","gpt-4","claude-3-opus","llama-2-70b"],"a":0,"e":" 標註 Model: \"text-davinci-003\"——屬於早期 GPT-3 系列的 completion 模型。"},{"q":"課程第一個範例標註的解碼參數是？","o":["temperature 1.0、top-p 0.7","temperature 0.2、top-p 0.9","temperature 0.7、top-p 1","temperature 1.5、top-p 0.5"],"a":2,"e":" 標註 temperature: 0.7、top-p: 1。這兩個數字常被直接考。"},{"q":"課程列出 prompt 的四個組成要素是？","o":["Model／Dataset／Loss／Optimizer","Instructions／Context／Input data／Output indicator","Encoder／Decoder／Attention／Feed-forward","System／User／Assistant／Tool"],"a":1,"e":"instructions、context、input data、output indicator 四項。"},{"q":" 的分類例子（Classify the text… Sentiment:）中，哪一個要素其實「缺席」？","o":["Instructions","Input data","Output indicator","Context"],"a":3,"e":"該例只有指令、輸入資料與輸出指示（Sentiment:），並沒有提供任何背景 Context——這是常考的細節。"},{"q":"依課程，想要「精確的答案」時，temperature 與 top_p 應該？","o":["兩個都調高","兩個都調低","temperature 調高、top_p 調低","這兩個參數與答案精確度無關"],"a":1,"e":"generally keep these low if you are looking for exact answers；keep them high for more diverse responses。"},{"q":"top_p（nucleus sampling）的作用是？","o":["只從累積機率達到 p 的最小詞集合中取樣","決定模型有幾層","設定輸出長度上限","控制模型使用幾張 GPU"],"a":0,"e":"top_p 是「核取樣」：把候選詞依機率排序後取累積機率達 p 的最小集合，再從中抽樣。p=1 代表不截斷。"},{"q":"課程示範的六種任務中，不包含？","o":["Text Summarization","Question Answering","Code Generation","Image Segmentation"],"a":3,"e":" 的六項是 Text Summarization、Question Answering、Text Classification、Role Playing、Code Generation、Reasoning。"},{"q":"課程 Text Classification 範例中，「I think the food was okay.」的正確標籤是？","o":["Neutral","Positive","Negative","Unsure"],"a":0,"e":" 的答案是 Neutral——\"okay\" 屬於不好不壞，這題示範的是「標籤邊界」的重要性。"},{"q":"課程 Code Generation 範例中，prompt 先提供什麼，讓模型寫出正確的 SQL？","o":["執行計畫（execution plan）","資料表的實際資料列","資料庫的版本號","資料表的 schema（表名與欄位）"],"a":3,"e":" 先給 departments 與 students 兩張表的欄位清單，模型才寫得出 IN + 子查詢。"},{"q":"課程 Reasoning 範例使用的指令是？","o":["Answer in one word","Translate into Chinese","Solve by breaking the problem into steps","Summarize in 3 bullet points"],"a":2,"e":"Solve by breaking the problem into steps. First, identify whether the numbers are odd or even…——這已是 CoT 的雛形。"},{"q":"課程把提示技術分成幾大類？","o":["三大類","七大類","十二大類","二十類"],"a":1,"e":"Foundational／Context & Role-Based／Reasoning & Planning／Advanced Orchestration & Control／Style, Tone & Persona／Iterative Improvement & Refinement／Specialized & Cutting-Edge，共七大類。"},{"q":"下列哪一類在 的總表中出現，卻「沒有」單獨的展開頁？","o":["Foundational Techniques","Style, Tone & Persona","Reasoning & Planning Techniques","Specialized & Cutting-Edge"],"a":1,"e":"Foundational、Context & Role-Based、Reasoning & Planning、Advanced Orchestration、Specialized & Cutting-Edge都有展開頁；Style, Tone & Persona 與 Iterative Improvement & Refinement 只在總表出現。"},{"q":"Advanced Orchestration & Control 這一類「不包含」下列哪一項？","o":["Least-to-Most Prompting","Tree-of-Thoughts (ToT)","Self-Generated In-Context Learning","Markdown Prompting"],"a":3,"e":"Markdown Prompting 屬於 Context & Role-Based Techniques（）；其餘三項都列在 p50 的 Advanced Orchestration & Control。"},{"q":"Zero-Shot Prompting 的定義是？","o":["要求模型執行任務但不提供任何範例，依賴模型的預訓練知識","先給三個範例再問","把模型微調到零錯誤","完全不給模型任何指令"],"a":0,"e":"asking an AI model to perform a task without giving examples；relies on the model's pre-trained knowledge。"},{"q":"課程指出 zero-shot 相較於 few-shot 的缺點是？","o":["一定無法回答","會消耗更多 token 但品質一樣","可能產生較籠統或不一致的結果","只能處理英文"],"a":2,"e":"may produce generic or inconsistent results compared to few-shot prompting。"},{"q":"Few-Shot Prompting 在課程中又被稱為什麼？","o":["Zero-shot transfer","Fine-tuning","Chain-of-thought","In-Context Learning"],"a":3,"e":"課程把它標成 Few-Shot Prompting (In-Context Learning)——範例放在上下文裡，不改權重。"},{"q":"Few-shot prompting 會不會更新模型的權重？","o":["會，效果等同微調","不會，範例只是放在這次的上下文裡","會，但只更新最後一層","取決於 temperature 的設定"],"a":1,"e":"in-context learning 的關鍵性質：模型權重不變，只是在本次推論中依上下文調整行為。"},{"q":"課程用同一個題目 \"The sky is ___\" 做了 zero-shot 與 few-shot 對照，兩者答案分別是？","o":["gas 與 Blue","Blue 與 Blue","Blue 與 gas","gas 與 gas"],"a":2,"e":"（zero-shot）答案是 Blue；few-shot，先給 the ocean is liquid.答案是 gas——同題目、有無範例會得到不同答案。"},{"q":" 建議 clear instructions 應包含的六個要素是？","o":["Task／Format／Length／Tone／Constraints／Context","Model／Temperature／Top-p／Seed／Stop／Stream","Input／Output／Hidden／Loss／Grad／Step","Who／What／When／Where／Why／How"],"a":0,"e":" 明列：Task, Format, Length, Tone, Constraints, Context。"},{"q":" 的強 prompt「Summarize the article in 3 bullet points, each ≤15 words, focusing on main findings.」比弱 prompt 多了什麼？","o":["更長的句子與更多禮貌用語","要求模型先自我介紹","數量、長度與重點的明確限制","要求模型改用另一種語言"],"a":2,"e":"弱 prompt 是 Summarize this article.；強 prompt 補上了「3 點」「每點 ≤15 字」「聚焦主要發現」。"},{"q":"課程說 clear instructions 為什麼重要？","o":["可以讓模型變得更聰明","可以減少 token 消耗","可以取代 few-shot","減少歧義、提升一致性，讓輸出更容易評估與重用"],"a":3,"e":"reduces ambiguity, improves consistency, and makes outputs easier to evaluate and reuse。"},{"q":"System Prompting 的關鍵描述是？","o":["一次性的問題改寫技巧","像一個常駐的指令層，影響對話中之後的所有回答","只影響對話中的第一個回答","只能用在影像生成模型上"],"a":1,"e":"acts like a permanent instruction layer that influences all later answers in the conversation。"},{"q":"課程說 system prompting 特別適合哪些場景？","o":["production workflows、教學助理、客服機器人等需要「可重複行為」的場景","一次性的隨機問答","離線的批次數值計算","純圖像生成"],"a":0,"e":"especially useful in production workflows, teaching assistants, and support bots where repeatable behavior matters。"},{"q":"Role Prompting 主要會改變輸出的哪三件事？","o":["長度、價格、時間","語言、格式、字型","模型、資料、算力","語氣（tone）、詞彙（vocabulary）、決策標準（decision criteria）"],"a":3,"e":"helps the model adopt the right tone, vocabulary, and decision criteria for the task。"},{"q":"課程對 role prompting 的關鍵建議是？","o":["角色越模糊越好，讓模型自由發揮","一定要使用虛構人物","角色越具體越有效（stronger when the role is specific rather than vague）","一次只能指派一種角色，不能組合"],"a":2,"e":" 的關鍵句：It is stronger when the role is specific rather than vague。"},{"q":"Contextual Prompting 可以補充哪些背景？","o":["受眾、目標、環境、限制、地點、先備知識","模型的權重與偏差值","GPU 型號與記憶體容量","API key 與服務端點"],"a":0,"e":"audience, goals, environment, constraints, location, or prior knowledge。"},{"q":"課程給 contextual prompting 的判斷準則是？","o":["只要題目很短就該用","同一個問題在不同處境下可能需要不同的答案","只有英文題目才需要","只有在 temperature 設為 0 時才用"],"a":1,"e":" 的 Key idea：use contextual prompting whenever the same question could require different answers in different settings。"},{"q":"Markdown Prompting 的價值在於？","o":["讓模型跑得更快","減少 token 用量","讓模型自動翻譯","同時改善 prompt 清晰度與輸出可讀性，讓結果更容易閱讀與重用"],"a":3,"e":"This improves both prompt clarity and output readability；並提到 poorly structured output is harder to read and reuse。"},{"q":"課程列出的 Markdown 結構元素「不包含」？","o":["headings（標題）","hyperlinks（超連結）","tables（表格）","code blocks（程式碼區塊）"],"a":1,"e":"課程列的是 headings、bullet points、numbered steps、tables、code blocks——沒有 hyperlinks。"},{"q":"下列哪一句「不是」課程列出的 CoT 觸發語？","o":["think step by step","work through this carefully","answer with one word only","reason through this before answering"],"a":2,"e":" 的三句觸發語是 \"think step by step\"、\"work through this carefully\"、\"reason through this before answering\"。"},{"q":"課程說 CoT 特別適合哪類問題？","o":["邏輯、數學、多步分析與需要審慎決策的問題","單純的名詞解釋","純文字翻譯","圖片分類"],"a":0,"e":"useful for problems that involve logic, math, multi-step analysis, or careful decision-making。"},{"q":"課程建議 TCoT 的表格欄位是？","o":["Input／Output／Score／Rank","step number／action／evidence／result","Name／Age／City／Score","A／B／C／D"],"a":1,"e":"columns such as step number, action, evidence, and result。"},{"q":"課程說表格化的推理讓步驟更容易？","o":["被隱藏","被隨機化","被加密","被掃視、比較與稽核（scan, compare, and audit）"],"a":3,"e":"A table makes reasoning easier to scan, compare, and audit。"},{"q":"課程說 SoT 的骨架通常包含幾點？","o":["3 到 10 個短點","剛好 2 點","至少 20 點","沒有任何數量限制"],"a":0,"e":"A typical skeleton contains 3 to 10 short points。"},{"q":"課程提到 SoT 除了提升清晰度，還可能有什麼好處？","o":["把模型準確率提升到 100%","完全消除幻覺","有時可降低回應延遲（reduce response latency）","自動產生投影片圖片"],"a":2,"e":"which can improve clarity and sometimes reduce response latency——這是 SoT 被提出的動機之一。"},{"q":"Step-Back Prompting 的動作順序是？","o":["先退一步想上位概念／原則，再把通則套回原題","先回答再自我修正","先翻譯成英文再回答","先給三個範例再回答"],"a":0,"e":"first think about the higher-level concepts, principles, or framework behind it；after that, applies those general insights to the original task。"},{"q":"課程說 Step-Back 特別適合哪類任務？","o":["即時翻譯","策略、政策、設計與分析等「原則比表面答案重要」的任務","影像去背","資料庫備份"],"a":1,"e":"Use Step-Back prompting for strategy, policy, design, analysis, and other tasks where principles matter more than immediate surface-level answers。"},{"q":"Least-to-Most Prompting 的三個步驟是？","o":["先做摘要、再翻譯、最後朗讀","先評估、再排序、最後刪除","把問題拆成更簡單的子問題、逐一解決、再合併成最終答案","先反駁、再同意、最後總結"],"a":2,"e":"breaks a difficult problem into smaller and simpler subproblems, solves them one by one, and then combines the results into a final answer。"},{"q":"Least-to-Most 與 CoT 最大的差別是？","o":["Least-to-Most 完全不允許推理","Least-to-Most 只能處理英文題目","CoT 一定要用表格呈現","CoT 是對「同一題」逐步推理；Least-to-Most 是把題目「拆成多個子問題」再逐一解"],"a":3,"e":"CoT 是一條推理鏈；Least-to-Most 會先做 decomposition（拆解）再逐一求解，最後合併。"},{"q":"Tree-of-Thoughts 相對 CoT 多出的能力是？","o":["更快的輸出速度","更短的答案長度","平行探索多條分支並評估，需要時可搜尋與回溯（search / backtracking）","自動微調模型權重"],"a":2,"e":"explore multiple candidate paths or ideas in parallel, evaluate them, and then continue with the strongest branch；並提到 search or backtracking。"},{"q":" 的 ToT 練習要求模型做哪三件事？","o":["探索 3 個可能方案、依準則評估、選出最佳方案","產生 1 個方案並直接採用","列出 10 個關鍵字","寫一段程式並執行"],"a":0,"e":"課程要求：Explore 3 possible event plans… Evaluate each plan by cost, learning value, and practicality, then choose the best option——展開→評估→收斂。"},{"q":"Interactive Tree-of-Thoughts 與 ToT 的差別是？","o":["iToT 只用一條分支","iToT 每輪都會依回饋迭代精煉，弱分支會被修訂或替換","iToT 不能評估分支","iToT 只能用在圖像任務"],"a":1,"e":"refining branches iteratively with feedback after each round；as weak branches are revised or replaced。"},{"q":"Self-Generated In-Context Learning 解決了什麼問題？","o":["模型回應太慢","token 成本太高","模型不會翻譯","人工撰寫 few-shot 範例很花時間，改由模型自己生成任務相關範例"],"a":3,"e":"reduces dependence on manually written exemplars；uses the model itself to create examples closely related to the target task。"},{"q":"Constitutional AI (CAI) 的核心做法是？","o":["用更大的模型來訓練小模型","用一組明文的原則／規則／倫理限制來引導模型如何回應","刪除所有訓練資料中的敏感內容","把模型部署到隔離網路"],"a":1,"e":"uses an explicit set of principles, rules, or ethical constraints to guide how the model should respond。"},{"q":"課程說若缺少明確的治理原則，模型可能出現什麼狀況？","o":["完全無法回答","只會回答英文","回答「技術上流暢但不合政策或倫理」（technically fluent but misaligned）","拒絕所有請求"],"a":2,"e":"a model may answer in ways that are technically fluent but misaligned with policy or ethics。"},{"q":"Perspective-Taking Prompting 的作用是？","o":["讓模型只採用專家的立場","讓答案變得更短","讓模型改用另一種語言回答","讓模型從多個利害關係人視角看問題，得到更平衡細緻的答案"],"a":3,"e":"consider a problem from more than one viewpoint… often produces a more balanced and nuanced answer。"},{"q":"Analogical Prompting 的關鍵是？","o":["用類比把新概念連到熟悉經驗，最後再接回技術本身","用數學公式推導","用表格比較選項","用程式驗證答案"],"a":0,"e":" 說類比是 a bridge；p65 的示範更要求 Then connect the analogy back to the technical idea。"},{"q":"Multi-Modal Prompting 指的是？","o":["同時使用多個模型來投票","同時使用多種程式語言","把文字指令與影像、文件、音訊、影片等其他輸入結合","把 prompt 切成很多段分批送出"],"a":2,"e":"combines text instructions with other input types such as images, documents, audio, or video。"},{"q":"Persona Consistency Prompting 要解決的問題是？","o":["模型回應太慢","模型的語氣與人格在不同輸出之間漂移（drift）","模型無法處理長文本","模型不會算數學"],"a":1,"e":"Without consistency instructions, the model's tone and personality may drift across turns or documents。"},{"q":"Predictive Prompting 要模型做什麼？","o":["回顧過去的歷史資料","把現況摘要成一句話","把答案翻譯成英文","預測可能的後果與未來發展（anticipate outcomes）"],"a":3,"e":"asks the model to anticipate likely outcomes, consequences, or future developments based on the current situation。"},{"q":"Generate Knowledge Prompting 最後採用哪一個預測？","o":["信心最高的那一個（highest-confidence prediction）","第一個產生的那一個","字數最短的那一個","隨機挑一個"],"a":0,"e":"Highest-confidence prediction is used；p74 的示範正是同一題、兩條知識得到相反答案，最後取信心較高者。"},{"q":"Program-aided Language Model (PAL) 的核心做法是？","o":["讓 LLM 產生程式當中間推理步驟，把求解外包給 Python 直譯器等執行環境","讓 LLM 只輸出自然語言答案","讓 LLM 直接改寫自己的權重","讓 LLM 呼叫另一個更大的模型"],"a":0,"e":"generate programs as the intermediate reasoning steps；offloads the solution step to a runtime such as Python interpreter。"},{"q":"ReAct 的關鍵特色是？","o":["只用一條推理鏈，完全不與外界互動","把計算外包給 Python 直譯器","先給三個範例再問","讓推理軌跡與任務行動交錯產生，可呼叫外部工具取得額外資訊"],"a":3,"e":"generate both reasoning traces and task-specific actions in an interleaved manner；interact with external tools to retrieve additional information。"},{"q":"課程說「LLM 搭配外部工具」需要的三個元件是？","o":["Encoder／Decoder／Attention","Agent／Tool／LLM","Input／Process／Output","Prompt／Response／Score"],"a":1,"e":"① 由 LLM 驅動、決定行動的 agent；② 用來與世界互動的 tool；③ 驅動 agent 的 LLM。注意 agent 與 LLM 是分開的兩個元件。"},{"q":"課程說 prompt engineering 在「安全」面向的用途是？","o":["只能用來提升模型效能","只能偵測硬體故障","找出 LLM 的風險行為，進而降低有害行為與風險","只能用來壓縮模型大小"],"a":2,"e":"prompt engineering can help identify risky behaviours of LLMs, which can help to reduce harmful behaviours and risks——社群甚至會主動做 prompt injection 來了解 LLM 的弱點。"},{"q":"下列配對何者正確？","o":["Prompt Injection＝逼模型吐出它自己的 prompt","Jailbreaking＝只影響圖片生成，與文字模型無關","Prompt Leaking＝逼模型吐出關於它自己 prompt 的資訊","RLHF＝完全不需要人類參與"],"a":2,"e":"injection 是劫持輸出（hijack an LM's output）；p89：leaking 是 force the model to spit out information about its own prompt；p90：jailbreaking 是繞過安全與審核；p92：RLHF 需要收集人類回饋資料集。"}];

const LET = 'ABCD';
const KEY = 'prompt-eng-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 15 || i === 30 || i === 45){
      const label = i === 0 ? '第一部分：課程範圍、prompt 定義與元素（1–15）'
                  : i === 15 ? '第二部分：六大任務、技術地圖與基礎／上下文技術（16–30）'
                  : i === 30 ? '第三部分：推理與規劃、進階編排技術（31–45）'
                  : '第四部分：專業前沿、工具應用與模型安全（46–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
