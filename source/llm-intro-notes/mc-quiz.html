<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;
  --red-bg:#fdeaea; --sel:#dbeafe; --sel-line:#2563eb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}

<script>
const QUESTIONS = [{"q":"原稿說「large language model」的「large」指的是什麼？","o":["只有模型的參數量很大","只有訓練用的資料集很大","參數量與訓練資料量「兩者都」很大","只有詞彙表（vocabulary）很大"],"a":2,"e":"原稿 p6 特別強調「large」**同時**指兩件事：參數量（parameters，常有數十億到數千億個）與訓練所用的龐大資料集。只寫一個就錯。"},{"q":"原稿如何澄清「語言模型理解語言」這件事？","o":["代表 LLM 具備人類的意識","指的是能產生連貫且切合上下文的文字，而非具備人類意識或理解力","代表 LLM 能感受情緒","代表 LLM 內建了語言學規則"],"a":1,"e":"原稿 p2 明確澄清：不是 human-like consciousness or comprehension，而是能產生 coherent and contextually relevant 的文字。"},{"q":"當代 LLM 與早期 NLP 模型最根本的差別是？","o":["早期模型通常為「特定任務」而設計，LLM 則展現跨任務的廣泛能力","早期模型的參數比 LLM 多","LLM 無法處理分類任務","早期模型完全不能做翻譯"],"a":0,"e":"原稿 p3：earlier NLP models were typically designed for specific tasks；LLM 展現 broader proficiency across a wide range of NLP tasks。"},{"q":"原稿指出 LLM 之所以成功，兩個原因是？","o":["GPU 算力與雲端服務","人工標註與規則庫","量化與剪枝技術","transformer 架構 與 海量訓練資料"],"a":3,"e":"原稿 p4：the transformer architecture 與 vast amounts of data；後者讓模型能捕捉難以手動編碼的語言細節、上下文與模式。"},{"q":"LLM 中的「parameters（參數）」指的是？","o":["訓練資料的文件數","網路中可調整的權重，訓練時被最佳化以預測序列中的下一個字","詞彙表的項目數","模型的層數"],"a":1,"e":"原稿 p6：parameters are the adjustable weights in the network that are optimized during training to predict the next word in a sequence。"},{"q":"依原稿，LLM 的定義是？","o":["一套規則式語言分析器","一種資料庫查詢引擎","一個搜尋引擎排名系統","一個為理解、生成與回應類似人類文字而設計的神經網路"],"a":3,"e":"原稿 p5 的定義句：a neural network designed to understand, generate, and respond to human-like text。"},{"q":"原稿舉出的客製化 LLM 例子中，BloombergGPT 專精於哪個領域？","o":["醫療問答","法律文件","金融","氣象預測"],"a":2,"e":"原稿 p9：BloombergGPT 是 specialized for finance 的例子；另一個例子是醫療問答（medical question answering）。"},{"q":"pretraining 的「pre」在原稿中代表什麼意思？","o":["預先壓縮模型","最初的階段——模型先在大型、多樣的資料集上訓練","預先標註訓練資料","預先部署到雲端"],"a":1,"e":"原稿 p10：the term \"pre\" in \"pretraining\" refers to the initial phase where a model is trained on a large, diverse dataset。"},{"q":"關於 pretraining 與 finetuning 的資料，下列何者正確？","o":["pretraining 用大型多樣資料集；finetuning 用更小、更聚焦特定任務或領域的資料集","pretraining 用小而專的資料；finetuning 用大型多樣資料","兩者使用完全相同的資料集","finetuning 不需要任何資料"],"a":0,"e":"原稿 p10：pretraining 建立 broad understanding；pretrained model 再以 a narrower dataset that is more specific to particular tasks or domains 進行 finetuning。"},{"q":"預訓練完成的模型又被稱為什麼？","o":["蒸餾模型（distilled model）","量化模型（quantized model）","基礎模型（base model / foundation model）","專家混合模型（MoE）"],"a":2,"e":"原稿 p24：因為可再被微調、當作下游任務的基礎，這類模型也被稱為 base or foundation models。"},{"q":"下列哪一種微調的標註資料是「instruction 與 answer 的配對」？","o":["classification finetuning","pretraining","masked word prediction","instruction-finetuning"],"a":3,"e":"原稿 p12：In instruction-finetuning, the labeled dataset consists of instruction and answer pairs（例如「要求翻譯一段文字」＋正確譯文）。"},{"q":"分類微調（finetuning for classification tasks）的標註資料形式是？","o":["文本與對應的類別標籤（例如 email 標成 spam／non-spam）","指令與答案的配對","只有原始未標註文字","圖片與 bounding box"],"a":0,"e":"原稿 p12：In classification finetuning, the labeled dataset consists of texts and associated class labels。"},{"q":"Transformer 的兩個子模組是？","o":["encoder 與 pooling layer","encoder（編碼器）與 decoder（解碼器）","generator 與 discriminator","卷積層與池化層"],"a":1,"e":"原稿 p14：the transformer architecture consists of two submodules, an encoder and a decoder。"},{"q":"在原稿的翻譯任務例子中，encoder 的角色是？","o":["生成目標語言的文字","判斷句子是正面還是負面","把來源語言文字編碼成捕捉上下文的向量","把向量壓縮成單一數字"],"a":2,"e":"原稿 p14–15：encoder 把來源語言編成向量，decoder 再把這些向量解碼生成目標語言文字。"},{"q":"encoder 與 decoder 的「許多層」之間是靠什麼機制連接？","o":["self-attention 機制","dropout","batch normalization","卷積核"],"a":0,"e":"原稿 p15：Both the encoder and decoder consist of many layers connected by a so-called self-attention mechanism。"},{"q":"self-attention 機制的核心作用是？","o":["把文字轉成 token ID","衡量序列中不同詞或 token 相對於彼此的重要性","降低模型參數量","把影像切成 patch"],"a":1,"e":"原稿 p16：allows the model to weigh the importance of different words or tokens in a sequence relative to each other。"},{"q":"self-attention 讓模型能捕捉什麼，因而提升輸出品質？","o":["只捕捉相鄰兩個字的關係","只捕捉詞的絕對位置","只捕捉詞的拼字","長距離依賴（long-range dependencies）與上下文關係"],"a":3,"e":"原稿 p16：capture long-range dependencies and contextual relationships within the input data，enhancing coherent and contextually relevant output。"},{"q":"BERT 是建立在原始 transformer 的哪個子模組上？","o":["decoder","完整的 encoder + decoder","encoder","都不是，BERT 是獨立架構"],"a":2,"e":"原稿 p17：BERT, which is built upon the original transformer's encoder submodule。"},{"q":"BERT 專精的訓練方式是？","o":["next-word prediction（自迴歸生成）","masked word prediction（預測句子中被遮蔽的字）","強化學習","對比學習"],"a":1,"e":"原稿 p17：BERT and its variants specialize in masked word prediction, where the model predicts masked or hidden words in a given sentence。"},{"q":"原稿提到哪家公司用 BERT 偵測毒性內容（toxic content）？","o":["Google","Meta","Microsoft","Twitter"],"a":3,"e":"原稿 p17：as of this writing, Twitter uses BERT to detect toxic content。"},{"q":"GPT 取用原始 transformer 的哪個部分？","o":["decoder","encoder","encoder + decoder","都不是，GPT 是獨立架構"],"a":0,"e":"原稿 p19：GPT focuses on the decoder portion of the original transformer architecture。"},{"q":"下列何者「不是」原稿列出的 GPT 生成任務？","o":["machine translation（機器翻譯）","text summarization（文字摘要）","遮字填空（masked word prediction）","writing computer code（寫程式碼）"],"a":2,"e":"masked word prediction 是 BERT 的訓練方式；原稿 p19 列出的 GPT 任務包含翻譯、摘要、fiction writing、寫程式碼。"},{"q":"zero-shot learning 的定義是？","o":["從最少量範例中學習","完全沒有事先提供任何具體範例，就能泛化到完全沒見過的任務","完全不能處理新任務","需要大量標註資料"],"a":1,"e":"原稿 p20：Zero-shot learning refers to the ability to generalize to completely unseen tasks without any prior specific examples。"},{"q":"few-shot learning 的定義是？","o":["完全不給範例","需要微調整個模型","只能用於翻譯","從使用者提供的最少量範例（minimal number of examples）中學習"],"a":3,"e":"原稿 p20：few-shot learning involves learning from a minimal number of examples the user provides as input。"},{"q":"GPT-2 主要的訓練資料集名稱是？","o":["WebText","ImageNet","Common Crawl（完全未過濾）","BookCorpus"],"a":0,"e":"本筆記補充（原稿 p22 為圖）：GPT-1 用 BookCorpus、GPT-2 用 WebText、GPT-3 混合 Common Crawl（過濾後）／WebText2／Books／Wikipedia。"},{"q":"原稿對「token」的定義是？","o":["一個完整的句子","模型所讀取的一個文字單位","一個英文字母","一段程式碼"],"a":1,"e":"原稿 p23：a token is a unit of text that a model reads。"},{"q":"依原稿，資料集的 token 數大約等於？","o":["句子的數量","段落數乘以平均字數","單詞數加上標點字元數","檔案的位元組數"],"a":2,"e":"原稿 p23：roughly equivalent to the number of words and punctuation characters in the text。"},{"q":"GPT-3 的預訓練成本估計約為？","o":["460 萬美元（$4.6 million）","46 萬美元","4,600 萬美元","4.6 億美元"],"a":0,"e":"原稿 p24：the GPT-3 pretraining cost is estimated to be $4.6 million in terms of cloud computing credits。"},{"q":"原稿說 GPT-3 的預訓練成本是以什麼計價？","o":["用電度數","人力工時","硬體採購金額","雲端運算額度（cloud computing credits）"],"a":3,"e":"原稿 p24：in terms of cloud computing credits。"},{"q":"關於開源預訓練 LLM，原稿的說法是？","o":["開源模型不能商用，也不能再微調","許多預訓練 LLM 以開源形式提供，可當通用工具撰寫／擷取／編輯不在訓練資料裡的文字","開源模型只能做分類","開源模型的預訓練成本比閉源更高"],"a":1,"e":"原稿 p25：many pretrained LLMs, available as open-source models, can be used as general purpose tools to write, extract, and edit texts that were not part of the training data。"},{"q":"next-word prediction 屬於哪一種學習形式？","o":["監督式學習（需人工標註）","強化學習","自我監督學習（self-supervised learning），也就是一種自我標註（self-labelling）","非監督式分群"],"a":2,"e":"原稿 p26：next-word prediction task is a form of self-supervised learning, which is a form of self-labelling。"},{"q":"為什麼 next-word prediction 不需要人工收集標籤？","o":["因為可以直接利用資料本身的結構——用句子中的下一個字當作標籤","因為模型不需要標籤也能收斂","因為標籤由使用者即時輸入","因為標籤由另一個模型生成"],"a":0,"e":"原稿 p26：we don't need to collect labels for the training data explicitly but can leverage the structure of the data itself。"},{"q":"為什麼 GPT 被歸類為「自迴歸（autoregressive）模型」？","o":["因為它只用 encoder","因為它一次生成整段文字","因為它需要人工標註","因為它是 decoder 式模型，一次預測一個字來生成文字"],"a":3,"e":"原稿 p27：decoder-style models like GPT generate text by predicting text one word at a time, they are considered a type of autoregressive model。"},{"q":"自迴歸模型會如何處理自己的輸出？","o":["直接丟棄，只保留最後一個字","把先前的輸出當作未來的輸入","只用來計算 loss，不再輸入模型","存成訓練資料後重新訓練"],"a":1,"e":"原稿 p27：Autoregressive models incorporate their previous outputs as inputs for future predictions。"},{"q":"GPT-3 的層數與參數量分別是？","o":["12 層、1.17 億參數","48 層、1,750 億參數","96 層、1,750 億（175 B）參數","96 層、1,750 萬參數"],"a":2,"e":"原稿 p28：GPT-3 has 96 transformer layers and 175 billion parameters in total。"},{"q":"原始 transformer 的 encoder／decoder 各重複幾次？","o":["1 次","3 次","12 次","6 次"],"a":3,"e":"原稿 p28：the original transformer repeated the encoder and decoder blocks six times。"},{"q":"原稿 p29 的標題與 p27 相同（Autoregressive Models），這代表？","o":["兩頁是同一主題的「定義頁」與「生成過程頁」，不是兩個不同主題","原稿重複出錯，其中一頁應刪除","p29 是另一個全新主題","p29 是考試範圍外的附錄"],"a":0,"e":"p27 講自迴歸的定義；p29 只有一張圖（無文字層），描述生成過程。本筆記依原稿順序拆成 §15 與 §17。"},{"q":"原稿 p30–31「Building an LLM」的性質是？","o":["兩個完整的新主題","章節分隔頁，把教材從觀念切換到實作","考試範圍外的補充","課後練習題"],"a":1,"e":"p30 與 p31 都只有標題、沒有文字層，是章節分隔頁；實作細節在 p32–47。"},{"q":"word embedding 是什麼？","o":["把句子壓縮成一個數字","把詞翻譯成另一種語言","把 token 映射到固定長度的實數向量，語意相近的詞向量也相近","把圖片轉成文字"],"a":2,"e":"embedding 是「文字世界 → 數值世界」的對應；神經網路只能運算數字，而向量距離可表達語意相似度。"},{"q":"原稿 p34 的分詞程式為何要寫成 re.split(r'([,.:;?_!\"()\\']|--|\\s)', text)（加括號）？","o":["因為加括號才能把分隔符（標點）也保留成獨立的 token","因為不加括號會讓 Python 報錯","因為加括號才能支援中文","因為加括號可以加速執行"],"a":0,"e":"re.split 若不加捕獲括號，分隔符會被丟棄，標點就不會成為 token——這是最常見的錯誤。"},{"q":"本筆記實測 re.split 切 \"Hello, world. Is this-- a test?\" 會得到幾個 token？","o":["6 個","8 個","12 個","10 個"],"a":3,"e":"本機實測：['Hello', ',', 'world', '.', 'Is', 'this', '--', 'a', 'test', '?']，共 10 個。"},{"q":"建立 vocabulary 時為什麼要用 sorted(set(tokens))？","o":["為了讓詞彙表變小","去重並固定順序，讓 token ID 可重現","為了把中文排在前面","為了提高訓練速度"],"a":1,"e":"set 去重、sorted 固定順序；否則每次執行的 ID 都不同，實驗結果無法比較。"},{"q":"本筆記示範的小語料中，\"The cat sat\" 轉成的 token IDs 是？","o":["[0, 1, 2]","[15, 16, 17]","[2, 4, 11]","[15496, 11, 995]"],"a":2,"e":"本機實測：vocabulary size 15，\"The cat sat\" → [2, 4, 11]。"},{"q":"SimpleTokenizerV1 遇到詞彙表裡沒有的詞（OOV）會如何？","o":["直接丟出 KeyError 而中斷","自動略過該詞","自動切成子詞","自動轉成 UNK"],"a":0,"e":"本機實測：encode(\"Hello, do you like tea?\") → KeyError: 'Hello'。這正是 V2 要解決的問題。"},{"q":"SimpleTokenizerV2 相對 V1 的關鍵差別是？","o":["改用 BPE 演算法","加入大小寫轉換","移除標點處理","把不在詞彙表裡的詞替換成 <|unk|>"],"a":3,"e":"V2 只多了一行：item if item in self.str_to_int else \"<|unk|>\"。"},{"q":"<|endoftext|> 的主要用途是？","o":["標示文件（文本）的邊界／分隔","代表未知詞","代表句子中的逗號","代表模型版本"],"a":0,"e":"原稿 p39（Start and End of Text）：用 <|endoftext|> 把多份不相關的文件分開，避免模型學到假關聯。"},{"q":"若不插入 <|endoftext|> 就把兩份文件接起來，會有什麼問題？","o":["檔案會變大","模型無法訓練","token ID 會重複","模型會把前一份文件的結尾與下一份的開頭當成同一句話，學到假關聯"],"a":3,"e":"本機實測 decode 結果會變成 The cat sat on the mat. The dog sat on the log.，兩份文件被黏成一句。"},{"q":"<|unk|> 這個特殊 token 的用途是？","o":["標示文件結束","代表不在詞彙表裡的字（unknown）","代表句首","代表數字"],"a":1,"e":"V2 用它取代 OOV 詞，讓 tokenizer 不再因 KeyError 中斷。"},{"q":"GPTDatasetV1 中的 target_ids 是怎麼產生的？","o":["由人工標註","隨機抽樣","把 input_ids 往左平移一位（取 i+1 到 i+max_length+1）","由另一個模型預測"],"a":2,"e":"對應原稿 p41：y 由輸入平移一位（shifting the input by one position）而來。"},{"q":"樣本數的計算公式是？","o":["token 總數 ÷ stride","⌊(token 總數 − max_length) ÷ stride⌋","token 總數 − max_length","max_length × stride"],"a":1,"e":"迴圈為 range(0, len(token_ids) - max_length, stride)；本機實測 6 個 token、max_length=4、stride=1 → 2 個樣本。"},{"q":"在 DataLoader 中，張量 x 的每一列代表什麼？","o":["一個輸入 context（一段輸入序列）","一個單獨的預測值","一個 batch 的總數","一個模型的層"],"a":0,"e":"原稿 p41：x where each row represents one input context。"},{"q":"本機實測中，x 與 y 的形狀（shape）是？","o":["x=(4,2)、y=(4,2)","x=(1,4)、y=(4,1)","x=(2,4)、y=(2,4)","x=(2,3)、y=(2,3)"],"a":2,"e":"batch_size=2、max_length=4，故兩者皆為 (2,4)；y 是 x 平移一位。"},{"q":"依原稿，stride 設為 1 時？","o":["batch 之間完全不重疊","每建立下一個 batch 只把輸入視窗移 1 格，樣本高度重疊","只會產生一個 batch","視窗大小會自動加倍"],"a":1,"e":"原稿 p42：If the stride is set to 1, we shift the input window by 1 position when creating the next batch。"},{"q":"依原稿，把 stride 設成「等於輸入視窗大小」可以得到什麼效果？","o":["樣本數變成無限多","每個 token 都被重複使用","視窗會自動變大","可以避免 batch 之間重疊（prevent overlaps）"],"a":3,"e":"原稿 p42：If we set the stride equal to the input window size, we can prevent overlaps between the batches。"},{"q":"embedding layer 的運算本質是？","o":["查表（look-up operation），直接取出權重矩陣的某一列","矩陣乘法","卷積運算","遞迴運算"],"a":0,"e":"原稿 p44：Embedding layers perform a look-up operation, retrieving the embedding vector corresponding to the token ID。"},{"q":"依原稿，token ID 5 對應 embedding 權重矩陣的第幾列？","o":["第 4 列","第 5 列","第 6 列（因為 Python 從 0 開始數）","第 7 列"],"a":2,"e":"原稿 p44 特別用括號強調：it is the sixth instead of the fifth row because Python starts counting at 0。"},{"q":"關於 embedding layer 對「位置」的處理，下列何者正確？","o":["會依位置給不同的向量","會把位置資訊編進 token ID","會自動加上位置編碼","同一個 token ID 不論在序列哪個位置，查到的向量都相同"],"a":3,"e":"原稿 p45 與本機實測（[5,4,5] 第 1 與第 3 個位置查到的向量相同 → True）；正因如此才需要 §29 的 positional embedding。"},{"q":"positional embedding 是如何與 token embedding 結合的？","o":["用 concat（接在一起）","用矩陣乘法","用 max pooling","逐元素相加（added to），且維度必須相同"],"a":3,"e":"原稿 p46：Positional embeddings are added to the token embedding vector… The positional vectors have the same dimension as the original token embeddings。"},{"q":"輸入處理管線（p47）五個步驟的正確順序是？","o":["切 token → 轉 token ID → 轉 embedding → 加 positional embedding → 送進主層","轉 token ID → 切 token → 送進主層 → 轉 embedding","轉 embedding → 切 token → 轉 token ID → 送進主層","加 positional embedding → 切 token → 轉 token ID → 送進主層"],"a":0,"e":"原稿 p47 的總結句：broken up into tokens → converted into token IDs using a vocabulary → converted into embedding vectors → positional embeddings added → input embeddings used as input for the main LLM layers。"},{"q":"本筆記實測 GPT-2 分詞器對 \"Hello, world!\" 的輸出是？","o":["[1, 2, 3]","[464, 3797, 3332, 319, 262, 2603]","[15496, 11, 995, 0]（共 4 個 token）","[50257]"],"a":2,"e":"本機實測（tiktoken gpt2）：'Hello'(15496)、','(11)、' world'(995)、'!'(0)，共 4 個 token，符合「token 數 ≈ 單詞數 + 標點數」。"}];

const LET = 'ABCD';
const KEY = 'llm-intro-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 15 || i === 30 || i === 45){
      const label = i === 0 ? '第一部分：LLM 基礎、訓練流程與 Transformer（1–15）'
                  : i === 15 ? '第二部分：BERT vs GPT、自迴歸與規模數字（16–30）'
                  : i === 30 ? '第三部分：輸入管線實作——分詞、ID 與特殊 token（31–45）'
                  : '第四部分：滑動視窗、DataLoader、embedding 與管線（46–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
      html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
