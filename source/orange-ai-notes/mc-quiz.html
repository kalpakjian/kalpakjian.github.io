<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}

<script>
const QUESTIONS = [{"q":"Orange 中「基本的資料探勘單元」稱為什麼？","o":["Widget（元件）","Channel（通道）","Workflow（工作流）","Domain（領域）"],"a":0,"e":"Orange 的基本資料探勘單元稱為 **Widget（元件）**；有專門用於讀取資料、預處理、視覺化、分群、分類等功能的 widget。"},{"q":"在 Orange 裡，Widget 之間靠什麼互相通訊？","o":["檔案","通道（Channel）","資料庫","剪貼簿"],"a":1,"e":"Widgets 透過**通訊通道（channels）**進行通訊。通道有型別（Data／Learner／Classifier…），型別不合就**連不起來**。"},{"q":"「資料探勘工作流程（workflow）」在 Orange 的定義是？","o":["一個模型","一份資料集","一段程式碼","一堆 Widget 與 Channel 的集合"],"a":3,"e":"原稿原文：資料探勘工作流程是 **widgets 和通訊通道的集合**。"},{"q":"Orange 工作流的存檔副檔名是？","o":[".tab",".ows",".pkcls",".csv"],"a":1,"e":"工作流存成 **`.ows`**（Orange Workflow Scheme）。`.tab`／`.csv` 是資料，`.pkcls`／`.pkreg` 是模型。"},{"q":"在「為什麼有了 TPOT 還需要 Orange」的對照裡，兩者的本質差異是什麼？","o":["TPOT 是優化器（自動找模型），Orange 是互動環境（幫人懂資料）","兩者都是 AutoML 工具，只是介面一個是 GUI、一個是程式庫","TPOT 只能做分類，Orange 只能做迴歸","TPOT 是商業軟體，Orange 是開源軟體"],"a":0,"e":"TPOT 的抽象層是「管線」——它把人的判斷**移出**流程；Orange 的抽象層是「資料流 ＋ 人」——它把人的判斷**放進**流程。一句話：TPOT 回答「最佳分數是多少」，Orange 回答「為什麼」。"},{"q":"為什麼說「TPOT 的搜尋空間上限 ＝ scikit-learn 的零件箱」？","o":["因為 TPOT 是用遺傳規劃在 scikit-learn 的管線空間裡搜尋，sklearn 沒有的零件它永遠搜不到","因為 TPOT 只能讀 scikit-learn 格式的資料","因為 TPOT 的授權跟 scikit-learn 綁在一起","因為 TPOT 只能呼叫 sklearn 的評分函式"],"a":0,"e":"這不是效能差異，是**可達性（reachability）**差異。Orange 有 sklearn 根本沒有的元件——**CN2 Rule Induction、Scoring Sheet、Nomogram、Paint Data**——這些 TPOT 從頭到尾不可能給你，因為搜尋空間再大，也搜不到不存在的東西。"},{"q":"Orange 的「Brush & Link（選取即資料）」最核心的意義是？","o":["可以用滑鼠把資料點拖曳到另一個視窗","選取會即時改變資料的型態","在圖上框選的結果會變成下游所有元件的輸入子集","可以把圖表匯出成高解析度圖片"],"a":2,"e":"Orange 會自動在資料上掛一個 `Selected` 欄位——**選取本身就變成了一種資料**。這是 TPOT 架構上做不到的：它的資料流是 `X → transformer → estimator → y`，中間**沒有任何節點**能接收「使用者剛剛框了這 12 個點」這個訊號。"},{"q":"用同樣的三份資料集跑 TPOT，結果大致是什麼？","o":["兩次與手寫模型打平、一次贏在雜訊範圍內","TPOT 每次都以明顯差距勝出手寫模型","TPOT 每次都以明顯差距輸給手寫模型","三次結果完全相同"],"a":0,"e":"房價：390 條管線、11.8 分鐘 → **打平**（p = 0.6932）；銀行：460 條管線 → **+0.0024 AUC**（在雜訊帶內）；無人機：361 秒 → **輸**給手寫 LogReg 0.0005。結論是「**限制在資料，不在工具**」。"},{"q":"「先跑 Orange 再跑 TPOT」最主要的效益是什麼？","o":["提升 TPOT 的 AUC","讓 TPOT 的搜尋速度變快","省下搜尋時間，並知道什麼時候該停","讓最終模型更容易解釋"],"a":2,"e":"**分數不會變好**（三次搜尋兩次打平、一次贏在雜訊內）——省的是時間：房價 11.8 分鐘、無人機 6 分鐘。Orange 幾秒就能告訴你「已經撞到雜訊底線，不用再搜」。另外要注意：Orange 的前處理**不會自動轉移到 TPOT**，搬運本身是有成本的。"},{"q":"Orange 唯一提供的命令列工具 `orange-canvas`，本質上是什麼？","o":["批次執行 `.ows` 工作流的工具","把工作流轉成 Python 程式碼的工具","模型部署用的 HTTP 伺服器","GUI 啟動器（需要 Qt）"],"a":3,"e":"`orange-canvas` 的完整參數表（`--no-discovery`／`--no-welcome`／`--log-level`／`--config`…）裡**沒有任何** `--no-gui`、`--batch`、`--headless`。它唯一的用途是「**用指定的設定把 GUI 開起來**」。"},{"q":"原稿的 Model 面板清單共有幾個元件？","o":["12","16","20","25"],"a":2,"e":"原稿 p8 標題就是 **`20 models`**，並編號列出 20 個（Constant 到 Load Model）。"},{"q":"下列哪一個「不是」原稿 20 個模型元件之一？","o":["Constant","kNN","Gradient Boosting","Box Plot"],"a":3,"e":"**Box Plot 是視覺化元件**（在 Visualize 面板），不在 Model 面板的 20 個模型清單裡。"},{"q":"Orange 官方把 Stochastic Gradient Descent 拼成了什麼？","o":["Stochastic Gradient Decent","Stochastic Gradient Decant","Stochastic Gradient Dessent","Stochastic Gradient Descent（完全正確）"],"a":0,"e":"這是 **Orange 官方介面自己的錯字**：第 17 個元件寫成 **`Decent`**（正確拼字是 **Descent**）。照著介面出題時答案就是 `Decent`。"},{"q":"SGD 元件設定面板中，`Number of iterations` 的預設值是？","o":["10","100","1000","10000"],"a":2,"e":"原稿 p9 的 SGD 截圖上，`Number of iterations` 是 **1000**；`Initial learning rate (η₀)` 是 **0.0100**、`Tolerance` 是 **0.0010**。"},{"q":"關於「不開 GUI 執行 Orange 工作流」，官方立場是什麼？","o":["已支援，加上 `--no-gui` 參數即可","標記為 wontfix，官方建議改用 Python 腳本","只有企業版支援","需要另外安裝外掛套件"],"a":1,"e":"維護者的原話是：「Running workflows without GUI is not expected behavior. Orange is designed as an interactive exploration tool. **For running scheduled workflows please use Python scripts.**」—— 官方指定的無頭路徑就是 `import Orange`。"},{"q":"Orange 的 Data 面板共有幾個元件？","o":["8","10","12","20"],"a":2,"e":"Widget Catalog 的 **Data 分類共 12 個**元件，排列是 **4 + 4 + 4**（匯入 4、檢視探索 4、處理輸出 4）。"},{"q":"下列哪一個元件屬於「資料匯入」那一排？","o":["Data Table","Paint Data","Save Data","SQL Table"],"a":3,"e":"第一排（匯入）是 **File、CSV File Import、Datasets、SQL Table**。Data Table／Paint Data 在第二排，Save Data 在第三排。"},{"q":"哪一個元件負責「修改欄位的型態與角色」，並且是設定 Target 的地方？","o":["Edit Domain","Data Info","Rank","Color"],"a":0,"e":"**`Edit Domain`** 修改各欄位的屬性定義（Numeric／Categorical／**Target**）。**沒有設 Target，監督式模型就跑不起來。**"},{"q":"若要看「整體摘要」（筆數／變數數／NaN 比例／型態分佈），應該用哪個元件？","o":["Data Table","Data Info","Column Statistics","Save Data"],"a":1,"e":"**`Data Info`** 是摘要儀表板：**N（Instances）／Var（Variables）／NaN／型態**。`Data Table` 看的是「每一筆」（微觀）。"},{"q":"哪一個元件可以「用滑鼠手畫資料點」，不需要真實資料集？","o":["Rank","File","Save Data","Paint Data"],"a":3,"e":"**`Paint Data`** 允許使用者用滑鼠在畫布上「畫出」資料點，是**唯一「憑空產生資料」**的元件，適合教學示範分類與分群。"},{"q":"原稿說本課程聚焦於哪一種學習方式？","o":["非監督學習","監督學習","強化學習","半監督學習"],"a":1,"e":"原稿 p11 的「本課程重點」卡片：聚焦於**監督學習**模型，使用**標記數據**進行訓練與預測。"},{"q":"下列哪一種學習方式「需要標記資料」？","o":["非監督學習","強化學習","監督學習","以上皆非"],"a":2,"e":"**監督學習**需要標籤（Target）；非監督學習找資料本身的結構；強化學習只有獎勵訊號。"},{"q":"在 Orange 裡，沒有設定哪個欄位角色就無法訓練分類模型？","o":["Meta","Feature","String","Target"],"a":3,"e":"**`Target`**（＝ class variable）是「要預測的那一欄」。設定 Target 的地方就是 **`Edit Domain`**，這是最常見的「模型元件一直報錯」原因。"},{"q":"「Constant 模型」在分類任務上會預測什麼？","o":["平均值","中位數","眾數（最多數類別）","最大值"],"a":2,"e":"原稿原文：分類任務 → 預測訓練集中**出現最多的類別（眾數）**；迴歸任務 → 預測**平均值（均值）**。"},{"q":"原稿說 Constant 模型最重要的用途是？","o":["提高準確率","建立基準線","加速訓練","降低維度"],"a":1,"e":"Constant 提供一條**基準線（Baseline）**，讓我們衡量其他模型是否真的從資料中學到有用的模式。**任何模型都應先與它比較。**"},{"q":"CN2 規則歸納法最主要的優點是？","o":["可解釋性強","預測速度最快","準確度最高","不需要資料"],"a":0,"e":"CN2 提取易懂的「如果—那麼」規則，**可解釋性強**，適合醫療診斷、信用評分等需要提供理由說明的場景。"},{"q":"CN2 規則集的最後一條通常是？","o":["IF TRUE THEN <最多數類別>","IF FALSE THEN …","沒有最後一條","一定是空規則"],"a":0,"e":"本機實測 iris 得到 15 條規則，最後一條是 **`IF TRUE THEN iris=Iris-versicolor`**——這就是「預設規則」，接住前面所有規則都沒命中的樣本。"},{"q":"原稿說 kNN 的缺點不包括下列哪一項？","o":["計算量大","對特徵縮放敏感","大數據集效率低","需要很長的訓練時間"],"a":3,"e":"kNN 是 **lazy learning：訓練幾乎為零**，代價移到**預測階段**（要跟全部訓練樣本算距離）。所以「訓練時間長」不是它的缺點。"},{"q":"用 Orange 的 Python API 交一對 train／test 給模型，`model(test)` 回傳什麼？","o":["一張含 actual／predicted 欄位的 Table","一個類別名稱的字串陣列","一個 numpy 的 int64 類別索引陣列","一個 dict（鍵是類別名、值是機率）"],"a":2,"e":"實測 `type(pred) = ndarray`、`pred.shape = (50,)`、`dtype = int64`。要拿類別名稱得自己查 `domain.class_var.values`；要機率必須另外傳 `ret=Model.Probs`。**它不會給你一張組好的報表。**"},{"q":"原稿說 kNN 的優點是？","o":["訓練時間長但精準","簡單直觀、無需訓練過程","可解釋性最高","能自動降維"],"a":1,"e":"原稿原文：**簡單直觀，無需訓練過程，即插即用。**"},{"q":"決策樹最主要的缺點是？","o":["無法處理非線性","完全無法可視化","訓練時間最長","容易過擬合、對數據細微變化敏感"],"a":3,"e":"原稿原文：**容易過擬合，對數據細微變化過於敏感。** 這正是「高變異數」，也是隨機森林存在的原因。"},{"q":"隨機森林的「兩層隨機」是指？","o":["資料隨機 + 特徵隨機","樹的深度隨機 + 學習率隨機","類別隨機 + 標籤隨機","權重隨機 + 閾值隨機"],"a":0,"e":"① **資料隨機**：bagging（有放回抽樣）；② **特徵隨機**：每次分割只從隨機 m 個特徵中挑最好的。第 ② 點才是「森林」的關鍵。"},{"q":"隨機森林在分類任務上是如何彙整結果的？","o":["取平均","投票","取最大值","取第一個模型的結果"],"a":1,"e":"原稿原文：通過**投票或平均**結果進行最終預測——**分類用投票**、**迴歸用平均**。"},{"q":"梯度提升（Gradient Boosting）每一輪主要在修正什麼？","o":["樣本權重","特徵數量","前一個模型的殘差誤差","學習率"],"a":2,"e":"原稿原文：逐步訓練弱學習器，每次**修正前一個模型的殘差誤差**。（調整**樣本權重**的是 AdaBoost。）"},{"q":"原稿說梯度提升的缺點是？","o":["精度不足","無法處理分類","訓練時間長且參數調整複雜","只能處理線性關係"],"a":2,"e":"原稿原文：**訓練時間長，參數調整複雜，需要豐富的調參經驗。** 它也是「效率速查」裡**訓練最慢**的那一項。"},{"q":"原稿標題「準確度 vs 可解釋性」暗示兩者的關係是？","o":["可以同時最大化","完全無關","可解釋性一定帶來高準確度","通常需要取捨"],"a":3,"e":"標題用的是 **vs**，表示這是一條**取捨線（trade-off）**。高準確的模型（神經網路／SVM／森林）通常難解釋；可解釋的（CN2／決策樹）通常犧牲一些準確度。"},{"q":"原稿的「效率速查」說「訓練最快」是哪一組？","o":["隨機森林與梯度提升","kNN 與 CN2 規則","決策樹與 SVM","神經網路與 PLS"],"a":1,"e":"原稿原文：**訓練最快 → kNN（無需訓練）、CN2 規則簡單收斂快。**"},{"q":"原稿的「效率速查」說「預測最快」是哪一組？","o":["梯度提升與隨機森林","神經網路與 SVM","kNN 與 PLS","決策樹與 CN2 規則"],"a":3,"e":"原稿原文：**預測最快 → 決策樹與 CN2 規則直接查找，即時輸出。** 注意 **kNN 是訓練最快、預測最慢**，兩者不同。"},{"q":"需要「解釋結果」時，原稿建議選？","o":["CN2 或決策樹","隨機森林或梯度提升","神經網路或 SVM","任意皆可"],"a":0,"e":"原稿原文：**需要解釋結果？→ CN2 或決策樹**（規則清晰，易於溝通）。"},{"q":"原稿的收尾結論是？","o":["梯度提升是萬能模型","沒有萬能模型，要依問題特性、數據規模與資源條件選擇","資料量越大模型一定越準","一定要用集成方法"],"a":1,"e":"原稿原文：**沒有萬能模型**——根據**問題特性、數據規模與資源條件**，選擇最適合的工具。"},{"q":"原稿說 SVM 的優點是？","o":["訓練速度最快","不需要任何參數","可自動處理缺失值","在高維空間中表現優異"],"a":3,"e":"原稿原文：**優點：在高維空間中表現優異**（靠 kernel trick）；**缺點：計算複雜，對大數據集較慢**（O(n²)～O(n³)）。"},{"q":"邏輯迴歸用什麼形狀的函數把輸出映射到 0–1 之間？","o":["直線","拋物線","S 形曲線（sigmoid）","階梯函數"],"a":2,"e":"原稿原文：用 **S 形曲線**將數據映射到 **0–1 之間的概率**。它其實是對 **log-odds 做線性迴歸**，所以叫「邏輯」迴歸。"},{"q":"樸素貝氏的「樸素」是指什麼假設？","o":["特徵相互獨立","資料必須常態分布","類別必須平衡","樣本數必須很大"],"a":0,"e":"原稿原文：基於貝葉斯定理，**假設特徵相互獨立**。這個假設讓聯合機率可以拆成連乘，所以**訓練極快**；但也因此在現實中不總是成立。"},{"q":"原稿說評分表（Scoring Sheet）的典型應用是？","o":["圖像辨識","語音辨識","信用評分模型與風險評估核貸","自然語言生成"],"a":2,"e":"原稿原文：典型應用是**信用評分模型、風險評估與核貸**。本機實測：它**只支援二元分類**（拿 3 類的 iris 會報 `Too many target variable values`）。"},{"q":"原稿說神經網絡的缺點是？","o":["只能處理線性關係","無法做分類","完全不可解釋所以沒人用","需要大量數據且計算成本高"],"a":3,"e":"原稿原文：**需要大量數據，計算成本高。** 本機實測也印證：在只有 150 筆的 iris 上，神經網路（0.9533）打不贏 kNN（0.9667）。"},{"q":"Constant 模型在迴歸任務上會預測什麼？","o":["平均值（均值）","最大值","最小值","中位數"],"a":0,"e":"原稿原文：迴歸任務 → 預測訓練集**所有樣本的平均值（均值）**。所以 Constant 其實就是「無條件猜最常見／最平均的答案」。"},{"q":"本機實測中，Constant 在 iris（3 類各 50 筆）上的 CA 是多少？","o":["0.5000","0.3333","0.2500","0.9667"],"a":1,"e":"Constant 永遠猜「最多數類別」，而 iris 三類各 50 筆 → 準確率 **50/150 = 0.3333**。這是辨認「模型有沒有真的學到東西」的門檻。"},{"q":"Constant 模型的 AUC 通常接近多少？","o":["0.5","0.8","1.0","0.0"],"a":0,"e":"**AUC = 0.5 就是「完全沒有鑑別力」的定義**。Constant 對每一筆都給同一個機率，排序上完全沒有資訊，所以 AUC 恆為 0.5。"},{"q":"原稿說「若複雜模型的準確率低於 Constant」代表？","o":["資料太少","這是正常現象","應該改用 Constant","該模型可能存在嚴重問題，需重新檢視訓練流程"],"a":3,"e":"原稿原文：若複雜模型的準確率低於 Constant，代表該模型可能**存在嚴重問題**，需要**重新檢視訓練流程**。Constant 就是你的除錯警報器。"},{"q":"在 Orange 中，Constant 元件的路徑是？","o":["Evaluate → Constant","Data → Constant","Model → Constant","Visualize → Constant"],"a":2,"e":"原稿原文：**元件路徑：Model → Constant**。它的輸出是 Classifier／Regressor，所以可以接 Evaluate 面板的 **Test and Score**。"},{"q":"Stacking 屬於哪一類策略？","o":["降維","正則化","整合學習（Ensemble Learning）","資料清洗"],"a":2,"e":"原稿原文：Stacking（堆疊學習）是一種**整合學習（Ensemble Learning）策略**，透過組合多個模型的智慧來提升整體預測效能。"},{"q":"Stacking 的兩層架構中，負責「整合所有基礎學習器輸出」的是？","o":["基礎學習器","元學習器","資料分割器","特徵選擇器"],"a":1,"e":"**基礎學習器（Base Learners）**各自預測；**元學習器（Meta Learner）**整合所有基礎學習器的輸出，做出最終決策。"},{"q":"原稿建議 Stacking 的元學習器使用？","o":["Logistic Regression","Random Forest","神經網路","Constant"],"a":0,"e":"原稿原文：選擇負責整合的元學習器（**建議使用 Logistic Regression**）。因為元學習器的任務是「對基礎預測做加權組合」，本質是簡單的線性問題。"},{"q":"Stacking 運作流程的第一步是？","o":["特徵堆疊","元學習器整合","資料分折（分成多個 Fold）","輸出預測"],"a":2,"e":"原稿四步：**① 資料分折 → ② 基礎學習器訓練 → ③ 特徵堆疊 → ④ 元學習器整合**。第一步就是分折。"},{"q":"Stacking 為什麼一定要「資料分折」？","o":["為了加快訓練","為了避免資料洩漏，讓元學習器看到誠實的預測","為了增加資料量","為了減少參數"],"a":1,"e":"若不使用 K 折交叉預測，基礎學習器在自己的訓練資料上幾乎完美，元學習器會看到「假的完美預測」而學會盲信 → **資料洩漏**，上線後崩盤。"},{"q":"Save Model 可將分類模型儲存成什麼格式？","o":[".pkcls",".tab",".csv",".ows"],"a":0,"e":"原稿原文：Save Model 可將模型儲存為 **`.pkcls`（分類）** 或 **`.pkreg`（迴歸）**。實質上就是 Python 的 **pickle** 檔。"},{"q":"Save Model 可將迴歸模型儲存成什麼格式？","o":[".pkcls",".xlsx",".basket",".pkreg"],"a":3,"e":"**`.pkreg`** 是迴歸模型（**pk** = pickle、**reg** = regression）。記法：**看到 `pk` 開頭就是模型**，`tab`／`csv` 是資料。"},{"q":"Load Model 元件的操作順序是？","o":["連接資料 → 拖入元件 → 選擇模型 → 查看預測","拖入元件 → 選擇模型 → 連接資料 → 查看預測","選擇模型 → 拖入元件 → 查看預測 → 連接資料","查看預測 → 選擇模型 → 拖入元件 → 連接資料"],"a":1,"e":"原稿四步：**① 拖入 Load Model 元件 → ② 點擊元件選擇模型檔（`.pkcls`／`.pkreg`）→ ③ 連接新資料集 → ④ 連接 Predictions 查看結果**。"},{"q":"原稿對 Load Model 的結論是？","o":["必須重新訓練","只能載入 .csv","只能用於迴歸","無需重新訓練，適合生產環境的實際應用"],"a":3,"e":"原稿原文：**無需重新訓練，節省時間，非常適合生產環境的實際應用！** 因為訓練要幾小時、推論只要幾毫秒。"},{"q":"原稿的 Windows 安裝建議中，想「靈活管理 Python 套件」時建議用？","o":["官方 .exe","Conda 安裝 Orange3","Docker","手動編譯原始碼"],"a":1,"e":"原稿原文：想靈活管理 Python 套件（例如同時用 scikit-learn、TensorFlow）→ **用 Conda 安裝 Orange3**，方便同其他 ML 套件共存。"}];

const LET = 'ABCD';
const KEY = 'orange-ai-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 20 || i === 40){
      const label = i === 0 ? '第一部分：Orange 平台與資料工具箱（1–20）'
                  : i === 20 ? '第二部分：機器學習模型（21–45）'
                  : '第三部分：Orange 模型元件與實作（46–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
}
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
