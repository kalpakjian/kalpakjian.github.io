<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《Deep Learning》導讀 MC 測驗（40 題）｜AI Tech Notes</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--txt:#1f2328;--dim:#5b636e;
  --blue:#2563eb;--green:#15803d;--green-bg:#e8f6ec;--red:#b91c1c;
  --red-bg:#fdeaea;--sel:#dbeafe;--sel-line:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);line-height:1.7;font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.topbar .row1{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.topbar .back{font-size:13px;color:var(--dim);text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;font-size:14px;color:var(--dim)}
.stats b{font-size:18px;color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px;color:var(--green);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--blue);
  border-radius:99px;transition:width .25s}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-size:13px;padding:6px 13px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;transition:.15s}
button:hover{border-color:#b9c0c9;background:#fbfbfc}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel);border-color:var(--sel-line);color:#1e40af;font-weight:600}
button.danger{color:var(--red);border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.navgrid button{padding:6px 0;font-size:13px;border-radius:7px;text-align:center}
.navgrid button.done{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.navgrid button.right{background:var(--green-bg);border-color:#a7d7b6;color:var(--green);font-weight:700}
.navgrid button.wrong{background:var(--red-bg);border-color:#eeb4b4;color:var(--red);font-weight:700}
main{max-width:900px;margin:0 auto;padding:20px 20px 80px}
.parttitle{margin:34px 0 14px;font-size:15px;font-weight:700;color:var(--dim)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin:0 0 14px}
.q.correct{border-color:#a7d7b6;box-shadow:0 0 0 2px var(--green-bg)}
.q.incorrect{border-color:#eeb4b4;box-shadow:0 0 0 2px var(--red-bg)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:#eef2ff;color:#3730a3;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qtext{margin:0;font-size:15.5px;font-weight:600}
.opts{list-style:none;margin:12px 0 0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.12s}
.opt:hover{border-color:#b9c0c9;background:#fbfbfc}
.opt .lt{flex:0 0 20px;font-weight:700;color:var(--dim)}
.opt.picked{border-color:var(--sel-line);background:var(--sel)}
.opt.right{border-color:#a7d7b6;background:var(--green-bg)}
.opt.wrong{border-color:#eeb4b4;background:var(--red-bg)}
.tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag.right{color:var(--green)}
.tag.wrong{color:var(--red)}
.expl{margin-top:10px;padding:10px 13px;background:#f6f8fa;border-left:4px solid var(--blue);
  border-radius:0 8px 8px 0;font-size:14px;color:#374151}
.empty{text-align:center;color:var(--dim);padding:40px 0;font-size:15px}
footer{max-width:900px;margin:0 auto;padding:0 20px 60px;color:var(--dim);font-size:12.5px}
</style>
</head>

  <div class="row1">
    <h1>《Deep Learning》導讀 MC 測驗（40 題）</h1>

const LET = 'ABCD';
const KEY = 'dlbook-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}
function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){ answered++; if(a === QUESTIONS[i].a) score++; }
  }
  return { answered:answered, score:score, wrong:answered-score };
}
function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s); let out = ''; let bold = false; let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold; out += bold ? '<b>' : '</b>'; i += 2;
    } else { out += s.charAt(i); i++; }
  }
  return out;
}
function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}
function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}
const PARTS = [[0, "第一部分：定位、線性代數、機率與資訊理論（1–14）"], [14, "第二部分：ML 基礎、前饋網路、正則化與最佳化（15–27）"], [27, "第三部分：卷積、序列、圖模型、推論與生成（28–40）"]];

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    for(let p=0;p<PARTS.length;p++){
      if(PARTS[p][0] === i){ html += '<div class="parttitle">' + PARTS[p][1] + '</div>'; }
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';
    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
      html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 40 題」。</div>';
  }
  box.innerHTML = html;
}
function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] =
      parseInt(opt.getAttribute('data-k'), 10);
    saveState(); renderAll(); return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});
function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}
function setFilter(f){ state.filter = f; syncFilterButtons(); saveState(); renderAll(); }
function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}
loadState(); syncFilterButtons(); renderAll(); bind();



</script>
