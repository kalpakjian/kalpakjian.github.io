<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470"
     width="1200" height="470" role="img"
     aria-label="四個 OCR 引擎實測：PaddleOCR 683 字、Surya 734 字、RapidOCR 514 字、Tesseract 771 字但關鍵詞 0、EasyOCR 直排失敗">
  <title>OCR 引擎實測比較</title>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#141428" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#07070f" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="470" fill="#07070f"/>
  <rect width="1200" height="470" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="470" fill="url(#fade)"/>

  <text x="56" y="72" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="4"
        fill="#ff2bd6" filter="url(#softglow)">BENCHMARK / SAME PAGE</text>
  <text x="56" y="112" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="32" font-weight="800"
        fill="#e8eaff">同一頁、四引擎：召回字數與速度</text>
  <text x="56" y="144" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="12.5" fill="#8b8fb3">
    召回字數僅供參考；Tesseract 字數高但全是亂碼（關鍵詞命中 0）
  </text>

  <g>
  <g>
    <text x="56" y="168" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700"
          fill="#e8eaff">PaddleOCR</text>
    <text x="56" y="186" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8b8fb3">chinese_cht</text>

    <rect x="250" y="154" width="700" height="20" rx="10" fill="#12121f"/>
    <rect x="250" y="154" width="597.6" height="20" rx="10" fill="#34d399"
          opacity="0.28"/>
    <rect x="250" y="154" width="597.6" height="20" rx="10" fill="none"
          stroke="#34d399" stroke-width="1.6" filter="url(#softglow)"/>
    <text x="966" y="169" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="13"
          fill="#34d399">683 字</text>
    <text x="1042" y="169" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12"
          fill="#8b8fb3">1.1 s</text>
    <text x="1102" y="169" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="12"
          fill="#34d399">召回最高</text>
  </g>
  <g>
    <text x="56" y="226" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700"
          fill="#e8eaff">Surya 0.22</text>
    <text x="56" y="244" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8b8fb3">GGUF/llama.cpp</text>

    <rect x="250" y="212" width="700" height="20" rx="10" fill="#12121f"/>
    <rect x="250" y="212" width="642.2" height="20" rx="10" fill="#22d3ee"
          opacity="0.28"/>
    <rect x="250" y="212" width="642.2" height="20" rx="10" fill="none"
          stroke="#22d3ee" stroke-width="1.6" filter="url(#softglow)"/>
    <text x="966" y="227" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="13"
          fill="#22d3ee">734 字</text>
    <text x="1042" y="227" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12"
          fill="#8b8fb3">4–9 s</text>
    <text x="1102" y="227" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="12"
          fill="#22d3ee">順序最好</text>
  </g>
  <g>
    <text x="56" y="284" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700"
          fill="#e8eaff">RapidOCR</text>
    <text x="56" y="302" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8b8fb3">PP-OCRv6</text>

    <rect x="250" y="270" width="700" height="20" rx="10" fill="#12121f"/>
    <rect x="250" y="270" width="449.8" height="20" rx="10" fill="#a78bfa"
          opacity="0.28"/>
    <rect x="250" y="270" width="449.8" height="20" rx="10" fill="none"
          stroke="#a78bfa" stroke-width="1.6" filter="url(#softglow)"/>
    <text x="966" y="285" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="13"
          fill="#a78bfa">514 字</text>
    <text x="1042" y="285" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12"
          fill="#8b8fb3">0.6 s</text>
    <text x="1102" y="285" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="12"
          fill="#a78bfa">最快</text>
  </g>
  <g>
    <text x="56" y="342" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700"
          fill="#e8eaff">Tesseract 5</text>
    <text x="56" y="360" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8b8fb3">chi_tra_vert</text>

    <rect x="250" y="328" width="700" height="20" rx="10" fill="#12121f"/>
    <rect x="250" y="328" width="35.0" height="20" rx="10" fill="#fb7185"
          opacity="0.28"/>
    <rect x="250" y="328" width="35.0" height="20" rx="10" fill="none"
          stroke="#fb7185" stroke-width="1.6" filter="url(#softglow)"/>
    <text x="966" y="343" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="13"
          fill="#fb7185">771 字</text>
    <text x="1042" y="343" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12"
          fill="#8b8fb3">3.2 s</text>
    <text x="1102" y="343" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="12"
          fill="#fb7185">亂碼·有效 0</text>
  </g>
  <g>
    <text x="56" y="400" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700"
          fill="#e8eaff">EasyOCR</text>
    <text x="56" y="418" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8b8fb3">ch_tra</text>

    <rect x="250" y="386" width="700" height="20" rx="10" fill="#12121f"/>
    <rect x="250" y="386" width="6.0" height="20" rx="10" fill="#fb7185"
          opacity="0.28"/>
    <rect x="250" y="386" width="6.0" height="20" rx="10" fill="none"
          stroke="#fb7185" stroke-width="1.6" filter="url(#softglow)"/>
    <text x="966" y="401" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="13"
          fill="#fb7185">0 字</text>
    <text x="1042" y="401" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12"
          fill="#8b8fb3">—</text>
    <text x="1102" y="401" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="12"
          fill="#fb7185">直排失敗</text>
  </g>
  </g>

  <line x1="56" y1="416" x2="1144" y2="416" stroke="#141428" stroke-width="1"/>
  <text x="56" y="444" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8b8fb3">
    RTX 4090 24GB · 直排雙欄 · 手機翻拍 · 關鍵詞 5 個
  </text>
  <text x="1144" y="444" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" fill="#fbbf24"
        text-anchor="end">Paddle 召回 + Surya 順序 = 互補</text>
</svg>
