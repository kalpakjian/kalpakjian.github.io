<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"
     width="1200" height="500" role="img"
     aria-label="OCR 工作流：影像輸入、三引擎並跑、合併補漏、兩層校對、人工確認">
  <title>OCR 工作流</title>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#141428" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#07070f" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="#07070f"/>
  <rect width="1200" height="500" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="500" fill="url(#fade)"/>

  <text x="56" y="86" font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="4"
