<svg viewBox="0 0 800 1150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold">CNNs for Image Classification: Technical Architecture</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#555">Convolutional Neural Networks Overview</text>

  <rect x="50" y="90" width="700" height="120" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="115" text-anchor="middle" font-size="16" font-weight="bold">Motivation &amp; Key Characteristics</text>

  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold">Local Connectivity</text>
    <text x="100" y="45" text-anchor="middle" font-size="10">Exploits spatial locality</text>
  </g>

  <g transform="translate(290, 130)">
    <rect x="0" y="0" width="220" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="110" y="25" text-anchor="middle" font-size="12" font-weight="bold">Parameter Sharing</text>
    <text x="110" y="45" text-anchor="middle" font-size="10">Reduces model complexity</text>
  </g>

  <g transform="translate(530, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold">Hierarchical Features</text>
    <text x="100" y="45" text-anchor="middle" font-size="10">Edges to shapes to objects</text>
  </g>

  <line x1="400" y1="210" x2="400" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="240" width="700" height="140" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="265" text-anchor="middle" font-size="16" font-weight="bold">Core Operations Pipeline</text>

  <rect x="100" y="280" width="600" height="80" fill="#fff" stroke="#000" stroke-width="1.5" />

  <g transform="translate(120, 290)">
    <text x="0" y="20" font-size="14" font-weight="bold">Standard CNN Layer Sequence</text>
    <line x1="0" y1="30" x2="560" y2="30" stroke="#ddd" stroke-width="1" />

    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11">Convolution (Filters)</text>
    </g>

    <g transform="translate(195, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11">ReLU Activation</text>
    </g>

    <g transform="translate(390, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11">Pooling (Down-sample)</text>
    </g>
  </g>

  <line x1="400" y1="380" x2="400" y2="410" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="410" width="700" height="420" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="435" text-anchor="middle" font-size="16" font-weight="bold">Network Architecture (Forward Pass)</text>

  <g transform="translate(70, 460)">
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold">Inputs</text>
    <rect x="0" y="0" width="160" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <rect x="20" y="40" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="65" text-anchor="middle" font-size="11">Input Image</text>
    <text x="80" y="80" text-anchor="middle" font-size="10">(H x W x Channels)</text>

    <rect x="20" y="120" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="145" text-anchor="middle" font-size="11">Filter Weights</text>
    <text x="80" y="160" text-anchor="middle" font-size="10">(Learnable Kernels)</text>

    <rect x="20" y="200" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="225" text-anchor="middle" font-size="11">Hyperparameters</text>
    <text x="80" y="240" text-anchor="middle" font-size="10">(Stride, Padding)</text>
  </g>

  <line x1="230" y1="630" x2="260" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <g transform="translate(260, 460)">
    <text x="140" y="-10" text-anchor="middle" font-size="14" font-weight="bold">Layer Modules</text>
    <rect x="0" y="0" width="280" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold">Convolution Layer</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11">Filter Application</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11">Weighted Sum + Bias</text>
    </g>

    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold">Activation Layer</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11">ReLU Function</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11">f(x) = max(0,x)</text>
    </g>

    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold">Pooling Layer</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11">Max Pooling</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11">Down-sampling</text>
    </g>

    <line x1="120" y1="100" x2="120" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <line x1="120" y1="200" x2="120" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <line x1="540" y1="630" x2="570" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <g transform="translate(570, 460)">
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold">Outputs</text>
    <rect x="0" y="0" width="160" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <rect x="20" y="100" width="120" height="60" fill="#fff" stroke="#000" />
    <text x="80" y="125" text-anchor="middle" font-size="11">Feature Maps</text>
    <text x="80" y="145" text-anchor="middle" font-size="11">(H x W x Depth)</text>

    <rect x="20" y="180" width="120" height="60" fill="#fff" stroke="#000" />
    <text x="80" y="205" text-anchor="middle" font-size="11">Class Predictions</text>
    <text x="80" y="225" text-anchor="middle" font-size="11">(Softmax / Logits)</text>
  </g>

  <line x1="400" y1="830" x2="400" y2="860" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="860" width="700" height="180" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="885" text-anchor="middle" font-size="16" font-weight="bold">Training Protocol &amp; Key Properties</text>

  <g transform="translate(100, 900)">
    <rect x="0" y="0" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="25" font-size="12" font-weight="bold">Training:</text>
    <text x="100" y="25" font-size="12">Supervised learning with image data; learn filter weights via backpropagation</text>

    <rect x="0" y="50" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="75" font-size="12" font-weight="bold">Properties:</text>
    <text x="100" y="75" font-size="12">Local connectivity, parameter sharing, stride-based downsampling, receptive fields</text>

    <rect x="0" y="100" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="125" font-size="12" font-weight="bold">Implementation:</text>
    <text x="100" y="125" font-size="12">tf.keras.layers.Conv2D, ReLU activation, MaxPool2D(pool_size, strides)</text>
  </g>

  <line x1="400" y1="1040" x2="400" y2="1070" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="150" y="1070" width="500" height="50" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="400" y="1100" text-anchor="middle" font-size="14" font-weight="bold">Conclusion: Hierarchical Feature Learning for Scalable Classification</text>
</svg>