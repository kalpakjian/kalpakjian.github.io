<svg viewBox="0 0 800 1150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Multimodal Segmentation: Technical Roadmap
  </text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#555" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Cross-Attention Fusion with Contrastive Learning
  </text>

  <rect x="50" y="90" width="700" height="120" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="115" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Input Modalities
  </text>

  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Image Input</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">RGB / Multi-spectral Data</text>
  </g>

  <g transform="translate(290, 130)">
    <rect x="0" y="0" width="220" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="110" y="25" text-anchor="middle" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Text / Auxiliary Input</text>
    <text x="110" y="45" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Class Labels / Descriptions</text>
  </g>

  <g transform="translate(530, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Ground Truth</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Segmentation Masks</text>
  </g>

  <line x1="400" y1="210" x2="400" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="240" width="700" height="140" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="265" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Feature Extraction (Encoder Stage)
  </text>

  <rect x="100" y="280" width="600" height="80" fill="#fff" stroke="#000" stroke-width="1.5" />

  <g transform="translate(120, 290)">
    <text x="0" y="20" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Dual Encoder Architecture</text>
    <line x1="0" y1="30" x2="560" y2="30" stroke="#ddd" stroke-width="1" />

    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Image Encoder</text>
    </g>

    <g transform="translate(195, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Text Encoder</text>
    </g>

    <g transform="translate(390, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Feature Maps</text>
    </g>
  </g>

  <line x1="400" y1="380" x2="400" y2="410" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="410" width="700" height="420" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="435" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Cross-Modal Fusion Architecture
  </text>

  <g transform="translate(70, 460)">
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Image Features</text>
    <rect x="0" y="0" width="160" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <rect x="20" y="40" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="65" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Spatial Features</text>
    <text x="80" y="80" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">(H x W x C)</text>

    <rect x="20" y="120" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="145" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Patch Embeddings</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">(N x D)</text>

    <rect x="20" y="200" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="225" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Query Vectors</text>
    <text x="80" y="240" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">(Learnable)</text>
  </g>

  <line x1="230" y1="630" x2="260" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <g transform="translate(260, 460)">
    <text x="140" y="-10" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Fusion Modules</text>
    <rect x="0" y="0" width="280" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Cross-Attention Layer</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Image as Query</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Text as Key/Value</text>
    </g>

    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Self-Attention Refinement</text>

      <rect x="10" y="35" width="65" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="42.5" y="57" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Multi-Head</text>

      <rect x="87.5" y="35" width="65" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="120" y="57" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">FFN</text>

      <rect x="165" y="35" width="65" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="197.5" y="57" text-anchor="middle" font-size="10" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">LayerNorm</text>
    </g>

    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Feature Alignment</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Projection Head</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Normalization</text>
    </g>

    <line x1="120" y1="100" x2="120" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <line x1="120" y1="200" x2="120" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <line x1="540" y1="630" x2="570" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <g transform="translate(570, 460)">
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Output</text>
    <rect x="0" y="0" width="160" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <rect x="20" y="100" width="120" height="60" fill="#fff" stroke="#000" />
    <text x="80" y="125" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Fused Features</text>
    <text x="80" y="145" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">(Aligned)</text>

    <rect x="20" y="180" width="120" height="60" fill="#fff" stroke="#000" />
    <text x="80" y="205" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Decoder Input</text>
    <text x="80" y="225" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">(H x W x C)</text>
  </g>

  <line x1="400" y1="830" x2="400" y2="860" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="860" width="700" height="180" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="885" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Segmentation Head &amp; Loss Functions
  </text>

  <g transform="translate(100, 900)">
    <rect x="0" y="0" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="25" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Decoder:</text>
    <text x="100" y="25" font-size="12" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Progressive Upsampling with Skip Connections</text>

    <rect x="0" y="50" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="75" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Contrastive Loss:</text>
    <text x="140" y="75" font-size="12" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">InfoNCE / Supervised Contrastive for Cross-Modal Alignment</text>

    <rect x="0" y="100" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="125" font-size="12" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Segmentation Loss:</text>
    <text x="150" y="125" font-size="12" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">Dice Loss + Cross-Entropy for Mask Prediction</text>
  </g>

  <line x1="400" y1="1040" x2="400" y2="1070" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="150" y="1070" width="500" height="50" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="400" y="1100" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Microsoft YaHei, SimHei, SimSun, sans-serif">
    Output: Pixel-wise Segmentation Masks
  </text>
</svg>