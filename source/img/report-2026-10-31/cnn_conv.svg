<svg viewBox="0 0 800 1150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    CNN Convolution: Technical Roadmap
  </text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#555" font-family="Arial, Helvetica, sans-serif">
    Core Principles of Convolutional Neural Networks
  </text>

  <rect x="50" y="90" width="700" height="120" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="115" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    Core Properties
  </text>

  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Weight Sharing</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">Same kernel reused spatially</text>
  </g>

  <g transform="translate(290, 130)">
    <rect x="0" y="0" width="220" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="110" y="25" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Local Connectivity</text>
    <text x="110" y="45" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">Small receptive field per neuron</text>
  </g>

  <g transform="translate(530, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Parameter Efficiency</text>
    <text x="100" y="45" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">Drastically reduced parameters</text>
  </g>

  <line x1="400" y1="210" x2="400" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="240" width="700" height="140" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="265" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    Convolution Operation
  </text>

  <rect x="100" y="280" width="600" height="80" fill="#fff" stroke="#000" stroke-width="1.5" />

  <g transform="translate(120, 290)">
    <text x="0" y="20" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">3x3 Kernel Sliding Over Input Image</text>
    <line x1="0" y1="30" x2="560" y2="30" stroke="#ddd" stroke-width="1" />

    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Element-wise Product</text>
    </g>

    <g transform="translate(195, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Sum to Single Value</text>
    </g>

    <g transform="translate(390, 45)">
      <rect x="0" y="0" width="170" height="30" fill="#f9f9f9" stroke="#333" />
      <text x="85" y="20" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Output Feature Map</text>
    </g>
  </g>

  <line x1="400" y1="380" x2="400" y2="410" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="410" width="700" height="420" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="435" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    Architecture Components
  </text>

  <g transform="translate(70, 460)">
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Hyperparameters</text>
    <rect x="0" y="0" width="160" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <rect x="20" y="40" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="65" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Stride</text>
    <text x="80" y="80" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">(Step size)</text>

    <rect x="20" y="120" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="145" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Padding</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">(Border handling)</text>

    <rect x="20" y="200" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="225" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Kernel Size</text>
    <text x="80" y="240" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">(e.g., 3x3)</text>

    <rect x="20" y="280" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="305" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Channels</text>
    <text x="80" y="320" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">(Feature maps)</text>
  </g>

  <line x1="230" y1="630" x2="260" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <g transform="translate(260, 460)">
    <text x="140" y="-10" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Layer Operations</text>
    <rect x="0" y="0" width="280" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Convolution Layer</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Feature Extraction</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Learnable Filters</text>
    </g>

    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Pooling Layer</text>

      <rect x="10" y="35" width="65" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="42.5" y="57" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">Max Pool</text>

      <rect x="87.5" y="35" width="65" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="120" y="57" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">Avg Pool</text>

      <rect x="165" y="35" width="65" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="197.5" y="57" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif">Downsample</text>
    </g>

    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="240" height="80" fill="#fff" stroke="#000" />
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Stacking &amp; Depth</text>

      <rect x="10" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="62.5" y="57" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Receptive Field</text>

      <rect x="125" y="35" width="105" height="35" fill="#f0f0f0" stroke="#333" />
      <text x="177.5" y="57" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Hierarchical Features</text>
    </g>

    <line x1="120" y1="100" x2="120" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <line x1="120" y1="200" x2="120" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <line x1="540" y1="630" x2="570" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <g transform="translate(570, 460)">
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Effects</text>
    <rect x="0" y="0" width="160" height="340" fill="none" stroke="#666" stroke-dasharray="4,4" />

    <rect x="20" y="80" width="120" height="60" fill="#fff" stroke="#000" />
    <text x="80" y="105" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Spatial Resolution</text>
    <text x="80" y="125" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Decreases</text>

    <rect x="20" y="180" width="120" height="60" fill="#fff" stroke="#000" />
    <text x="80" y="205" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Channel Depth</text>
    <text x="80" y="225" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Increases</text>

    <rect x="20" y="280" width="120" height="50" fill="#fff" stroke="#000" />
    <text x="80" y="305" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif">Translation Invariance</text>
  </g>

  <line x1="400" y1="830" x2="400" y2="860" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="50" y="860" width="700" height="180" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8,8" />
  <text x="400" y="885" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    Key Characteristics &amp; Benefits
  </text>

  <g transform="translate(100, 900)">
    <rect x="0" y="0" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="25" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Hierarchical Feature Learning:</text>
    <text x="220" y="25" font-size="12" font-family="Arial, Helvetica, sans-serif">Edges → Textures → Patterns → Objects</text>

    <rect x="0" y="50" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="75" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Parameter Sharing:</text>
    <text x="150" y="75" font-size="12" font-family="Arial, Helvetica, sans-serif">Same weights applied across all spatial positions</text>

    <rect x="0" y="100" width="600" height="40" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
    <text x="20" y="125" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Equivariance:</text>
    <text x="120" y="125" font-size="12" font-family="Arial, Helvetica, sans-serif">Preserves spatial relationships through learned representations</text>
  </g>

  <line x1="400" y1="1040" x2="400" y2="1070" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="150" y="1070" width="500" height="50" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="400" y="1100" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    Conclusion: Efficient Hierarchical Visual Representation Learning
  </text>

</svg>