<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{

a{color:var(--blue)}

.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{

  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}

機率"],"a":3,"e":"Softmax **輸出各類別機率**。"},{"q":"ReLU 的作用是？","o":["加入非線性（負值歸零）","降低解析度","輸出機率","卷積運算"],"a":0,"e":"ReLU **加入非線性（負值歸零）**。"},{"q":"下列何者「不是」CNN 的三大特性？","o":["局部連接","參數共享","無需任何資料即可訓練","平移不變性"],"a":2,"e":"「無需任何資料即可訓練」不是 CNN 特性。"},{"q":"「平移不變性（translation invariance）」的意思是？","o":["圖片不能移動","物件左右移動仍能辨識","只能辨識中心物件","需要固定座標"],"a":1,"e":"物件**移動仍能辨識**。"},{"q":"「局部連接（local connectivity）」的意思是？","o":["只看整張圖的平均值","只看最亮的像素","隨機選像素","卷積只看鄰近區域"],"a":3,"e":"卷積**只看鄰近區域**。"},{"q":"CNN 的關鍵思想（Key idea）是？","o":["隨機初始化","參數重用（re-use parameters）","刪除所有參數","每個位置換一組權重"],"a":1,"e":"關鍵思想是**參數重用（re-use parameters）**。"},{"q":"「Convolution shares parameters」的意思是？","o":["每個像素都有專屬權重","參數會被刪除","參數每次隨機改變","同一組權重在全圖共用"],"a":3,"e":"**同一組權重在全圖共用**。"},{"q":"5×5 影像做 3×3 卷積（stride 1、無 padding）的輸出尺寸是？","o":["3×3","5×5","2×2","1×1"],"a":0,"e":"(5−3)/1+1 = 3 → **3×3**。"},{"q":"卷積核（kernel）又常被稱作？","o":["Cache","Buffer","Filter","Index"],"a":2,"e":"卷積核又稱 **filter**。"},{"q":"卷積輸出邊長的公式（無 padding）是？","o":["`W + K + S`","`(W − K) / S + 1`","`W × K`","`W / K − 1`"],"a":1,"e":"輸出邊長 = **`(W − K) / S + 1`**。"},{"q":"卷積層相對全連接層的主要優勢是？","o":["參數更多","完全不需要訓練","無法處理影像","參數共享且保留空間關係"],"a":3,"e":"**參數共享且保留空間關係**。"},{"q":"「參數共享」帶來的好處之一是？","o":["參數大幅減少，不易過擬合","一定達到 100% 準確率","完全不需要資料","不需要激活函數"],"a":0,"e":"**參數大幅減少，不易過擬合**。"},{"q":"卷積核在影像上做什麼動作？","o":["隨機跳躍","只在中心計算一次","逐格滑動並做加權求和","只做旋轉"],"a":2,"e":"**逐格滑動並做加權求和**。"},{"q":"卷積中的「stride」指的是？","o":["卷積核的大小","卷積核每次移動的步長","圖片的張數","通道數"],"a":1,"e":"stride ＝ **每次移動的步長**。"},{"q":"卷積中的「padding」指的是？","o":["刪除邊緣像素","增加卷積核大小","改變步長","在影像邊緣補值（常補 0）"],"a":3,"e":"padding ＝ **在邊緣補值（常補 0）**。"},{"q":"CNN 學到的特徵，其階層順序通常是？","o":["邊緣 → 紋理 → 部件 → 物件","物件 → 部件 → 紋理 → 邊緣","隨機順序","只有顏色"],"a":0,"e":"**邊緣 → 紋理 → 部件 → 物件**。"},{"q":"為什麼卷積特別適合影像資料？","o":["因為影像很小","因為影像沒有規律","因為影像具局部相關性，且卷積具平移不變性","因為卷積不需要計算"],"a":2,"e":"影像具**局部相關性**，卷積具**平移不變性**。"},{"q":"一個 3×3 卷積核（單通道）有多少個權重（不含 bias）？","o":["3","9","6","27"],"a":1,"e":"3×3 = **9** 個權重。"},{"q":"CNN「自動學習特徵」代表？","o":["需要人工設計每個特徵","完全不需要資料","只能辨識顏色","不需 const LET = 'ABCD';
const KEY = 'cv-intro-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 20 || i === 40){
      const label = i === 0 ? '第一部分：電腦視覺與商業應用（1–20）'
                  : i === 20 ? '第二部分：CNN 定義與架構（21–40）'
                  : '第三部分：卷積、參數重用與綜合（41–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
      html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
