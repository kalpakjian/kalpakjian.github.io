<script>
const QUESTIONS = [{"q":"線性迴歸的一句話定義是什麼？","o":["用一條曲線穿過每一個資料點","證明兩件事之間的因果關係","用一條直線描述兩件事的整體關係，並估計可能的結果","把資料分成兩群後各自取平均"],"a":2,"e":"課程的定義句：**用一條直線，描述兩件事的整體關係，並估計可能的結果**。三個關鍵字是「一條直線」「整體關係」「估計」。"},{"q":"課程在描述生活例子時都加上「通常」，最主要的目的為何？","o":["強調直線描述的是整體趨勢，個別情況仍會不同","表示這條線完全沒有參考價值","提醒讀者資料一定服從直線","說明模型只能用在氣溫與冰淇淋"],"a":0,"e":"「通常」保留了例外：有人讀得少卻考得好，有人讀得多卻失常。直線描述**整體**，不是每個人。"},{"q":"課程用來當主線例子的搭配是哪一組？","o":["x：考試分數 → y：讀書時數","x：冰淇淋銷量 → y：氣溫","x：考試分數 → y：冰淇淋銷量","x：讀書時數 → y：考試分數"],"a":3,"e":"課程把**讀書時數**當輸入、**考試分數**當輸出，因為它可量化、有直覺，又能說明個別差異。"},{"q":"「直線只是簡化的描述方式」這句話的意思是？","o":["所有生活關係都必須是完美的直線","生活中的關係不一定完全筆直，直線是方便的近似","只要畫得出直線就代表模型正確","直線比曲線更難計算"],"a":1,"e":"課程提醒：生活中的關係不一定完全筆直，直線只是**簡化**的描述方式。"},{"q":"「趨勢 ≠ 定律」在課程裡的用意是什麼？","o":["趨勢就是定律，只是說法不同","定律比趨勢更不準","趨勢只能用在自然科學","直線給的是趨勢，不保證每一次預測都準"],"a":3,"e":"趨勢是整體走向，定律是必然規律。線性迴歸給的是前者。"},{"q":"在 y = ax + b 中，a 代表什麼角色？","o":["截距","斜率","輸入","輸出"],"a":1,"e":"課程的記號：**a 是斜率**（每增加一單位輸入，預測結果改變多少）。"},{"q":"在 y = ax + b 中，b 代表什麼角色？","o":["截距","斜率","預測值","自變數"],"a":0,"e":"**b 是截距**：輸入為零時，直線上的預測結果。"},{"q":"課程如何定義「輸入」x？","o":["我們想預測的結果","模型學到的參數","我們已知、能掌握的資料","資料點與直線之間的差距"],"a":2,"e":"輸入是**已知、能掌握**的那一半，例如讀書時數 —— 必須事先取得才有意義。"},{"q":"課程如何定義「輸出」y？","o":["我們已知的資料","我們想預測的結果","模型的斜率","資料的筆數"],"a":1,"e":"輸出是模型算出來的結果。課程特別強調：**y 是模型產生的預測，不是實際發生的結果**。"},{"q":"課程為求簡潔，直接用哪個字母代表「模型的預測結果」？","o":["x","a","n","y"],"a":3,"e":"課程直接寫 y；嚴謹的統計記號會寫 **ŷ（y-hat）**，以便與實際觀察值區分。只有殘差那張圖同時出現兩者。"},{"q":"教科書常見寫法 y = mx + c 中，斜率是哪一個字母？","o":["c","y","m","x"],"a":2,"e":"同一件事、不同字母：本課程斜率是 **a**，常見教科書寫 **m**（截距則是 c，對應本課程的 b）。"},{"q":"「自變數（independent variable）」對應課程的哪一個角色？","o":["輸入 x","輸出 y","斜率 a","截距 b"],"a":0,"e":"自變數是拿來解釋或預測的資料 → 就是**輸入 x**（例如讀書時數）。"},{"q":"「應變數（dependent variable）」對應課程的哪一個角色？","o":["輸出 y","輸入 x","殘差","截距 b"],"a":0,"e":"應變數是我們想了解的結果 → 就是**輸出 y**（例如考試分數）。"},{"q":"固定同一個模型、只改變輸入 x，直線上會發生什麼事？","o":["整條直線被換成另一條","斜率 a 會跟著改變","沿著同一條直線移動到另一個點","截距 b 會跟著改變"],"a":2,"e":"**改 x 是在模型裡移動**（a、b 不變）；改 a 或 b 才是換模型。"},{"q":"改變斜率 a 或截距 b，模型會發生什麼事？","o":["只是同一條線上的點換位置","整條直線換成另一條（等於換了一個模型）","模型的輸入 x 會改變","資料筆數會增加"],"a":1,"e":"課程用「旋鈕」比喻：調整 a 或 b，得到的是**不同的直線** —— 這時變的是整個模型。"},{"q":"課程說「光靠一條直線，還不能證明誰造成誰」，對應哪一個觀念？","o":["外推的風險","彎曲關係別硬套","殘差一定為零","相關不等於因果"],"a":3,"e":"模型只描述「一起變動」的數學關係，不負責解釋背後機制 —— 這正是**相關不等於因果**。"},{"q":"課程用哪一句話定義斜率？","o":["x 為零時 y 是多少","y 除以資料筆數","資料點與直線的垂直距離","x 加 1，y 會變多少"],"a":3,"e":"課程的說法：**x 加 1，y 會變多少** —— 也就是變化率。"},{"q":"當 a > 0 時，直線的走向是？","o":["由左下往右上","由左上往右下","水平線","垂直線"],"a":0,"e":"a > 0 代表 x 增加時 y 上升，圖上是**由左下往右上**的直線。"},{"q":"當 a = 0 時，圖形呈現什麼樣子？","o":["一條通過原點的垂直線","由左上往右下的斜線","一條通過 b 的水平線","由左下往右上的斜線"],"a":2,"e":"a = 0 時 x 增加而預測 y 不變 → 圖上是一條**水平線**，高度就是截距 b。"},{"q":"「|a| 越大」代表什麼？","o":["直線越平緩","直線越陡","直線越短","截距越大"],"a":1,"e":"課程原文：**|a| 越大，直線越陡**。注意是絕對值 —— 符號管方向、大小管陡度。"},{"q":"a = 5 與 a = −5 兩條直線的差別是什麼？","o":["陡度與方向都相同","陡度不同，方向相同","陡度相同，但方向相反","兩者完全無法比較"],"a":2,"e":"絕對值相同 → 陡度相同；正負號相反 → 方向相反（一升一降）。"},{"q":"課程提醒「a 為零」時，最正確的解讀是哪一個？","o":["這個線性模型的預測不隨 x 改變","現實中兩件事完全沒有關係","資料一定有錯","模型一定過擬合"],"a":0,"e":"a = 0 只說明**這個線性模型**的預測不變；現實中可能只是關係不是直線，或這批資料看不出趨勢。"},{"q":"課程如何定義截距 b？","o":["x = 1 時的斜率","y 的最大值","資料點的平均值","x = 0 時的起點"],"a":3,"e":"課程的說法：**b 是截距：x = 0 時的起點**。"},{"q":"把 x = 0 代進 y = ax + b，會得到什麼？","o":["y = a","y = b","y = 0","y = a + b"],"a":1,"e":"x = 0 時 ax 這一項消失，只剩 b —— 這就是「起點」的來源。"},{"q":"改變 b 對整條直線的影響是什麼？","o":["整條線改變角度，截距不變","只有第一個資料點會移動","直線會變成曲線","整條線上下平移，斜率 a 不變"],"a":3,"e":"課程用左右兩格圖對比：改變 b 是**整條線上下平移**，並以雙向箭頭註明「a 不變」。"},{"q":"在課程的讀書例子中，b 可以想成什麼？","o":["每多讀一小時增加的分數","沒讀書時，模型預測的基本分","考試的最高分","全班平均分數"],"a":1,"e":"b = 50 就是「不讀書的預測基本分」；斜率 a = 5 才是「每多讀 1 小時多幾分」。"},{"q":"如果資料只涵蓋 x = 3 到 x = 8，b 該怎麼解讀？","o":["只是把直線往左延伸後的數學交點","就是真實的基本分","等於資料裡最小的 y","無法計算"],"a":0,"e":"課程的警告：**若資料沒有涵蓋 x = 0，截距可能只是數學上的交點**，不宜解讀成真實的基本分。"},{"q":"課程提醒「不宜把 b 解讀成真實基本分」的前提是什麼？","o":["資料筆數太少","斜率是負的","資料沒有涵蓋 x = 0","y 的單位不是分數"],"a":2,"e":"判斷關鍵只有一個：**資料是否涵蓋 x = 0**。有涵蓋才有實際觀察支撐。"},{"q":"課程用文字讀法描述 y = ax + b，讀法是什麼？","o":["y = 輸入 x + 變化率 a × 起點 b","y = 起點 b + 變化率 a × 輸入 x","y = 變化率 b + 起點 a × 輸入 x","y = 起點 a + 輸入 b × 變化率 x"],"a":1,"e":"課程的敘述句：**y = 起點 b + 變化率 a × 輸入 x**，把公式讀成一句人話。"},{"q":"課程用什麼比喻 a 與 b？","o":["資料的「鑰匙」","誤差的「開關」","輸出的「刻度」","模型的「旋鈕」"],"a":3,"e":"課程說 **a 與 b 是模型的「旋鈕」**：調整它們，就會得到不同的直線。"},{"q":"課程流程圖中，四個角色的順序為何？","o":["a → x → y → b","y → b → a → x","x → a → b → y","x → y → a → b"],"a":2,"e":"流程圖：**x（送入模型的資料）→ a（變化率，決定走勢）→ b（起點）→ y（模型產生的預測）**。"},{"q":"流程圖把 a、b 都標成「模型設定」，這句話的意義是什麼？","o":["它們不隨單筆資料改變，是整個模型共用的參數","它們會隨每一筆輸入重新計算","它們是由使用者隨機指定的","它們就是輸入與輸出"],"a":0,"e":"a、b 是**模型層級**的設定；改變輸入 x 不會動到它們，這也是「改 x」與「改模型」的分界。"},{"q":"課程示範操作時，第一步要求先做什麼？","o":["固定 a、b，只改變 x","先改變 a，再改變 x","先把 b 設為 0","先換一批資料"],"a":0,"e":"課程的操作順序：**先固定 a、b，改變 x，沿著同一條直線找 y**；再改變 a 或 b，說明這時變的是整個模型。"},{"q":"課程假設的示意模型是哪一條？","o":["y = 50x + 5","y = 5x − 50","y = 5x + 50","y = x + 50"],"a":2,"e":"課程明講**以下都是示意數字**：模型是 y = 5x + 50，各點由假設公式算出，並非實際考試資料。"},{"q":"在示意模型 y = 5x + 50 中，斜率 a 是多少？","o":["50","5","55","1"],"a":1,"e":"對照 y = ax + b：**a = 5**、b = 50。課程說「每多讀 1 小時，約多 5 分」。"},{"q":"在示意模型 y = 5x + 50 中，b = 50 的意義是什麼？","o":["每多讀一小時增加的分數","考試滿分","資料的筆數","不讀書時的預測基本分"],"a":3,"e":"b 是「不讀書的預測基本分」；a 才是每小時的增量。"},{"q":"用 y = 5x + 50 預測讀 2 小時的分數，結果是多少？","o":["55 分","62 分","70 分","60 分"],"a":3,"e":"5 × 2 + 50 = 10 + 50 = **60**。五個輸入的預測值是 50／55／60／65／70。"},{"q":"用 y = 5x + 50 預測讀 4 小時的分數，結果是多少？","o":["70 分","65 分","45 分","90 分"],"a":0,"e":"5 × 4 + 50 = 20 + 50 = **70**。課程特別強調：這是**模型預測**，不是保證一定考到。"},{"q":"關於「讀 4 小時 → 70 分」的正確說法是？","o":["保證一定考 70 分","代表所有人都會考 70 分","這是模型預測值，不是保證考到的分數","代表實際資料的平均是 70 分"],"a":2,"e":"70 分是**模型算出來的預測**，屬於趨勢描述；實際結果仍然會有誤差。"},{"q":"手算 y = ax + b 時，正確的運算順序是？","o":["先加再乘：(a + x) × b","先乘再加：a × x 之後才 + b","先加 b 再乘 a","順序不影響結果"],"a":1,"e":"公式是 a × x 先算，再加上 b。順序顛倒會得到完全不同的數字。"},{"q":"課程如何定義殘差？","o":["預測值減去實際值","預測值加上實際值","實際值減去預測值","兩者的乘積"],"a":2,"e":"課程原文：**殘差是實際值減去預測值**，也就是 y - ŷ。順序顛倒會讓正負號全部相反。"},{"q":"資料點落在直線上方時，殘差是什麼符號？","o":["正","負","零","不一定"],"a":0,"e":"點在線**上方**代表實際值大於預測值 → 殘差為**正**；在線下方則為負。"},{"q":"殘差衡量的是資料點與直線之間的哪一種距離？","o":["點到直線的最短距離","水平差距","沿著直線的距離","垂直差距"],"a":3,"e":"課程明確定義：殘差是資料點與直線之間的**垂直差距**（同一個 x 之下量上下的距離）。"},{"q":"課程說「我們要找的線」是哪一種？","o":["穿過每一個資料點的線","讓整體差距盡量小的線","最陡的那一條線","通過原點的線"],"a":1,"e":"課程的取捨：**讓整體差距盡量小的線，而不是穿過每一個點的線**。"},{"q":"殘差的公式寫成下列哪一個？","o":["ŷ − y（預測值 − 實際值）","y + ŷ","a × y − b","y − ŷ（實際值 − 預測值）"],"a":3,"e":"殘差 = **實際值 − 預測值** = y - ŷ。ŷ（y-hat）是模型的預測值。"},{"q":"最小平方法會怎麼挑出最好的直線？","o":["選出穿過最多資料點的直線","把每個殘差平方後加總，選出總和最小的直線","選出斜率最大的直線","選出通過原點的直線"],"a":1,"e":"課程原文：**最小平方法會把每個殘差平方後加總，選出總和最小的直線**。"},{"q":"把殘差平方的第一個作用是？","o":["防止正負殘差互相抵消","讓數字變小比較好算","讓斜率變成正數","讓截距變成零"],"a":0,"e":"不平方時，正 10 與負 10 相加等於 0，看起來「完美」；平方後兩者都變成 100，**不會抵消**。"},{"q":"把殘差平方的第二個作用是？","o":["讓所有差距一視同仁","讓差距變成無條件捨去","讓較大的差距受到更重視","讓差距只保留整數"],"a":2,"e":"平方是**非線性放大**：差距 10 被放大成 100，是差距 1 的 100 倍 —— 所以大誤差權重更重。"},{"q":"課程把最小平方法拆成 01–03 三步，正確順序是？","o":["平方後加總 → 比較每個差距 → 找出最小總和","比較每個差距 → 平方後加總 → 找出最小總和","找出最小總和 → 比較每個差距 → 平方後加總","比較每個差距 → 找出最小總和 → 平方後加總"],"a":1,"e":"課程的編號順序：**01 比較每個差距 → 02 平方後加總 → 03 找出最小總和**（由電腦計算）。"},{"q":"課程說 a、b 是怎麼來的？","o":["由使用者憑經驗指定","由資料筆數決定","固定為 5 與 50","從資料「學」出來的"],"a":3,"e":"課程強調 **a、b 是從資料「學」出來的**；示意模型裡的 5 與 50 只是為了教學方便先假設的。"},{"q":"最小平方法所謂的「最佳」，精確定義是什麼？","o":["相關係數最大","穿過的點最多","殘差平方和最小","斜率絕對值最大"],"a":2,"e":"「最佳」= **殘差平方和（SSE）最小**。這是相對於這批資料與這個標準的最佳，不代表這條線適用於所有情況。"},{"q":"「相關不等於因果」在課程中的舉例是什麼？","o":["讀書時數之外，基礎能力與讀書方法也可能影響分數","氣溫越高冰淇淋賣得越多","讀書時數越多分數越高","直線越陡變化越大"],"a":0,"e":"課程的舉例正是「還有第三個因素」：**基礎能力與讀書方法**也可能同時影響分數。"},{"q":"課程如何定義「外推」？","o":["拿模型預測資料範圍以外的情況","把模型套用到新的資料庫","把兩個模型疊在一起","把資料標準化後再預測"],"a":0,"e":"外推 = **預測資料範圍以外**的情況，課程明講「風險較高」。"},{"q":"把 y = 5x + 50 用在 x = 20 小時，會得到什麼結果？","o":["100 分 —— 剛好是上限","70 分 —— 與 4 小時相同","150 分 —— 明顯不合理，因為分數通常上限是 100 分","無法計算"],"a":2,"e":"5 × 20 + 50 = **150 分**。直線本身沒有「常識」，範圍外的輸入照樣給數字 —— 這就是外推的危險。"},{"q":"面對「明顯彎曲」的資料，課程的建議是什麼？","o":["直接硬套直線，因為比較簡單","先看資料的樣子，再決定是否用直線描述","把彎曲的部分刪掉","把資料點數減少"],"a":1,"e":"課程建議的判斷順序：**先看資料的形狀 → 再決定用不用直線**，而不是先假設直線再硬套。"},{"q":"課程把三個提醒對應成三個自我檢查問題，下列哪一組正確？","o":["資料夠不夠多？程式跑得快不快？圖好不好看？","斜率正不正？截距大不大？殘差平不平均？","有沒有裝套件？版本對不對？記憶體夠不夠？","能否解釋原因？是否超出觀察範圍？關係是否大致筆直？"],"a":3,"e":"三個提醒 → 三個問題：**相關≠因果 → 能否解釋原因；避免外推 → 是否超出觀察範圍；彎曲別硬套 → 關係是否大致筆直**。"},{"q":"用一句話說出 a 與 b 的不同，最精確的是？","o":["a 管起點，b 管方向與陡度","a 是輸入，b 是輸出","a 與 b 都是資料的統計量","a 管方向與陡度，b 管起點"],"a":3,"e":"課程的收尾練習就是要能說出這一句：**a 決定方向與陡度、b 決定起點**（x = 0 時的預測）。"},{"q":"課程用來收尾的一句提醒是什麼？","o":["預測描述的是趨勢，仍然會有誤差","預測就是事實，不會有誤差","只要資料夠多就一定零誤差","誤差只出現在分類問題"],"a":0,"e":"課程收尾：**預測描述的是趨勢，仍然會有誤差** —— 把殘差與三項提醒再強調一次。"},{"q":"「預測值」與「實際值」的差別是什麼？","o":["兩者是同一個東西","預測值一定是整數，實際值一定是小數","預測值來自公式，實際值是觀察到的資料","實際值由公式算出"],"a":2,"e":"預測值（ŷ）是模型算出來的；實際值（y）是觀察到的。殘差就是兩者的差。"},{"q":"課程請學員回想的示意模型是 a = 5、b = 50，讀 4 小時預測 70 分；這個練習的重點是什麼？","o":["背下 5、50、70 三個數字","確認自己能區分預測值與實際結果","證明模型永遠準確","計算資料的筆數"],"a":1,"e":"課程的收尾練習有兩件事：一句話說出 a、b 的不同，以及**確認能區分預測值與實際結果**。"}];

const LET = 'ABCD';
const KEY = 'linear-regression-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 16 || i === 33 || i === 51){
      const label = i === 0 ? '第一部分：從生活出發與四個角色（1–16）'
                  : i === 16 ? '第二部分：斜率、截距與合併公式（17–33）'
                  : i === 33 ? '第三部分：代數字、殘差與最小平方法（34–51）'
                  : '第四部分：使用提醒與重點回顧（52–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
}
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
