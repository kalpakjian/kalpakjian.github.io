<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;
  --red-bg:#fdeaea; --sel:#dbeafe; --sel-line:#2563eb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}
</style>

<script>
const QUESTIONS = [{"q":"本節對 LiteLLM 的一句話描述（TLDR）是？","o":["Call 50+ LLM APIs using chatGPT Input/Output format","Train your own LLM on a single GPU","A faster inference engine for local models","A prompt library for ChatGPT"],"a":0,"e":"本節第 0 格：TLDR 就是「用 chatGPT 的輸入輸出格式呼叫 50+ LLM API」。關鍵字是 unified interface（統一介面）。"},{"q":"LiteLLM 解決的核心問題是什麼？","o":["模型推理速度太慢","N 個供應商 × M 個應用 = N×M 套整合程式碼的噩夢","LLM 的幻覺問題","GPU 記憶體不足"],"a":1,"e":"沒有 LiteLLM 時，每個供應商的 SDK 與呼叫方式都不同，N×M 的整合成本爆炸。LiteLLM 把它變成 N+M：所有供應商收斂成同一個 completion()。"},{"q":"本機實測 litellm 1.91.2 的 litellm.provider_list 共有幾個供應商？","o":["50","80","146","4069"],"a":2,"e":"本節寫「50+」，但本機實測 len(litellm.provider_list) = 146。注意不要與 litellm.model_cost 的 4069（模型數）混淆。"},{"q":"`ollama` 與 `ollama_chat` 兩個 provider 代號的差別是？","o":["完全一樣，只是別名","ollama 是雲端版、ollama_chat 是本機版","ollama 只能跑 embedding、ollama_chat 只能跑 chat","前者走 Ollama 的 /api/generate（completion 風格），後者走 /api/chat（chat 風格）"],"a":3,"e":"這是兩個不同的 provider。本節 lite.py 用的是 ollama/smollm。"},{"q":"LiteLLM 的安裝指令是？","o":["pip install litellm","pip install litellm-sdk","npm install litellm","conda install litellm-core"],"a":0,"e":"本節第 2 格：!pip install litellm。不需為每個供應商另外安裝 SDK，LiteLLM 會帶上相依套件。"},{"q":"匯入 LiteLLM 主函式的正確寫法是？","o":["import litellm.completion","from litellm import completion","from litellm.core import chat","import litellm as completion"],"a":1,"e":"本節第 3 格：from litellm import completion ／ import os。completion 是唯一需要記的函式名。"},{"q":"全域設定 `litellm.drop_params = True` 的作用是？","o":["強制所有請求都使用 JSON 格式","關閉所有除錯輸出","供應商不支援的參數自動丟棄，而不是丟出例外","自動刪除快取的回應"],"a":2,"e":"這是「讓同一段程式碼跨供應商都能跑」的關鍵開關。例如 response_format 對某些模型不支援，設了之後 LiteLLM 會默默移除。"},{"q":"本節程式碼中的 `#@param` 是什麼？","o":["Python 的型別註解語法","LiteLLM 專用的參數標記","用來加密 API Key 的語法","Google Colab 的表單語法，在本機執行時完全沒有作用"],"a":3,"e":"本節第 5 格用了 #@param，那是 Colab 會把該行變成可填輸入框的語法。它只是註解，本機執行時沒有任何效果。"},{"q":"Azure OpenAI 是唯一需要幾個環境變數的供應商？","o":["三個（AZURE_API_KEY、AZURE_API_BASE、AZURE_API_VERSION）","一個（AZURE_API_KEY）","兩個（AZURE_API_KEY、AZURE_API_BASE）","四個"],"a":0,"e":"同一個 key 可以對應多個 Azure 資源與多個 API 版本，所以 key、base、version 三者都要。API 版本還會決定可用功能。"},{"q":"`completion(..., api_key=\"sk-xxx\")` 與環境變數 `OPENAI_API_KEY` 同時存在時，哪個生效？","o":["環境變數優先","api_key 參數優先","兩者會合併使用","會直接報錯"],"a":1,"e":"呼叫時傳入的 api_key 優先序高於環境變數。三種提供金鑰的方式優先序：api_key > 環境變數／.env > key manager 設定。"},{"q":"呼叫本機 Ollama 時，需要設定哪個 API Key 環境變數？","o":["OLLAMA_API_KEY","LOCAL_API_KEY","不需要任何金鑰","OLLAMA_TOKEN"],"a":2,"e":"本機 Ollama 不需要金鑰，只要用 api_base 指到 http://127.0.0.1:11434 即可。這是它適合離線演練的原因。"},{"q":"本節 Call chatGPT 那一格使用的模型是？","o":["gpt-4","text-davinci-003","gpt-3.5-turbo-instruct","gpt-3.5-turbo"],"a":3,"e":"本節第 7 格：completion(model=\"gpt-3.5-turbo\", messages=[{\"content\": \"what's the weather in SF\",\"role\": \"user\"}])。"},{"q":"當 `model=` 字串沒有供應商前綴時，LiteLLM 如何決定要用哪一家？","o":["依內建的字串推斷規則（例如 gpt-* → openai、command-* → cohere）","一律預設使用 Azure","直接丟出例外，不允許省略前綴","依 api_base 的網域自動判斷"],"a":0,"e":"本機實測 get_llm_provider(\"gpt-3.5-turbo\") → openai、get_llm_provider(\"command-nightly\") → cohere。但 claude-2 已不再被推斷，必須加前綴。"},{"q":"LiteLLM 回傳物件的 `object` 欄位，無論呼叫哪一家供應商，值都是？","o":["chat.completion.chunk","chat.completion","litellm.response","model.response"],"a":1,"e":"本機實測 resp.object = 'chat.completion'。這是「統一介面」在回應端的體現；串流時才變成 chat.completion.chunk。"},{"q":"`completion(model=\"claude-2\", ...)` 在 litellm 1.91.2 執行會發生什麼？","o":["正常回傳 Claude 的回答","自動改用 anthropic/claude-2 並成功","丟出 BadRequestError：LLM Provider NOT provided","丟出 AuthenticationError"],"a":2,"e":"新版 LiteLLM 對 Anthropic 模型不再做裸名推斷，必須寫 anthropic/claude-2。這是「舊版 vs 現行版本」的典型落差。"},{"q":"Replicate 模型字串 `replicate/llama-2-70b-chat:2c1608e1...` 中，冒號後面那串 64 字元是什麼？","o":["版本雜湊（version hash），鎖定特定版本","API 金鑰","模型檔案的 MD5 校驗碼","使用者的帳號 ID"],"a":0,"e":"Replicate 上同一個模型有多個版本，:後面就是鎖定的版本。不寫的話會拿到 latest，行為可能隨時改變。"},{"q":"LiteLLM 的供應商前綴只認第幾個斜線？","o":["所有斜線","第一個","最後一個","第二個"],"a":1,"e":"只認第一個 /。例：huggingface/bigcode/starcoder → provider=huggingface、model=bigcode/starcoder；openrouter/anthropic/claude-3.5-sonnet → provider=openrouter。"},{"q":"Cohere 的 `command-nightly` 是什麼性質的模型？","o":["穩定版，適合正式上線","專為 RAG 設計的版本","每晚更新的最新實驗版，可能隨時變動","只能做 embedding 的版本"],"a":2,"e":"名字裡就有 nightly，代表每晚更新、行為可能隨時改變，適合測試不適合上線。穩定版是 command。"},{"q":"成本表實測顯示 `command-nightly` 的 `mode` 是？","o":["chat","embedding","rerank","completion"],"a":3,"e":"它是「文字補完」型模型（mode='completion'），但 LiteLLM 仍接受 chat 格式的 messages 並在內部轉換。"},{"q":"Azure OpenAI 的 `model=` 參數放的內容是？","o":["OpenAI 的模型名稱（如 gpt-3.5-turbo）","Azure 的訂閱 ID","Azure 的資源群組名稱","你自己取的部署名稱（deployment-id）"],"a":3,"e":"本節特別提醒：If your deployment-id is chatgpt-test set model = azure/chatgpt-test。所以 azure/chatgpt-v-2 裡的 chatgpt-v-2 不是 OpenAI 模型名，是部署名稱。"},{"q":"`azure/chatgpt-v-2` 中的 `chatgpt-v-2` 最準確的描述是？","o":["某人 Azure 帳號裡的部署名稱","OpenAI 的一個模型版本","Azure 的 API 版本代號","Azure 的區域代號"],"a":0,"e":"Azure 的 model 放的是 deployment-id，是使用者在入口網站自取的部署名稱，因此 LiteLLM 無從推斷，一定得加 azure/ 前綴。"},{"q":"LiteLLM 的 `timeout` 參數預設值是多少？","o":["30 秒","600 秒","120 秒","無限"],"a":1,"e":"LiteLLM 預設 600 秒（10 分鐘），比很多人以為的 30 秒長得多。本節 lite.py 明確寫 timeout=120 是為了避免本機模型載入過慢時卡太久。"},{"q":"`lite.py` 中 `BASE_URL` 的埠號是多少？","o":["5000","8000","11434","8501"],"a":2,"e":"11434 是 Ollama 的預設埠號。Flask 是 5000、Streamlit 是 8501、vLLM 常是 8000。"},{"q":"`lite.py` 中 `api_base=BASE_URL` 為什麼被本節標為「critical for local Ollama」？","o":["沒有它就不能設定 temperature","沒有它就會自動改用 OpenAI","沒有它 Ollama 會拒絕連線","model 只說明用哪個 provider 與模型，api_base 才告訴 LiteLLM 服務裝在哪台機器"],"a":3,"e":"model=\"ollama/smollm\" 只說「用 ollama 這個 provider、模型叫 smollm」，但不知道服務位址。api_base 就是補上這個位址。"},{"q":"本機實測把 `lite.py` 逐字照跑，`smollm` 對「Define RAG in one sentence」的回答是？","o":["完全錯誤的幻覺（答成不存在的東西）","正確解釋 Retrieval-Augmented Generation","拒絕回答","回傳空白字串"],"a":0,"e":"兩次實測分別答成 'RAG stands for Ragged Alligators...' 與 'Ragged Garbage...'，都是幻覺。這是小模型能力問題，不是程式問題。"},{"q":"`temperature=0` 的意義是？","o":["每次都會給出不同答案","貪婪解碼，每次選機率最高的詞","關閉模型的安全機制","限制輸出長度為零"],"a":1,"e":"temperature=0 是貪婪解碼，理論上確定性最高。但實測同一 prompt 兩次仍跑出不同答案——因為模型重新載入或走不同推論路徑。"},{"q":"本機實測 `temperature=0` 兩次卻跑出不同答案，說明什麼？","o":["LiteLLM 有 bug","Ollama 忽略了 temperature 參數","「確定性」有邊界，不能當成可重現性的保證","模型被重新訓練了"],"a":2,"e":"temperature=0 只保證同一組權重＋同一組快取下的確定性。要真正可重現還需要固定 seed，而且供應商支援程度不一。"},{"q":"`top_p=1` 代表什麼？","o":["只取機率最高的那一個詞","關閉核取樣","取前 1% 的候選詞","不截斷候選詞（使用完整機率分布）"],"a":3,"e":"top_p 是核取樣：取累積機率達 p 的最小詞集合。p=1 代表不截斷。搭配 temperature=0 即為完全確定性解碼。"},{"q":"`resp[\"choices\"][0][\"message\"][\"content\"]` 等價於下列哪個屬性存取？","o":["resp.choices[0].message.content","resp.message.content","resp.choices.message[0].content","resp[\"content\"]"],"a":0,"e":"ModelResponse 同時支援屬性與字典兩種存取。注意 choices 是陣列，一定要寫 [0]。"},{"q":"`get_llm_provider(\"openrouter/anthropic/claude-3.5-sonnet\")` 推斷出的 provider 是？","o":["anthropic","openrouter","claude-3.5-sonnet","openai"],"a":1,"e":"只認第一個斜線：provider=openrouter、model=anthropic/claude-3.5-sonnet。後面的斜線全屬於模型名。"},{"q":"`completion()` 的輸入 `messages` 使用的格式是？","o":["OpenAI 的 chat 格式（[{role, content}]），全供應商共用","各家 SDK 各自的原生格式","XML 標籤","CSV 表格"],"a":0,"e":"這是 LiteLLM 的核心公約：不管底層是 Anthropic 的 messages.create 還是 Cohere 的 chat，你只寫 OpenAI chat 這一種，LiteLLM 負責翻譯。"},{"q":"本機實測回應物件的 `resp.model` 值是什麼？","o":["'smollm'","'ollama/smollm'（帶前綴）","'llama'","None"],"a":1,"e":"回應裡的 model 是帶供應商前綴的完整字串，不是裸模型名。這是常見的細節考點。"},{"q":"`resp.choices` 的型別是什麼，取值時要注意什麼？","o":["dict，直接取 key 即可","字串，直接使用","陣列（list），即使只有一個回答也一定要寫 [0]","generator，需要迭代"],"a":2,"e":"choices 是陣列，標準寫法是 resp.choices[0].message.content。忘記 [0] 是最常見的錯誤。"},{"q":"依慣例，`system` 訊息應該放在 messages 的哪個位置？","o":["最後一則","隨便都可以，行為一致","第二則","第一則"],"a":3,"e":"慣例放第一則。放後面雖然多數供應商接受，但行為不保證一致；而且多數供應商只認第一則 system，要疊加規則就合併成一段文字。"},{"q":"`system` 與 `user` 訊息的分工是？","o":["system 管規則（怎麼回答），user 管內容（回答什麼）","system 管內容，user 管規則","兩者完全相同，只是名稱不同","system 只有 Azure 支援"],"a":0,"e":"system 設定常駐行為（人格、語氣、限制、輸出格式），user 提出真正的問題。這與 Lesson 5 的 System Prompting／Role Prompting 是同一組概念。"},{"q":"LiteLLM（與所有 chat API）如何實現多輪對話？","o":["伺服器會自動記住上下文","每次把完整的對話歷史全部重送","用 session cookie","用 model 參數指定對話 ID"],"a":1,"e":"所有 chat API 都是無狀態的。多輪的唯一做法是每次重送完整歷史，代價是每多一輪 prompt_tokens 就多一份——這是長對話變貴的原因。"},{"q":"`max_tokens` 參數限制的是什麼？","o":["輸入與輸出的總和","輸入的 token 數","輸出的 token 數（不含輸入）","模型的最大上下文長度"],"a":2,"e":"max_tokens 限制輸出長度。模型的上下文上限是另一個概念，用 get_max_tokens(model) 查（實測 gpt-3.5-turbo = 4096）。"},{"q":"串流模式下，回應物件的 `object` 欄位值變成？","o":["chat.completion","stream.chunk","litellm.delta","chat.completion.chunk"],"a":3,"e":"非串流是 chat.completion，串流變成 chat.completion.chunk。本機實測 2063 個 chunk。"},{"q":"串流模式下要取出文字，應該讀哪個欄位？","o":["chunk.choices[0].delta.content","chunk.choices[0].message.content","chunk.content","chunk.choices[0].text"],"a":0,"e":"串流時欄位從 message 變成 delta，這是串流最常考也最容易寫錯的地方。"},{"q":"串流模式下，`usage`（token 統計）的狀況是？","o":["一定完整提供","不保證存在，多數供應商只有最後一塊才有，或需要額外參數","一定是 0","會變成字串"],"a":1,"e":"所以「要計 token 就不能只靠串流回應」。要準確數字就用非串流回應的 resp.usage。"},{"q":"已知供應商但沒有設定 API key 時，LiteLLM 丟出的例外是？","o":["BadRequestError","RateLimitError","AuthenticationError","APIConnectionError"],"a":2,"e":"本機實測：litellm.AuthenticationError: The api_key client option must be set either by passing api_key to the client or by setting the environment variable。"},{"q":"本機 Ollama 上不存在的模型（`ollama/definitely-not-a-real-model`）會丟出什麼例外？","o":["NotFoundError","ValueError","BadRequestError","APIConnectionError"],"a":3,"e":"反直覺但實測如此：Ollama 用 HTTP 200 帶著 {\"error\": \"model not found\"} 回覆，LiteLLM 只能歸類為連線層級問題。"},{"q":"`completion(model=\"nosuchprovider/foo\", ...)` 會丟出什麼例外？","o":["BadRequestError（訊息為 LLM Provider NOT provided）","KeyError","ImportError","AuthenticationError"],"a":0,"e":"不是「找不到供應商」，而是「沒能從字串推斷出供應商」。同樣的錯誤也會發生在沒加前綴的 claude-2 上。"},{"q":"本機實測 `supports_vision(\"claude-3-5-sonnet-20241022\")` 回傳 False，最準確的解讀是？","o":["該模型確實不支援看圖","該函式查的是 LiteLLM 內建能力表，而這個模型名沒被收錄","該函式只支援 OpenAI 模型","需要安裝額外套件"],"a":1,"e":"claude-3-5-sonnet 真的支援 vision 與 tool use。回 False 只代表「LiteLLM 的表裡查不到」——加上 anthropic/ 前綴就能正確判定。"},{"q":"本機實測 `get_max_tokens(\"gpt-3.5-turbo\")` 的值是？","o":["8192","128000","4096","2048"],"a":2,"e":"實測為 4096。這是該模型的上下文長度上限，不是 max_tokens 參數的預設值。"},{"q":"同一句 17 字中文，`token_counter` 對 `gpt-3.5-turbo` 算出 30、對 `gpt-4o` 算出 15。原因是？","o":["兩者使用不同的分詞器（gpt-4o 的 o200k_base 對中文效率約為兩倍）","gpt-4o 的計算有 bug","gpt-3.5-turbo 把中文字算兩次","隨機結果"],"a":0,"e":"model 參數只決定「用哪個分詞器」。gpt-3.5-turbo 用 cl100k_base、gpt-4o 用 o200k_base，對中文的切分效率不同。"},{"q":"用 `token_counter(model=\"ollama/smollm\", text=...)` 算本機模型的 token 數，可信度如何？","o":["完全準確","不可信——查不到該模型的分詞器時會退回 tiktoken 估算","一定比實際多 10%","會直接報錯"],"a":1,"e":"實測 ollama/smollm 與 gpt-3.5-turbo 都回 30，那其實是 tiktoken 的數字，不是 smollm 自己的分詞結果。"},{"q":"要取得最準確的 token 數，應該用什麼？","o":["token_counter() 的估算值","自己數空白分隔的詞數","伺服器回傳的 resp.usage","模型名稱的長度"],"a":2,"e":"resp.usage 是模型自己算的，永遠最準。token_counter() 是離線估算（省一次 API 呼叫），適合事前判斷會不會爆上下文。"},{"q":"`completion_cost(resp)` 對本機 Ollama 模型的回傳值是？","o":["拋出例外，因為查不到價格","回傳 None","回傳 -1","0.0"],"a":3,"e":"本機推論確實沒有 API 費用（真正的成本是電費與顯卡攤提），所以 0.0 是正確答案不是 bug。"},{"q":"成本表實測顯示 `gpt-4o` 的輸出價格是每 100 萬 token 多少美元？","o":["USD 1.50","USD 2.50","USD 5.00","USD 10.00"],"a":3,"e":"gpt-4o：輸入 USD 2.50、輸出 USD 10.00（4 倍）。gpt-3.5-turbo：輸入 USD 0.50、輸出 USD 1.50（3 倍）。輸出普遍比輸入貴。"},{"q":"本機實測 `len(litellm.model_cost)` 的值是？","o":["146","4096","4069","50"],"a":2,"e":"litellm.model_cost 收錄 4069 個模型的單價。注意別與 provider_list 的 146（供應商數）混淆。"},{"q":"監控成本時發現 `completion_cost()` 一直是 0，除了本機模型之外還有什麼可能？","o":["系統時鐘錯誤","LiteLLM 版本太舊","快取命中所以免費","模型名寫錯導致查不到成本表——這其實是警訊"],"a":3,"e":"模型名寫錯（例如漏了供應商前綴）會讓成本表查不到而一律回 0。儀表板顯示成本 USD 0 可能不是省錢，是名字對不上。"},{"q":"Fallbacks 與 Router 的差別是？","o":["兩者完全相同","Fallbacks 做負載平衡，Router 做失敗重試","Fallbacks 只支援 OpenAI","Fallbacks 是「失敗後換模型」，Router 是「一開始就在多個部署間分流」"],"a":3,"e":"fallbacks=[...] 在主力模型失敗時依序嘗試備援；Router(model_list=[...]) 則是把同一個 model_name 掛多把金鑰／多個部署來輪流使用。"},{"q":"LiteLLM Proxy 的主要價值是？","o":["讓只認 OpenAI 協議的工具也能用上任意供應商，並集中管理金鑰","加快模型推理速度","自動訓練模型","取代 Ollama"],"a":0,"e":"Proxy 是一個本機伺服器：對外假裝成 OpenAI 端點，對內轉發到任意供應商。金鑰只留在 Proxy 機器上，不會散到每個應用。"},{"q":"啟動 LiteLLM Proxy 後，客戶端連線時的 `api_key` 應該填什麼？","o":["必須填真實的 OpenAI 金鑰","隨便填即可（例如 \"anything\"），真正的金鑰在 Proxy 那一側","留空不能填","填 Proxy 的埠號"],"a":1,"e":"客戶端不需要知道後面接的是哪一家。真金鑰由 Proxy 的 config.yaml 或環境變數提供。"},{"q":"本機實測 `smollm` 的非串流與串流耗時分別是？","o":["8.09 秒 / 14.59 秒","兩者相同","14.59 秒 / 8.09 秒（首塊 3.38 秒）","30 秒 / 60 秒"],"a":2,"e":"非串流 14.59 秒；串流總計 8.09 秒但首塊只要 3.38 秒。串流的價值是「感覺變快」——第一個字很快就出現。"},{"q":"本節寫「Call 50+ LLM APIs」，本機 litellm 1.91.2 實測的供應商數是？","o":["146 個","50 個","4069 個","80 個"],"a":0,"e":"本節是對的，只是版本前進了。litellm.provider_list 現有 146 個供應商。"},{"q":"本節 notebook 保存的回應物件型別是 `OpenAIObject`，現行 LiteLLM 回傳的是？","o":["OpenAIObject（未變）","dict","openai.ChatCompletion","ModelResponse"],"a":3,"e":"LiteLLM 現在回傳自己的 ModelResponse 型別，但仍支援屬性與字典兩種存取，且 object 欄位維持 chat.completion。"},{"q":"`completion(model=\"claude-2\", ...)` 要怎麼改才能在 litellm 1.91.2 正常執行？","o":["改成 model=\"claude-2.0\"","加上供應商前綴：model=\"anthropic/claude-2\"","改成 model=\"openai/claude-2\"","加上 api_base 參數"],"a":1,"e":"通則：<供應商>/<模型> 永遠安全。舊寫法在當時有效，現行版本已收緊裸名推斷。"},{"q":"「有疑慮就加前綴」這條記法的根據是？","o":["前綴可以加快推理速度","沒有前綴會被額外收費","「可省略」是例外，「要加前綴」是常態","前綴是 Azure 專屬要求"],"a":2,"e":"只有 OpenAI 與 Cohere 等少數供應商有內建推斷規則。Anthropic、Azure、所有本機／自架、聚合平台、雲端代管都必須寫前綴。"},{"q":"本節把 **LLM Gateway** 定義成什麼？","o":["一個**集中**的 API 端點：接收所有推論請求、統一多供應商互動，並套用跨切面控制","一種把大模型壓縮成小模型的技術","一個用來自動訓練模型的框架","一個瀏覽器上的提示詞外掛"],"a":0,"e":"原文是 centralized API endpoint。三項職責：接收所有推論請求、統一各家互動方式、套用跨切面控制（成本追蹤、認證、快取、限流、路由、fallback）。"},{"q":"指出，LiteLLM Proxy Server 對外暴露的端點長得像下列哪一個？","o":["http://your-llm-gateway/v1/models","http://your-llm-gateway/anthropic/v1/messages","http://your-llm-gateway/v1/chat/completions","http://your-llm-gateway/api/generate"],"a":2,"e":"寫的就是 /v1/chat/completions，這正是 §20.3「客戶端只要改 base_url 就能用」的原因。"},{"q":"說，LiteLLM 可以發給內部使用者的是哪一種金鑰？","o":["供應商的真金鑰","SSH 私鑰","資料庫連線密碼","虛擬 API Key（可控制 per-user 配額與角色權限）"],"a":3,"e":"真金鑰只留在 gateway 機器上；對內發放的是可撤銷、可限額的 virtual API keys，並支援 per-user 配額與 RBAC。"},{"q":"的 **Multi-Tenant Cost Tracking & Governance** 包含哪三項？","o":["模型微調、量化、蒸餾","成本儀表板、per-team／per-project 預算、用量報表","快取、壓縮、批次推論","認證、授權、加密"],"a":1,"e":"本節原文列出 cost dashboards、budgets、usage reporting。對照 §18 的 completion_cost() 只算單次，這裡是組織層級的帳。"},{"q":"本節說「把敏感資料只導向私有地端模型」的主要動機是什麼？","o":["合規與資安——企業與政府不允許機密資料出境","地端模型的準確度一定比雲端高","地端模型沒有 token 上限","雲端模型不支援中文"],"a":0,"e":"：direct sensitive data only to private on-prem models；第 8 頁進一步說這是 enterprise 與 government 的硬需求。"},{"q":"的典型 gateway 架構中，負責保存**狀態**（虛擬金鑰、預算、用量）的是哪一個元件？","o":["Ollama","OpenWebUI","Postgres","MCP"],"a":2,"e":"五個元件是：UI（OpenWebUI）、LiteLLM Proxy、Ollama／雲端 LLM、**Postgres**（狀態）、MCP（工具）。沒有 DB，§21.4／§21.5 的治理能力會大打折扣。"},{"q":"難得地列出 gateway 的缺點。下列哪一組是它提到的限制？","o":["模型回答會變得不準確、無法支援本機模型、授權費用過高","只能接 OpenAI、不能接 Azure、不支援串流","必須有 GPU 才能啟動、不能使用 Docker、沒有 Python SDK","高負載下效能與穩定性下降、長時間運行記憶體成長、日誌／資料庫依賴拖慢請求"],"a":3,"e":"這三項都是「加一層 abstraction 的代價」。對照 §20：集中管理的價值是統一，代價是額外延遲與單點風險。"},{"q":"的**標題**與**內容**有什麼不一致？","o":["標題寫 LiteLLM，內容卻在講 Open WebUI","標題寫「& Gateway Alternatives」，但內文完全沒有介紹替代方案","標題寫 Limitations，內容卻全是優點","沒有不一致"],"a":1,"e":"同頁還有兩個筆誤：`LiteLLM includes:ost dashboards`（應為 Cost dashboards）、`A typical deployment involves:`（從第 9 頁複製過來，應為 Limitations include:）。"}];

const LET = 'ABCD';
const KEY = 'litellm-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 15 || i === 30 || i === 45 || i === 60){
      const label = i === 0 ? '第一部分：LiteLLM 定位、安裝與 API Key（1–15）'
                  : i === 15 ? '第二部分：五大供應商呼叫、本機 Ollama、命名規則（16–30）'
                  : i === 30 ? '第三部分：I/O 契約、messages、串流與例外（31–45）'
                  : i === 45 ? '第四部分：能力、Token、成本、Router 與 Proxy（46–60）'
                  : '第五部分：LLM Gateway 概念與企業治理（61–68）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 68 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
