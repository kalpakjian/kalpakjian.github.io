<script>
const QUESTIONS = [{"q":"這份導讀簡報診斷「為什麼我們總是學不會機器學習」，其**核心**原因是下列哪一項？","o":["學習者不夠努力、投入時間不足","課程難度與學習者當前能力嚴重脫節","機器學習本身是無法學會的學科","學習者缺少高階 GPU 設備"],"a":1,"e":"簡報中間那塊就是核心診斷：**課程難度與學習者當前能力嚴重脫節**。左邊（數學基礎不足）與右邊（跳躍式推導）都是它的成因／表現。"},{"q":"簡報列出的「三個症狀」，**不包括**下列哪一項？","o":["缺乏穩固的數學與理論基礎知識","課程難度與學習者當前能力嚴重脫節","跳躍式的公式推導與艱澀的學術語言","學習者缺乏業界實務專案經驗"],"a":3,"e":"簡報原文的三個症狀是：缺乏穩固的數學與理論基礎知識、課程難度與學習者當前能力嚴重脫節、跳躍式的公式推導與艱澀的學術語言。**沒有**提到實務專案經驗。"},{"q":"引文「在沒有準備足夠的基礎知識的情況下就去讀高難度的專業書，當然難以了解其中的內容。」的作者是？","o":["伊藤真","李開復","吳恩達（Andrew Ng）","Geoffrey Hinton"],"a":0,"e":"簡報第 2 頁 引文署名 **伊藤真**；他同時是《最新機器學習的教科書》的作者（簡報第 12 頁 標為「博士 伊藤真（Makoto Ito）」）。"},{"q":"簡報對「讀不懂專業書」開的處方是？","o":["加倍努力，硬啃同一本難書直到讀懂","先找到符合當前水準的橋樑書（過渡教科書）","跳過所有數學，只學 API 呼叫","直接改讀最新的研究論文"],"a":1,"e":"簡報第 3 頁 明言：讀懂大學教科書的正道，在於**先找到符合當前水準的橋樑書**；而不是硬啃原文書或跳過數學。"},{"q":"簡報用「橋」比喻過渡教科書時，橋的**兩根橋墩**是？","o":["線性代數與機率統計","GPU 與雲端運算","Python 實作與基礎數學","Jupyter 與 GitHub"],"a":2,"e":"橋墩寫得很清楚：**Python 實作** 與 **基礎數學**。這也正是本書要提供的兩項支撐。"},{"q":"橋的左岸與右岸分別代表什麼？","o":["具備 Python 基礎的初學者 → 深度學習專業領域","高中生 → 資料科學家","數學系學生 → 物理學家","初階工程師 → 產品經理"],"a":0,"e":"簡報第 3 頁：左岸是「具備 Python 基礎的初學者」，右岸是「深度學習專業領域」，中間的橋就是《最新機器學習的教科書 DM2155》。"},{"q":"簡報指出本書的核心理念是？","o":["跳過數學，直接教框架 API","以 Kaggle 競賽成績為唯一導向","只教 TensorFlow 語法","透過數學式了解機器學習"],"a":3,"e":"簡報第 3 頁 原文：本書「系統性整理基礎數學，並將『**透過數學式了解機器學習**』的理念貫穿全書」。"},{"q":"簡報說「讀懂大學教科書的正道」是什麼？","o":["從原文書第一頁硬讀到最後一頁","先找到符合當前水準的橋樑書","先讀完所有論文再回頭看教科書","把公式全部背下來"],"a":1,"e":"簡報第 3 頁 底部原文：讀懂大學教科書的正道，在於**先找到符合當前水準的橋樑書**。"},{"q":"公式 $J(w) = \\frac{1}{m}\\sum_{i=1}^{m}\\mathcal{L}(\\hat{y}^{(i)}, y^{(i)}) + \\frac{\\lambda}{2}\\lVert w\\rVert^{2}$ 中，程式碼 `tf.reduce_mean(tf.keras.losses.binary_crossentropy(y, y_hat))` 對應哪一項？","o":["正則化項 $\\frac{\\lambda}{2}\\lVert w\\rVert^{2}$","輸出層的 sigmoid","資料項 $\\frac{1}{m}\\sum\\mathcal{L}$","梯度下降的更新量"],"a":2,"e":"`binary_crossentropy` 回傳**逐樣本**損失向量，`reduce_mean` 取平均後才是 $\\frac{1}{m}\\sum\\mathcal{L}$，也就是資料項。"},{"q":"`tf.nn.l2_loss(w)` 的官方定義是？","o":["$\\frac{1}{2}\\sum w_i^{2}$","$\\sum w_i^{2}$","$\\sum |w_i|$","$\\max_i |w_i|$"],"a":0,"e":"TF 的 `l2_loss` **自帶 $\\frac{1}{2}$**，定義為 $\\frac{1}{2}\\sum w_i^{2}$。這是本題最常被記錯的細節。"},{"q":"因此 `lambda * tf.nn.l2_loss(w)` 對應公式中的哪一項？","o":["$\\lambda\\lVert w\\rVert^{2}$","$\\lambda\\lVert w\\rVert$","$2\\lambda\\lVert w\\rVert^{2}$","$\\frac{\\lambda}{2}\\lVert w\\rVert^{2}$"],"a":3,"e":"因為 `l2_loss` 已含 $\\frac{1}{2}$，乘上 `lambda` 後正好是 $\\frac{\\lambda}{2}\\lVert w\\rVert^{2}$——**不需要再自己除 2**。"},{"q":"$\\hat{y} = \\sigma(w^{T}x + b)$ 對應的 TensorFlow 程式碼是？","o":["`tf.matmul(w, x)`","`tf.sigmoid(tf.matmul(tf.transpose(w), x) + b)`","`tf.reduce_mean(w)`","`tf.nn.l2_loss(w) + b`"],"a":1,"e":"`transpose` 對應 $w^{T}$、`matmul` 對應矩陣乘法、`+ b` 對應偏置、`sigmoid` 對應 $\\sigma$。這正是簡報第 4 頁 的 1:1 對照。"},{"q":"本機實測中，「資料項 $(1/m)\\sum\\mathcal{L}$」與「`reduce_mean(binary_crossentropy)`」的差異是？","o":["約 1%","約 10%","小於 $10^{-12}$（兩者相等）","無法比較"],"a":2,"e":"實測兩者都是 **0.7771559204**，差異 $<10^{-12}$，證明程式碼語意與數學式真的 1:1 對應。"},{"q":"本機實測中，「解析梯度」與「數值梯度（中央差分 $h=10^{-6}$）」的最大差是？","o":["5.597e-11","0.5","1.0","5.597"],"a":0,"e":"最大差 **5.597e-11**，代表 $J(w)$ 真的是被最小化的那個目標函數，而不是裝飾用的公式。"},{"q":"為什麼簡報強調「公式與程式碼 1:1 對應」對初學者特別有效？","o":["因為程式碼永遠比公式簡單","因為這樣就可以完全跳過數學","因為 TensorFlow 會自動推導數學","因為公式與程式碼並排，看不懂一邊可以立刻對照另一邊"],"a":3,"e":"簡報第 4 頁 用黃線把公式的每一項連到對應的程式碼：看不懂公式就先看程式碼，看不懂程式碼就回頭看公式——**降低單一表述的卡關成本**。"},{"q":"簡報第 4 頁 並排的兩個視窗分別是？","o":["Word 與 Excel","Jupyter Lab（公式）與 Python Lab（程式碼）","GitHub 與 Slack","MATLAB 與 R"],"a":1,"e":"左邊是 Jupyter Lab 的「損失函數與正則化（Loss Function & Regularization）」公式，右邊是 Python Lab 的 TensorFlow 程式碼。"},{"q":"簡報說 Jupyter 環境的四個賣點，**不包括**下列哪一項？","o":["網頁編寫（瀏覽器內直接撰寫 Python）","圖文筆記（程式碼管理與理論紀錄）","自動幫你寫出正確的程式碼","即時執行（區塊化運行，立刻除錯）"],"a":2,"e":"四個賣點是：**網頁編寫、圖文筆記、即時執行、視覺結果**。簡報沒有說 Jupyter 會自動寫程式。"},{"q":"「區塊化運行，立刻除錯」對應四個賣點中的哪一個？","o":["即時執行","網頁編寫","視覺結果","圖文筆記"],"a":0,"e":"**即時執行**＝區塊化運行，立刻除錯（不必重跑整支程式，只重跑出錯的那個 cell）。"},{"q":"簡報認為「視覺化圖形介面」對初學者的效果是？","o":["降低模型的準確率","大幅激發初學者的學習動力","可以取代數學推導","讓程式執行速度變快"],"a":1,"e":"簡報第 5 頁 左下原文：比起在命令行零散輸入程式碼，**視覺化圖形介面能大幅激發初學者的學習動力**。"},{"q":"在「重新定義機器學習的入門標準」對照表中，「傳統大學教科書」的開發環境是？","o":["零散的終端機命令列","全視化 Jupyter Notebook","雲端 IDE","VS Code 加遠端容器"],"a":0,"e":"對照表原文：傳統大學教科書＝**零散的終端機命令列**；本書＝**全視化 Jupyter Notebook**。"},{"q":"對照表中，本書在「數學解說」這一列的寫法是？","o":["預設讀者懂微積分，跳躍推導","只給公式，不給任何解釋","從基礎算式開始，循序漸進圖文並茂","用影片取代所有文字說明"],"a":2,"e":"本書欄位是「**從基礎算式開始，循序漸進圖文並茂**」；「預設讀者懂微積分，跳躍推導」是傳統大學教科書那一欄。"},{"q":"對照表中，「理論與實作」這一列，本書的做法是？","o":["公式與程式碼分開寫在兩本書裡","只做實作，不談理論","只談理論，不做實作","一行公式對應一行程式碼（1:1 對應）"],"a":3,"e":"本書欄位是「**一行公式對應一行程式碼（1:1 對應）**」；傳統教科書則是「公式與程式碼嚴重脫節」。"},{"q":"對照表中，本書的適用對象是？","o":["具備進階數理背景的學霸","需要複習數學基礎的 Python 初學者","完全沒有寫過程式的人","已發表論文的 AI 研究者"],"a":1,"e":"本書欄位是「**需要複習數學基礎的 Python 初學者**」。注意：**已具備 Python 基礎**是前提（見橋的左岸）。"},{"q":"由「適用對象」這一列可以推知，本書對 Python 的定位是？","o":["入場券——假設讀者已具備基礎","書中會從零開始教 Python 語法","完全不需要用到 Python","只用來畫圖表"],"a":0,"e":"橋的左岸寫的是「**具備 Python 基礎**的初學者」，適用對象也是「**Python 初學者**」——Python 是入場券，數學才是本書要幫你補的。"},{"q":"學習藍圖**第一階段（Ch 1-4）**的四個節點，依序是？","o":["Python 基礎 → 環境整備 → 必備數學 → 資料視覺化","環境整備 → Python 基礎 → 資料視覺化 → 必備數學","必備數學 → Python 基礎 → 環境整備 → 資料視覺化","資料視覺化 → 必備數學 → 環境整備 → Python 基礎"],"a":1,"e":"第一階段順序：**1 環境整備 → 2 Python 基礎 → 3 資料視覺化 → 4 必備數學**。先有工具，再有語言，再能畫圖，最後補數學。"},{"q":"節點 1「環境整備」包含哪四項？","o":["Python, Jupyter, Keras, TensorFlow 安裝","NumPy, Pandas, Matplotlib, Seaborn","Git, Docker, Kubernetes, AWS","Linux, Vim, Bash, Makefile"],"a":0,"e":"簡報原文：環境整備＝**Python, Jupyter, Keras, TensorFlow 安裝**（四件套：語言 → 介面 → 高階 API → 底層框架）。"},{"q":"節點 2「Python 基礎」的內容是？","o":["類別、繼承與設計模式","網頁爬蟲與 API 串接","陣列、切片、矩陣四則運算、函數","資料庫 SQL 與正規化"],"a":2,"e":"簡報原文：Python 基礎＝**陣列、切片、矩陣四則運算、函數**（本質上是在為 NumPy ndarray 鋪路）。"},{"q":"節點 3「資料視覺化」的內容是？","o":["2D/3D 圖形繪製實作","影像壓縮與串流","3D 列印建模","網頁前端動畫"],"a":0,"e":"簡報原文：資料視覺化＝**2D/3D 圖形繪製實作**。它的用途是「看得到才判斷得出模型對不對」。"},{"q":"節點 4「必備數學」列出的**四項**是？","o":["機率、統計、微積分、線性代數","集合論、圖論、數論、拓撲學","數值分析、最佳化、資訊理論、微分方程","求和符號、導數與偏導數、矩陣、指數與對數函數"],"a":3,"e":"簡報原文四項：**求和符號、導數與偏導數、矩陣、指數與對數函數**。這四項正好對應簡報第 4 頁 那條損失函數的每一部分。"},{"q":"簡報對第一階段的定位（說明文字）是？","o":["穩紮穩打，在不寫複雜神經網路前，先建構堅不可摧的工具與數學思維","直接開始訓練深層卷積網路","先學會雲端部署再回頭學數學","以 Kaggle 競賽題目為主軸"],"a":0,"e":"簡報第 7 頁 原文：**穩紮穩打，在不寫複雜神經網路前，先建構堅不可摧的工具與數學思維。**"},{"q":"學習藍圖**第二階段**涵蓋的章節與節點是？","o":["Ch 1-4，節點 1-4","Ch 5-6，節點 5-7","Ch 7-9，節點 8-10","Ch 10-12，節點 11-13"],"a":1,"e":"第二階段＝**Ch 5-6**、節點 **5-7**（線性回歸、模型評估、分類問題），主題是「掌握監督學習模型」。"},{"q":"節點 5「線性回歸」的內容是？","o":["K-means 與混合高斯模型","CNN 與 Dropout","一維／二維／D 維線性模型、線性基底函數","決策樹與隨機森林"],"a":2,"e":"簡報原文：線性回歸＝**一維／二維／D 維線性模型、線性基底函數**。線性基底函數讓「線性模型」也能配出曲線。"},{"q":"節點 6「模型評估」的兩個重點是？","o":["學習率調整與批次大小選擇","資料清理與特徵工程","GPU 選擇與分散式訓練","過擬合問題、新模型生成與選擇"],"a":3,"e":"簡報原文：模型評估＝**過擬合問題、新模型生成與選擇**（用驗證集比較模型，而不是憑感覺挑）。"},{"q":"節點 7「分類問題」的內容是？","o":["一維／二維輸入的二元分類、三元分類","只有二元分類，不談多類別","只有多類別分類，不談二元","只有迴歸問題"],"a":0,"e":"簡報原文：分類問題＝**一維／二維輸入的二元分類、三元分類**（顆粒度要記牢：二元＋三元）。"},{"q":"學習藍圖**第三階段**的章節範圍是？","o":["Ch 1-4","Ch 5-6","Ch 7-9","Ch 10-12"],"a":2,"e":"第三階段＝**Ch 7-9**（節點 8-10），主題是「深度學習與無監督領域」。"},{"q":"節點 8「神經網路入門」的內容是？","o":["K-means 演算法","神經元模型、使用 Keras 實現模型","推薦系統演算法","知識圖譜建構"],"a":1,"e":"簡報原文：神經網路入門＝**神經元模型、使用 Keras 實現模型**（從單一神經元 $z=w^{T}x+b$ 開始）。"},{"q":"節點 9「深度學習應用」的內容是？","o":["進階至 CNN 與 MNIST 專案開發","混合高斯模型的 EM 推導","線性基底函數的選擇","資料視覺化的 3D 繪圖"],"a":0,"e":"簡報原文：深度學習應用＝**進階至 CNN 與 MNIST 專案開發**（也就是第 9 章的四步架構）。"},{"q":"節點 10「無監督學習」的兩把武器是？","o":["線性回歸與邏輯回歸","CNN 與 RNN","隨機森林與 GBDT","K-means 演算法、混合高斯模型"],"a":3,"e":"簡報原文：無監督學習＝**K-means 演算法、混合高斯模型**。兩者都不需要標籤，差別在硬分群 vs 軟分群。"},{"q":"K-means 與混合高斯模型（GMM）最關鍵的差別是？","o":["K-means 是硬分群（一點只屬一群），GMM 是軟分群（一點以機率屬於各群）","K-means 需要標籤，GMM 不需要標籤","K-means 只能處理二維資料，GMM 只能處理一維資料","K-means 是監督式學習，GMM 是半監督式學習"],"a":0,"e":"兩者都是**無監督**（都不需要標籤）；差別在 **K-means 硬分群**（球形群、輸出群標籤）與 **GMM 軟分群**（可為橢圓群、輸出各群機率，用 EM 估計參數）。"},{"q":"簡報第 10 頁 的 MNIST 模型四步架構演進，正確順序是？","o":["＋ReLU → FC 兩層 → Dropout → CNN","CNN → FC 兩層 → Pooling → ReLU","FC 兩層 → ＋ReLU → ＋CNN → ＋Pooling／Dropout","Pooling → CNN → ReLU → FC 兩層"],"a":2,"e":"四步：**Step 1 二層前饋（FC）→ Step 2 加 ReLU → Step 3 升級 CNN → Step 4 導入 Pooling 與 Dropout**。每一步都只在前一步上加一個零件。"},{"q":"MNIST 架構的 Step 1 內容是？","o":["MINST 資料集導入與二層前饋神經網路（MNIST Input → FC 1 → FC 2 → Output）","Conv → ReLU → MaxPool","FC → Dropout → Softmax","CNN → 池化 → 全連接"],"a":0,"e":"Step 1 是「**MINST 資料集導入與二層前饋神經網路**」，資料流為 MNIST Input → FC 1 → FC 2 → Output。"},{"q":"Step 4 導入的兩件事是？","o":["批次正規化與早停","資料增強與遷移學習","注意力機制與 Transformer","池化（Pooling）與 Dropout"],"a":3,"e":"Step 4：導入**池化（Pooling）與 Dropout**，簡報明確寫出目的是「防止過擬合」。"},{"q":"簡報說 Step 4 導入池化與 Dropout 的目的是？","o":["增加模型的參數量","防止過擬合","加快訓練速度以縮短開發時間","提高訓練集的準確率"],"a":1,"e":"簡報原文：導入池化（Pooling）與 Dropout **防止過擬合**。注意訓練集準確率在四步中都已達 1.0000，所以「提高訓練準確率」不是目的。"},{"q":"本機實測（sklearn digits 8×8 + PyTorch）四步的**測試**準確率變化是？","o":["0.9800 → 0.9778 → 0.9667 → 0.9489（逐步變差）","0.9489 → 0.9667 → 0.9778 → 0.9800（逐步變好）","四步都是 1.0000","0.50 → 0.60 → 0.70 → 0.80"],"a":1,"e":"實測：**0.9489 → 0.9667 → 0.9778 → 0.9800**，淨提升 +0.0311，方向與簡報的四步完全一致。"},{"q":"本機實測中，四步的**訓練**準確率都是？","o":["1.0000——單看訓練分數完全分不出這四個模型的差別","0.9000 左右","0.8000 左右","0.5000 左右"],"a":0,"e":"四步訓練準確率**全部是 1.0000**，所以必須看**測試分數**才能分辨模型好壞——這正是節點 6「模型評估」的重點。"},{"q":"本機實測中，Step 4 的參數量反而比 Step 3 **少**（10,410 → 9,930），原因是？","o":["因為 Dropout 刪除了部分參數","因為用了更小的卷積核","因為池化把特徵圖從 8×8 降到 4×4，而池化層沒有可學參數","因為訓練資料變少了"],"a":2,"e":"池化把特徵圖降為 4×4，全連接層輸入由 16×8×8 變成 32×4×4，且池化本身**沒有可學參數**——所以「加了一層反而參數更少」。"},{"q":"簡報對這一章（實戰深潛）的自我要求是？","o":["只要能跑出結果就好","模型越深越好、準確率越高越好","完全使用現成套件，不解釋原理","拒絕給予黑盒子——每層都要有數學原理解釋與 Jupyter 實作驗證"],"a":3,"e":"簡報第 10 頁 底部原文：**拒絕給予黑盒子。每一個神經網路層的加入，都會搭配對應的數學原理解釋與 Jupyter 實作驗證。**"},{"q":"池化（Pooling）的主要作用是？","o":["降維並帶來局部平移不變性","增加模型的參數量以提升容量","取代激活函數提供非線性","把資料標準化成均值 0、變異數 1"],"a":0,"e":"池化＝**降維＋局部平移不變性**，且沒有可學參數。它不提供非線性（那是激活函數的工作），也不做標準化。"},{"q":"Dropout 的機制是？","o":["推論時隨機關閉一半神經元以加速","訓練時隨機關閉一部分神經元，避免對特定神經元的依賴","永久刪除權重最小的神經元","把權重全部歸零後重新訓練"],"a":1,"e":"Dropout **只在訓練時**隨機關閉一部分神經元，避免網路依賴特定神經元；**推論時要用完整網路**（PyTorch 用 `model.eval()`）。"},{"q":"卷積層（Convolution）相對全連接層最大的優勢是？","o":["不需要激活函數","完全不需要訓練","參數重用——用少量權重掃描整張圖，並保留空間結構","保證測試準確率一定更高"],"a":2,"e":"卷積的核心是**參數重用（parameter sharing）**：同一組卷積核掃描全圖，參數遠少於全連接層，同時保留相鄰像素的空間關係。"},{"q":"五條後續學習路徑中，「路徑 A（演算法）」對應的課程是？","o":["猜心競賽：從實作了解推薦系統演算法（DM2034）","TensorFlow 上車就學會（DM2121）","化繁為簡的藝 const LET = 'ABCD';
const KEY = 'ml-textbook-guide-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 20 || i === 41){
      const label = i === 0 ? '第一部分：痛點、橋樑書與 1:1 學習法（1–20）'
                  : i === 20 ? '第二部分：入門標準與學習藍圖十節點（21–41）'
                  : '第三部分：MNIST 實戰、後續路徑與心態（42–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
    html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
}
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
