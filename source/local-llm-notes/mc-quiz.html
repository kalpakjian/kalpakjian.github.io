<title>Local LLM Apps MC 模擬測驗（60 題）| AI Tech Notes</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --txt:#1f2328; --dim:#5b636e;
  --blue:#2563eb; --green:#15803d; --green-bg:#e8f6ec; --red:#b91c1c;
  --red-bg:#fdeaea; --sel:#dbeafe; --sel-line:#2563eb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
    "Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  line-height:1.7; font-size:16px;
}
a{color:var(--blue)}
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.topbar .row1{display:flex; flex-wrap:wrap; align-items:baseline; gap:14px}
.topbar h1{font-size:17px; margin:0; font-weight:700}
.topbar .back{font-size:13px; color:var(--dim); text-decoration:none}
.topbar .back:hover{color:var(--blue)}
.stats{display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:14px; color:var(--dim)}
.stats b{font-size:18px; color:var(--txt)}
.stats .ok b{color:var(--green)}
.stats .no b{color:var(--red)}
.saved{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}
.progress{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .25s}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{
  font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
  border:1px solid var(--line); background:#fff; color:var(--txt); cursor:pointer;
  transition:.15s;
}
button:hover{border-color:#b9c0c9; background:#fbfbfc}
button.primary{background:var(--blue); border-color:var(--blue); color:#fff}
button.primary:hover{background:#1d4ed8}
button.active{background:var(--sel); border-color:var(--sel-line); color:#1e40af; font-weight:600}
button.danger{color:var(--red); border-color:#f0c4c4}
button.danger:hover{background:var(--red-bg)}
.navwrap{padding:16px 20px 0}
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.navgrid button{padding:6px 0; font-size:13px; border-radius:7px; text-align:center; font-variant-numeric:tabular-nums}
.navgrid button.done{background:#eef2ff; border-color:#c7d2fe; color:#3730a3}
.navgrid button.right{background:var(--green-bg); border-color:#a7d7b6; color:var(--green); font-weight:700}
.navgrid button.wrong{background:var(--red-bg); border-color:#eeb4b4; color:var(--red); font-weight:700}
main{max-width:900px; margin:0 auto; padding:20px 20px 80px}
.parttitle{
  margin:34px 0 14px; font-size:15px; font-weight:700; color:var(--dim);
  border-left:4px solid var(--blue); padding-left:10px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:14px;
}
.q.correct{border-color:#a7d7b6; background:var(--green-bg)}
.q.incorrect{border-color:#eeb4b4; background:var(--red-bg)}
.qhead{display:flex; gap:10px; align-items:flex-start}
.num{
  flex:0 0 auto; min-width:30px; height:26px; line-height:26px; text-align:center;
  background:#eef1f5; border-radius:7px; font-size:13px; font-weight:700;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.qtext{margin:0; font-weight:600; font-size:16px}
.opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:7px}
.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff;
  cursor:pointer; transition:.12s; user-select:none;
}
.opt:hover{border-color:#b9c0c9; background:#fbfbfc}
.opt .lt{
  flex:0 0 auto; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:#eef1f5; font-size:12px; font-weight:700; color:var(--dim);
}
.opt.picked{border-color:var(--sel-line); background:var(--sel)}
.opt.picked .lt{background:var(--sel-line); color:#fff}
.opt.right{border-color:#7cc08f; background:var(--green-bg)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:#e39191; background:var(--red-bg)}
.opt.wrong .lt{background:var(--red); color:#fff}
.tag{font-size:11px; padding:1px 7px; border-radius:99px; margin-left:auto;
     flex:0 0 auto; font-weight:700; align-self:center}
.tag.right{background:var(--green); color:#fff}
.tag.wrong{background:var(--red); color:#fff}
.expl{
  margin-top:12px; padding:11px 14px; background:#f8fafc; border-radius:9px;
  border-left:3px solid var(--blue); font-size:14.5px; color:#333a44;
}
.expl b{color:var(--txt)}
.empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px}
footer{
  max-width:900px; margin:0 auto; padding:0 20px 60px; color:var(--dim);
  font-size:13px; text-align:center;
}
@media print{
  .topbar,.navwrap,footer,.controls{display:none !important}
  body{background:#fff; font-size:12pt}
  main{max-width:none; padding:0}
  .q{break-inside:avoid; page-break-inside:avoid; border-color:#999}
}
@media (max-width:560px){
  .topbar{padding:10px 14px 8px}
  .topbar h1{font-size:15px}
  main{padding:14px 14px 60px}
  .navwrap{padding:12px 14px 0}
  .q{padding:13px 14px}
  .qtext{font-size:15px}
}
</style>

<script>
const QUESTIONS = [{"q":"Lesson 7 依序介紹的四個桌面 App 是？","o":["LM Studio → Ollama → AnythingLLM → GPT4All","Ollama → LM Studio → GPT4All → AnythingLLM","ChatGPT → Claude → Gemini → Copilot","LangChain → LlamaIndex → Streamlit → Flask"],"a":0,"e":"課程切四塊：LM Studio、Ollama、AnythingLLM、GPT4All。這個順序要背。"},{"q":"四個 App 中，哪一個**同時提供 CLI 與 REST API**？","o":["LM Studio","Ollama","AnythingLLM","GPT4All"],"a":1,"e":"只有 Ollama 同時有命令列與 REST API（預設 11434）。它也是唯一被後續課程（LiteLLM、LlamaIndex、Streamlit）直接當成後端的一個。"},{"q":"四個 App 中，哪一個**不自帶模型、必須接一個 provider**？","o":["LM Studio","Ollama","AnythingLLM","GPT4All"],"a":2,"e":"AnythingLLM 是「工作區＋文件庫」的前端，本身不提供模型。它的 provider 清單同時含雲端（OpenAI／Anthropic／Gemini／NVIDIA NIM）與本機（Ollama／LM Studio）。"},{"q":"Ollama REST API 的預設埠號是？","o":["5000","8080","8501","11434"],"a":3,"e":"11434 是 Ollama 的預設埠。這個數字一路貫穿：LiteLLM 的 api_base、LlamaIndex 的 base_url、Streamlit 的 ollama.chat() 全都用它。"},{"q":"GGUF 是什麼？","o":["一種單一檔案格式：權重 ＋ tokenizer 詞表 ＋ 超參數全包在一個檔案裡","一種推論引擎（實際做矩陣運算的程式）","一種量化演算法","一種雲端 API 協定"],"a":0,"e":"GGUF ＝ GGML Universal File，由 llama.cpp 專案定義。它的價值是「一個檔案就能跑」，不需要額外的 config.json／tokenizer.json。"},{"q":"實際負責矩陣運算（推論）的是哪一層？","o":["Ollama","llama.cpp","LM Studio","Hugging Face Hub"],"a":1,"e":"四層堆疊是：App（Ollama／LM Studio）→ 推論引擎 llama.cpp → GGUF 檔 → CPU/GPU。Ollama 與 LM Studio 只是引擎的管理介面。"},{"q":"量化標記 `Q4_K_M` 裡的「4」代表什麼？","o":["k-quant 的第 4 代","模型有 4 億參數","每個權重約用 4 bits 儲存","需要 4 GB 記憶體"],"a":2,"e":"Q ＝ Quantized，4 ＝ 每個權重的位元數，K ＝ k-quant（混合精度方法），M ＝ medium 變體。數字越小檔案越小、品質越差。"},{"q":"社群公認「品質／大小甜蜜點」、不確定時最推薦的量化等級是？","o":["Q2_K","Q8_0","F16","Q4_K_M"],"a":3,"e":"Q4_K_M 是 4-bit 中最推薦的。F16 是原始精度（最大）、Q8_0 接近原始但檔案大、Q2_K 明顯變差。 選的是同級的 Q4_K_S。"},{"q":"下列哪一組是「跑本機 LLM」的四個主要好處？","o":["隱私、成本、離線、控制","速度快、準確、便宜、支援中文","免安裝、免設定、免更新、免備份","可訓練、可微調、可量化、可部署"],"a":0,"e":"本機 LLM 的四大好處是隱私（資料不外流）、成本（沒有 per-token 費用）、離線（斷網可用）、控制（版本自己決定）。主要限制是模型能力（參數量小）。"},{"q":"GPT4All 是哪一家公司開發的？","o":["OpenAI","Nomic AI","Meta","Mintplex Labs"],"a":1,"e":"GPT4All 由 Nomic AI 開發，網址 nomic.ai/gpt4all，特色是可在純 CPU 上執行。AnythingLLM 才是 Mintplex Labs。"},{"q":"四個 App 中，哪一個**沒有內建 RAG**（檔案問答）？","o":["LM Studio","GPT4All","Ollama","AnythingLLM"],"a":2,"e":"LM Studio 可附加檔案、GPT4All 有 My Documents、AnythingLLM 有工作區文件庫——只有 Ollama 沒有內建 RAG，必須自己寫程式（§28）。"},{"q":"選擇本機 LLM 方案時，**第一個**要問自己的問題是？","o":["我的電腦多少錢","模型有多大","要不要買 GPU","我要「用現成 App」還是「自己寫程式」"],"a":3,"e":"第一分岔是「用 App」vs「自己寫」。第二分岔是「有沒有文件要問」，第三是「硬體夠不夠」。課程前半教用 App，lesson67 的 Lab 全部在教自己寫。"},{"q":"LM Studio 的官方下載網址是？","o":["lmstudio.ai/download","ollama.com/download","anythingllm.com/desktop","nomic.ai/gpt4all"],"a":0,"e":"四個 App 的網址要分清楚：LM Studio → lmstudio.ai/download；Ollama → ollama.com/download；AnythingLLM → anythingllm.com/desktop；GPT4All → nomic.ai/gpt4all。"},{"q":"LM Studio 首次啟動引導中，預設推薦下載的第一個模型是？","o":["deepseek-llm-7B","TinyLlama-1.1B","google/gemma-3-4b（3.34 GB）","Llama-3.2-1B-Instruct"],"a":2,"e":"p10 的截圖顯示推薦 google/gemma-3-4b，標籤 gemma3／4B，大小 3.34 GB（已量化）。說明文字提到它與 Gemini 系出同源。"},{"q":"LM Studio 第一次開啟時，一定要下載模型才能繼續嗎？","o":["要，不下載無法進入主介面","不用，畫面上有 Skip for now 可以跳過","要，但可以事後用指令下載","要，且必須先登入帳號"],"a":1,"e":"p10 除了 Download 按鈕外還有 Skip for now 連結。之後仍可在主介面用左側的「模型」圖示下載（§8）。"},{"q":"LM Studio 的模型設定中，被課程用紅線標出、決定推論**效能**的關鍵參數是？","o":["Context Length","CPU Thread Pool Size","Evaluation Batch Size","GPU Offload"],"a":3,"e":"p15 把 GPU Offload 標為重點。它決定有多少層放到 GPU；GPU 記憶體不足時可以調小，仍能跑但較慢。"},{"q":"在 LM Studio 改完模型參數後，必須做什麼才會生效？","o":["按 Reload to apply changes","重新開機","重新下載模型","切換到別的對話"],"a":0,"e":"p15 底部的 Reload to apply changes 就是套用鈕。沒按的話參數不會生效——這是最常見的「以為改了卻沒效」原因。"},{"q":"LM Studio 進階設定裡的「Start local LLM service on login」開關，作用是？","o":["讓 LM Studio 開機自動更新","登入時自動啟動本機模型伺服器，讓別的程式能連進來用","讓模型自動上傳到雲端","開啟 GPU 加速"],"a":1,"e":"這個開關讓 LM Studio 在背景提供本機 API 服務，AnythingLLM 之類的前端才連得上。這也是下載頁標語「Chat interface and programmable API」的來源。"},{"q":"在 LM Studio 裡從 Hugging Face 下載模型時，Format 欄位顯示的一定是？","o":["safetensors","PyTorch","GGUF","ONNX"],"a":2,"e":"p13 的模型卡顯示 Format: GGUF，並有 12 download options available（就是不同量化等級）。llama.cpp 生態只吃 GGUF。"},{"q":"課程在 LM Studio 示範下載的 Hugging Face repo 與量化等級是？","o":["TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF，Q4_K_M","google/gemma-3-4b，Q8_0","meta-llama/Llama-3.2-1B，F16","TheBloke/deepseek-llm-7B-base-GGUF，Q4_K_S（4.03 GB）"],"a":3,"e":"p13 輸入 https://huggingface.co/TheBloke/deepseek-llm-7B-base-GGUF，選 Q4_K_S、4.03 GB。同一個 repo 有 12 種量化可選。"},{"q":"在 LM Studio 附加檔案提問時，畫面出現的關鍵字是什麼？","o":["Chosen context injection strategy: 'retrieval'","RAG mode enabled","Vector search started","Document embedding finished"],"a":0,"e":"p16 顯示三行進度：選定 context injection strategy（'retrieval'）、檢索相關引用、對檔案做 embedding（9.1%）。這正是 RAG 的完整流程。"},{"q":"Ollama 的官方下載網址是？","o":["lmstudio.ai/download","ollama.com/download","ollama.ai/install","nomic.ai/ollama"],"a":1,"e":"p18 的網址是 https://ollama.com/download，提供 macOS／Linux／Windows 三平台，Windows 需 10 或更新。另有 PowerShell 一行安裝法。"},{"q":" 模型表中，檔案最小（約 100 MB）的模型是？","o":["tinyllama","llama3.2:1b","smollm2:135m","qwen2.5:0.5b"],"a":2,"e":"smollm2:135m 只有 135M 參數、約 100 MB，課程標明適合「Ultra-light prototyping, edge devices」。課程第二輪就是用它示範。"},{"q":" 模型表中，哪一個標明「多語言、回應快」？","o":["tinyllama","llama3.2:1b","gemma2:2b","qwen2.5:0.5b"],"a":3,"e":"qwen2.5:0.5b（0.5B／~300 MB）標明 Multilingual，因為 Qwen 系列出自阿里巴巴，中文支援是強項。要跑中文就選它。"},{"q":"`ollama run tinyllama` 這一行指令實際上做了哪三件事？","o":["只下載模型","檢查本機有沒有 → 沒有就自動 pull → 直接進入互動對話","只進入對話","啟動 REST 服務 → 下載模型 → 關閉服務"],"a":1,"e":"這是 Ollama 最方便的地方：一行從「什麼都沒有」變成「正在跟模型對話」。要只下載不下載對話就用 ollama pull。"},{"q":"在 Ollama 的互動對話模式中，要清空上下文該輸入什麼？","o":["/exit","/reset","/bye","/clear"],"a":3,"e":"互動模式三個指令：/bye（或 Ctrl+D）離開、/clear 清上下文、/? 看幫助。互動模式是有記憶的，接著問「它」會知道指誰。"},{"q":"請求一個**本機沒有安裝**的模型時，Ollama 會回哪個 HTTP 狀態碼？","o":["404","400","500","200"],"a":0,"e":"實測 llama3 與 llama3.2:1b 都回 404，內容是 {\"error\":\"model 'llama3' not found\"}。注意是 404 不是 400——這是實測得到的結論。"},{"q":"環境變數 `OLLAMA_HOST=0.0.0.0` 會造成什麼問題？","o":["Ollama 服務起不來","模型無法下載","`ollama` python 套件連不上（但 curl 打得通）","會自動改用 11435 埠"],"a":2,"e":"0.0.0.0 是「綁定位址」不是「連線位址」。ollama python 套件會直接拿它當連線目標而失敗。解法：明確指定 host=\"http://127.0.0.1:11434\"。"},{"q":"`testollama.py` 用來呼叫 Ollama 的核心一行是？","o":["ollama.generate(...)","requests.get(...)","requests.post(\"http://.../api/generate\", json=payload)","openai.ChatCompletion.create(...)"],"a":2,"e":"課程用最底層的 requests.post 打 /api/generate，再從 response.json()['response'] 取回文字。知道這個就理解了所有 GUI 背後的原理。"},{"q":"`testollama.py` 一執行就失敗，真正原因是什麼？","o":["它寫死的模型 llama3 不在模型表裡，本機沒安裝 → 404","requests 套件沒安裝","Ollama 服務沒有啟動","Prompt 太長超過 context"],"a":0,"e":"學生照著 §12 只裝了 tinyllama 與 smollm2:135m，但腳本卻寫 \"model\": \"llama3\"。這是最典型的「照著做會失敗」缺陷。"},{"q":"`torch.tensor([ord(c) for c in result[:100]])` 算出來的是什麼？","o":["真正的 token ID","字元的 ASCII 碼（沒有任何語意）","768 維嵌入向量","詞袋表示"],"a":1,"e":"課程註解自己承認是 dummy representation。tokenization 是依詞表切 token 成 token ID；embedding 是映射成固定維度的稠密浮點向量、有語意。ASCII 兩者都不是。"},{"q":"AnythingLLM 的 provider 清單中，哪兩個是**本機、不需要 API Key** 的？","o":["OpenAI 與 Anthropic","Gemini 與 NVIDIA NIM","AnythingLLM 與 OpenAI","Ollama 與 LM Studio"],"a":3,"e":"p34 的清單是：AnythingLLM／OpenAI／Anthropic／Gemini／NVIDIA NIM／Ollama／LM Studio。後兩者直接讀本機 11434 埠的模型。"},{"q":"GPT4All 的 My Documents 設定中，「允許的副檔名」預設值是什麼？","o":["docx,pdf,txt,md,rst","pdf,doc,xls,ppt","txt,json,csv,xml","任意副檔名都會被處理"],"a":0,"e":"p41 顯示 docx,pdf,txt,md,rst，說明是「以逗號分隔的列表」。不在清單裡的檔案不會被索引——這是最常見的「為什麼我的檔案沒被讀到」。"},{"q":"在 GPT4All 加入文件之後，還要做什麼才能讓聊天用到它？","o":["重新啟動 GPT4All","把檔案轉成 PDF","選中該集合（Collection），使其可供交談模型使用","把模型換成更大的"],"a":2,"e":"p44 右側提示「選擇一個收藏以使其可供交談模型使用」，右上角按鈕顯示「1 我的文件」代表啟用 1 個集合。只加不選是沒有用的。"},{"q":"Streamlit 最重要、也最反直覺的特性是什麼？","o":["只能用 Python 3.8","不能顯示中文","每次互動都重跑整支腳本","一定要連資料庫"],"a":2,"e":"這與 Flask／Django（只跑指定的 route）完全不同。所以變數每次都會消失，必須用 st.session_state 保存；重複運算則用 @st.cache_data。"},{"q":"`app_web.py` 用什麼保存對話歷史？","o":["一個全域變數","寫進檔案","存在 Ollama 伺服器","st.session_state"],"a":3,"e":"因為 Streamlit 每次互動都重跑整支腳本，所以要用 if \"messages\" not in st.session_state 做「只初始化一次」的判斷，否則對話永遠只有一輪。"},{"q":"`LangChain.ipynb` 用什麼方式載入 GGUF 模型？","o":["透過 Ollama 的 REST API","用 transformers 的 AutoModelForCausalLM","用 langchain_community 的 LlamaCpp 直接把 GGUF 載進 Python 行程","用 llama-index 的 Ollama 整合"],"a":2,"e":"這是「路徑 B」：不經過 Ollama 服務，模型直接在你的 Python 行程內推論。課程選它是因為 Colab 上裝 Ollama 很麻煩。"},{"q":"`LlamaCpp(model_path=..., n_gpu_layers=0)` 裡的 `n_gpu_layers=0` 代表什麼？","o":["完全用 CPU 執行","完全用 GPU 執行","自動偵測","停用模型"],"a":0,"e":"0 層放到 GPU ＝ 純 CPU。這與 LM Studio 的 GPU Offload 是同一件事，只是一個在 GUI 拉、一個在程式碼寫。課程註解直接寫 CPU only!。"},{"q":"`LangChain.ipynb` 示範的檢索方式，與真正的向量檢索最根本的差別是？","o":["速度差別","是否需要 GPU","能處理的檔案大小","前者比「字面是否相同」（數相同單字），後者比「語意是否相近」（餘弦相似度）"],"a":3,"e":"課程註解明說 REAL EMBEDDINGS do math similarity; this shows the CONCEPT!。關鍵字檢索找不到同義詞（car vs automobile），向量檢索可以，但需要嵌入模型 ＋ 相似度計算。"},{"q":"RAG 的六個步驟，正確順序是？","o":["切塊 → 嵌入 → 索引 → 檢索 → 增強 → 生成","檢索 → 切塊 → 嵌入 → 生成 → 索引 → 增強","嵌入 → 生成 → 檢索 → 切塊 → 索引 → 增強","生成 → 檢索 → 嵌入 → 切塊 → 索引 → 增強"],"a":0,"e":"記法：先切、再算向量、存起來、查、塞進 prompt、生成。核心價值是「模型不需要知道你的文件，只要讀得到」。"},{"q":"餘弦相似度（cosine similarity）的數值範圍是？","o":["0 到 1","0 到 ∞","−∞ 到 ∞","−1 到 1"],"a":3,"e":"公式是 (A·B) / (|A| |B|)。因為只看方向、不看長度，所以「長文件」與「短文件」只要講同一件事，相似度就會高。"},{"q":"`RAG.ipynb` 用 `max_length=max_length`（滑桿預設 50）有什麼問題？","o":["完全沒有問題","max_length 是「輸入＋輸出」的總長度，設太小會讓檢索到的內容被 truncation=True 默默截斷","max_length 只能設 100 以上","max_length 是 GPU 記憶體上限"],"a":1,"e":"RAG 的 prompt 動輒數百 token，設 50 輕則 ValueError，重則被截斷——檢索到的關鍵內容根本沒進模型，RAG 等於白做。正確做法是用 max_new_tokens。"},{"q":"`LangIndex.ipynb` 的架構是哪一種？","o":["全部在本機跑","全部在雲端跑","全部用 Hugging Face 免費 API","混合：生成用雲端 Groq、嵌入用本機 HuggingFaceEmbedding"],"a":3,"e":"嵌入要跑很多次（每段一次），放本機省錢又保護隱私；生成只要跑一次，用雲端品質較好。分別由 Settings.llm 與 Settings.embed_model 指定。"},{"q":"`LangIndex.ipynb` 最嚴重的問題是什麼？","o":["import 錯誤","缺少 pip install","把一把真實可用的 Groq API key 寫死在程式碼裡","使用了已淘汰的 API"],"a":2,"e":"正確做法是用環境變數或 Colab Secrets。而且更關鍵的是：沒有那把 key 的學員跑不動——筆記提供改用 llama-index-llms-ollama 的替代路徑。"},{"q":"LoRA 以 rank r=8 微調一個 4096×4096 的權重矩陣時，可訓練參數約是原本的多少？","o":["約 0.39%（65,536 / 16,777,216）","約 4%","約 25%","完全相同"],"a":0,"e":"A（4096×8）＋ B（8×4096）＝ 32,768 ＋ 32,768 ＝ 65,536。LoRA 凍結原權重 W，只訓練 A、B，使 W' = W + A×B。"},{"q":"`train.py` 與 `LoRA.txt` 有什麼不一致？","o":["檔案不存在","train.py 其實是「全參數微調」（optimizer 用 model.parameters()），完全沒有 import peft","LoRA.txt 寫錯了公式","兩者完全一致"],"a":1,"e":"LoRA.txt 教的是 LoRA，run.txt 也裝了 peft，但 train.py 從頭到尾沒有 LoraConfig／get_peft_model。兩者都是微調，但成本差很多。"},{"q":"`train.jsonl` 的實際狀況是？","o":["1000 筆多樣化資料","73 行但只有 1 個唯一樣本，且樣本是佔位字串","格式錯誤無法讀取","是 CSV 不是 JSONL"],"a":1,"e":"實測 73 行、Sort-Object -Unique 後只剩 1 行。內容是 ### Instruction / ### Input / ### Response 的 Alpaca 格式，但 Input 是「Large Language Models are...」、Response 斷在「They are models that Chinese」。"},{"q":"`Modelfile` 的 `TEMPLATE \"\"\"{{ .Prompt }}\"\"\"` 有什麼問題？","o":["沒有問題","少了 FROM","PARAMETER 寫錯","完全沒有角色（role）標記，導致 /api/chat 送進去的 messages 被丟掉"],"a":3,"e":"正確的模板要有 <|start_header_id|>system/user/assistant 之類的角色標記。加上底層是 GPT-2（base model），所以 mymodel 短指令回空字串、接續式提示則鬼打牆。"},{"q":"`Maze.ipynb` 的 DQN 環境中，智能體有幾個動作可選？","o":["2","4（上下左右）","8","25"],"a":1,"e":"動作編號是 0=up、1=down、2=left、3=right。狀態是位置 (row, col)，並正規化到 [0,1]；起點 (0,0)、終點 (4,4)。"},{"q":"`Maze.ipynb` 中每一走一步的預設獎勵是多少？","o":["+1","0","−0.5","−1"],"a":3,"e":"reward = -1 是「步數懲罰（step penalty）」，讓智能體盡快走到終點。若不扣分，智能體可能學會原地打轉。"},{"q":"DQN 的三個核心元件是？","o":["Q 網路、經驗回放（deque）、目標網路","編碼器、解碼器、注意力","生成器、判別器、噪聲","嵌入層、池化層、全連接層"],"a":0,"e":"經驗回放把 (s,a,r,s',done) 存進 deque 再隨機抽樣訓練，解決「連續經驗高度相關」導致訓練不穩的問題。貝爾曼式：Q(s,a) ← r + γ·max Q(s',a')。"},{"q":"把 `scarves` 還原成 `scarf`，用的是哪一種技術？","o":["Stemming（Porter Stemmer）","Tokenizing","Lemmatizing（WordNetLemmatizer）","POS tagging"],"a":2,"e":"Stemming 是「砍字尾」（scarves→scarv，不是真詞）；Lemmatizing 是「查字典」（scarves→scarf，一定是真詞）。一句話：Stemming 砍、Lemmatizing 查。"},{"q":"過濾停用詞（stop words）時，最需要注意的陷阱是什麼？","o":["會把 not 也濾掉，導致語意反轉","會讓速度變慢","會改變檔案編碼","只能處理英文"],"a":0,"e":" Worf 引句「I am not a merry man」過濾後變成 ['Sir', ',', 'protest', '.', 'merry', 'man', ' !']——not 消失了。做情感分析時這會致命。"},{"q":"POS tagging 判斷詞性的依據是什麼？","o":["只看字典","詞的定義 ＋ 它在句子中的上下文（context）","只看詞的長度","只看出現頻率"],"a":1,"e":"課程定義強調 based on its definition as well as its context。同一個詞在不同句子裡詞性可能不同（book 可當名詞也可當動詞）。"},{"q":"NLTK 的 `nltk.ne_chunk()`（NER）吃的輸入是什麼？","o":["原始文字字串","句子清單","詞袋向量","已經 POS tag 過的結果"],"a":3,"e":"這印證了「POS tagging 是 NER 的前置步驟」。Chunking 也一樣：先 POS tag，再用正則片語文法（如 NP: {<DT>?<JJ>*<NN>}）切出片語。"},{"q":"文字分類主要有哪三種做法？","o":["統計、深度學習、強化學習","人工、自動、半自動","Rule-based System、Machine Learning System、Hybrid System","監督式、非監督式、自我監督"],"a":2,"e":"課程列出這三種，並說三大應用是 sentiment analysis、topic detection、language detection。ML 系統用 bag of words 做特徵。"},{"q":"文字摘要的 Extractive 與 Abstractive 兩種模式，差別是？","o":["前者較慢","前者從原文挑出重要句子，後者用自己的話重寫出新句子","前者需要 GPU","兩者完全相同"],"a":1,"e":"Extractive 不會產生幻覺但可能冗長；Abstractive 流暢但可能出錯。課程說可以 combine them。RAG 用弱模型時常退化成 extractive。"},{"q":"本機實測中，`smollm:latest` 單輪對話（warm）耗時約多少？","o":["1.38 秒","14.59 秒","0.10 秒","87 秒"],"a":0,"e":"實測環境：Python 3.11.15／Ollama 0.40.3。對照組 mymodel 要 10.91 秒（因為是未量化的 GPT-2 F16）。"},{"q":"Lab 建出的 `mymodel` 實際上底層是什麼模型？","o":["Llama-3.2-1B-Instruct","TinyLlama-1.1B","GPT-2 124M（F16，僅 completion 能力）","SmolLM-135M"],"a":2,"e":"ollama show mymodel 顯示 architecture gpt2、parameters 124.44M、quantization F16、capabilities completion。這解釋了它為什麼不會「聽指令」。"},{"q":" 模型表在同一列上有什麼自我矛盾？","o":["大小與參數量對不上","Model 欄寫 phi3:3.8b，但 Command 欄寫 ollama run phi3（少了 :3.8b）","把 gemma2 寫成 gemma3","把 tinyllama 寫成 tinyllama2"],"a":1,"e":"同一列前後不一致。而且 app_web.py 又出現第三種寫法 phi3:mini——同一個模型在課程有三種名稱，考試時要認得。"}];

const LET = 'ABCD';
const KEY = 'local-llm-mc-quiz-v1';
const state = { answers:{}, revealed:false, filter:'all' };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && typeof p === 'object'){
      state.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      state.revealed = !!p.revealed;
      state.filter = p.filter || 'all';
    }
  }catch(e){}
}
let savedTimer = null;
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    if(el){ el.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(function(){ el.classList.remove('on'); }, 1200); }
  }catch(e){}
}

function tally(){
  let answered = 0, score = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    if(a !== undefined && a !== null){
      answered++;
      if(a === QUESTIONS[i].a) score++;
    }
  }
  return { answered:answered, score:score, wrong:answered-score };
}

function isVisible(i){
  const a = state.answers[i];
  const has = (a !== undefined && a !== null);
  if(state.filter === 'unanswered') return !has;
  if(state.filter === 'wrong') return has && a !== QUESTIONS[i].a;
  return true;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdInline(s){
  s = esc(s);
  let out = '';
  let bold = false;
  let i = 0;
  while(i < s.length){
    if(s.charAt(i) === '*' && s.charAt(i + 1) === '*'){
      bold = !bold;
      out += bold ? '<b>' : '</b>';
      i += 2;
    } else {
      out += s.charAt(i);
      i++;
    }
  }
  return out;
}

function renderStats(){
  const t = tally();
  document.getElementById('nAns').textContent = t.answered;
  document.getElementById('nScore').textContent = t.score;
  document.getElementById('nWrong').textContent = t.wrong;
  document.getElementById('bar').style.width = (t.answered / QUESTIONS.length * 100) + '%';
  document.getElementById('btnReveal').textContent = state.revealed ? '隱藏答案' : '顯示答案';
  document.getElementById('hint').textContent = state.revealed
    ? '已顯示正解與解析'
    : '作答進度自動存在此瀏覽器，關掉再回來可繼續';
}

function renderNav(){
  const nav = document.getElementById('navgrid');
  let html = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const a = state.answers[i];
    const has = (a !== undefined && a !== null);
    let cls = '';
    if(has) cls = 'done';
    if(state.revealed && has) cls = (a === QUESTIONS[i].a) ? 'right' : 'wrong';
    html += '<button class="' + cls + '" data-goto="' + i + '">' + (i+1) + '</button>';
  }
  nav.innerHTML = html;
}

function renderQuestions(){
  const box = document.getElementById('quiz');
  let html = '';
  let shown = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(!isVisible(i)) continue;
    shown++;
    const q = QUESTIONS[i];
    if(i === 0 || i === 12 || i === 24 || i === 36 || i === 48){
      const label = i === 0 ? '第一部分：定位、GGUF 與量化、四 App 對照（1–12）'
                  : i === 12 ? '第二部分：LM Studio 與 Ollama 操作（13–24）'
                  : i === 24 ? '第三部分：REST API、AnythingLLM 與 GPT4All（25–36）'
                  : i === 36 ? '第四部分：LangChain、RAG、LlamaIndex 與微調（37–48）'
                  : '第五部分：RL 補充、NLP 基礎與本機實測（49–60）';
      html += '<div class="parttitle">' + label + '</div>';
    }
    const picked = state.answers[i];
    const hasPicked = (picked !== undefined && picked !== null);
    let qcls = '';
    if(state.revealed && hasPicked) qcls = (picked === q.a) ? 'correct' : 'incorrect';

    html += '<article class="q ' + qcls + '" id="q' + (i+1) + '">';
    html += '<div class="qhead"><span class="num">' + (i+1) + '</span>';
    html += '<p class="qtext">' + mdInline(q.q) + '</p></div>';
    html += '<ul class="opts">';
    for(let k=0;k<q.o.length;k++){
      let cls = 'opt';
      if(hasPicked && picked === k) cls += ' picked';
      let tag = '';
      if(state.revealed){
        if(k === q.a){ cls += ' right'; tag = '<span class="tag right">正解</span>'; }
        else if(hasPicked && picked === k){ cls += ' wrong'; tag = '<span class="tag wrong">你選的</span>'; }
      }
      html += '<li class="' + cls + '" data-q="' + i + '" data-k="' + k + '">';
      html += '<span class="lt">' + LET[k] + '</span><span>' + esc(q.o[k]) + '</span>' + tag + '</li>';
    }
    html += '</ul>';
    if(state.revealed){
      html += '<div class="expl"><b>答案 ' + LET[q.a] + '。</b> ' + mdInline(q.e) + '</div>';
    }
    html += '</article>';
  }
  if(shown === 0){
    html = '<div class="empty">目前篩選條件下沒有題目 &#128522;<br>換個篩選，或按「全部 60 題」。</div>';
  }
  box.innerHTML = html;
}

function renderAll(){ renderStats(); renderNav(); renderQuestions(); }

document.addEventListener('click', function(ev){
  const opt = ev.target.closest ? ev.target.closest('.opt') : null;
  if(opt){
    state.answers[parseInt(opt.getAttribute('data-q'), 10)] = parseInt(opt.getAttribute('data-k'), 10);
    saveState();
    renderAll();
    return;
  }
  const go = ev.target.closest ? ev.target.closest('[data-goto]') : null;
  if(go){
    const idx = parseInt(go.getAttribute('data-goto'), 10);
    if(state.filter !== 'all'){ state.filter = 'all'; syncFilterButtons(); renderAll(); }
    const el = document.getElementById('q' + (idx + 1));
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px rgba(37,99,235,.35)';
      setTimeout(function(){ el.style.boxShadow = ''; }, 900);
    }
    saveState();
  }
});

function syncFilterButtons(){
  const map = { all:'btnAll', unanswered:'btnUnans', wrong:'btnWrong' };
  for(const k in map){
    const b = document.getElementById(map[k]);
    if(b) b.classList.toggle('active', state.filter === k);
  }
}

function setFilter(f){
  state.filter = f;
  syncFilterButtons();
  saveState();
  renderAll();
}

function bind(){
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.revealed = !state.revealed; saveState(); renderAll();
  });
  document.getElementById('btnAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('btnUnans').addEventListener('click', function(){ setFilter('unanswered'); });
  document.getElementById('btnWrong').addEventListener('click', function(){ setFilter('wrong'); });
  document.getElementById('btnTop').addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('確定要清除全部作答紀錄嗎？此動作無法復原。')) return;
    state.answers = {}; state.revealed = false; state.filter = 'all';
    saveState(); syncFilterButtons(); renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.revealed){ state.revealed = false; saveState(); renderAll(); }
  });
}

loadState();
syncFilterButtons();
renderAll();
bind();
</script>
</body>
</html>
