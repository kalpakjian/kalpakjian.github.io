name: Notes QA tools (selftest)

# Regression tests for the tools/notes-qa scripts themselves
# (tools/notes-qa/selftest_tools.py): builds a throwaway note fixture, runs each tool
# from a foreign cwd, and asserts the expected edit -- so a broken root discovery or a
# Windows-only assumption fails here instead of silently doing nothing.
#
# Runs only when the toolset changes, so it never duplicates the gate's CI minutes.
# Deliberately NOT continue-on-error: a broken tool is a real defect worth a red X.
# It still cannot block a deployment, because pages.yml is a separate workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'tools/notes-qa/**'
      - 'tools/ainews/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tools selftest
        shell: pwsh
        run: |
          python3 tools/notes-qa/selftest_tools.py
          exit $LASTEXITCODE

      # AINews 偵測器：13 項測試，多數在驗「什麼不該觸發」。
      # ledger 一旦寫錯就會重複發文或漏發，所以這裡是硬閘門，不是 advisory。
      - name: Run AINews detector selftest
        shell: pwsh
        run: |
          python3 tools/ainews/selftest.py
          exit $LASTEXITCODE

      # AINews 抽取器（階段 2）：21 項行為測試 + 105 KB 規模壓力測試。
      # 抽取漏掉 boilerplate 就會讓廣告文案混進文章，所以也是硬閘門。
      - name: Run AINews extractor selftest
        shell: pwsh
        run: |
          python3 tools/ainews/selftest_extract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 tools/ainews/_make_large_fixture.py
          python3 tools/ainews/stress_extract.py tools/ainews/fixtures/large-issue.json
          exit $LASTEXITCODE

      # AINews 導讀閘門（階段 3）：11 項測試。
      # 其中 t1 拿「已發布的兩篇」當黃金樣本——閘門若連好文章都擋，就沒人會用
      # 它，等於失去保護。所以這一步同時驗「抓得到錯」與「不誤報」。
      - name: Run AINews digest lint selftest
        shell: pwsh
        run: |
          python3 tools/ainews/selftest_lint.py
          exit $LASTEXITCODE

      # 階段 3b 寫稿大綱：17 項。每條測試都對應一個在真實資料上看到的 bug
      # （日期被當量化指標、句首大寫被當實體、六個重複候選……）。
      - name: Run AINews brief selftest
        shell: pwsh
        run: |
          python3 tools/ainews/selftest_brief.py
          exit $LASTEXITCODE
