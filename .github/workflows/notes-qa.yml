name: Notes QA (non-blocking)

# Advisory quality gate for the study notes (tools/notes-qa/qa_notes.ps1).
#
# Separate from pages.yml and continue-on-error, so it can never block a deploy.
# The gate is invoked EXACTLY ONCE: this single step runs it, publishes the result to
# the job summary, and re-exits with the gate's own exit code -- so a failure still
# shows up as a red step without costing a second run.
#
# Triggered by note changes only. Tool changes are covered by notes-qa-tools.yml,
# which keeps the two runs from overlapping.

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run notes QA gate and publish summary
        shell: pwsh
        run: |
          try {
            $out = & ./tools/notes-qa/qa_notes.ps1 2>&1 | Out-String
            $code = $LASTEXITCODE
          } catch {
            $out = $_ | Out-String
            $code = 1
          }
          Write-Output $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Notes QA result'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          exit $code
