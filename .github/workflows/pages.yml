name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 品質閘門：擋在部署前面。這裡是「唯一」執行 qa_notes.ps1 的地方
  # （舊的 notes-qa.yml 已移除），閘門失敗就讓整個 workflow 停在第一步。
  qa:
    name: Notes QA gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run notes QA gate and publish summary
        shell: pwsh
        run: |
          try {
            $out = & ./tools/notes-qa/qa_notes.ps1 2>&1 | Out-String
            $code = $LASTEXITCODE
          } catch {
            $out = $_ | Out-String
            $code = 1
          }
          Write-Output $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Notes QA result'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          exit $code

  build:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Hexo
        run: npx hexo clean && npx hexo generate

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
