name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 品質閘門：擋在部署前面。這裡是「唯一」執行 qa_notes.ps1 的地方
  # （舊的 notes-qa.yml 已移除），閘門失敗就讓整個 workflow 停在第一步。
  qa:
    name: Notes QA gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run notes QA gate and publish summary
        shell: pwsh
        run: |
          try {
            $out = & ./tools/notes-qa/qa_notes.ps1 2>&1 | Out-String
            $code = $LASTEXITCODE
          } catch {
            $out = $_ | Out-String
            $code = 1
          }
          Write-Output $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Notes QA result'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          exit $code

  build:
    needs: qa
    runs-on: ubuntu-latest
    # Permalinks (:year/:month/:day) are rendered in the runner's local time,
    # while _config.yml parses front-matter dates in Asia/Taipei. A UTC runner
    # therefore puts any post dated 00:00-07:59 one day earlier than the author
    # intended (2026-10-29 03:30 -> /2026/10/28/...), so the URL disagrees with
    # the date shown on the page and with every local preview. Pin the runner to
    # the site timezone so both sides compute the same URL.
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # Node 20 is EOL (20.20.2): its bundled roots permanently trust the eMudhra CAs; 24.x rejects that chain
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Hexo
        run: npx hexo clean && npx hexo generate

      # cnn-lab 圖檔的結構守門員：純 Python、零依賴、結果確定（不合格就擋住部署）
      - name: SVG structure gate (cnn-lab)
        run: python3 source/cnn-lab/code/build_figs.py --no-measure

      # 文字量測依賴 Chrome 字型度量，跨平台可能有 1–2px 差異 → 只做參考，不擋部署
      - name: SVG text measurement (advisory)
        continue-on-error: true
        run: python3 source/cnn-lab/code/build_figs.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
