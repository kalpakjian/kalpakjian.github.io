ext x="68" y="476" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">bias 加在整個特徵圖上（這裡 bias = 0）；若 bias = 1，九格全部 +1。</text><text x="48" y="534" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">輸出尺寸：O = ⌊(W − K)/S⌋ + 1 = ⌊(5 − 3)/1⌋ + 1 = 3</text></svg>