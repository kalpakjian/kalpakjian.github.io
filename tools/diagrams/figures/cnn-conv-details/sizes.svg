<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="四種 stride 與 padding 設定的輸出尺寸：28×28 輸入配 3×3 kernel，valid 得 26×26、same 得 28×28、stride 2 補 1 得 14×14、5×5 kernel 補 2 得 28×28"><defs><marker id="ard" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="338.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一張 28×28，四種設定</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">O = ⌊(W + 2P − K) / S⌋ + 1　（除不盡往下取整）</text><rect x="30" y="96" width="220" height="170" rx="8" fill="#12181f" stroke="#4ecdc488" stroke-width="1.5" opacity="0.9"/><text x="44" y="124" font-size="12" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">valid</text><text x="44" y="148" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(28 − 3)/1 + 1</text><text x="44" y="192" font-size="22" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">26×26</text><text x="44" y="246" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">邊角像素只被掃到 1 次</text><rect x="265" y="96" width="220" height="170" rx="8" fill="#12181f" stroke="#58a6ff88" stroke-width="1.5" opacity="0.9"/><text x="279" y="124" font-size="12" fill="#58a6ff" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">same（p = 1）</text><text x="279" y="148" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(28 + 2 − 3)/1 + 1</text><text x="279" y="192" font-size="22" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">28×28</text><text x="279" y="246" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">尺寸不變，邊界用 0 補</text><rect x="500" y="96" width="220" height="170" rx="8" fill="#12181f" stroke="#e0a45888" stroke-width="1.5" opacity="0.9"/><text x="514" y="124" font-size="12" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">stride 2 + p = 1</text><text x="514" y="148" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(28 + 2 − 3)/2 + 1</text><text x="514" y="192" font-size="22" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">14×14</text><text x="514" y="246" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一半解析度，常見於降採樣</text><rect x="735" y="96" width="220" height="170" rx="8" fill="#12181f" stroke="#c084fc88" stroke-width="1.5" opacity="0.9"/><text x="749" y="124" font-size="12" fill="#c084fc" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">5×5 kernel + p = 2</text><text x="749" y="148" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(28 + 4 − 5)/1 + 1</text><text x="749" y="192" font-size="22" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">28×28</text><text x="749" y="246" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">大 kernel 也能維持 same</text><text x="40" y="308" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">same 的 padding 由 kernel 決定：K = 3 → P = 1、K = 5 → P = 2；偶數 kernel 湊不出真正的 same。</text></svg>