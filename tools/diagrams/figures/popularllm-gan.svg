<text x="48" y="508" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">生成器的輸出直接接判別器的輸入，所以梯度可以一路回傳到生成器——這就是 GAN 的對抗訓練。</text>
