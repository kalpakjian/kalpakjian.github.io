<text x="48" y="1032" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一組問題換個情境就會換答案：先問清楚卡在哪裡，再打開套件清單。</text>
