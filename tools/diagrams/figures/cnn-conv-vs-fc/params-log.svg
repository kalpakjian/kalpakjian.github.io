<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="參數量對數比較：卷積 320 個、全連接 784 到 128 是 100480 個、全連接 784 到 25088 是 19694080 個"><defs><marker id="arv" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="398.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同樣產出 25,088 個值，參數差 61,544 倍</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">對數刻度（每格 10 倍）；卷積的 320 個參數是含 bias 的總數</text><line x1="420.0" y1="104" x2="420.0" y2="272" stroke="#8b949e" stroke-width="0.8" opacity="0.25"/><text x="420.0" y="292" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10^2</text><line x1="493.2142857142857" y1="104" x2="493.2142857142857" y2="272" stroke="#8b949e" stroke-width="0.8" opacity="0.25"/><text x="493.2142857142857" y="292" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10^3</text><line x1="566.4285714285714" y1="104" x2="566.4285714285714" y2="272" stroke="#8b949e" stroke-width="0.8" opacity="0.25"/><text x="566.4285714285714" y="292" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10^4</text><line x1="639.6428571428571" y1="104" x2="639.6428571428571" y2="272" stroke="#8b949e" stroke-width="0.8" opacity="0.25"/><text x="639.6428571428571" y="292" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10^5</text><line x1="712.8571428571429" y1="104" x2="712.8571428571429" y2="272" stroke="#8b949e" stroke-width="0.8" opacity="0.25"/><text x="712.8571428571429" y="292" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10^6</text><line x1="786.0714285714287" y1="104" x2="786.0714285714287" y2="272" stroke="#8b949e" stroke-width="0.8" opacity="0.25"/><text x="786.0714285714287" y="292" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10^7</text><text x="400" y="129" font-size="11.5" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">卷積 3×3、C_out 32</text><rect x="420" y="111" width="36.98419484127885" height="26" rx="4" fill="#4ecdc4" stroke="none" stroke-width="1" opacity="0.85"/><text x="466.98419484127885" y="129" font-size="11.5" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">320</text><text x="400" y="185" font-size="11.5" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">全連接 784 → 128</text><rect x="420" y="167" width="219.79511550378209" height="26" rx="4" fill="#e0a458" stroke="none" stroke-width="1" opacity="0.85"/><text x="649.7951155037821" y="185" font-size="11.5" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">100,480</text><text x="400" y="241" font-size="11.5" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">全連接 784 → 25,088</text><rect x="420" y="223" width="387.62100644238126" height="26" rx="4" fill="#ff7b72" stroke="none" stroke-width="1" opacity="0.85"/><text x="817.6210064423813" y="241" font-size="11.5" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">19,694,080</text><text x="40" y="340" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">算力也差 87 倍：卷積 225,792 次乘加，全連接 19,668,992 次。</text><text x="40" y="364" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">參數少不代表算得少——卷積把權重重複用，所以每個位置都要再算一次。</text></svg>