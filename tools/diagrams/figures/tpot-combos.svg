<text x="48" y="392" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">多一個維度是相乘不是相加：超參數 27 種 × 前處理 3 種 = 81；四個模型加起來 279 種，而且這還只是玩具級。</text>
