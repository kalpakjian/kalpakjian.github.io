<circle cx="78" cy="262" r="15" fill="#58a6ff" opacity="0.92"/>
<text x="78" y="266.56" font-size="12" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">人類</text>
<text x="102" y="267" font-size="15.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">你負責</text>
<path d="M 66 286 L 274 286" fill="none" stroke="#7d8590" stroke-width="1.2"/>
<text x="66" y="312" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">零件箱：sklearn 可用的元件</text>
<text x="66" y="336" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">賽道：訓練資料</text>
<rect x="328" y="232" width="244" height="132" rx="12" fill="#1c2230" stroke="#2dd4bf66" stroke-width="1.5"/>
<circle cx="358" cy="262" r="15" fill="#2dd4bf" opacity="0.92"/>
<text x="358" y="266.56" font-size="12" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">TPOT</text>
<text x="382" y="267" font-size="15.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">它負責</text>
