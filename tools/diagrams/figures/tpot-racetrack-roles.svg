<circle cx="638" cy="262" r="15" fill="#3fb950" opacity="0.92"/>
<text x="638" y="266.56" font-size="12" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">成果</text>
<text x="662" y="267" font-size="15.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">它交付</text>
