<text x="48" y="396" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">比喻的關鍵字是「自動試組合」與「附上改裝清單」。</text>
<text x="48" y="418" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">考試若問「TPOT 幫你省下什麼」：省下人工嘗試組合的時間，而不是省下「理解問題」的功夫。</text>
