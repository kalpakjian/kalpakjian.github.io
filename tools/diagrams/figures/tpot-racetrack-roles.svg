<text x="626" y="312" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一台調到最好的車（管線）</text>
<text x="626" y="336" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">改裝清單（節點與參數）</text>
<path d="M 450 162 L 450 198" fill="none" stroke="#7d8590" stroke-width="1.5"/>
