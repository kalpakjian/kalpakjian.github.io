<text x="490.0" y="407.0" font-size="12.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">兩個形狀算的是同一個函數，只是 GEMM 的形狀不同 → 捨入順序不同</text>
