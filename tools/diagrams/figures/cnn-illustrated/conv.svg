="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">九組乘積全部相加 = 一格；換到下一個位置，同樣九個權重再算一次。</text><text x="48" y="528" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">輸出尺寸（不補邊、步幅 1）：(5 − 3) / 1 + 1 = 3 → 3×3</text></svg>