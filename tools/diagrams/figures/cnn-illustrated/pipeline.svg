<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="一個影像分類 CNN 的資料流：輸入 28×28×1 → Conv+ReLU 16 → Pool → Conv+ReLU 32 → Pool → Flatten 1568 維 → Dense+Softmax → 10 個類別機率，前段重複 N 次抽特徵，後段做分類"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="248.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一個影像分類 CNN 的資料流</text><text x="40" y="70" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前段抽特徵，後段做判斷；中間那兩個 Pool 讓面積一路砍半</text><rect x="44" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6" opacity="0.9"/><text x="92.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">輸入影像</text><text x="92.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">28×28×1</text><line x1="143" y1="136.0" x2="161" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="166" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6" opacity="0.9"/><text x="214.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv+ReLU</text><text x="214.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3×3 ×16</text><line x1="265" y1="136.0" x2="283" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="288" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#58a6ff" stroke-width="1.6" opacity="0.9"/><text x="336.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool 2×2</text><text x="336.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">14×14×16</text><line x1="387" y1="136.0" x2="405" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="410" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6" opacity="0.9"/><text x="458.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv+ReLU</text><text x="458.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3×3 ×32</text><line x1="509" y1="136.0" x2="527" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="532" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#58a6ff" stroke-width="1.6" opacity="0.9"/><text x="580.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool 2×2</text><text x="580.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7×7×32</text><line x1="631" y1="136.0" x2="649" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="654" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#e0a458" stroke-width="1.6" opacity="0.9"/><text x="702.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Flatten</text><text x="702.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1,568 維</text><line x1="753" y1="136.0" x2="771" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="776" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#e0a458" stroke-width="1.6" opacity="0.9"/><text x="824.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Dense</text><text x="824.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">128 + softmax</text><line x1="875" y1="136.0" x2="893" y2="136.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="898" y="104" width="96" height="64" rx="8" fill="#12181f" stroke="#ff7b72" stroke-width="1.6" opacity="0.9"/><text x="946.0" y="134" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">類別機率</text><text x="946.0" y="153" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10 個數字</text><line x1="166" y1="96" x2="628" y2="96" stroke="#30363d" stroke-width="1"/><text x="397.0" y="88" font-size="11" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">特徵抽取：重複 N 次（卷積 → ReLU → 池化）</text><line x1="654" y1="96" x2="994" y2="96" stroke="#30363d" stroke-width="1"/><text x="824.0" y="88" font-size="11" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">分類頭</text><text x="40" y="212" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一組 filter 滑過整張圖（參數共享）→ 參數量與影像大小無關；池化只降維，沒有可學的參數。</text></svg>