191" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.0511</text><text x="600" y="227" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">鳥</text><rect x="612" y="213" width="5.824" height="20" rx="3" fill="#58a6ff" stroke="none" stroke-width="1" opacity="0.9"/><text x="625.824" y="227" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.0208</text><text x="612" y="262" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.9282 + 0.0511 + 0.0208 = 1.0000</text><text x="40" y="320" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">logits [4.2, 1.3, 0.4] 只是分數；softmax 才把它變成加總為 1 的機率，預測結果取最大那一格。</text></svg>