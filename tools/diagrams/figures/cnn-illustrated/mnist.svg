t-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">池化</text><line x1="603" y1="132.0" x2="625" y2="132.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><text x="615.0" y="94" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Flatten</text><rect x="630" y="104" width="88" height="56" rx="8" fill="#12181f" stroke="#e0a458" stroke-width="1.6" opacity="0.9"/><text x="674.0" y="138" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">784 維</text><text x="674.0" y="178" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">攤平</text><line x1="721" y1="132.0" x2="743" y2="132.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><text x="733.0" y="94" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Dense</text><rect x="748" y="104" width="88" height="56" rx="8" fill="#12181f" stroke="#e0a458" stroke-width="1.6" opacity="0.9"/><text x="792.0" y="138" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">64 維</text><text x="792.0" y="178" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">全連接</text><line x1="839" y1="132.0" x2="861" y2="132.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><text x="851.0" y="94" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Softmax</text><rect x="866" y="104" width="88" height="56" rx="8" fill="#12181f" stroke="#ff7b72" stroke-width="1.6" opacity="0.9"/><text x="910.0" y="138" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">10 維</text><text x="910.0" y="178" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">softmax</text><text x="40" y="226" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">卷積改通道數（filter 數量）、池化砍面積、Flatten 只攤平、Dense 才做判斷。</text><text x="40" y="250" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">光第一層全連接（784 → 64）就有 50,240 個參數，比兩個卷積層加起來的 1,248 個多 40 倍。</text></svg>