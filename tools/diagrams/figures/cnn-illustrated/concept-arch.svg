<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="概念架構：輸入 224×224×3 一路縮到 14×14×256 再攤平，最後由 Dense 加 softmax 給出貓 0.93、狗 0.05、鳥 0.02"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="408.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">概念架構：一路變小，最後才做決定</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">每個方塊的「高度」就是空間解析度；通道數正好相反，一路變多</text><rect x="50" y="160" width="96" height="160" rx="6" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4" opacity="0.95"/><line x1="50" y1="200.0" x2="146" y2="200.0" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><line x1="50" y1="240.0" x2="146" y2="240.0" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><line x1="50" y1="280.0" x2="146" y2="280.0" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><text x="98.0" y="342" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">224×224×3</text><text x="98.0" y="360" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">輸入</text><line x1="149" y1="240.0" x2="173" y2="240.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="178" y="186" width="96" height="134" rx="6" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4" opacity="0.95"/><line x1="178" y1="219.5" x2="274" y2="219.5" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><line x1="178" y1="253.0" x2="274" y2="253.0" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><line x1="178" y1="286.5" x2="274" y2="286.5" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><text x="226.0" y="342" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">112×112×64</text><text x="226.0" y="360" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv+ReLU</text><line x1="277" y1="253.0" x2="301" y2="253.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="306" y="210" width="96" height="110" rx="6" fill="#12181f" stroke="#58a6ffaa" stroke-width="1.4" opacity="0.95"/><line x1="306" y1="237.5" x2="402" y2="237.5" stroke="#58a6ff" stroke-width="0.7" opacity="0.35"/><line x1="306" y1="265.0" x2="402" y2="265.0" stroke="#58a6ff" stroke-width="0.7" opacity="0.35"/><line x1="306" y1="292.5" x2="402" y2="292.5" stroke="#58a6ff" stroke-width="0.7" opacity="0.35"/><text x="354.0" y="342" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">56×56×64</text><text x="354.0" y="360" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool</text><line x1="405" y1="265.0" x2="429" y2="265.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="434" y="234" width="96" height="86" rx="6" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4" opacity="0.95"/><line x1="434" y1="255.5" x2="530" y2="255.5" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><line x1="434" y1="277.0" x2="530" y2="277.0" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><line x1="434" y1="298.5" x2="530" y2="298.5" stroke="#4ecdc4" stroke-width="0.7" opacity="0.35"/><text x="482.0" y="342" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">28×28×256</text><text x="482.0" y="360" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv+ReLU</text><line x1="533" y1="277.0" x2="557" y2="277.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="562" y="258" width="96" height="62" rx="6" fill="#12181f" stroke="#58a6ffaa" stroke-width="1.4" opacity="0.95"/><line x1="562" y1="273.5" x2="658" y2="273.5" stroke="#58a6ff" stroke-width="0.7" opacity="0.35"/><line x1="562" y1="289.0" x2="658" y2="289.0" stroke="#58a6ff" stroke-width="0.7" opacity="0.35"/><line x1="562" y1="304.5" x2="658" y2="304.5" stroke="#58a6ff" stroke-width="0.7" opacity="0.35"/><text x="610.0" y="342" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">14×14×256</text><text x="610.0" y="360" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool</text><line x1="661" y1="289.0" x2="685" y2="289.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="690" y="280" width="96" height="40" rx="6" fill="#12181f" stroke="#e0a458aa" stroke-width="1.4" opacity="0.95"/><line x1="690" y1="290.0" x2="786" y2="290.0" stroke="#e0a458" stroke-width="0.7" opacity="0.35"/><line x1="690" y1="300.0" x2="786" y2="300.0" stroke="#e0a458" stroke-width="0.7" opacity="0.35"/><line x1="690" y1="310.0" x2="786" y2="310.0" stroke="#e0a458" stroke-width="0.7" opacity="0.35"/><text x="738.0" y="342" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">25,088</text><text x="738.0" y="360" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Flatten</text><line x1="78" y1="96" x2="640" y2="96" stroke="#4ecdc4" stroke-width="1"/><text x="359" y="88" font-size="11" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">特徵抽取：Conv → ReLU → Pool（重複 N 次）</text><line x1="806" y1="96" x2="976" y2="96" stroke="#e0a458" stroke-width="1"/><text x="891" y="88" font-size="11" fill="#e0a458" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">決策</text><rect x="806" y="180" width="170" height="140" rx="10" fill="#12181f" stroke="#ff7b7299" stroke-width="1.4"/><text x="822" y="206" font-size="11" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Dense → softmax</text><text x="822" y="236" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">貓</text><rect x="846" y="226" width="74.4" height="16" rx="3" fill="#ff7b72" stroke="none" stroke-width="1" opacity="0.8"/><text x="926.4" y="237" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.93</text><text x="822" y="262" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">狗</text><rect x="846" y="252" width="4.0" height="16" rx="3" fill="#ff7b72" stroke="none" stroke-width="1" opacity="0.8"/><text x="856.0" y="263" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.05</text><text x="822" y="288" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">鳥</text><rect x="846" y="278" width="3" height="16" rx="3" fill="#ff7b72" stroke="none" stroke-width="1" opacity="0.8"/><text x="855" y="289" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.02</text><line x1="790" y1="250" x2="802" y2="250" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><text x="50" y="386" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一張圖，換掉最後那一段（決策頭）就是另一個任務——見下圖。</text></svg>