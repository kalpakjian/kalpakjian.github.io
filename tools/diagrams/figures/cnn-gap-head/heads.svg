<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="兩種分類頭：7×7×512 展平後接 1000 類全連接是 25,089,000 個參數；先做 GAP 壓成 512 再接 1000 類只要 513,000 個"><defs><marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="408.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">兩種分類頭，差 48.9 倍</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同樣從 7×7×512 的特徵圖出發，輸出 1000 類</text><rect x="30" y="96" width="460" height="250" rx="12" fill="#12181f" stroke="#ff7b7277" stroke-width="1.4" opacity="0.7"/><text x="50" y="124" font-size="12.5" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">舊寫法：Flatten + 大 FC</text><rect x="50" y="150" width="124" height="56" rx="8" fill="#12181f" stroke="#ff7b72aa" stroke-width="1.4"/><text x="112" y="174" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7×7×512</text><line x1="177" y1="178" x2="197" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="200" y="150" width="124" height="56" rx="8" fill="#12181f" stroke="#ff7b72aa" stroke-width="1.4"/><text x="262" y="174" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Flatten</text><text x="262" y="192" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">25,088 維</text><line x1="327" y1="178" x2="347" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="350" y="150" width="124