<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="輸入尺寸自由：7×7、8×8、14×14 三種特徵圖經過 GAP 都是 512 維，展平則變成 25088、32768、100352 維"><defs><marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="418.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">GAP 讓分類頭與輸入尺寸脫鉤</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同樣的骨幹、同樣的分類頭，換一張大一點的特徵圖會怎樣</text><rect x="50" y="110" width="140" height="52" rx="8" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4"/><text x="120" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7×7×512</text><line x1="194" y1="136" x2="236" y2="136" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#ar)"/><rect x="240" y="110" width="90" height="52" rx="7" fill="#12181f" stroke="#4ecdc4" stroke-width="1.4"/><text x="285" y="142" font-size="11.5" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">GAP</text><line x1="333" y1="136" x2="392" y2="136" stroke="#30363d" stroke-width="1.2"/><rect x="50" y="182" width="140" height="52" rx="8" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4"/><text x="120" y="214" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">8×8×512</text><line x1="194" y1="208" x2="236" y2="208" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#ar)"/><rect x="240" y="182" width="90" height="52" rx="7" fill="#12181f" stroke="#4ecdc4" stroke-width="1.4"/><text x="285" y="214" font-size="11.5" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">GAP</text><line x1="333" y1="208" x2="392" y2="208" stroke="#30363d" stroke-width="1.2"/><rect x="50" y="254" width="140" height="52" rx="8" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4"/><text x="120" y="286" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">14×14×512</text><line x1="194" y1="280" x2="236" y2="280" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#ar)"/><rect x="240" y="254" width="90" height="52" rx="7" fill="#12181f" stroke="#4ecdc4" stroke-width="1.4"/><text x="285" y="286" font-size="11.5" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">GAP</text><line x1="333" y1="280" x2="392" y2="280" stroke="#30363d" stroke-width="1.2"/><line x1="392" y1="136" x2="392" y2="280" stroke="#30363d" stroke-width="1.2"/><line x1="392" y1="208" x2="432" y2="208" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#ar)"/><rect x="436" y="148" width="150" height="120" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6"/><text x="511" y="190" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">512 維</text><text x="511" y="214" font-size="10.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">三種尺寸</text><text x="511" y="236" font-size="10.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">輸出完全相同</text><line x1="590" y1="208" x2="632" y2="208" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#ar)"/><rect x="636" y="168" width="210" height="80" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6"/><text x="741" y="198" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Linear(512 → 1000)</text><text x="741" y="222" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一個分類頭吃三種尺寸</text><rect x="50" y="296" width="900" height="84" rx="10" fill="#12181f" stroke="#ff7b7277" stroke-width="1.4"/><text x="70" y="322" font-size="12" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">改成展平：25,088 / 32,768 / 100,352 —— 長度跟著尺寸變</text><text x="70" y="348" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一個 Linear(25,088 → 1000) 只能接第一種；換解析度就得換分類頭，權重全部重來。</text><text x="40" y="404" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">GAP 的輸出長度只取決於通道數 C；展平的長度是 H×W×C。</text></svg>