<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="分類頭占整個模型參數的比例：VGG16 89.4%、MobileNetV2 36.7%、ResNet-50 8.0%"><defs><marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="398.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">分類頭占整個模型多少參數</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一件事在三種架構上的比例；括號是分類頭 / 全部參數</text><text x="280" y="136" font-size="12" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">VGG16</text><rect x="300" y="116" width="464.88" height="28" rx="4" fill="#ff7b72" stroke="none" stroke-width="1" opacity="0.85"/><text x="774.88" y="136" font-size="12.5" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">89.4%</text><text x="280" y="158" font-size="10" fill="#8b949e" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(123,642,856 / 138,357,544)</text><text x="280" y="210" font-size="12" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">MobileNetV2</text><rect x="300" y="190" width="190.84000000000003" height="28" rx="4" fill="#e0a458" stroke="none" stroke-width="1" opacity="0.85"/><text x="500.84000000000003" y="210" font-size="12.5" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">36.7%</text><text x="280" y="232" font-size="10" fill="#8b949e" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(1,281,000 / 3,487,816)</text><text x="280" y="284" font-size="12" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">ResNet-50</text><rect x="300" y="264" width="41.6" height="28" rx="4" fill="#4ecdc4" stroke="none" stroke-width="1" opacity="0.85"/><text x="351.6" y="284" font-size="12.5" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">8.0%</text><text x="280" y="306" font-size="10" fill="#8b949e" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">(2,049,000 / 25,557,032)</text><text x="40" y="366" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">VGG16 的 89.4% 幾乎都卡在 4096×4096 那兩層；換成 GAP 頭之後，同一個骨幹的分類頭會掉到 1% 等級。</text></svg>