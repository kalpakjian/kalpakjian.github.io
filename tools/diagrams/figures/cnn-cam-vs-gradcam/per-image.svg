<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="同一組分類權重 w，對兩張不同影像：純 GAP 加 Linear 的模型 alpha 完全不變，中間有 ReLU 時 alpha 才隨影像改變"><defs><marker id="arcg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="428.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α 真的「隨影像改變」嗎？實測</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一組分類權重，換一張影像，權重會變嗎？答案取決於中間有沒有非線性</text><rect x="40" y="96" width="250" height="120" rx="10" fill="#12181f" stroke="#4ecdc488" stroke-width="1.4"/><text x="56" y="120" font-size="11" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">分類層權重 w（固定）</text><text x="56" y="148" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[1, 狗] = 1.20</text><text x="56" y="172" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[2, 狗] = −0.50</text><text x="56" y="196" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[3, 狗] = 0.80</text><line x1="296" y1="156" x2="336" y2="156" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="340" y="96" width="210" height="120" rx="10" fill="#12181f" stroke="#58a6ff88" stroke-width="1.4"/><text x="356" y="120" font-size="11" fill="#58a6ff" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">影像 A</text><text x="356" y="148" font-size="10.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α = [0.019, −0.018, 0.025]</text><text x="356" y="176" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">（純 GAP 時：0.075 / −0.031 / 0.05）</text><text x="356" y="200" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">4×4 → H·W = 16</text><rect x="340" y="232" width="210" height="120" rx="10" fill="#12181f" stroke="#c084fc88" stroke-width="1.4"/><text x="356" y="256" font-size="11" fill="#c084fc" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">影像 B</text><text x="356" y="284" font-size="10.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α = [0.038, −0.014, 0.031]</text><text x="356" y="312" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">（純 GAP 時：同一組數字）</text><text x="356" y="336" font-size="9.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α 只在這裡不同</text><rect x="580" y="96" width="390" height="256" rx="12" fill="#12181f" stroke="#e0a45877" stroke-width="1.4"/><text x="600" y="122" font-size="12" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">兩種情況要分清楚</text><text x="600" y="152" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">① 純 GAP + Linear（沒有中間層）</text><text x="616" y="176" font-size="11" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α = w / (H·W) → 每張圖都一樣</text><text x="616" y="198" font-size="11" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">這時 Grad-CAM 就等於 CAM</text><text x="600" y="232" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">② 中間有 ReLU（真實網路）</text><text x="616" y="256" font-size="11" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">∂y/∂A = w/(H·W) · 1[A &gt; 0]</text><text x="616" y="278" font-size="11" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">正值比例隨影像變 → α 也變</text><text x="616" y="300" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">影像 A 的正值比例 0.25 / 0.56 / 0.50</text><text x="616" y="320" font-size="10" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">影像 B 的正值比例 0.50 / 0.44 / 0.62</text><text x="40" y="400" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">所以「Grad-CAM 的權重隨影像改變」這句話要加條件：在 CAM 適用的那種純線性末端上，它其實不變。</text></svg>