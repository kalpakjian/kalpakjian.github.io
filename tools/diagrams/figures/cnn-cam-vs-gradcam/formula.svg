<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="兩個公式並排：CAM 用訓練好的權重 w 乘特徵圖，Grad-CAM 用梯度平均 alpha 乘特徵圖，兩者只差在那 K 個數字怎麼來"><defs><marker id="arcg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="378.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一個式子，只差那 K 個數字</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">兩者都是「加權疊加特徵圖，再 ReLU」；差別在權重怎麼來</text><rect x="30" y="96" width="450" height="210" rx="12" fill="#12181f" stroke="#4ecdc477" stroke-width="1.4" opacity="0.6"/><text x="50" y="124" font-size="13" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">原始 CAM</text><text x="50" y="156" font-size="13" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">L = ReLU( Σ_k  w[k, c] · A_k )</text><text x="50" y="186" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[k, c]：Linear(K → C) 的權重</text><text x="50" y="210" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">訓練時學好、存在模型裡</text><text x="50" y="240" font-size="11.5" fill="#ff7b72" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前提：最後一層卷積後面接 GAP</text><text x="50" y="272" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">→ 一次前向 + 查表就能畫</text><rect x="520" y="96" width="450" height="210" rx="12" fill="#12181f" stroke="#c084fc77" stroke-width="1.4" opacity="0.6"/><text x="540" y="124" font-size="13" fill="#c084fc" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Grad-CAM</text><text x="540" y="156" font-size="13" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">L = ReLU( Σ_k  α[k, c] · A_k )</text><text x="540" y="186" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α[k, c] = mean( ∂yᶜ / ∂A_k )</text><text x="540" y="210" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">推論時對這張影像算出來的</text><text x="540" y="240" font-size="11.5" fill="#4ecdc4" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前提：只要該層能反向傳播</text><text x="540" y="272" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">→ 每個類別多一次反向</text><path d="M 480 200 L 512 200" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arcg)"/><text x="496" y="190" font-size="10" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">換</text><text x="40" y="344" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一句話：CAM 的權重是「模型的常識」，Grad-CAM 的權重是「這張圖的即時判斷」。</text></svg>