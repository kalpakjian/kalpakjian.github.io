<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-label="決策流：需要跨語料問答或讓 agent 查語料時值得安裝；要產出 HTML、題庫或 OCR 時不該用；只要全文檢索則 SQLite FTS5 就足夠" style="width:100%;height:auto;display:block">
