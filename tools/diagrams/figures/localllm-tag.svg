<text x="48" y="300" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">冒號後面是 tag：同一個模型可以有 llama3.2:1b、llama3.2:3b 等多種版本。</text>
