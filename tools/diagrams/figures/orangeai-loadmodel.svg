<defs><marker id="m7d8590" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs>
<rect x="0.75" y="0.75" width="898.5" height="378.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/>
<text x="48" y="52" font-size="25" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Load Model 的四個步驟</text>
<text x="48" y="82" font-size="14.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">拖入元件 → 選擇模型 → 連接資料 → 查看預測</text>
<rect x="48" y="190" width="180" height="80" rx="10" fill="#161b22" stroke="#2dd4bf66" stroke-width="1.5"/>
<text x="138.0" y="228.0" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">① Load Model</text>
<text x="138.0" y="250.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">拖入元件</text>
<path d="M 232 230 L 254 230" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#m7d8590)"/>
<rect x="258" y="190" width="180" height="80" rx="10" fill="#161b22" stroke="#58a6ff66" stroke-width="1.5"/>
<text x="348.0" y="228.0" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">② .pkcls / .pkreg</text>
<text x="348.0" y="250.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">選擇模型</text>
<path d="M 442 230 L 464 230" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#m7d8590)"/>
<rect x="468" y="190" width="180" height="80" rx="10" fill="#161b22" stroke="#c084fc66" stroke-width="1.5"/>
<text x="558.0" y="228.0" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">③ 新資料（File）</text>
<text x="558.0" y="250.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">連接資料</text>
<path d="M 652 230 L 674 230" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#m7d8590)"/>
<rect x="678" y="190" width="180" height="80" rx="10" fill="#161b22" stroke="#3fb95066" stroke-width="1.5"/>
<text x="768.0" y="228.0" font-size="13.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">④ Predictions</text>
<text x="768.0" y="250.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">查看預測</text>
<text x="48" y="340" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">順序不能顛倒：先選模型檔，再接資料——這四個標籤就是課程標在圖上的操作順序。</text>
