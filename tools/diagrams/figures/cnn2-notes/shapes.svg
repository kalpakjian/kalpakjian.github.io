<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" role="img" aria-label="張量形狀階梯：28×28×1 經 Conv 變 26×26×32、Pool 變 13×13×32、再 Conv 變 11×11×64、Pool 變 5×5×64，Flatten 後 1600 維"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect width="940" height="210" fill="#0d1117"/><text x="40" y="32" fill="#e0a458" font-size="13" text-anchor="start" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一個模型，張量一路縮小：28×28×1 → 1600 維</text><rect x="40" y="74" width="100" height="54" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="90.0" y="106.0" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">28×28×1</text><line x1="140" y1="101.0" x2="188" y2="101.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><text x="166.0" y="62" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv 3×3</text><rect x="192" y="74" width="100" height="54" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="242.0" y="106.0" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">26×26×32</text><line x1="292" y1="101.0" x2="340" y2="101.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><text x="318.0" y="62" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool 2×2</text><rect x="344" y="74" width="100" height="54" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.6"/><text x="394.0" y="106.0" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">13×13×32</text><line x1="444" y1="101.0" x2="492" y2="101.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><text x="470.0" y="62" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv 3×3</text><rect x="496" y="74" width="100" height="54" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="546.0" y="106.0" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">11×11×64</text><line x1="596" y1="101.0" x2="644" y2="101.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><text x="622.0" y="62" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool 2×2</text><rect x="648" y="74" width="100" height="54" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.6"/><text x="698.0" y="106.0" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">5×5×64</text><line x1="748" y1="101.0" x2="796" y2="101.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><text x="774.0" y="62" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Flatten</text><rect x="800" y="74" width="100" height="54" rx="8" fill="none" stroke="#e0a458" stroke-width="1.6"/><text x="850.0" y="106.0" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1600 維</text><text x="40" y="178" fill="#8b949e" font-size="11.5" text-anchor="start" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">卷積只改 channel 數（= 濾波器數量），池化只砍面積，Flatten 只攤平。</text></svg>