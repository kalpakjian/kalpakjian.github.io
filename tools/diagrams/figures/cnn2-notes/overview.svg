<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 165" role="img" aria-label="CNN 分類網路架構：Input → Conv 32 → Pool → Conv 64 → Pool → Flatten → Dense 1024 → Softmax 10 類"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect width="920" height="165" fill="#0d1117"/><text x="20" y="30" fill="#e0a458" font-size="12.5" text-anchor="start" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前五層學特徵，後三層做分類</text><rect x="20" y="60" width="96" height="56" rx="7" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="68.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Input</text><text x="68.0" y="101.0" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">影像</text><line x1="116" y1="88.0" x2="129" y2="88.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><rect x="132" y="60" width="96" height="56" rx="7" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="180.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv 32</text><text x="180.0" y="101.0" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3×3+ReLU</text><line x1="228" y1="88.0" x2="241" y2="88.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><rect x="244" y="60" width="96" height="56" rx="7" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="292.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool</text><text x="292.0" y="101.0" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2×2</text><line x1="340" y1="88.0" x2="353" y2="88.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><rect x="356" y="60" width="96" height="56" rx="7" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="404.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv 64</text><text x="404.0" y="101.0" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3×3+ReLU</text><line x1="452" y1="88.0" x2="465" y2="88.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><rect x="468" y="60" width="96" height="56" rx="7" fill="none" stroke="#4ecdc4" stroke-width="1.6"/><text x="516.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Pool</text><text x="516.0" y="101.0" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2×2</text><line x1="564" y1="88.0" x2="577" y2="88.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><rect x="580" y="60" width="96" height="56" rx="7" fill="none" stroke="#e0a458" stroke-width="1.6"/><text x="628.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Flatten</text><text x="628.0" y="101.0" fill="#8b949e" font-size="10.5" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">→ 向量</text><line x1="676" y1="88.0" x2="689" y2="88.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/><rect x="692" y="60" width="96" height="56" rx="7" fill="none" stroke="#e0a458" stroke-width="1.6"/><text x="740.0" y="84.0" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Dense</text><text x="740.0" y="101.0" fill="#8b949e" font-size="10.5" te