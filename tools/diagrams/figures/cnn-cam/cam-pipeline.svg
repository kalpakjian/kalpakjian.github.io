t-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">softmax</text><text x="915.0" y="182.0" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">C 個機率</text><path d="M 755 206 C 755 268, 425 268, 425 240" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arc)"/><text x="590" y="292" font-size="11.5" fill="#c084fc" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[k, c] 回頭加權每張 A_k</text><text x="40" y="330" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">CAM_k(x, y) = Σ_k w[k, c] · A_k(x, y)；再上採樣回 224×224 就是熱圖。</text></svg>