<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="CAM 的網路結構：卷積到 K 張 7×7 特徵圖，GAP 成 K 個數，最後 Linear(K→C) 的權重 w 再回頭加權那 K 張圖，得到類別熱圖"><defs><marker id="arc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="358.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">CAM 的網路結構：GAP 是那座橋</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">只有「GAP + Linear」的頭，才能讓分類權重乾淨地對應回單一張特徵圖</text><rect x="40" y="104" width="110" height="62" rx="8" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4"/><text x="95.0" y="130" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">影像</text><text x="95.0" y="151.0" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">224×224×3</text><line x1="154" y1="135" x2="186" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="190" y="104" width="120" height="62" rx="8" fill="#12181f" stroke="#4ecdc4aa" stroke-width="1.4"/><text x="250.0" y="130" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">卷積堆疊</text><text x="250.0" y="151.0" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">→ 7×7×K</text><line x1="314" y1="135" x2="346" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="350" y="96" width="150" height="140" rx="10" fill="#12181f" stroke="#58a6ff99" stroke-width="1.4"/><text x="425" y="120" font-size="10.5" 