<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-label="CAM 的五個步驟：取出最後一層特徵圖、GAP、讀線性層權重、加權相加、上採樣回原圖尺寸"><defs><marker id="arc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="388.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">五個步驟，只有最後一步是為了「看」</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前四步都是線性運算；上採樣只是把 7×7 放大到看得出來的尺寸</text><rect x="44" y="120" width="160" height="110" rx="10" fill="#12181f" stroke="#4ecdc488" stroke-width="1.5"/><circle cx="74" cy="146" r="15" fill="#4ecdc4"/><text x="74" y="152" font-size="13" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1</text><text x="100" y="152" font-size="12" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">取特徵圖</text><text x="62" y="196" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">A₁…A_K，7×7</text><line x1="207" y1="175" x2="226" y2="175" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="230" y="120" width="160" height="110" rx="10" fill="#12181f" stroke="#e0a45888" stroke-width="1.5"/><circle cx="260" cy="146" r="15" fill="#e0a458"/><text x="260" y="152" font-size="13" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2</text><text x="286" y="152" font-size="12" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">GAP</text><text x="248" y="196" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">F₁…F_K，K 個數</text><line x1="393" y1="175" x2="412" y2="175" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="416" y="120" width="160" height="110" rx="10" fill="#12181f" stroke="#58a6ff88" stroke-width="1.5"/><circle cx="446" cy="146" r="15" fill="#58a6ff"/><text x="446" y="152" font-size="13" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3</text><text x="472" y="152" font-size="12" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">讀權重</text><text x="434" y="196" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[k, c]，K 個</text><line x1="579" y1="175" x2="598" y2="175" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="602" y="120" width="160" height="110" rx="10" fill="#12181f" stroke="#c084fc88" stroke-width="1.5"/><circle cx="632" cy="146" r="15" fill="#c084fc"/><text x="632" y="152" font-size="13" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">4</text><text x="658" y="152" font-size="12" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">加權相加</text><text x="620" y="196" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">CAM，7×7</text><line x1="765" y1="175" x2="784" y2="175" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="788" y="120" width="160" height="110" rx="10" fill="#12181f" stroke="#ff7b7288" stroke-width="1.5"/><circle cx="818" cy="146" r="15" fill="#ff7b72"/><text x="818" y="152" font-size="13" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">5</text><text x="844" y="152" font-size="12" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">上採樣</text><text x="806" y="196" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">224×224 熱圖</text><rect x="44" y="268" width="912" height="96" rx="12" fill="#1c2230" stroke="#58a6ff55" stroke-width="1.4"/><text x="64" y="296" font-size="12" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">為什麼第 3 步需要 GAP：F_k 只對應一張 A_k，所以 w[k, c] 可以直接乘回 A_k。</text><text x="64" y="322" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">若換成 Flatten + 大 FC，每個權重綁的是「某個像素 × 某個通道」，無法還原成一張圖。</text><text x="64" y="346" font-size="11" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">實測：K=6、7×7、C=4 時，GAP 頭 6 個權重 vs 展平頭 1,176 個（196 倍）。</text></svg>