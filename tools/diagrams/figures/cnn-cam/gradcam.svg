<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="CAM 與 Grad-CAM 的差別：CAM 用 GAP 之後的線性權重，Grad-CAM 用 logit 對特徵圖的梯度平均；在純 GAP＋Linear 的網路上兩者只差一個常數與 ReLU"><defs><marker id="arc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="418.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">CAM vs Grad-CAM</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一個用「線性層的權重」，一個用「梯度」；後者不必有 GAP</text><rect x="30" y="96" width="460" height="220" rx="12" fill="#12181f" stroke="#4ecdc477" stroke-width="1.4" opacity="0.6"/><text x="50" y="124" font-size="12.5" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">CAM（原版）</text><text x="50" y="152" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">w[k, c]：GAP 後線性層的權重</text><text x="50" y="178" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">要求：末端必須是 GAP + Linear</text><text x="50" y="204" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">優點：一次前向就能算、可解釋性強</text><text x="50" y="230" font-size="11.5" fill="#ff7b72" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">缺點：既有模型要改架構重訓</text><text x="50" y="264" font-size="12" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">CAM_c = Σ_k w[k,c] · A_k</text><text x="50" y="290" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">（本頁手算例子：8.1 / −0.3 / 6.5 / 1.3）</text><rect x="510" y="96" width="460" height="220" rx="12" fill="#12181f" stroke="#c084fc77" stroke-width="1.4" opacity="0.6"/><text x="530" y="124" font-size="12.5" fill="#c084fc" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Grad-CAM（2017）</text><text x="530" y="152" font-size="11.5" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">α[k, c] = (1/HW) ΣΣ ∂y_c/∂A_k</text><text x="530" y="178" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">要求：只要能算梯度（幾乎所有 CNN）</text><text x="530" y="204" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">優點：不必改架構、可套用既有模型</text><text x="530" y="230" font-size="11.5" fill="#e0a458" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">缺點：要多一次反向傳播</text><text x="530" y="264" font-size="12" fill="#c084fc" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">M_c = ReLU( Σ_k α[k,c] · A_k )</text><text x="530" y="290" font-size="10.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">ReLU 是因為我們只關心「支持」的證據</text><rect x="30" y="330" width="940" height="74" rx="12" fill="#1c2230" stroke="#e0a45855" stroke-width="1.4"/><text x="50" y="356" font-size="12" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">實測（純 GAP + Linear 的網路）：α = w / (H·W)，於是 Grad-CAM = ReLU(CAM / (H·W))。</text><text x="50" y="382" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">最大差 5.64e-18 —— 在這種架構上，兩張圖其實是同一張。</text></svg>