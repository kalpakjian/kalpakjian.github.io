<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Ada 與 Blackwell 的解鎖鏈對照：Ada 的主機寫入可以改變暫存器讀值，Blackwell 的寫入被無聲丟棄，速率改由熔絲決定" style="width:100%;height:auto;display:block">
