<text x="48" y="524" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">每一個都包含在下一個裡面：生成式 AI 是 AI 的一種，但「AI 就是生成式 AI」是錯的。</text>
