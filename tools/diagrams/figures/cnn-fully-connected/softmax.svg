<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="softmax 把 logits 2.4、1.2、負 0.7 轉成 0.7428、0.2237、0.0335，總和 1.000000"><defs><marker id="arf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="418.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Softmax：把 logits 變成加總為 1 的機率</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">pⱼ = e^zⱼ / Σ e^z_k；排序不變，總和一定是 1</text><text x="60" y="118" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">logits</text><text x="316" y="118" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">機率</text><text x="60" y="155" font-size="12.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">貓</text><text x="140" y="155" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2.4</text><line x1="240" y1="150" x2="296" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="316" y="138" width="341.688" height="24" rx="4" fill="#4ecdc4" stroke="none" stroke-width="1" opacity="0.9"/><text x="667.688" y="155" font-size="12" fill="#4ecdc4" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.7428</text><text x="60" y="201" font-size="12.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">狗</text><text x="140" y="201" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1.2</text><line x1="240" y1="196" x2="296" y2="196" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="316" y="184" width="102.902" height="24" rx="4" fill="#58a6ff" stroke="none" stroke-width="1" opacity="0.9"/><text x="428.902" y="201" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.2237</text><text x="60" y="247" font-size="12.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">鳥</text><text x="140" y="247" font-size="12.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">−0.7</text><line x1="240" y1="242" x2="296" y2="242" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="316" y="230" width="15.41" height="24" rx="4" fill="#58a6ff" stroke="none" stroke-width="1" opacity="0.9"/><text x="341.41" y="247" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.0335</text><text x="316" y="300" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">0.7428 + 0.2237 + 0.0335 = 1.000000</text><rect x="60" y="320" width="880" height="80" rx="12" fill="#1c2230" stroke="#58a6ff55" stroke-width="1.4"/><text x="80" y="348" font-size="12" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">實測兩個性質：① 全部 logits 同時 +100，機率完全不變（平移不變）</text><text x="80" y="374" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">② argmax 不變（2.4 還是最大）；logits 差距 3.10，機率比 22.2 倍</text></svg>