<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="參數量比較：小 CNN 的卷積層共 1248 個參數，全連接層共 50890 個，占 97.6%"><defs><marker id="arf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="378.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">參數幾乎都在全連接層</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一個 MNIST 小 CNN：總計 52,138 個參數，全連接占 50,890（97.6%）</text><text x="340" y="127" font-size="11.5" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">卷積層（3×3×1→8、3×3×8→16）</text><rect x="360" y="110" width="12.9171974522293" height="24" rx="4" fill="#4ecdc4" stroke="none" stroke-width="1" opacity="0.85"/><text x="382.9171974522293" y="127" font-size="12" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1,248</text><text x="340" y="185" font-size="11.5" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">全連接 784 → 64</text><rect x="360" y="168" width="520.0" height="24" rx="4" fill="#ff7b72" stroke="none" stroke-width="1" opacity="0.85"/><text x="890.0" y="185" font-size="12" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">50,240</text><text x="340" y="243" font-size="11.5" fill="#e6edf3" text-anchor="end" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">全連接 64 → 10</text><rect x="360" y="226" width="6.727707006369426" height="24" rx="4" fill="#e0a458" stroke="none" stroke-width="1" opacity="0.85"/><text x="376.7277070063694" y="243" font-size="12" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">650</text><text x="40" y="320" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">另一組對照：3136 → 128 是 401,536 個參數；同樣輸入直接接 10 類只要 31,370 個（差 12.8 倍）。</text><text x="40" y="344" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">全連接是 m×n + m；卷積是 (k×k×C_in + 1)×C_out，與影像大小無關。</text></svg>