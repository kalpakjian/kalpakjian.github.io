<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="加權投票：4 個特徵各自對 3 個類別投一票，共 12 條邊、12 個獨立權重"><defs><marker id="arf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="438.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">把全連接層想成一場加權投票</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">12 條邊就是 12 個獨立權重；線越粗代表票越重，紅色是負票</text><rect x="60" y="110" width="120" height="52" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.5"/><text x="120" y="142" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">x₁ = 2</text><rect x="60" y="186" width="120" height="52" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.5"/><text x="120" y="218" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">x₂ = 1</text><rect x="60" y="262" width="120" height="52" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.5"/><text x="120" y="294" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">x₃ = 0</text><rect x="60" y="338" width="120" height="52" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.5"/><text x="120" y="370" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">x₄ = 3</text><rect x="760" y="150" width="150" height="56" rx="9" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6"/><text x="835" y="185" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">貓</text><rect x="760" y="234" width="150" height="56" rx="9" fill="#12181f" stroke="#58a6ff" stroke-width="1.6"/><text x="835" y="269" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">狗</text><rect x="760" y="318" width="150" height="56" rx="9" fill="#12181f" stroke="#c084fc" stroke-width="1.6"/><text x="835" y="353" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">鳥</text><line x1="180" y1="136" x2="760" y2="178" stroke="#4ecdc4" stroke-width="1.6" opacity="0.55"/><line x1="180" y1="212" x2="760" y2="178" stroke="#4ecdc4" stroke-width="2.6" opacity="0.55"/><line x1="180" y1="288" x2="760" y2="178" stroke="#ff7b72" stroke-width="1.1" opacity="0.55"/><line x1="180" y1="364" x2="760" y2="178" stroke="#4ecdc4" stroke-width="3.1" opacity="0.55"/><line x1="180" y1="136" x2="760" y2="262" stroke="#4ecdc4" stroke-width="4.1" opacity="0.55"/><line x1="180" y1="212" x2="760" y2="262" stroke="#ff7b72" stroke-width="2.1" opacity="0.55"/><line x1="180" y1="288" x2="760" y2="262" stroke="#4ecdc4" stroke-width="1.6" opacity="0.55"/><line x1="180" y1="364" x2="760" y2="262" stroke="#4ecdc4" stroke-width="1.1" opacity="0.55"/><line x1="180" y1="136" x2="760" y2="346" stroke="#ff7b72" stroke-width="3.1" opacity="0.55"/><line x1="180" y1="212" x2="760" y2="346" stroke="#4ecdc4" stroke-width="3.6" opacity="0.55"/><line x1="180" y1="288" x2="760" y2="346" stroke="#4ecdc4" stroke-width="4.6" opacity="0.55"/><line x1="180" y1="364" x2="760" y2="346" stroke="#ff7b72" stroke-width="1.6" opacity="0.55"/><text x="440" y="410" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">W[j][i] 就是「第 i 個特徵對第 j 個類別的票」（粗細＝|w|，紅＝負票）</text></svg>