<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="一個 CNN block 的形狀流：32×32×3 經 Conv 3×3 32 個 filter 補 1 得到 32×32×32、ReLU 不變、MaxPool 2×2 步幅 2 得到 16×16×32"><defs><marker id="ara" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="348.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">一個 block：Conv → ReLU → Pool</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">形狀只在 Conv 與 Pool 改變；參數只有 Conv 有</text><rect x="45" y="104" width="190" height="66" rx="10" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6" opacity="0.9"/><text x="140.0" y="144" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">輸入</text><text x="140.0" y="204" font-size="12" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">32 × 32 × 3</text><text x="140.0" y="226" font-size="10.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">參數 —</text><line x1="241" y1="137.0" x2="275" y2="137.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="283" y="104" width="190" height="66" rx="10" fill="#12181f" stroke="#4ecdc4" stroke-width="1.6" opacity="0.9"/><text x="378.0" y="144" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Conv 3×3、32 filters、補 1</text><text x="378.0" y="204" font-size="12" fill="#4ecdc4" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">32 × 32 × 32</text><text x="378.0" y="226" font-size="10.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">參數 896</text><line x1="479" y1="137.0" x2="513" y2="137.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="521" y="104" width="190" height="66" rx="10" fill="#12181f" stroke="#58a6ff" stroke-width="1.6" opacity="0.9"/><text x="616.0" y="144" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">ReLU</text><text x="616.0" y="204" font-size="12" fill="#58a6ff" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">32 × 32 × 32</text><text x="616.0" y="226" font-size="10.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">參數 0</text><line x1="717" y1="137.0" x2="751" y2="137.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="759" y="104" width="190" height="66" rx="10" fill="#12181f" stroke="#e0a458" stroke-width="1.6" opacity="0.9"/><text x="854.0" y="144" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">MaxPool 2×2、stride 2</text><text x="854.0" y="204" font-size="12" fill="#e0a458" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">16 × 16 × 32</text><text x="854.0" y="226" font-size="10.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">參數 0</text><text x="45" y="292" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">同一個 block 疊三次：32×32 → 16×16 → 8×8 → 4×4，通道 3 → 32 → 64 → 128。</text><text x="45" y="316" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">解析度一路砍、通道一路加，這是 CNN 的固定節奏。</text></svg>