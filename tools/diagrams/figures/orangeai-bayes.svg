<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="貝氏定理與「樸素」兩個字" style="width:100%;height:auto;display:block">
<defs><marker id="m7d8590" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs>
<rect x="0.75" y="0.75" width="898.5" height="458.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/>
<text x="48" y="52" font-size="25" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">貝氏定理與「樸素」兩個字</text>
<text x="48" y="82" font-size="14.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">後驗 ∝ 先驗 × 似然</text>
<text x="100" y="210" font-size="17" fill="#e6edf3" font-weight="700" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">P(A | B)  =</text>
<text x="420" y="182" font-size="15" fill="#e6edf3" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">P(B | A) · P(A)</text>
<path d="M 340 196 L 500 196" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
<text x="420" y="228" font-size="15" fill="#e6edf3" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">P(B)</text>
<text x="100" y="300" font-size="13.5" fill="#8b949e" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">換成分類的語言：</text>
<text x="100" y="348" font-size="16" fill="#e6edf3" font-weight="700" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">P(類別 | 特徵)</text>
<text x="300" y="348" font-size="16" fill="#e6edf3" font-weight="700" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">∝</text>
<text x="336" y="348" font-size="16" fill="#e6edf3" font-weight="700" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">P(類別)</text>
<text x="452" y="348" font-size="16" fill="#e6edf3" font-weight="700" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">×</text>
<text x="488" y="348" font-size="16" fill="#e6edf3" font-weight="700" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">Π P(特徵ᵢ | 類別)</text>
<path d="M 203 372 L 203 356" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#m7d8590)"/>
<text x="203" y="394" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">後驗機率</text>
<path d="M 376 372 L 376 356" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#m7d8590)"/>
<text x="376" y="394" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">先驗機率</text>
<path d="M 640 372 L 640 356" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#m7d8590)"/>
<text x="640" y="394" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">似然（每個特徵各自算，然後相乘）</text>
<text x="48" y="440" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">「樸素」＝假設每個特徵彼此獨立，所以可以把所有似然直接相乘。</text>
</svg>