<path d="M 634 210 L 836 210" fill="none" stroke="#30363d" stroke-width="3"/>
<circle cx="120" cy="210" r="17" fill="#c084fc" opacity="0.92"/>
<text x="120" y="215.32" font-size="14" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1</text>
<text x="120" y="164" font-size="15" fill="#c084fc" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7/21</text>
<text x="120" y="188" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">併購 SceniX</text>
<text x="120" y="244" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">把機器人與模擬</text>
<text x="120" y="264" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">拉進同一條線</text>
<circle cx="366" cy="210" r="17" fill="#fbbf24" opacity="0.92"/>
<text x="366" y="215.32" font-size="14" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2</text>
<text x="366" y="164" font-size="15" fill="#fbbf24" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7/28</text>
<text x="366" y="188" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">R2S2R 成果</text>
<text x="366" y="244" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">模擬能預測真實</text>
<text x="366" y="264" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">policy 排名</text>
<circle cx="612" cy="210" r="17" fill="#2dd4bf" opacity="0.92"/>
<text x="612" y="215.32" font-size="14" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3</text>
<text x="612" y="164" font-size="15" fill="#2dd4bf" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">9/01</text>
<text x="612" y="188" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">新一代 Atlas</text>
<text x="612" y="244" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">從重建走向</text>
<text x="612" y="264" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">想像未看見的場景</text>
<circle cx="858" cy="210" r="17" fill="#3fb950" opacity="0.92"/>
<text x="858" y="215.32" font-size="14" fill="#08141a" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">4</text>
<text x="858" y="164" font-size="15" fill="#3fb950" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">9/28</text>
<text x="858" y="188" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">併入 AMD</text>
<text x="858" y="244" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">世界模型與硬體</text>
<text x="858" y="264" font-size="12" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">垂直整合</text>
<rect x="48" y="330" width="848" height="196" rx="12" fill="#1c2230" stroke="#2dd4bf66" stroke-width="1.5"/>
<text x="72" y="364" font-size="15.5" fill="#2dd4bf" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">四件事合起來指向同一件事</text>
<text x="72" y="394" font-size="13" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1. 模擬器是樞紐：從真實任務重建模擬，再用它預測真實世界的 policy 表現。</text>
<text x="72" y="420" font-size="13" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2. 驗證的是「未來」而不是「場景」——2,000 次模擬預測 100 次真實試驗的排名。</text>
<text x="72" y="446" font-size="13" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3. 產出的是想像：Atlas 能生成參考圖中不可見的場景，不是重建看見的部分。</text>
<text x="72" y="472" font-size="13" fill="#e6edf3" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">4. 瓶頸轉移到硬體：模型與算力的關係，決定了世界模型能走多遠。</text>
<text x="72" y="504" font-size="13" fill="#2dd4bf" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">四件事都不是在證明「重建得更像」，而是在證明「預測得更準」。</text>
</svg>