<text x="120" y="318" font-size="13.5" fill="#58a6ff" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Part 2　進階：Least-to-Most／ToT／iToT／SG-ICL</text>
