<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="特徵 X 與目標 y：什麼是「標記」" style="width:100%;height:auto;display:block">
<rect x="0.75" y="0.75" width="898.5" height="438.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/>
<text x="48" y="52" font-size="25" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">特徵 X 與目標 y：什麼是「標記」</text>
<text x="48" y="82" font-size="14.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">每一列都有正確答案，才叫有標記</text>
<text x="255" y="150" font-size="13" fill="#8b949e" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">特徵（features / independent variables）</text>
<rect x="90" y="170" width="330" height="118" rx="10" fill="#0d1117" stroke="#2dd4bf66" stroke-width="1.5"/>
<path d="M 90 212 L 420 212" fill="none" stroke="#2dd4bf66" stroke-width="1.5"/>
<path d="M 200 170 L 200 288" fill="none" stroke="#30363d" stroke-width="1"/>
<path d="M 310 170 L 310 288" fill="none" stroke="#30363d" stroke-width="1"/>
<path d="M 90 250 L 420 250" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="145.0" y="196.0" font-size="12.5" fill="#2dd4bf" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">花萼長</text>
<text x="255.0" y="196.0" font-size="12.5" fill="#2dd4bf" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">花萼寬</text>
<text x="365.0" y="196.0" font-size="12.5" fill="#2dd4bf" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">花瓣長</text>
<text x="145.0" y="236.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">5.1</text>
<text x="255.0" y="236.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3.5</text>
<text x="365.0" y="236.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1.4</text>
<text x="145.0" y="274.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7.0</text>
<text x="255.0" y="274.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3.2</text>
<text x="365.0" y="274.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">4.7</text>
<text x="430" y="226" font-size="18" fill="#8b949e" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">…</text>
<text x="660" y="150" font-size="13" fill="#8b949e" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">目標（target）</text>
<rect x="560" y="170" width="200" height="118" rx="10" fill="#0d1117" stroke="#fbbf2466" stroke-width="1.5"/>
<path d="M 560 212 L 760 212" fill="none" stroke="#fbbf2466" stroke-width="1.5"/>
<path d="M 560 250 L 760 250" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="660.0" y="196.0" font-size="12.5" fill="#fbbf24" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">品種</text>
<text x="660.0" y="236.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">setosa</text>
<text x="660.0" y="274.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">versicolor</text>
<text x="775" y="245" font-size="12" fill="#fbbf24" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">← 這就是「標記」</text>
<text x="255" y="340" font-size="12.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">（X：模型看得到的）</text>
<text x="660" y="340" font-size="12.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">（y：模型要學著猜的）</text>
<text x="48" y="400" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">有標記＝每一列都有正確答案（y），模型才有東西可以學；這跟「監督／非監督」是同一件事的兩種說法。</text>
</svg>