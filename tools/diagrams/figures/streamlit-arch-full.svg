<text x="48" y="722" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">兩條獨立的後端路線：問候走 Flask（自己寫的 API），問 LLM 走 LiteLLM（統一模型介面），LiteLLM 再轉給本機 Ollama。</text>
