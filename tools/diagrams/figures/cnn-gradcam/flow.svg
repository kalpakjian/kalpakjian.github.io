<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Grad-CAM 的七個步驟：前向取得特徵圖、選類別、反向求梯度、對梯度取平均得到 alpha、加權疊加、ReLU、上採樣疊圖"><defs><marker id="argc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8b949e"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="378.5" rx="16" fill="#0d1117" stroke="#222b36" stroke-width="1.5"/><text x="40" y="44" font-size="20" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Grad-CAM 的七個步驟</text><text x="40" y="72" font-size="13" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前六步都在特徵圖上算；只有最後一步是為了畫出來</text><rect x="36" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#4ecdc488" stroke-width="1.4"/><text x="50" y="142" font-size="11.5" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">1.</text><text x="70" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">前向</text><text x="96" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">A¹…Aᴷ</text><line x1="158" y1="162" x2="169" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="172" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#4ecdc488" stroke-width="1.4"/><text x="186" y="142" font-size="11.5" fill="#4ecdc4" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">2.</text><text x="206" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">選類別</text><text x="232" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">yᶜ</text><line x1="294" y1="162" x2="305" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="308" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#58a6ff88" stroke-width="1.4"/><text x="322" y="142" font-size="11.5" fill="#58a6ff" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">3.</text><text x="342" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">反向</text><text x="368" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">∂yᶜ/∂Aᵏ</text><line x1="430" y1="162" x2="441" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="444" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#e0a45888" stroke-width="1.4"/><text x="458" y="142" font-size="11.5" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">4.</text><text x="478" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">梯度平均</text><text x="504" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">αᵏᶜ</text><line x1="566" y1="162" x2="577" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="580" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#e0a45888" stroke-width="1.4"/><text x="594" y="142" font-size="11.5" fill="#e0a458" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">5.</text><text x="614" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">加權疊加</text><text x="640" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Lᶜ</text><line x1="702" y1="162" x2="713" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="716" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#c084fc88" stroke-width="1.4"/><text x="730" y="142" font-size="11.5" fill="#c084fc" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">6.</text><text x="750" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">ReLU</text><text x="776" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">只留正</text><line x1="838" y1="162" x2="849" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="852" y="116" width="120" height="92" rx="9" fill="#12181f" stroke="#ff7b7288" stroke-width="1.4"/><text x="866" y="142" font-size="11.5" fill="#ff7b72" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">7.</text><text x="886" y="142" font-size="11.5" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">上採樣</text><text x="912" y="176" font-size="9.5" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">224×224</text><rect x="36" y="232" width="928" height="96" rx="12" fill="#1c2230" stroke="#58a6ff55" stroke-width="1.4"/><text x="56" y="260" font-size="12" fill="#e6edf3" font-weight="700" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">公式：α[k, c] = (1/Z) ΣΣ ∂yᶜ/∂Aᵏ(i, j)　　Lᶜ = ReLU( Σ_k α[k, c] · Aᵏ )</text><text x="56" y="288" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">Z = H×W；ReLU 之後只留下「支持這個類別」的區域。</text><text x="56" y="312" font-size="11.5" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">跟 CAM 的差別只有權重來源：一個拿線性層的 w，一個拿梯度的平均。</text><text x="40" y="356" font-size="12" fill="#8b949e" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">成本：多一次反向傳播；好處：不必改架構、不必重訓。</text></svg>