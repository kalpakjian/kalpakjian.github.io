<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>@@TITLE@@</title>
<style>
:root{--accent:#c0392b;--accent2:#2c6fb1;--border:#d8dee4;--text:#24292f;--muted:#57606a;--panel:#f6f8fa;--bar:54px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity;-webkit-text-size-adjust:100%}
body{margin:0;background:#eef2f7;color:var(--text);
     font:16px/1.7 "Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.mbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;
      min-height:var(--bar);padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top));
      background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);
      backdrop-filter:saturate(150%) blur(8px)}
.mbar button{width:40px;height:40px;flex:0 0 auto;border:0;border-radius:12px;background:var(--panel);
             color:var(--text);font-size:19px;font-weight:700;cursor:pointer}
.mbar button:active{background:#e2e8ef}
.mbar-mid{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0}
#pos{font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
#tier{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#fff1ef;color:var(--accent);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{position:fixed;left:0;height:3px;background:var(--accent);width:0;z-index:21;transition:width .12s linear;
      top:calc(var(--bar) + env(safe-area-inset-top))}
main{padding:calc(var(--bar) + env(safe-area-inset-top) + 12px) 10px 96px}
.card{scroll-snap-align:start;scroll-margin-top:calc(var(--bar) + env(safe-area-inset-top) + 12px);
      background:#fff;border:1px solid var(--border);border-left:9px solid var(--border);
      border-radius:16px;padding:14px 14px 18px;margin:0 0 16px;box-shadow:0 1px 3px rgba(15,35,60,.07)}
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;border-radius:50%;
       background:#1f2d3d;color:#fff;font-size:15px;font-weight:700}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--panel);color:var(--muted)}
.tier{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff1ef;color:var(--accent);margin-left:auto}
h1{font-size:20px;line-height:1.4;margin:0 0 10px;color:var(--accent2)}
h3{font-size:16px;margin:15px 0 6px;color:#0f4c81}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-left:22px}
li{margin:3px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--panel)}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:.92em;font-family:Consolas,monospace}
pre{background:#0f2233;color:#e8f1fa;padding:10px 12px;border-radius:8px;overflow-x:auto;
    font-size:12.5px;line-height:1.55;white-space:pre-wrap}
.note{background:#f0f6fc;border-left:4px solid var(--accent2);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.warn{background:#fff4f2;border-left:4px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.trap{color:#b3261e}
.check{list-style:none;padding-left:0}
.check li::before{content:"\2610 "}
.card.u1{border-left-color:#c0392b}.card.u1 .badge{background:#c0392b}
.card.u2{border-left-color:#2c6fb1}.card.u2 .badge{background:#2c6fb1}
.card.u3{border-left-color:#1f8a70}.card.u3 .badge{background:#1f8a70}
.card.u4{border-left-color:#8e44ad}.card.u4 .badge{background:#8e44ad}
.card.u5{border-left-color:#b9770e}.card.u5 .badge{background:#b9770e}
.card.u6{border-left-color:#5b6b7c}.card.u6 .badge{background:#5b6b7c}
.card.u7{border-left-color:#0f4c81}.card.u7 .badge{background:#0f4c81}
.card.tS .tier{background:#c0392b;color:#fff}
.card.tA .tier{background:#b9770e;color:#fff}
.card.tB .tier{background:#2c6fb1;color:#fff}
.card.tC .tier{background:#5b6b7c;color:#fff}
.tocpanel{position:fixed;inset:0;z-index:30;background:rgba(18,28,42,.45);display:none}
.tocpanel.open{display:block}
.tocpanel-in{position:absolute;top:0;right:0;bottom:0;width:min(88vw,420px);background:#fff;
             overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.tocpanel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;margin:0 0 12px}
.tocpanel ol{margin:0;padding-left:22px}
.tocpanel li{margin:8px 0;line-height:1.45}
.tocpanel a{color:var(--text);text-decoration:none}
.tocpanel .t{font-size:11.5px;font-weight:700;color:var(--accent);margin-left:6px;white-space:nowrap}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;
     width:54px;height:54px;border:0;border-radius:50%;background:var(--accent);color:#fff;
     font-size:23px;font-weight:700;box-shadow:0 6px 16px rgba(192,57,43,.35);cursor:pointer}
.hint{color:var(--muted);font-size:13px}
@media (min-width:760px){main{padding-left:6vw;padding-right:6vw}.card{padding:20px 22px 24px}h1{font-size:23px}}
@media print{.mbar,#prog,.fab,.tocpanel{display:none}main{padding:0;max-width:none}.card{break-inside:avoid}}
</style>
</head>
<body class="@@BODYCLASS@@">
<div class="mbar">
  <button id="btn-prev" aria-label="上一張">‹</button>
  <div class="mbar-mid"><span id="pos">1 / @@COUNT@@</span><span id="tier"></span></div>
  <button id="btn-next" aria-label="下一張">›</button>
  <button id="btn-toc" aria-label="目錄">☰</button>
</div>
<div id="prog"></div>
<div class="tocpanel" id="toc">
  <div class="tocpanel-in">
    <div class="tocpanel-h"><span>速記卡目錄（依考試重要性排序）</span>
      <button id="btn-toc-close" style="border:0;background:none;font-size:20px;cursor:pointer">✕</button></div>
    <ol id="toclist"></ol>
    <p class="hint">@@FOOTNOTE@@</p>
    <p class="hint">操作：左右滑動或按 ‹ › 換卡；鍵盤 ← → ↑ ↓ 也可；☰ 開目錄跳到指定卡。</p>
  </div>
</div>
<main id="deck">
@@CARDS@@
</main>
<button class="fab" id="btn-fab" aria-label="下一張">›</button>
<script>
(function () {
  var deck = document.getElementById('deck');
  var cards = [].slice.call(deck.querySelectorAll('.card'));
  var n = cards.length;
  var pos = document.getElementById('pos');
  var tier = document.getElementById('tier');
  var prog = document.getElementById('prog');
  var toc = document.getElementById('toc');
  function offset() { return document.querySelector('.mbar').offsetHeight + 12; }
  function current() {
    var best = 0, bd = 1e9;
    for (var i = 0; i < n; i++) {
      var d = Math.abs(cards[i].getBoundingClientRect().top - offset());
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function update() {
    var i = current();
    pos.textContent = (i + 1) + ' / ' + n;
    var t = cards[i].querySelector('.tier');
    tier.textContent = t ? t.textContent : '';
    var max = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (max > 0 ? (window.scrollY / max * 100) : 0) + '%';
  }
  function go(i) {
    if (i < 0 || i >= n) { return; }
    cards[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('btn-prev').onclick = function () { go(current() - 1); };
  document.getElementById('btn-next').onclick = function () { go(current() + 1); };
  document.getElementById('btn-fab').onclick = function () { go(current() + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(current() + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(current() - 1); }
    if (e.key === 'Escape') { toc.classList.remove('open'); }
  });
  var list = document.getElementById('toclist');
  cards.forEach(function (c, i) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#';
    var h = c.querySelector('h1');
    a.textContent = (i + 1) + '. ' + (h ? h.textContent.trim() : '');
    a.onclick = function (e) { e.preventDefault(); toc.classList.remove('open'); go(i); };
    li.appendChild(a);
    var t = c.querySelector('.tier');
    if (t) { var s = document.createElement('span'); s.className = 't'; s.textContent = t.textContent; li.appendChild(s); }
    list.appendChild(li);
  });
  document.getElementById('btn-toc').onclick = function () { toc.classList.add('open'); };
  document.getElementById('btn-toc-close').onclick = function () { toc.classList.remove('open'); };
  toc.onclick = function (e) { if (e.target === toc) { toc.classList.remove('open'); } };
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
